  # -- no_export_tables structural-flatten cases --------------------------
  # The IronCalc importer flattens xlsx fixtures into single-sheet,
  # all-rows-visible static-cell oracle setup. Two structural pieces of the
  # live workbook are dropped: (1) multi-sheet workbook geometry (so SHEET()
  # / SHEET("name") / SHEETS() can't reproduce live tab indices), and (2)
  # auto-filter / hidden-row visibility state (so SUBTOTAL codes 9 / 109
  # can't skip rows that Mac sees as hidden). Formulon's SHEET / SUBTOTAL
  # math is already verified by other passing fixtures; the failures below
  # are inherent to the importer's flatten step. No new probes are added
  # because the static-cell driver schema lacks knobs for "this sheet has
  # hidden rows" or "this workbook has 6 sheets".
  #
  # SUBTOTAL 101..111 does read `RowLayout::hidden` off the sheet, so the
  # skip below is about missing input state, not a missing engine path.
  # Two of the three cases carry a second, independent reason: a range
  # whose endpoints are `OFFSET` / `INDIRECT` calls has no static row
  # provenance, so its cells are never dropped even when the sheet does
  # carry hidden rows. Auto-filter visibility (which codes 1..11 also
  # honour in Excel) is not modelled at all.
