    reason: "=_xlfn.SHEET(\"Filters\") -- expects tab index 4 in the live multi-sheet workbook. Importer-flattened single-sheet driver has no \"Filters\" sheet, so Formulon (correctly per spec) returns #N/A. Structural flatten limitation."
