  # -- COTH(1)*CSCH(1)=COSH(1)/SINH(1)^2 1-ULP equality test --------------
  # Mac evaluates B41=COTH(1)*CSCH(1) and C41=COSH(1)/SINH(1)^2 to
  # bit-identical values (giving B41=C41 -> TRUE). Formulon's standard
  # IEEE 754 evaluation produces 1.1172855274492741 vs 1.1172855274492743
  # (1 ULP apart) -> FALSE. The platform FP evaluation order on macOS
  # Accelerate happens to align both expressions; glibc/standard libm
  # does not. Irreducible without changing trig path implementation.

  # -- Range argument to a scalar function: 365 spill vs legacy IIE -------
  # These fixtures store `=FN(range)` where the formula cell's row (or
  # column) falls INSIDE the range span, so IronCalc's imported legacy
  # workbook resolves the argument by implicit intersection aligned to the
  # formula cell — e.g. =ROMAN(H34:H37) at row 36 picks H36=4 -> "IV".
