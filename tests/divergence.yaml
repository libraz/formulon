  # -- Print PageBreakPreview low-scale auto-break quirk ------------------
  # Round-3 Windows COM capture (PageBreakPreview view, ActiveWindow.Zoom
  # pinned to 60, ResetAllPageBreaks + ScreenUpdating toggle for layout-
  # settle) shows Excel emitting column auto-breaks at PageSetup.Zoom<=50
  # that don't follow any simple geometric model. For the same A1:H30
  # geometry with col_widths={A:H: 30}: pages=1 v=[] at scale=100/75, but
  # pages=4 v=[7] at scale=50 and pages=6 v=[3,6] at scale=25. The break
  # count grows as scale shrinks -- inverted from the intuitive "smaller
  # scale fits more content" model that the Excel VBA community has
  # documented (mrexcel.com, tek-tips.com, excelforum.com, May 2026
  # research). The community's published workarounds (toggle the window
  # view between xlNormalView and xlPageBreakPreview after each Zoom
  # change; avoid mixing Zoom with FitToPagesWide/Tall) confirm this is
  # a notorious COM/PBP unreliability rather than a documented algorithm.
  # We already apply every published workaround in the driver
  # (tools/oracle/drivers/windows_excel.py::_apply_and_read_print) yet
  # still see this behaviour, so the goldens are real -- Formulon's
  # geometric model just cannot reproduce them. Skipping until a
  # principled rule emerges (would need source-level Excel access or a
  # significantly broader capture matrix to derive empirically).
