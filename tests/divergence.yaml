  # Stale `pivot_authored_filter_families_not_evaluated` removed: the two
  # families it was parked on are decoded now, so no authored `<filters>`
  # family is left unevaluated. The week windows run Sunday through
  # Saturday on the calendar week -- `thisWeek` read on a Friday still
  # starts the preceding Sunday, and the three windows tile with no gap.
  # The recurring `M1`..`M12` / `Q1`..`Q4` selectors pick a calendar month
  # range in any year, so they resolve with no clock reading at all and
  # are modelled apart from the windows as AuthoredRecurringFilter.
  #
  # Both were observed on the Mac host after all. The earlier reading --
  # that Mac Excel exposes no reachable pivot-table object -- was wrong:
