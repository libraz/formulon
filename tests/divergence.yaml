# Known / accepted divergences between Formulon and Mac Excel 365 (ja-JP).
#
# Every entry documents a case where the oracle verifier would otherwise
# fail. Two modes are supported:
#
#   mode: skip-oracle
#     Case is excluded from oracle-gen and oracle-verify. Use sparingly —
#     only for intrinsically non-reproducible results (NOW, RAND, TODAY
#     without a seed injection) or oracle bugs (e.g. Mac Excel CVErr
#     inconsistency). Prefer widening tolerance when possible.
#
#   tolerance: { abs: <N>, rel: <N> }
#     Case is generated and verified, but the verifier accepts any result
#     within the given absolute-or-relative tolerance. Default is strict
#     equality (0.0 / 0.0). Use for expected ±1ulp drift on transcendental
#     / statistical functions.
#
# Every entry MUST carry a `reason` string that cites an incident or
# source; `prefer` optionally records which implementation we trust if the
# two differ (Mac Excel 365 / Win Excel 365 / Formulon). PR reviewers
# check this file's diff on any oracle-gen roll-forward.
#
# Schema (parsed by tools/oracle/oracle_gen.py):
#
#   entries:
#     - id: <case_id from tests/oracle/cases/*.yaml>
#       # `ids: [...]`, `suite: <name>`, and `suites: [...]` are also
#       # available for a shared tolerance / compare_mode policy. Skip
#       # entries must target exactly one `id`.
#       reason: "..."
#       mode: skip-oracle | tolerance      # default: tolerance
#       tolerance: { abs: 1e-10, rel: 0 }
#       compare_mode: exact | complex_text | numeric_text | ...
#       prefer: mac-excel-365 | win-excel-365 | formulon
#       first_noted: YYYY-MM-DD
#       last_verified_excel_version: "16.xx.x (Build ...)"
#       applies_to: [mac-365-ja_JP, win-365-ja_JP]   # optional; list of
#                                                     # oracle target names
#                                                     # from tools/oracle/
#                                                     # targets.yaml. Default
#                                                     # (omitted / null) =
#                                                     # applies to every
#                                                     # target. Entries with
#                                                     # an unrecognised type
#                                                     # are rejected loudly
#                                                     # so typos surface
#                                                     # immediately.

entries:
  # Mac xlwings reads ARRAYTOTEXT error results back as blank cells, so the
  # primary golden cannot distinguish #N/A / #VALUE! from a real blank.
  - ids:
      - arraytotext_error_in_array_default
      - arraytotext_error_in_array_strict
      - arraytotext_only_errors_default
      - arraytotext_arity_zero
      - arraytotext_arity_three
    mode: skip-oracle
    reason: "Mac xlwings reads ARRAYTOTEXT array-error and arity-error results back as blank, losing Excel's error code. Function-level tests cover the real error contract."
    prefer: formulon
    first_noted: 2026-08-05
    last_verified_excel_version: "16.108.1"
  # -- ad-hoc evaluate-formula scalar reduction (intentional API shape) ----
  # `fm_workbook_evaluate_formula` (and the WASM / Node
  # `evaluateFormulaText`) return a single scalar. When the evaluated
  # formula produces an array/spill (e.g. `=SEQUENCE(3)`), the API reduces
  # it to the top-left element. In a real Excel cell the same formula would
  # spill the whole array; this is a deliberate Phase 1 API-shape choice,
  # not an Excel-compatibility bug, and not implicit intersection (which
  # selects the anchor-row/column element and yields #VALUE! when there is
  # none). Multi-cell results are a Phase 2 follow-up. No oracle case is
  # generated for this behaviour; the entry documents the intent for
  # reviewers.
  - id: evaluate_formula_array_scalar_reduction
    mode: skip-oracle
    scope: api-contract
    evidence: [tests/c_api/formulon_c_evaluate_formula_test.cpp]
    reason: "fm_workbook_evaluate_formula / evaluateFormulaText reduce an array result to its top-left element (Phase 1 scalar API shape); a real cell would spill. Intentional API-shape divergence, not implicit intersection or an Excel bug."
    prefer: formulon
    first_noted: 2026-07-03
  # -- xlwings empty-string / blank read-back gaps -------------------------
  # The Mac xlwings driver cannot write a cell holding the empty string
  # "": assigning "" leaves the cell genuinely blank from Excel's point of
  # view. Formula results that return "" are verified with
  # compare_mode=empty_string_readback; the remaining skipped cases below
  # need an actual setup-cell empty string, or hit xlwings blank read-back
  # for rejected formulas. Revisit if the oracle pipeline moves to a bridge
  # that can preserve Excel empty-string cells and rejected-formula errors.
  - id: isblank_of_empty_string
    mode: skip-oracle
    reason: "xlwings writes \"\" as a blank cell, so Excel reports ISBLANK=TRUE even though Formulon correctly says FALSE."
    prefer: formulon
    first_noted: 2026-04-23
  - id: countif_notequal_empty_over_mixed
    mode: skip-oracle
    reason: "xlwings writes \"\" as a blank cell, so Excel's COUNTIF(range, \"<>\") over a range with a literal-\"\" cell sees one fewer populated cell than Formulon's in-memory model. Formulon returns 3, Mac records 2 due to the xlwings round-trip gap."
    prefer: formulon
    first_noted: 2026-04-25
  - id: isformula_of_literal_number_is_value
    mode: skip-oracle
    reason: "Mac returns #VALUE!; xlwings reads it back as blank, producing a spurious kind mismatch."
    prefer: formulon
    first_noted: 2026-04-23
  - id: isformula_of_literal_text_is_value
    mode: skip-oracle
    reason: "Mac returns #VALUE!; xlwings reads it back as blank, producing a spurious kind mismatch."
    prefer: formulon
    first_noted: 2026-04-23

