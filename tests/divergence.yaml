    last_verified_excel_version: "16.108.1"
    mode: skip-oracle
  - id: rept_empty_string
    reason: "REPT() returns empty string; xlwings reports it as blank cell (COM round-trip artifact). Unit tests in tests/unit/eval/builtins_text_test.cpp cover empty-string return."
    prefer: mac-excel-365
