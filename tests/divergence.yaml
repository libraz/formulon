  # -- Circular reference with iterative calculation OFF ------------------
  # A formula cycle (e.g. A1 = =A2, A2 = =A1) with the workbook's iterative
  # calculation option disabled is detected as a strongly-connected
  # component by the recalc engine, and every member cell resolves to
  # #REF!: on a re-entrant reference the resolver returns ErrorCode::Ref
  # unless workbook.iterative_options().enabled (src/eval/eval_context.cpp),
  # and RecalcEngine reports the members via its cycle_cells stat (see
  # tests/unit/eval/recalc_engine_test.cpp DirectCycleProducesRefError).
  # Excel, with iterative calc OFF, refuses to resolve the cycle: it seeds
  # one member with 0 and lets the rest compute off that seed. Reprobed on
  # 16.112 with the iteration flag read back rather than assumed:
  # A1==B1+1 / B1==A1+1 gives A1=1 and B1=0; a three-cell cycle gives
  # 2 / 1 / 0; a self-cycle A1==A1+1 gives 0. Cells downstream of the cycle
  # are left uncomputed at 0 as well (ISERROR / ISNUMBER over a member both
  # read 0 rather than a boolean). Two earlier claims here were wrong: the
  # result is not 0 in every member cell, and it is not uncapturable --
  # xlwings reads ordinary numbers. The divergence is genuine and
  # accepted: Formulon's #REF! per member is the more useful signal for a
  # headless engine, and with iterative calc ON both engines converge to
  # the fixed point instead.
  #
  # Unpinned, recorded so it is not rediscovered as a surprise: the same
  # reprobe showed Excel abandoning the whole dependency closure, not just
  # the cycle. A cell merely *downstream* of a member is left uncomputed at
  # 0 -- =ISERROR(<member>) and =ISNUMBER(<member>) both read back 0 rather
  # than a boolean, and Excel renders them as `0` rather than `FALSE`, so
  # the cell was never evaluated rather than evaluated to FALSE. Formulon
  # propagates #REF! into those cells instead. That is a wider divergence
  # than this entry describes and no case pins it; scoping it needs its own
  # probe of how far the abandonment reaches.
  - id: circular_reference_iterative_off_returns_ref
    cause: accepted-divergence
    mode: skip-oracle
    scope: unit-test
    evidence: [tests/unit/eval/recalc_engine_test.cpp]
    reason: "A formula cycle with iterative calc OFF resolves to #REF! for every cycle-member cell in Formulon (recalc-engine SCC detection; eval_context returns ErrorCode::Ref on a re-entrant reference). Excel instead seeds one member with 0 and computes the others from it -- A1==B1+1 / B1==A1+1 yields A1=1, B1=0, and a three-cell cycle yields 2 / 1 / 0 -- so there is no single expected value to compare a cycle member against. The values are plain numbers and the harness can read them; the divergence is a deliberate policy difference, not a capture gap."
    prefer: formulon
    first_noted: 2026-07-02
    last_verified_excel_version: "16.112"

