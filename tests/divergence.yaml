  # -- chart track: rules the chart oracle cannot observe -----------------
  # The chart oracle compares what Excel saves (caches, references) and
  # what its object model reports. These rules change only how Excel draws
  # a chart, so no capture can pin them; unit tests hold them instead.
  - id: chart_disp_blanks_as_unobservable
    applies_to: [mac-365-ja_JP]
    cause: excel-no-value
    mode: skip-oracle
    scope: unit-test
    evidence: [tests/unit/chart/chart_data_test.cpp]
    reason: "c:dispBlanksAs gap / zero / span leaves both the saved cache (a blank cell writes no c:pt, ptCount still counts it) and Series.Values (blank reads '') identical, so how a blank point is drawn is not observable from a capture. Formulon reports each point's state (gap / zero-valued / connect) by the documented rule; chart_data_test pins it per chart type, and an absent element reads as zero, as Excel reads it."
    prefer: formulon
    first_noted: 2026-10-14
    last_verified_excel_version: "16.113.4"
  - id: chart_disp_na_as_blank_unobservable
    applies_to: [mac-365-ja_JP]
    cause: excel-no-value
    mode: skip-oracle
    scope: unit-test
    evidence: [tests/unit/chart/chart_data_test.cpp]
    reason: "c16r3:dispNaAsBlank on or off leaves the saved cache (#N/A is written as a <c:v>#N/A</c:v> point either way) and Series.Values identical, so whether #N/A is drawn as a blank is not observable from a capture. Excel writes the extension with val=1 on a new chart and drops it on re-save when set to 0. Formulon applies the flag when resolving point states; chart_data_test pins it."
    prefer: formulon
    first_noted: 2026-10-14
    last_verified_excel_version: "16.113.4"
  - id: chart_absent_title_display_undetermined
    applies_to: [mac-365-ja_JP]
    cause: non-identifiable
    mode: skip-oracle
    scope: unit-test
    evidence: [tests/unit/chart/chart_xml_test.cpp]
    reason: "A chart with no c:title, autoTitleDeleted=0 and exactly one unfiltered series has an automatic title, and Formulon reads it as one (chart_xml_test pins the rule). Whether Excel writes that title into the part on re-save depends on state the file does not carry: charts that were laid out in the visible window gain a c:title, charts below it are saved without one, so the re-saved title kind is not determined by the workbook."
    prefer: formulon
    first_noted: 2026-10-14
    last_verified_excel_version: "16.113.4"

