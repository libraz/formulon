    evidence: [tests/unit/eval/builtins_regex_test.cpp]
    reason: "REGEXEXTRACT with catastrophic backtracking: Mac Excel hangs; Formulon returns #CALC! after the pcre2 match limit is exceeded."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.108.1"
  - id: regex_match_limit_regexreplace
    mode: skip-oracle
