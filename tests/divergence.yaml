  - id: bycol_error_in_column
    mode: skip-oracle
    reason: "BYCOL with errored column produces a per-column array including the error; not anchor-unwrapped. Mac Excel returns blank at anchor (Z1) when one column errors — a separate quirk worth re-verifying when the unwrap path lands."
    prefer: mac-excel-365
