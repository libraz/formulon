  # `active_ctest: false`) both identify as an Office 2019 install, not a
  # Microsoft 365 one. Stamped `unverified` below rather than "16.0" so
  # these six entries surface as pending reprobes instead of masquerading
  # as verified Microsoft 365 evidence.
