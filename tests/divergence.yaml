  # Stale `external_stub_getpivotdata` removed 2026-05-02: the case
  # `=GETPIVOTDATA("amount", A1)` evaluates to #REF! on both engines
  # because A1 has no pivot anchor — that is now correct behaviour, not
  # a divergence.
  #
  # Stale `external_stub_phonetic` removed from external_stubs.yaml:
  # PHONETIC is a real lazy form, not an unavailable function stub. The
  # entry survives because the case is a string literal, which Excel
  # refuses at entry.
  - id: external_stub_phonetic
    applies_to: all
    cause: excel-no-value
    case_alias: lazy_phonetic_literal_text
    reason: "As lazy_phonetic_literal_text: the case is `=PHONETIC(\"テスト\")` and Excel's PHONETIC takes a reference, so the literal is refused at entry and Excel stores no formula to evaluate. Annotated-cell behaviour agrees on both engines and is pinned by tests/integration/ooxml_phonetic_roundtrip_test.cpp. Windows Excel 365 ja-JP 16.0.20326 refuses it at entry as well (COM 0x800A03EC, recorded as a driver skip in tests/oracle/targets/win-365-ja_JP/golden/), so no Excel host produces a value."
    prefer: formulon
    first_noted: 2026-04-28
