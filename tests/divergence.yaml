  # -- GROUPBY / PIVOTBY nested subtotals (|total_depth| == 2) -------------
  # Both functions build the outer/inner hierarchy over the first key
  # column. PIVOTBY also emits value-wide subtotal blocks for every outer
  # column group on a two-level column axis; the unit matrix is an observed
  # Mac Excel 16.111.3 ja-JP result (see builtins_pivotby_test.cpp). No
  # divergence entry is needed for these shapes.

  # -- XLOOKUP / XMATCH binary search over dirty (non-sorted) data --------
  # Binary search (search_mode = 2 / -2) requires the lookup vector to be
  # sorted. When the vector also holds a cell that is incomparable with the
  # lookup value (Error / Array / Ref / Lambda), Formulon treats that cell
  # as "greater than the target" to keep the upper-bound pass monotone
  # (src/eval/lookups/xlookup.cpp). On already-clean, properly sorted
  # arrays this is a no-op. On dirty data the bisection can step over a
  # value that a linear scan would have matched, so a near match may be
  # missed. Excel's own binary search is documented as undefined on
  # unsorted input and also returns implementation-defined results there;
  # the exact cell each engine lands on differs. Both behaviours are
  # "right" under the sorted-input contract — this entry records the
  # accepted divergence on contract-violating input.
  - id: xlookup_binary_search_dirty_data
    mode: skip-oracle
    scope: unit-test
    evidence: [tests/unit/eval/builtins_xlookup_test.cpp]
    reason: "Binary search (search_mode 2/-2) is only defined on sorted input. Formulon treats incomparable cells as greater-than-target to keep the upper bound monotone, so on unsorted/dirty data a near match can be stepped over. Excel's binary search is likewise undefined on unsorted data and lands on a different cell; the divergence only occurs on contract-violating input."
    prefer: formulon
    first_noted: 2026-06-26
    last_verified_excel_version: "16.109"

