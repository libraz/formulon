  # -- Column print-layout width is inferred for every font but Calibri ----
  # Excel resolves a column's width in points from its stored character-unit
  # width times the Normal font's maximum digit width (MDW), so the
  # conversion is a property of that font -- but two DIFFERENT MDW figures
  # are in play. The reported `Range.Width` ("display" width) is DPI-
  # dependent: sweeping Calibri, ＭＳ Ｐゴシック, 游ゴシック and Meiryo UI
  # at 8-18 pt gave different numbers at 100% scaling (96 DPI) than at 175%
  # (168 DPI) for the identical fonts/sizes. The width print pagination
  # actually breaks on is NOT this figure: the same print-track cases'
  # page-break positions are identical across both DPI captures, which the
  # 168-DPI Range.Width sweep approximates and the 96-DPI one does not.
  # Only Calibri 11's print-layout width is therefore directly evidenced
  # (from the print captures' own breaks, not a Range.Width sweep); every
  # other font/size's print-layout width is inferred by scaling its
  # (separately measured, DPI-dependent) 96-DPI display calibration by
  # Calibri 11's print/display ratio -- an approximation, not a second
  # sweep. The display calibration itself remains exact and continues to
  # drive `applied_geometry.column_widths_pt` in the workbook oracle
  # goldens (a diagnostic field no verifier compares today).
  - id: pagination_column_width_calibrated_to_one_normal_font
    applies_to: all
    cause: engine-gap
    mode: skip-oracle
    scope: deferred-feature
    evidence: [src/print/sheet_geometry.cpp, tests/unit/print/pagination_test.cpp]
    reason: "Column width in points is the stored character-unit width times the Normal font's max digit width (MDW), which depends on that font's family and size -- but pagination's break math and the diagnostic `applied_geometry.column_widths_pt` field need different MDW figures. `Range.Width` (the display figure, swept over Calibri, ＭＳ Ｐゴシック, 游ゴシック and Meiryo UI at 8/9/10/11/12/14/16/18 pt: tests/fixtures/excel/win/column_width_dpi100/results.json at 100% scaling / 96 DPI, cross-checked against tests/fixtures/excel/win/column_width/results.json at 175% / 168 DPI) is DPI-dependent -- e.g. Calibri 11 resolves an 8.43-unit column to 48 pt at 100% and 51.43 pt at 175%. Print pagination cannot depend on the authoring screen's DPI, and indeed does not: the print-track captures' page-break positions for a 30-character Calibri-11 column are identical at both DPIs (171.0 pt worth of break, not either DPI's Range.Width figure of 161.25 pt / 171.0 pt happens to coincide for the 168-DPI capture only by chance). Formulon therefore uses two geometries (`ResolveColumnPrintGeometry` / `ResolveColumnDisplayGeometry`, src/print/sheet_geometry.cpp): Calibri 11's print-layout MDW/padding is the only one taken directly from a print capture; every other font/size's print-layout figure is inferred by scaling its measured 96-DPI display calibration by Calibri 11's print/display ratio, which is an approximation Excel's actual per-font print behavior has not been swept to confirm. The display calibration remains exact and still drives the diagnostic `applied_geometry` field. A Normal font or size outside the 4x8 sampled set falls back to the Calibri-11 figures in both geometries."
    prefer: win-excel-365
    first_noted: 2026-08-22
    last_verified_excel_version: "16.0.20326"

  # -- Page-field header block --------------------------------------------
  # Retired the pair of `engine-gap` entries that claimed GETPIVOTDATA
  # could not address a page/data-axis field: Microsoft 365 16.0.20228
  # answers `#REF!` for both probes, exactly as Formulon does, so nothing
  # was owed. What the same capture did surface is narrower and real --
  # the header block Excel draws above a pivot that has a page field --
  # and `page_axis_field` is retired too, now that the block is projected:
  # `pivot::evaluate` resolves each page field's selection against the
  # bound cache and `pivot::layout` draws one row per field plus the blank
  # separator, so `getpivotdata_page_data.page_axis_field` runs unskipped.
  #
  # `<pageFields>` follows the `<filters>` split -- decoded for rendering,
  # re-emitted from the passthrough bin -- so the round trip is unchanged;
  # the writer only synthesises the element for a table that never carried
  # one. What stays unobserved is the several-items selection: no capture
  # picks more than one page item, so `multiple_items_label` reproduces
  # Excel's UI wording without a measurement behind it. That is a label
  # default, not a divergence, and it is documented where it is declared
  # (`pivot::PivotLayoutOptions`) rather than tracked here.

  # AREAS recurses into CHOOSE / IF reference branches, so a branch that is
  # itself a union reports its real area count.
  #
  # `arg_indirect_union` (tests/oracle/cases/areas.yaml): INDIRECT builds at
  # most one rectangle, so `INDIRECT("A1,B2")` cannot return a 2-area
  # reference -- the INDIRECT call itself is #REF!, and AREAS reports that
  # error rather than a count of 2. Implementation (src/eval/areas_lazy.cpp),
  # oracle case, and golden (tests/oracle/targets/mac-365-ja_JP/golden/areas.golden.json, no
  # `skipped` field) all agree on #REF!; this is not a pending divergence.

  # -- Circular reference with iterative calculation OFF ------------------
  # A cycle through several cells resolves to #REF! for every member
  # (src/eval/cell_evaluator.cpp unresolved_cycle_value); a cell that is its
  # own only cycle member holds 0, as in Excel. Excel computes a multi-cell
  # cycle along the chain from the member whose entry closed it, so its
  # values depend on entry order, and so do the cells downstream of a member
  # (circular_reference_downstream_cells_depend_on_entry_order).
  - id: circular_reference_iterative_off_returns_ref
    applies_to: all
    cause: accepted-divergence
    mode: skip-oracle
    scope: unit-test
    evidence: [tests/unit/eval/recalc_engine_test.cpp]
    reason: "A cycle through two or more cells with iterative calc OFF resolves to #REF! for every member in Formulon. Excel seeds the member whose entry closed the cycle with 0 and computes the others along the chain (A1=B1+1 / B1=A1+1 entered A then B gives 1, 0; entered B then A gives 0, 1), so member values depend on entry order, which a workbook does not record. A cell whose cycle runs through itself alone is deterministic and holds 0 as in Excel."
    prefer: formulon
    first_noted: 2026-07-02
    last_verified_excel_version: "16.113.4"
  - id: circular_reference_downstream_cells_depend_on_entry_order
    applies_to: all
    cause: accepted-divergence
    mode: skip-oracle
    scope: unit-test
    evidence: [tests/unit/eval/recalc_engine_test.cpp]
    reason: "With iterative calculation off, Excel leaves a cell that reads a cycle member at 0 when the cell was entered after the cycle closed (C1 =A1+1, D1 =C1+1, E1 =ISERROR(D1), =ISNUMBER(A1) all read 0, at any depth and on another sheet), and computes it from the members' values when it existed before (C1 2, D1 3, ISERROR FALSE, ISNUMBER TRUE). Neither state changes under Calculate, CalculateFull or CalculateFullRebuild, and the workbook does not record which order produced it. The same holds downstream of a single-cell self-cycle (C1 0 entered after, 1 entered before). Breaking the cycle recomputes every cell. Formulon reports a multi-cell cycle's members as #REF! and propagates it downstream, so ISERROR of a downstream cell is TRUE; downstream of a self-cycle it computes from the member's 0."
    prefer: formulon
    first_noted: 2026-10-18
    last_verified_excel_version: "16.113.4"
  - id: adhoc_evaluation_self_reference_reads_cached_value
    applies_to: all
    cause: accepted-divergence
    mode: skip-oracle
    scope: api-contract
    evidence: [src/c_api/formulon_c.h]
    reason: "An ad-hoc evaluation (fm_workbook_evaluate_formula and its siblings) is never inserted into the dependency graph, so a formula that refers to its own anchor cell reads that cell's cached value: =A1+1 anchored at an empty A1 gives 1. Excel with automatic calculation leaves such a cell at 0 (manual calculation gives 1). Whole-axis and bounded self-rectangles are answered by the walker's cycle rule and give 0 on this path too."
    prefer: formulon
    first_noted: 2026-10-18
    last_verified_excel_version: "16.113.4"
  - id: evaluated_array_between_resource_ceiling_and_excel_bound
    applies_to: all
    cause: accepted-divergence
    mode: skip-oracle
    scope: unit-test
    evidence: [tests/unit/eval/array_alloc_test.cpp]
    reason: "Formulon refuses a generated array past 1,048,576 cells (#NUM!) and a derived array past its 10,000,000-cell ceiling (#CALC! / #NUM!), bounding evaluator memory under WASM. Excel evaluates arrays up to 53,687,091 elements and abandons the formula to 0 only past that, so SUM(SEQUENCE(3277,16383)*0+1) is 53687091 in Excel and #NUM! in Formulon. Past the Excel bound both give 0, and ROWS / COLUMNS size generators and operations without building them, so their results agree throughout."
    prefer: formulon
    first_noted: 2026-10-18
    last_verified_excel_version: "16.113.4"

  # -- XLSB-sourced pivot tables: GETPIVOTDATA unsupported ----------------
  # Pivot tables in a .xlsb workbook are not decoded into Formulon's
  # evaluated pivot model: the XLSB reader wires no pivot caches / pivot
  # tables onto the workbook (unlike the OOXML reader), so an .xlsb pivot
  # survives only as opaque passthrough state. GETPIVOTDATA against such a
  # pivot has no evaluated anchor to resolve and returns #REF!, whereas
  # Excel returns the aggregated pivot value. Removing this divergence
  # requires decoding the XLSB binary pivot records (tracked under the
  # XLSB completion work).
  # XLSB pivot decoding landed: the three parts are read into the same
  # model the OOXML reader builds, and every answer Excel cached in
  # tests/fixtures/excel/xlsb_pivot_base.xlsb is reproduced by a recalc.
  # The record layouts were established by differential decode -- the
  # same workbook re-saved by Excel as .xlsx and read with the OOXML
  # pivot reader -- rather than guessed, and the aggregation selector was
  # isolated by re-saving one pivot per `<dataField subtotal>` value.
  # Two earlier claims in the retired entry were wrong: Mac Excel does
  # expose a reachable pivot object model, and it converts a pivot-bearing
  # .xlsb to .xlsx, which is what made the differential reference
  # available without a Windows host. What Mac genuinely cannot do is
  # *create* a pivot from the AppleScript bridge.
  - id: xlsb_pivot_unmeasured_cell_encodings
    applies_to: all
    cause: engine-gap
    mode: skip-oracle
    scope: fixture
    evidence: [tests/unit/io/xlsb_pivot_fixture_test.cpp, src/io/xlsb/pivot_reader.h]
    reason: "The XLSB pivot decoder covers the encodings measured against an Excel-authored fixture: shared-item string fields, an inline-double measure, row / column axis orders, and the eleven aggregation selectors. Encodings no capture has pinned yet -- a cache field holding dates, booleans, blanks or errors, a numeric field with shared items, and the per-item flag bits that mark an item hidden -- are refused rather than guessed, so a pivot using one is skipped and GETPIVOTDATA over it still returns #REF! where Excel answers. Refusing keeps a wrong number off the sheet (a mis-sized record cell shifts every later field, and a dropped hidden-item filter would over-count silently), and the record-width check plus the shared-item bounds check are what turn a wrong encoding into a refusal instead of a plausible total. Closing this needs more Excel-authored fixtures, which the .xlsb -> .xlsx conversion path can now supply."
    prefer: mac-excel-365
    first_noted: 2026-07-02
    last_verified_excel_version: "16.112.1"

  # -- Cross-workbook references: sheet qualifiers ---------------------------
  # Excel records a qualifier naming no local sheet as a link to an external
  # book of that name; Formulon gives the same values but creates no link
  # without brackets or a path.
  - id: missing_local_sheet_qualifier_binds_external_book
    applies_to: [mac-365-ja_JP]
    cause: accepted-divergence
    mode: skip-oracle
    scope: unit-test
    evidence: [tests/unit/eval/local_sheet_qualifier_eval_test.cpp, tests/unit/eval/external_ref_eval_test.cpp]
    reason: "A sheet qualifier that names no sheet of the workbook is bound by Mac Excel 365 ja-JP as a link to an external book of that name, recorded in link_sources (`=Nope!A1`, `=SUM(Data:S2!A1)` with S2 absent, `=S2!LocalName`). Formulon creates no link from such a qualifier. The values agree: `=Nope!A1` gives #REF!, while `=SUM(Data:S2!A1)` (no 3-D reference; Excel reads it back as `Data:'S2'!A1`) and `=S2!LocalName` give #NAME?. A qualifier that matches a link the workbook already holds (a book written without an extension, whose `[1]!Name` reads back as `'Src2'!Name`) does bind: `Src2!Name` reads that link's book-scope name, as in Excel. A new link needs the bracketed or path-qualified spelling, which Formulon accepts and binds."
    prefer: formulon
    first_noted: 2026-10-07
    last_verified_excel_version: "16.113.3"


  # Retired the INDIRECT R1C1 entries (`indirect_r1c1_style_deferred`,
  # `indirect_r1c1_absolute`, `indirect_r1c1_from_address`): `a1 = FALSE`
  # now parses R1C1 rather than short-circuiting to #REF!, so all three
