  # Stale `external_stub_info` removed from external_stubs.yaml: INFO has
  # its own environment-bound suite (`info_function.yaml`) because it is
  # host-state-dependent rather than an unavailable fixed-error stub.
  - id: external_stub_info
    applies_to: all
