# Known / accepted divergences between Formulon and Mac Excel 365 (ja-JP).
#
# Every entry documents a case where the oracle verifier would otherwise
# fail. Two modes are supported:
#
#   mode: skip-oracle
#     Case is excluded from oracle-gen and oracle-verify. Use sparingly,
#     and say which `cause` value applies — see below.
#     Prefer widening tolerance when possible.
#
#   tolerance: { abs: <N>, rel: <N> }
#     Case is generated and verified, but the verifier accepts any result
#     within the given absolute-or-relative tolerance. Default is strict
#     equality (0.0 / 0.0). Use for expected ±1ulp drift on transcendental
#     / statistical functions.
#
# Every entry MUST carry a `reason` string that cites an incident or
# source; `prefer` optionally records which implementation we trust if the
# two differ (Mac Excel 365 / Win Excel 365 / Formulon). PR reviewers
# check this file's diff on any oracle-gen roll-forward.
#
# Every `mode: skip-oracle` entry MUST also carry a `cause`, which
# `divergence_check.py` validates and tallies per cause. The release gate
# leaves skipped cases out of the pass-rate denominator on the grounds
# that they "can never pass" — true of exactly one of these causes, so the
# tally is what keeps the others from ageing into permanent exemptions:
#
#   cause: excel-no-value
#     Excel produces no comparable value at all — volatile / not
#     reproducible, or a formula it rejects at entry. Nothing we build
#     makes this comparable. The only cause the gate's rationale covers.
#
#   cause: harness-cannot-capture
#     Excel answers; our bridge cannot record the answer (xlwings writes
#     "" as blank, an error reads back as blank, a spill exceeds the
#     capture ceiling). Fixable on our side — read the count as a bug
#     queue, not an exemption.
#
#   cause: accepted-divergence
#     Both engines answer and we deliberately differ, preferring ours: an
#     Excel quirk we don't reproduce, a stubbed external, a documented API
#     shape. Long-lived by design.
#
#   cause: engine-gap
#     Excel answers and Formulon is wrong or not there yet. The entry is
#     deleted when the engine work lands.
#
#   cause: non-identifiable
#     Both engines answer and the quantity itself has no unique value to
#     agree on — a smoothing weight the data cannot pin down once the fit
#     saturates, an F statistic whose residual is zero in the limit.
#     Neither answer is the wrong one, which is what separates this from
#     `engine-gap`: there is no engine work that would close it. It is not
#     `accepted-divergence` either, because we did not choose to differ.
#     Long-lived, and the entry should carry the reason the quantity is
#     unidentifiable rather than a comparison of the two numbers.
#
#   cause: unclassified
#     The entry's own text does not determine which of the others applies:
#     it states two different blockers, or none of them in these terms.
#     Use it rather than picking the most plausible one — a guessed cause
#     reads as settled and nothing re-examines it, which is the failure
#     this field exists to prevent. The checker tallies these separately;
#     working the count down means going back to each entry's source.
#
# When more than one applies, record the cause that prevents the
# comparison *first* — harness before engine — because that is the one
# that has to be removed before the case can be judged at all. If that
# ordering is itself unclear from the text, the entry is `unclassified`.
#
# Schema (parsed by tools/oracle/oracle_gen.py):
#
#   entries:
#     - id: <case_id from tests/oracle/cases/*.yaml>
#       # `ids: [...]`, `suite: <name>`, and `suites: [...]` are also
#       # available for a shared tolerance / compare_mode policy. Skip
#       # entries must target exactly one `id`.
#       reason: "..."
#       mode: skip-oracle | tolerance      # default: tolerance
#       cause: excel-no-value | harness-cannot-capture
#              | accepted-divergence | engine-gap | non-identifiable
#              | unclassified
#                                          # REQUIRED when mode is
#                                          # skip-oracle; see above
#       tolerance: { abs: 1e-10, rel: 0 }
#       compare_mode: exact | complex_text | numeric_text | host_libm | ...
#       prefer: mac-excel-365 | win-excel-365 | formulon
#       first_noted: YYYY-MM-DD
#       last_verified_excel_version: "16.xx.x (Build ...)"
#       applies_to: all | [mac-365-ja_JP, win-365-ja_JP]
#                                          # `all`, or target names from
#                                          # tools/oracle/targets.yaml.
#                                          # REQUIRED on skip-oracle entries:
#                                          # a skip suppresses capture on the
#                                          # targets it covers, so one resting
#                                          # on a single host's observation
#                                          # names that host. Optional on
#                                          # tolerance / compare_mode entries,
#                                          # where omitted means every target.

entries:
  # Excel refuses these five spellings at entry, so no reading exists to
  # compare against. An array constant may hold an error *literal* but not a
  # function call, which rules out `{1,NA(),3}`, and the signature takes one
  # or two arguments. The same error contract is captured by the sibling
  # cases that spell it in a form Excel accepts.
  - ids:
      - arraytotext_error_in_array_default
      - arraytotext_error_in_array_strict
      - arraytotext_only_errors_default
      - arraytotext_arity_zero
      - arraytotext_arity_three
    applies_to: all
    mode: skip-oracle
    cause: excel-no-value
    reason: "Excel discards these formulas at entry rather than evaluating them: `NA()` inside an array constant is not accepted (an error literal such as `{1,#N/A,3}` is), and ARRAYTOTEXT takes one or two arguments. Observed by entering each and reading the formula back empty. The error contract they were written for is captured by arraytotext_error_literal_in_array_default / _strict, arraytotext_error_cells_default / _strict and arraytotext_only_error_cells_default, which Excel does accept. Windows Excel 365 ja-JP 16.0.20326 refuses it at entry as well (COM 0x800A03EC, recorded as a driver skip in tests/oracle/targets/win-365-ja_JP/golden/), so no Excel host produces a value."
    prefer: formulon
    first_noted: 2026-08-05
    last_verified_excel_version: "16.112.1"
  - ids:
      - weeknum_invalid_type_is_num
      - weeknum_return_type_negative
      - weeknum_neg2
    applies_to: [mac]
    mode: skip-oracle
    cause: excel-no-value
    reason: "WEEKNUM(DATE(2024,1,1),99), WEEKNUM(10,-2), WEEKNUM(DATE(2025,3,1),-2): Mac Excel 365 returns #NUM! or the type-1 week number for the same formula, flipping between cells and runs (about 20-35% #NUM! for return_type 22 and above, and for negative types). The documented types 1, 2, 11-17 and 21 are stable, as are the always-#NUM! types 0, 3-10 and 18-20. Formulon returns #NUM! for every unsupported type on every host."
    prefer: formulon
    first_noted: 2026-09-30
    last_verified_excel_version: "16.113.4"
  # -- ad-hoc evaluate-formula scalar reduction (intentional API shape) ----
  # `fm_workbook_evaluate_formula` (and the WASM / Node
  # `evaluateFormulaText`) return a single scalar. When the evaluated
  # formula produces an array/spill (e.g. `=SEQUENCE(3)`), the API reduces
  # it to the top-left element. In a real Excel cell the same formula would
  # spill the whole array; this is a deliberate Phase 1 API-shape choice,
  # not an Excel-compatibility bug, and not implicit intersection (which
  # selects the anchor-row/column element and yields #VALUE! when there is
  # none). evaluateFormulaArray returns the whole result. No oracle case is
  # generated for this behaviour; the entry documents the intent for
  # reviewers.
  - id: evaluate_formula_array_scalar_reduction
    applies_to: all
    cause: accepted-divergence
    mode: skip-oracle
    scope: api-contract
    evidence: [tests/c_api/formulon_c_evaluate_formula_test.cpp]
    reason: "fm_workbook_evaluate_formula / evaluateFormulaText reduce an array result to its top-left element (Phase 1 scalar API shape); a real cell would spill. Intentional API-shape divergence, not implicit intersection or an Excel bug."
    prefer: formulon
    first_noted: 2026-07-03
    last_verified_excel_version: "16.111.2"
  # -- ISFORMULA over a non-reference argument -----------------------------
  # ISFORMULA's argument is reference-typed, and Excel enforces that when
  # the formula is entered rather than when it is evaluated: `=ISFORMULA(42)`,
  # `=ISFORMULA("A1")` and `=ISFORMULA(1+1)` are all discarded at entry,
  # leaving the cell blank with no formula to read back. `=ISFORMULA(A1)`
  # and `=ISREF(42)` entered alongside them retain and evaluate normally,
  # so this is Excel's grammar and not a bridge failure.
  #
  # Excel therefore never produces a value for these, and Formulon's
  # #VALUE! is unobservable rather than wrong. A setup-cell empty string is
  # a separate matter and no longer skipped: the apostrophe entry prefix
  # writes a genuine zero-length string, so ISBLANK / COUNTIF over one are
  # captured from Excel directly.
  - ids:
      - isformula_of_literal_number_is_value
      - isformula_of_literal_text_is_value
    applies_to: all
    mode: skip-oracle
    cause: excel-no-value
    reason: "Excel rejects ISFORMULA with a non-reference argument at entry, so the cell stays blank and no value is ever produced. Observed by reading the formula back empty while the `=ISFORMULA(A1)` and `=ISREF(42)` controls entered in the same pass retained and evaluated. Formulon returns #VALUE!, which Excel gives no answer to compare against. Windows Excel 365 ja-JP 16.0.20326 refuses it at entry as well (COM 0x800A03EC, recorded as a driver skip in tests/oracle/targets/win-365-ja_JP/golden/), so no Excel host produces a value."
    prefer: formulon
    first_noted: 2026-04-23
    last_verified_excel_version: "16.112.1"

  # -- Formulas Excel refuses to accept into a cell ------------------------
  # These three share one mechanism, established by writing the formula
  # through `formula2` and reading it straight back: the cell retains
  # nothing. Excel never accepts the formula, so it never evaluates one
  # and there is no result of any kind — not an error category the bridge
  # failed to reify, and not a blank cell. The earlier reading ("xlwings
  # reads the rejection back as blank") described the capture path that
  # existed before the driver checked retention, and was wrong about
  # where the value was lost.
  #
  # The control that makes an empty read-back mean refusal rather than a
  # dead bridge: in the same generator invocation, `erf_zero` and
  # `erf_one` set and captured normally (0.0 and 0.8427007929497149).
  - id: rows_of_mixed_row_array_literal
    applies_to: all
    cause: excel-no-value
    mode: skip-oracle
    reason: "Mac Excel refuses =ROWS({1,2;3,4,5}) at entry: the formula written through formula2 reads back empty, so no formula is stored and Excel evaluates nothing. Formulon's parser surfaces #NAME? for the jagged array literal. Windows Excel 365 ja-JP 16.0.20326 refuses it at entry as well (COM 0x800A03EC, recorded as a driver skip in tests/oracle/targets/win-365-ja_JP/golden/), so no Excel host produces a value."
    prefer: formulon
    first_noted: 2026-04-26
    last_verified_excel_version: "16.112"

  - id: erf_precise_two_arg_rejected
    applies_to: all
    cause: excel-no-value
    mode: skip-oracle
    reason: "Mac Excel refuses =ERF.PRECISE(1,2) at entry (the function is strict 1-arg): the formula written through formula2 reads back empty, so no formula is stored and Excel evaluates nothing. Formulon's registry enforces the (1,1) arity bound and returns #VALUE!, which is the more useful surface for tooling that consumes formula errors. Windows Excel 365 ja-JP 16.0.20326 refuses it at entry as well (COM 0x800A03EC, recorded as a driver skip in tests/oracle/targets/win-365-ja_JP/golden/), so no Excel host produces a value."
    prefer: formulon
    first_noted: 2026-04-26
    last_verified_excel_version: "16.112"

  - id: erfc_precise_two_arg_rejected
    applies_to: all
    cause: excel-no-value
    mode: skip-oracle
    reason: "Mac Excel refuses =ERFC.PRECISE(1,2) at entry: the formula written through formula2 reads back empty, so no formula is stored and Excel evaluates nothing. Formulon returns #VALUE! from arity enforcement, mirroring erf_precise_two_arg_rejected. Windows Excel 365 ja-JP 16.0.20326 refuses it at entry as well (COM 0x800A03EC, recorded as a driver skip in tests/oracle/targets/win-365-ja_JP/golden/), so no Excel host produces a value."
    prefer: formulon
    first_noted: 2026-04-29
    last_verified_excel_version: "16.112"

  # Capture-driver exceptions land in the golden's own `skipped` field
  # (oracle_gen.py's driver-exception path), which is a permanent GTEST_SKIP
  # but was never mirrored here -- so divergence_check.py's per-cause tally,
  # the release gate's sole accounting of what is skipped and why, silently
  # omitted these two. Same mechanism and evidence shape as
  # rows_of_mixed_row_array_literal above: formula2 readback empty.
  - ids:
      - rows_of_two_endpoint_mixed_axis
      - columns_of_two_endpoint_mixed_axis
    applies_to: all
    cause: excel-no-value
    mode: skip-oracle
    reason: "Mac Excel refuses the two-endpoint mixed-axis spelling (=ROWS(A:1), =COLUMNS(A:1)) at entry: the formula written through formula2 reads back empty, so no formula is stored and Excel evaluates nothing. The three-endpoint spelling (=ROWS(1:3:E5) / =COLUMNS(1:3:E5), cases rows_of_whole_row_chained_with_cell / columns_of_whole_row_chained_with_cell) is accepted and has a real golden. Formulon's parser surfaces #NAME? for the rejected two-endpoint spelling. Windows Excel 365 ja-JP 16.0.20326 refuses it at entry as well (COM 0x800A03EC, recorded as a driver skip in tests/oracle/targets/win-365-ja_JP/golden/), so no Excel host produces a value."
    prefer: formulon
    first_noted: 2026-08-21
    last_verified_excel_version: "16.112.1"

  # Stale `phonetic_returns_input_text` removed: PHONETIC now substitutes
  # each annotated span and passes the rest of the string through, so a
  # partially annotated `東京都` reads `トウキョウ都` on both engines. The
  # `<rPh>` sb/eb offsets are carried from the readers onto the cell and
  # back out through the writer instead of being flattened into one kana
  # string; `tests/integration/ooxml_phonetic_roundtrip_test.cpp` pins the
  # Excel-observed package end to end.
  # Stale `getpivotdata_always_ref` removed 2026-05-02: GETPIVOTDATA now
  # has a working pivot-anchor lookup path, and the OOXML reader wires
  # pivot caches + pivot tables onto the workbook so anchors over real
  # pivots resolve. The remaining external-stub case
  # (`external_stub_getpivotdata`) verifies the no-pivot anchor path
  # against Mac and is no longer a divergence; see external_stubs.yaml.
  # Stale `isomitted_always_false` removed 2026-04-28: LAMBDA is now wired
  # and ISOMITTED is exercised under the lambda suite below; `[optional]`
  # parameter syntax is the remaining gap, captured per-case.

  # -- LAMBDA family (oracle-close family=lambda, 2026-04-28) ---------------
  # The LAMBDA helper implementation is live for anchor unwrap, MAP shape
  # extension, and per-slot error spills.

  # Gap 1: LAMBDA-helper anchor unwrap — closed 2026-05-01.
  # BYROW / BYCOL / MAP / SCAN / MAKEARRAY (and SEQUENCE / TRANSPOSE in the
  # dynamic-array suite) return ValueKind::Array in single-cell evaluation.
  # The oracle comparator now projects Array results down to their top-left
  # anchor cell (matching xlwings' read-back semantics); see
  # tests/oracle/oracle_anchor.{h,cpp} and the corresponding unit tests.
  #
  # Stale `bycol_error_in_column` / `map_error_propagation` /
  # `scan_error_in_element` removed: BYROW / BYCOL / SCAN no longer collapse
  # the whole call on the first errored slot, so each helper spills the
  # error into its own output cell (SCAN additionally carries it forward on
  # the accumulator) exactly as Excel does. The three case formulas also
  # moved off `1/0` inside an array constant — an expression Excel rejects
  # at formula entry — onto the `#DIV/0!` error literal, so they now name
  # something a live host can actually evaluate. Regenerated: all three
  # goldens in tests/oracle/targets/mac-365-ja_JP/golden/lambda.golden.json carry the live
  # per-slot #DIV/0! array result with no `skipped` field.

  # Gap 2 (closed 2026-04-29): Formulon parser now accepts the
  # `[optional_param]` bracket syntax in LAMBDA parameter lists. Optional
  # trailing params bind to an "omitted" sentinel detected by ISOMITTED
  # via the active NameEnv frame.

  # Stale `forecast_ets_seasonality_linear_no_period` removed: the
  # seasonality detector now removes the linear trend before computing the
  # autocorrelation, so a perfectly linear series reports no period (0) like
  # Excel instead of picking lag 2 off a non-stationary series. Regenerated:
  # tests/oracle/targets/mac-365-ja_JP/golden/forecast_ets.golden.json carries the live
  # `{kind: number, value: 0.0}` result with no `skipped` field.

  # Stale MUNIT spill-navigation entries removed 2026-05-15:
  # resolve_range_arg now unwraps generic Value::Array results, so
  # INDEX(MUNIT(...)) and SUMPRODUCT(MUNIT(...)) are live oracle cases.

  # The four GROUPBY/PIVOTBY aggregator cases were skipped here on the
  # grounds that Excel rejects "compact inline-array" formulas. That
  # diagnosis was wrong: inline arrays evaluate fine, and the rejection
  # came from a literal 0 in the sort_order slot, which Excel treats as
  # out of domain (sort_order is a signed column index with no zero
  # member). The cases now pass an in-contract argument list. Both GROUPBY
  # and PIVOTBY sort_order cases became live goldens that Formulon
  # matches exactly. Re-probing the two PIVOTBY aggregator-dispatch cases
  # here (pivotby_bare_sum / pivotby_lambda_sum) surfaced a real 2x3-vs-3x3
  # shape defect in the merged single-column layout, since fixed -- both
  # are live goldens now too.
  # Retired the pair of `engine-gap` entries that recorded a supplied
  # `sort_order` of 0 spilling instead of erroring
  # (`groupby_sort_order_zero_rejected` / `pivotby_row_sort_order_zero_rejected`).
  # The slot is a signed column index with no zero member, so a supplied 0
  # now returns #VALUE! while omission keeps taking the documented default;
  # both cases are live goldens.

  # Regression family residual: an empty-array-literal read-back quirk.
  - id: frequency_empty_bins
    applies_to: all
    cause: excel-no-value
    reason: "Mac Excel refuses =FREQUENCY({1;2;3}, {}) at entry: the formula written through formula2 reads back empty, so no formula is stored and Excel evaluates nothing. The empty array literal is rejected as a formula construct rather than treated as a degenerate bins argument. Formulon's parser rejects the empty array literal as well and returns #NAME?. Bins that hold no numeric value -- the 1x1 total-count spill -- are covered by tests/unit/eval/frequency_eval_test.cpp. Windows Excel 365 ja-JP 16.0.20326 refuses it at entry as well (COM 0x800A03EC, recorded as a driver skip in tests/oracle/targets/win-365-ja_JP/golden/), so no Excel host produces a value."
    prefer: formulon
    first_noted: 2026-05-15
    last_verified_excel_version: "16.112"
    mode: skip-oracle
  # Volatile / non-deterministic cluster (NOW / TODAY / RAND / RANDBETWEEN /
  # RANDARRAY). Each function's result is intrinsically non-reproducible —
  # NOW/TODAY drift over wall-clock time, the RAND family draws from a
  # non-seedable PRNG. These entries declare the closure cluster; oracle
  # parity is not meaningful, so every case is `mode: skip-oracle`. Per-
  # function correctness is covered by unit tests (range / shape).
  - id: volatile_now_clock
    applies_to: all
    cause: excel-no-value
    reason: "NOW() depends on wall-clock time; oracle comparison is intrinsically non-reproducible."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.112.1"
    mode: skip-oracle
  - id: volatile_today_clock
    applies_to: all
    cause: excel-no-value
    reason: "TODAY() depends on wall-clock date; oracle comparison is intrinsically non-reproducible."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.112.1"
    mode: skip-oracle
  - id: volatile_rand_uniform
    applies_to: all
    cause: excel-no-value
    reason: "RAND() draws from a non-seedable PRNG; oracle comparison is intrinsically non-reproducible."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.112.1"
    mode: skip-oracle
  - id: volatile_randbetween_int
    applies_to: all
    cause: excel-no-value
    reason: "RANDBETWEEN draws from a non-seedable PRNG; oracle comparison is intrinsically non-reproducible."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.112.1"
    mode: skip-oracle
  - id: volatile_randarray_2x2
    applies_to: all
    cause: excel-no-value
    reason: "RANDARRAY draws from a non-seedable PRNG; oracle comparison is intrinsically non-reproducible."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.112.1"
    mode: skip-oracle

  # Unavailable host-service / connection stubs. These functions are
  # recognized by name and arity, but Formulon deliberately returns a
  # deterministic unavailable surface because the required runtime,
  # network service, or OLAP connection is outside the pure calculation
  # engine. Fixed return codes are covered by unit tests; these entries
  # exclude the representative probes from oracle-verify.
  - id: external_stub_image
    applies_to: all
    cause: accepted-divergence
    reason: "IMAGE fetches a network image; Formulon does no network I/O and stubs to #VALUE!. Oracle parity requires an embedded image client."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.112.1"
    mode: skip-oracle
  - id: external_stub_py
    applies_to: all
    cause: accepted-divergence
    reason: "PY runs Python in the cloud; Formulon does not embed a Python runtime and stubs to #NAME?. Oracle parity requires the Microsoft 365 PY service."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.112.1"
    mode: skip-oracle
  - id: external_stub_stockhistory
    applies_to: all
    cause: accepted-divergence
    reason: "STOCKHISTORY pulls live market data; Formulon does no network I/O. Oracle parity requires Microsoft 365 stock data subscription."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.112.1"
    mode: skip-oracle
  - id: external_stub_webservice
    applies_to: [win-365-ja_JP]
    cause: accepted-divergence
    reason: "WEBSERVICE makes an HTTP request; Formulon does no network I/O and returns #VALUE! on Windows profiles. Mac Excel does not provide WEBSERVICE (#NAME?), which Mac profiles return."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.113.4"
    mode: skip-oracle
  - id: external_stub_copilot
    applies_to: [win-365-ja_JP]
    cause: accepted-divergence
    reason: "COPILOT dispatches to an LLM backend; Formulon does not embed one and returns #NAME?. Mac Excel 16.113 does not provide COPILOT either (#NAME?), so only Windows profiles diverge where the Microsoft 365 Copilot service is available."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.113.4"
    mode: skip-oracle
  - id: external_stub_detectlanguage
    applies_to: all
    cause: accepted-divergence
    reason: "DETECTLANGUAGE calls a translation cloud; Formulon does no network I/O and stubs to #NAME?."
    prefer: formulon
    first_noted: 2026-04-28
