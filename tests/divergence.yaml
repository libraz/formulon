# Known / accepted divergences between Formulon and Mac Excel 365 (ja-JP).
#
# Every entry documents a case where the oracle verifier would otherwise
# fail. Two modes are supported:
#
#   mode: skip-oracle
#     Case is excluded from oracle-gen and oracle-verify. Use sparingly,
#     and say which of the four `cause` values applies — see below.
#     Prefer widening tolerance when possible.
#
#   tolerance: { abs: <N>, rel: <N> }
#     Case is generated and verified, but the verifier accepts any result
#     within the given absolute-or-relative tolerance. Default is strict
#     equality (0.0 / 0.0). Use for expected ±1ulp drift on transcendental
#     / statistical functions.
#
# Every entry MUST carry a `reason` string that cites an incident or
# source; `prefer` optionally records which implementation we trust if the
# two differ (Mac Excel 365 / Win Excel 365 / Formulon). PR reviewers
# check this file's diff on any oracle-gen roll-forward.
#
# Every `mode: skip-oracle` entry MUST also carry a `cause`, which
# `divergence_check.py` validates and tallies per cause. The release gate
# leaves skipped cases out of the pass-rate denominator on the grounds
# that they "can never pass" — true of exactly one of these four, so the
# tally is what keeps the other three from ageing into permanent
# exemptions:
#
#   cause: excel-no-value
#     Excel produces no comparable value at all — volatile / not
#     reproducible, or a formula it rejects at entry. Nothing we build
#     makes this comparable. The only cause the gate's rationale covers.
#
#   cause: harness-cannot-capture
#     Excel answers; our bridge cannot record the answer (xlwings writes
#     "" as blank, an error reads back as blank, a spill exceeds the
#     capture ceiling). Fixable on our side — read the count as a bug
#     queue, not an exemption.
#
#   cause: accepted-divergence
#     Both engines answer and we deliberately differ, preferring ours: an
#     Excel quirk we don't reproduce, a stubbed external, a documented API
#     shape. Long-lived by design.
#
#   cause: engine-gap
#     Excel answers and Formulon is wrong or not there yet. The entry is
#     deleted when the engine work lands.
#
#   cause: unclassified
#     The entry's own text does not determine which of the four applies:
#     it states two different blockers, or none of them in these terms.
#     Use it rather than picking the most plausible one — a guessed cause
#     reads as settled and nothing re-examines it, which is the failure
#     this field exists to prevent. The checker tallies these separately;
#     working the count down means going back to each entry's source.
#
# When more than one of the four applies, record the cause that prevents
# the comparison *first* — harness before engine — because that is the one
# that has to be removed before the case can be judged at all. If that
# ordering is itself unclear from the text, the entry is `unclassified`.
#
# Schema (parsed by tools/oracle/oracle_gen.py):
#
#   entries:
#     - id: <case_id from tests/oracle/cases/*.yaml>
#       # `ids: [...]`, `suite: <name>`, and `suites: [...]` are also
#       # available for a shared tolerance / compare_mode policy. Skip
#       # entries must target exactly one `id`.
#       reason: "..."
#       mode: skip-oracle | tolerance      # default: tolerance
#       cause: excel-no-value | harness-cannot-capture
#              | accepted-divergence | engine-gap | unclassified
#                                          # REQUIRED when mode is
#                                          # skip-oracle; see above
#       tolerance: { abs: 1e-10, rel: 0 }
#       compare_mode: exact | complex_text | numeric_text | ...
#       prefer: mac-excel-365 | win-excel-365 | formulon
#       first_noted: YYYY-MM-DD
#       last_verified_excel_version: "16.xx.x (Build ...)"
#       applies_to: [mac-365-ja_JP, win-365-ja_JP]   # optional; list of
#                                                     # oracle target names
#                                                     # from tools/oracle/
#                                                     # targets.yaml. Default
#                                                     # (omitted / null) =
#                                                     # applies to every
#                                                     # target. Entries with
#                                                     # an unrecognised type
#                                                     # are rejected loudly
#                                                     # so typos surface
#                                                     # immediately.

entries:
  # Excel preserves its 1900 serial-calendar weekday offset for dates before
  # the fictitious 1900-02-29. Formulon intentionally returns the real
  # proleptic-Gregorian weekday; this non-oracle unit test fixes that policy.
  - id: weekday_pre_1900_excel_serial_bug
    cause: accepted-divergence
    mode: skip-oracle
    scope: unit-test
    evidence: [tests/unit/eval/builtins_datetime_test.cpp]
    reason: "Excel 365 ja-JP 16.111.2 returns WEEKDAY(DATE(1900,1,1),2)=7 and WEEKDAY(DATE(1900,2,28),2)=2, one day earlier than their real Gregorian weekdays. Formulon intentionally returns 1 and 3."
    prefer: formulon
    first_noted: 2026-08-05
    last_verified_excel_version: "16.111.2"

  # Mac xlwings reads ARRAYTOTEXT error results back as blank cells, so the
  # primary golden cannot distinguish #N/A / #VALUE! from a real blank.
  - ids:
      - arraytotext_error_in_array_default
      - arraytotext_error_in_array_strict
      - arraytotext_only_errors_default
      - arraytotext_arity_zero
      - arraytotext_arity_three
    mode: skip-oracle
    cause: harness-cannot-capture
    reason: "Mac xlwings reads ARRAYTOTEXT array-error and arity-error results back as blank, losing Excel's error code. Function-level tests cover the real error contract."
    prefer: formulon
    first_noted: 2026-08-05
    last_verified_excel_version: "16.108.1"
  # -- ad-hoc evaluate-formula scalar reduction (intentional API shape) ----
  # `fm_workbook_evaluate_formula` (and the WASM / Node
  # `evaluateFormulaText`) return a single scalar. When the evaluated
  # formula produces an array/spill (e.g. `=SEQUENCE(3)`), the API reduces
  # it to the top-left element. In a real Excel cell the same formula would
  # spill the whole array; this is a deliberate Phase 1 API-shape choice,
  # not an Excel-compatibility bug, and not implicit intersection (which
  # selects the anchor-row/column element and yields #VALUE! when there is
  # none). Multi-cell results are a Phase 2 follow-up. No oracle case is
  # generated for this behaviour; the entry documents the intent for
  # reviewers.
  - id: evaluate_formula_array_scalar_reduction
    cause: accepted-divergence
    mode: skip-oracle
    scope: api-contract
    evidence: [tests/c_api/formulon_c_evaluate_formula_test.cpp]
    reason: "fm_workbook_evaluate_formula / evaluateFormulaText reduce an array result to its top-left element (Phase 1 scalar API shape); a real cell would spill. Intentional API-shape divergence, not implicit intersection or an Excel bug."
    prefer: formulon
    first_noted: 2026-07-03
    last_verified_excel_version: "16.111.2"
  # -- xlwings empty-string / blank read-back gaps -------------------------
  # The Mac xlwings driver cannot write a cell holding the empty string
  # "": assigning "" leaves the cell genuinely blank from Excel's point of
  # view. Formula results that return "" are verified with
  # compare_mode=empty_string_readback; the remaining skipped cases below
  # need an actual setup-cell empty string, or hit xlwings blank read-back
  # for rejected formulas. Revisit if the oracle pipeline moves to a bridge
  # that can preserve Excel empty-string cells and rejected-formula errors.
  - id: isblank_of_empty_string
    cause: harness-cannot-capture
    mode: skip-oracle
    reason: "xlwings writes \"\" as a blank cell, so Excel reports ISBLANK=TRUE even though Formulon correctly says FALSE."
    prefer: formulon
    first_noted: 2026-04-23
    last_verified_excel_version: "16.111.2"
  - id: countif_notequal_empty_over_mixed
    cause: harness-cannot-capture
    mode: skip-oracle
    reason: "xlwings writes \"\" as a blank cell, so Excel's COUNTIF(range, \"<>\") over a range with a literal-\"\" cell sees one fewer populated cell than Formulon's in-memory model. Formulon returns 3, Mac records 2 due to the xlwings round-trip gap."
    prefer: formulon
    first_noted: 2026-04-25
    last_verified_excel_version: "16.111.2"
  - id: isformula_of_literal_number_is_value
    cause: harness-cannot-capture
    mode: skip-oracle
    reason: "Mac returns #VALUE!; xlwings reads it back as blank, producing a spurious kind mismatch."
    prefer: formulon
    first_noted: 2026-04-23
    last_verified_excel_version: "16.111.2"
  - id: isformula_of_literal_text_is_value
    cause: harness-cannot-capture
    mode: skip-oracle
    reason: "Mac returns #VALUE!; xlwings reads it back as blank, producing a spurious kind mismatch."
    prefer: formulon
    first_noted: 2026-04-23
    last_verified_excel_version: "16.111.2"

  # -- BESSELI: Formulon more accurate than Excel's A&S 9.8.1/9.8.2 -------
  # Excel's BESSELI uses the Abramowitz & Stegun rational polynomial
  # approximations (rated |epsilon| < ~1.9e-7) for I_n(x). Formulon's
  # power-series implementation is accurate to ~1e-13 in practice, so it
  # diverges from Excel by up to a few times 1e-7 in the value. The
  # discrepancy is within the published Excel error bound, so the answers
  # are both "right" — we just differ on which one we trust. Verified at
  # I_0(1): true value 1.26606587775..., Formulon 1.26606587775,
  # Mac Excel 1.26606584803 (~3e-8 absolute error). I_0(20): true
  # 43558282.559, Formulon 43558282.560, Mac Excel 43558285.788
  # (~7.4e-8 relative). Tolerance widening is applied per-case in
  # tests/oracle/cases/engineering_special.yaml; this entry documents
  # the underlying numerical-accuracy reason.
  - id: besseli_one_zero
    reason: "Formulon's power-series BESSELI is more accurate than Mac Excel's A&S polynomial approximation; ~3e-8 absolute drift at I_0(1) is within Excel's published 1.9e-7 error bound. Per-case tolerance widened in engineering_special.yaml."
    tolerance: { abs: 1e-6, rel: 1e-7 }
    prefer: formulon
    first_noted: 2026-04-26
    last_verified_excel_version: "16.108.1"
  - id: besseli_text_x_coerces
    reason: "Same BESSELI accuracy gap as besseli_one_zero (both compute I_0(1)). Per-case tolerance widened in engineering_special.yaml."
    tolerance: { abs: 1e-6, rel: 1e-7 }
    prefer: formulon
    first_noted: 2026-04-26
    last_verified_excel_version: "16.108.1"
  - id: besseli_large_x_growth
    reason: "I_0(20): Excel's A&S 9.8.2 large-x polynomial has |epsilon| < 1.9e-7; observed diff is ~7.4e-8 relative (~3 absolute on a 4.4e7 magnitude). Per-case tolerance widened in engineering_special.yaml."
    tolerance: { abs: 100.0, rel: 1e-6 }
    prefer: formulon
    first_noted: 2026-04-26
    last_verified_excel_version: "16.108.1"

  # -- BESSELY: Formulon's POSIX delegation more accurate than Excel ------
  # BESSELY(x, n) goes through POSIX `::yn`, which on macOS / glibc / musl
  # is accurate to within a few ULPs of the true value. Mac Excel's
  # implementation diverges by ~1e-7 at moderate orders. Same accuracy
  # story as BESSELI. Verified at Y_5(2): true -9.93598912848...,
  # Formulon -9.93598912848 (POSIX), Mac Excel -9.93598902280.
  - id: bessely_large_order_decay
    reason: "Y_5(2): Formulon's POSIX ::yn matches the true value to ULP; Mac Excel diverges by ~1.1e-7. Same accuracy gap as BESSELI. Per-case tolerance widened in engineering_special.yaml."
    tolerance: { abs: 1e-6, rel: 1e-7 }
    prefer: formulon
    first_noted: 2026-04-26
    last_verified_excel_version: "16.108.1"

  # -- Jagged array literal: xlwings parse-error blank read-back ---------
  # Mac Excel rejects `=ROWS({1,2;3,4,5})` at the formula level (jagged
  # array rows). xlwings reads the rejection back as a blank cell rather
  # than an error category, so the golden records `kind: blank`.
  # Formulon's parser correctly surfaces a `#NAME?` for the malformed
  # array literal. Same family of xlwings round-trip gaps as
  # erf_precise_two_arg_rejected.
  - id: rows_of_mixed_row_array_literal
    cause: unclassified
    mode: skip-oracle
    reason: "Mac Excel rejects =ROWS({1,2;3,4,5}) at the formula level; xlwings reads the rejection back as blank. Formulon correctly surfaces #NAME? for the jagged array literal."
    prefer: formulon
    first_noted: 2026-04-26
    last_verified_excel_version: "16.108.1"

  # -- ERF.PRECISE arity rejection: Mac Excel returns blank, not error ----
  # Mac Excel 365 ja-JP refuses to evaluate `=ERF.PRECISE(1, 2)` (the
  # function is documented as strict 1-arg) and surfaces something the
  # xlwings driver reads back as a blank cell — most likely a parse-time
  # rejection or an error category xlwings can't reify. Formulon's
  # registry enforces the (1,1) arity bound and correctly returns
  # #VALUE!, which is the more useful behaviour for tooling that
  # consumes formula errors.
  - id: erf_precise_two_arg_rejected
    cause: unclassified
    mode: skip-oracle
    reason: "Mac Excel rejects =ERF.PRECISE(1,2) at the formula level; xlwings reads the rejection back as blank. Formulon correctly surfaces #VALUE! from arity enforcement."
    prefer: formulon
    first_noted: 2026-04-26
    last_verified_excel_version: "16.108.1"

  - id: erfc_precise_two_arg_rejected
    cause: unclassified
    mode: skip-oracle
    reason: "Mac Excel rejects =ERFC.PRECISE(1,2) at the formula level; xlwings reads the rejection back as blank. Formulon correctly surfaces #VALUE! from arity enforcement, mirroring erf_precise_two_arg_rejected."
    prefer: formulon
    first_noted: 2026-04-29
    last_verified_excel_version: "16.108.1"

  # -- No-infrastructure stubs --------------------------------------------
  # These functions return a deterministic Excel-visible surface in lieu
  # of a Formulon subsystem that is not yet built out. The stubs live in
  # `src/eval/builtins/service_stubs.cpp` next to the host-service stubs
  # (IMAGE / RTD / TRANSLATE / DETECTLANGUAGE / COPILOT). When the
  # underlying subsystem lands, the corresponding stub is replaced with
  # a real implementation and the entry below is removed.
  - id: phonetic_returns_input_text
    cause: engine-gap
    mode: skip-oracle
    scope: deferred-feature
    evidence: [tests/integration/ooxml_phonetic_roundtrip_test.cpp]
    reason: "PHONETIC currently returns the input text instead of the IME-typed kana because OOXML <rPh> annotations are not yet read into Formulon's Value model; phonetic metadata not yet modelled."
    prefer: mac-excel-365
    first_noted: 2026-04-28
    last_verified_excel_version: "16.108.1"
  # Stale `getpivotdata_always_ref` removed 2026-05-02: GETPIVOTDATA now
  # has a working pivot-anchor lookup path, and the OOXML reader wires
  # pivot caches + pivot tables onto the workbook so anchors over real
  # pivots resolve. The remaining external-stub case
  # (`external_stub_getpivotdata`) verifies the no-pivot anchor path
  # against Mac and is no longer a divergence; see external_stubs.yaml.
  # Stale `isomitted_always_false` removed 2026-04-28: LAMBDA is now wired
  # and ISOMITTED is exercised under the lambda suite below; `[optional]`
  # parameter syntax is the remaining gap, captured per-case.

  # -- LAMBDA family (oracle-close family=lambda, 2026-04-28) ---------------
  # The LAMBDA helper implementation is live for anchor unwrap, MAP shape
  # extension, and per-slot error spills.

  # Gap 1: LAMBDA-helper anchor unwrap — closed 2026-05-01.
  # BYROW / BYCOL / MAP / SCAN / MAKEARRAY (and SEQUENCE / TRANSPOSE in the
  # dynamic-array suite) return ValueKind::Array in single-cell evaluation.
  # The oracle comparator now projects Array results down to their top-left
  # anchor cell (matching xlwings' read-back semantics); see
  # tests/oracle/oracle_anchor.{h,cpp} and the corresponding unit tests.
  #
  # Stale `bycol_error_in_column` / `map_error_propagation` /
  # `scan_error_in_element` removed: BYROW / BYCOL / SCAN no longer collapse
  # the whole call on the first errored slot, so each helper spills the
  # error into its own output cell (SCAN additionally carries it forward on
  # the accumulator) exactly as Excel does. The three case formulas also
  # moved off `1/0` inside an array constant — an expression Excel rejects
  # at formula entry — onto the `#DIV/0!` error literal, so they now name
  # something a live host can actually evaluate. Regenerated: all three
  # goldens in tests/oracle/golden/lambda.golden.json carry the live
  # per-slot #DIV/0! array result with no `skipped` field.

  # Gap 2 (closed 2026-04-29): Formulon parser now accepts the
  # `[optional_param]` bracket syntax in LAMBDA parameter lists. Optional
  # trailing params bind to an "omitted" sentinel detected by ISOMITTED
  # via the active NameEnv frame.

  # Gap 3: REGEX* family with catastrophic-backtracking inputs. PCRE2
  # bounds runtime via match_limit (1_000_000) and depth_limit (10_000),
  # surfacing FALSE (REGEXTEST) or #CALC! (REGEXEXTRACT / REGEXREPLACE)
  # when a pattern blows past the budget. Mac Excel applies no such
  # bound and hangs indefinitely on the same inputs, which xlwings
  # translates into a generation-time timeout. The Formulon outcomes
  # are intentional safety-vs-fidelity choices and are exempt from
  # oracle verification.
  - id: regex_match_limit_regextest
    cause: excel-no-value
    mode: skip-oracle
    scope: unit-test
    evidence: [tests/unit/eval/builtins_regex_test.cpp]
    reason: "REGEXTEST with catastrophic backtracking pattern: Mac Excel hangs indefinitely; Formulon returns FALSE after pcre2_match_limit=1000000 iterations."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.108.1"
  - id: regex_match_limit_regexextract
    cause: excel-no-value
    mode: skip-oracle
    scope: unit-test
    evidence: [tests/unit/eval/builtins_regex_test.cpp]
    reason: "REGEXEXTRACT with catastrophic backtracking: Mac Excel hangs; Formulon returns #CALC! after the pcre2 match limit is exceeded."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.108.1"
  - id: regex_match_limit_regexreplace
    cause: excel-no-value
    mode: skip-oracle
    scope: unit-test
    evidence: [tests/unit/eval/builtins_regex_test.cpp]
    reason: "REGEXREPLACE with catastrophic backtracking: Mac Excel hangs; Formulon returns #CALC! after the pcre2 match limit is exceeded."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.108.1"

  # FORECAST.ETS Holt-Winters fit is non-convex; Mac Excel converges to
  # (alpha,beta,gamma) close to (1,1,1) on perfectly-periodic data and
  # snaps the forecast to an exact integer (18.0). Formulon's bounded
  # Nelder-Mead settles at a nearby local optimum (~4.3e-4 relative
  # offset). Tightening convergence risks regressing other ETS cases;
  # widen tolerance per case instead.
  - id: forecast_ets_manual_seasonality_4
    reason: "Holt-Winters Nelder-Mead converges to a different local optimum than Mac Excel on perfectly-periodic data; ~4.3e-4 relative drift on the point forecast."
    prefer: mac-excel-365
    first_noted: 2026-04-28
    last_verified_excel_version: "16.108.1"
    tolerance: { abs: 0.01, rel: 0.001 }
  - id: forecast_ets_auto_detect_seasonality
    reason: "Same Holt-Winters convergence drift as forecast_ets_manual_seasonality_4 but with auto-detected period (ACF picks the same period 4)."
    prefer: mac-excel-365
    first_noted: 2026-04-28
    last_verified_excel_version: "16.108.1"
    tolerance: { abs: 0.01, rel: 0.001 }

  # FORECAST.ETS.CONFINT / .STAT — joint (alpha, beta, gamma, L_0, B_0,
  # S_0..S_{m-1}) optimisation (added 2026-04-29) closes the basin gap
  # against Mac Excel for fit-quality metrics: the optimiser now jointly
  # tunes the smoothing parameters and the initial state vector, reaching
  # RMSE / MASE values matching Mac on cyclic period-4 and linear data.
  # Four entries that previously sat under `mode: skip-oracle`
  # (forecast_ets_confint_default_confidence,
  # forecast_ets_confint_higher_confidence, forecast_ets_stat_rmse,
  # forecast_ets_stat_mase) now agree with Mac within case-level
  # tolerance. The remaining stat=1 (alpha) divergence is documented
  # below: when fit quality saturates (RMSE -> 0), multiple (alpha,
  # beta, gamma, init-state) combinations achieve the same SSE and the
  # alpha value becomes non-unique; Mac picks alpha ~0.751, Formulon
  # picks alpha ~0.09 on the same data with the same RMSE.
  - id: forecast_ets_stat_alpha
    cause: unclassified
    reason: "On cyclic period-4 data where joint optimisation drives RMSE -> 0, the alpha value is non-unique: any (alpha, beta, gamma, initial-state) combination with the same forecast manifold yields the same SSE. Mac selects alpha ~0.751 via its bias / regularisation; Formulon's bounded Nelder-Mead reaches RMSE = 0 at alpha ~0.09. The fit quality (RMSE / MASE) matches Mac; the smoothing weight is a non-identifiable parameter on this fixture."
    prefer: mac-excel-365
    first_noted: 2026-04-28
    last_verified_excel_version: "16.108.1"
    mode: skip-oracle

  # Stale `forecast_ets_seasonality_linear_no_period` removed: the
  # seasonality detector now removes the linear trend before computing the
  # autocorrelation, so a perfectly linear series reports no period (0) like
  # Excel instead of picking lag 2 off a non-stationary series. Regenerated:
  # tests/oracle/golden/forecast_ets.golden.json carries the live
  # `{kind: number, value: 0.0}` result with no `skipped` field.

  # REGEXEXTRACT spill-mode results — modes 1 (1 x N) and 2 (1 x G) are
  # now captured as full arrays by the spill-shape oracle probe. Mode 3
  # remains skipped until Mac Excel exposes return_mode=3.
  - id: regexextract_mode_3_all_capture_groups
    cause: accepted-divergence
    reason: "Mac Excel 365 16.109 returns #VALUE! for REGEXEXTRACT return_mode=3; Formulon implements per MS docs and validates via unit tests."
    prefer: formulon
    first_noted: 2026-04-28
    last_verified_excel_version: "16.109"
    mode: skip-oracle

  # Stale MUNIT spill-navigation entries removed 2026-05-15:
  # resolve_range_arg now unwraps generic Value::Array results, so
  # INDEX(MUNIT(...)) and SUMPRODUCT(MUNIT(...)) are live oracle cases.

  # The four GROUPBY/PIVOTBY aggregator cases were skipped here on the
  # grounds that Excel rejects "compact inline-array" formulas. That
  # diagnosis was wrong: inline arrays evaluate fine, and the rejection
  # came from a literal 0 in the sort_order slot, which Excel treats as
  # out of domain (sort_order is a signed column index with no zero
  # member). The cases now pass an in-contract argument list. Both GROUPBY
  # cases became live goldens that Formulon matches exactly; the two
  # PIVOTBY cases surfaced a real shape defect that the old skip had been
  # hiding, recorded below.
  - id: groupby_sort_order_zero_rejected
    cause: engine-gap
    reason: "sort_order 0 is outside Excel's domain for that argument (a signed column index, no zero member) and Excel returns #VALUE!. Formulon accepts it and returns the grouped spill, so a workbook that computes here errors in Excel. Isolated by varying one argument at a time: field_headers=0 and total_depth=0 are both accepted, and every form carrying sort_order=0 errors while 1 or omission spills."
    prefer: mac-excel-365
    first_noted: 2026-08-15
    last_verified_excel_version: "16.112"
    mode: skip-oracle
  - id: pivotby_row_sort_order_zero_rejected
    cause: engine-gap
    reason: "As groupby_sort_order_zero_rejected, on PIVOTBY's row_sort_order slot: Excel returns #VALUE! for a literal 0, Formulon returns the pivot spill."
    prefer: mac-excel-365
    first_noted: 2026-08-15
    last_verified_excel_version: "16.112"
    mode: skip-oracle
  - id: pivotby_bare_sum
    cause: engine-gap
    reason: "Excel spills 3x3 for this pivot -- a pivot always carries the column-field value row, so the layout is a blank corner cell, an X/Y header row, then the A/B rows with values on the diagonal. Formulon returns 2x3: it emits the row-label column but omits the column-field header row when col_total_depth is 0. The richer multi-axis PIVOTBY cases in this suite pass with their header rows intact, so the defect is specific to the zero-total-depth form. Previously skipped on a wrong diagnosis (\"compact inline-array\"), which hid this."
    prefer: mac-excel-365
    first_noted: 2026-08-15
    last_verified_excel_version: "16.112"
    mode: skip-oracle
  - id: pivotby_lambda_sum
    cause: engine-gap
    reason: "Same 2x3-versus-3x3 shape defect as pivotby_bare_sum, reached through the inline-LAMBDA aggregator path rather than the bare name."
    prefer: mac-excel-365
    first_noted: 2026-08-15
    last_verified_excel_version: "16.112"
    mode: skip-oracle

  # Regression family residuals after array-aware oracle capture. Most
  # LINEST/TREND/LOGEST/GROWTH/FREQUENCY spill cases are live now; these
  # entries remain for numerically unstable perfect-fit statistics and an
  # empty-array-literal read-back quirk.
  - id: linest_univariate_stats_true
    cause: unclassified
