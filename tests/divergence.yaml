  - suite: filterxml
    cause: excel-no-value
    applies_to: [mac-365-ja_JP]
    reason: "Mac Excel 365 ja-JP does not register FILTERXML, so the primary target produces no value to compare against. Excel accepts and retains the formula verbatim, then evaluates it to #NAME?: its own ERROR.TYPE(FILTERXML(...)) returns 5 and ISERROR returns TRUE, both ordinary results carried back by the bridge. The saved workbook stores the bare name with the error cached (<f>FILTERXML(...)</f><v>#NAME?</v>, no _xlfn. prefix), and reopening that file and recalculating reproduces #NAME? with no AppleEvent involved. WEBSERVICE behaves identically, matching the documented Windows-only pairing. A control formula succeeds through every path used. Note that formula_local cannot be used to re-test this: that route is inert on the Mac xlwings bridge for every formula including controls (see tools/oracle/drivers/macos_excel.py), so a blank read from it is not an Excel observation."
    prefer: formulon
    first_noted: 2026-05-15
    last_verified_excel_version: "16.112"
    mode: skip-oracle

