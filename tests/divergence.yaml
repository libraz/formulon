  # unwrap arrays to anchor in oracle_test.cpp::compare_value, or (b) make
  # the lambda-helper eval paths return the anchor scalar when the formula
  # cell is single-target. Tracked as follow-up work; entries are
  # skip-oracle until then so verify is green.
  - id: byrow_sum_each_row
