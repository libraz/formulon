  - id: custom_subtotal_compact_max_bottom
    description: Compact layout with the outer row field's only subtotal being Max, at the bottom of its group.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
      Report: {}
    pivot:
      source: Data!A1:C5
      anchor: Report!A1
      row_fields: [Region, Product]
      data_fields:
        - {field: Amount, agg: Sum}
      layout: Compact
      field_options:
        Region: {subtotal_functions: [Max], subtotal_top: false}

  - id: custom_subtotal_compact_max_top
    description: Compact layout with the outer row field's only subtotal being Max, on the group's heading row.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
      Report: {}
    pivot:
      source: Data!A1:C5
      anchor: Report!A1
      row_fields: [Region, Product]
      data_fields:
        - {field: Amount, agg: Sum}
      layout: Compact
      field_options:
        Region: {subtotal_functions: [Max]}

  - id: custom_subtotal_compact_sum_max
    description: Compact layout with Sum and Max subtotals on the outer row field, on the heading row.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
      Report: {}
    pivot:
      source: Data!A1:C5
      anchor: Report!A1
      row_fields: [Region, Product]
      data_fields:
        - {field: Amount, agg: Sum}
      layout: Compact
      field_options:
