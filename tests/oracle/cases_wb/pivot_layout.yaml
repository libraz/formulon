suite: pivot_layout
kind: workbook
description: >
  Layout and filtering coverage for the pivot oracle: Compact vs Tabular vs
  Outline report layout, subtotal rendering for multi-level row
  hierarchies, and manual item filters that hide row / column items. Each
  case reuses a small sales dataset on a "Data" sheet and pivots onto
  "Report".

cases:
  - id: compact_layout
    description: Two row fields rendered in Compact layout (the default).
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
      Report: {}
    pivot:
      source: Data!A1:C5
      anchor: Report!A1
      row_fields: [Region, Product]
      data_fields:
        - {field: Amount, agg: Sum}
      layout: Compact

  - id: tabular_layout
    description: Two row fields rendered in Tabular layout.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
      Report: {}
    pivot:
      source: Data!A1:C5
      anchor: Report!A1
      row_fields: [Region, Product]
      data_fields:
        - {field: Amount, agg: Sum}
      layout: Tabular

  - id: outline_layout
    description: Two row fields rendered in Outline layout.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
      Report: {}
    pivot:
      source: Data!A1:C5
      anchor: Report!A1
      row_fields: [Region, Product]
      data_fields:
        - {field: Amount, agg: Sum}
      layout: Outline

  - id: subtotals_two_level
    description: >
      Two-level row hierarchy (Region > Product); the Region-level
      subtotal rows must render between the leaf rows.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Widget
        C3: 25
        A4: North
        B4: Gadget
        C4: 50
        A5: South
        B5: Widget
        C5: 200
        A6: South
        B6: Gadget
        C6: 300
        A7: South
        B7: Gadget
        C7: 75
      Report: {}
    pivot:
      source: Data!A1:C7
      anchor: Report!A1
      row_fields: [Region, Product]
      data_fields:
        - {field: Amount, agg: Sum}
      layout: Tabular

  - id: filter_hide_row_item
    description: Manual filter hides the "South" row item.
    sheets:
      Data:
        A1: Region
        B1: Amount
        A2: North
        B2: 100
        A3: South
        B3: 200
        A4: North
        B4: 50
        A5: West
        B5: 80
        A6: South
        B6: 25
      Report: {}
    pivot:
      source: Data!A1:B6
      anchor: Report!A1
      row_fields: [Region]
      data_fields:
        - {field: Amount, agg: Sum}
      filters:
        - {field: Region, hide: [South]}

  - id: filter_hide_multiple_items
    description: Manual filter hides two row items (South and West).
    sheets:
      Data:
        A1: Region
        B1: Amount
        A2: North
        B2: 100
        A3: South
        B3: 200
        A4: North
        B4: 50
        A5: West
        B5: 80
        A6: East
        B6: 90
      Report: {}
    pivot:
      source: Data!A1:B6
      anchor: Report!A1
      row_fields: [Region]
      data_fields:
        - {field: Amount, agg: Sum}
      filters:
        - {field: Region, hide: [South, West]}

  - id: filter_hide_col_item
    description: Manual filter hides a column item (Gadget) on the Product axis.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
      Report: {}
    pivot:
      source: Data!A1:C5
      anchor: Report!A1
      row_fields: [Region]
      col_fields: [Product]
      data_fields:
        - {field: Amount, agg: Sum}
      filters:
        - {field: Product, hide: [Gadget]}

  - id: tabular_no_grand_totals
    description: Tabular layout with both grand totals disabled.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
      Report: {}
    pivot:
      source: Data!A1:C5
      anchor: Report!A1
      row_fields: [Region, Product]
      data_fields:
        - {field: Amount, agg: Sum}
      layout: Tabular
      grand_totals: {rows: false, cols: false}

  - id: filter_with_col_field
    description: >
      Region rows, Product columns, a row-item filter hiding "West" and a
      column-item filter hiding "Gadget" combined.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
        A6: West
        B6: Widget
        C6: 120
        A7: West
        B7: Gadget
        C7: 80
      Report: {}
    pivot:
      source: Data!A1:C7
      anchor: Report!A1
      row_fields: [Region]
      col_fields: [Product]
      data_fields:
        - {field: Amount, agg: Sum}
      filters:
        - {field: Region, hide: [West]}
        - {field: Product, hide: [Gadget]}

  - id: outline_subtotals
    description: Outline layout with a two-level row hierarchy and subtotals.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
        A6: North
        B6: Widget
        C6: 25
      Report: {}
    pivot:
      source: Data!A1:C6
      anchor: Report!A1
      row_fields: [Region, Product]
      data_fields:
        - {field: Amount, agg: Sum}
      layout: Outline

  - id: compact_subtotal_bottom
    description: Compact layout with the outer row field's subtotal at the bottom of its group.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
      Report: {}
    pivot:
      source: Data!A1:C5
      anchor: Report!A1
      row_fields: [Region, Product]
      data_fields:
        - {field: Amount, agg: Sum}
      layout: Compact
      field_options:
        Region: {subtotal_top: false}

  - id: outline_subtotal_bottom
    description: Outline layout with the outer row field's subtotal at the bottom of its group.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
      Report: {}
    pivot:
      source: Data!A1:C5
      anchor: Report!A1
      row_fields: [Region, Product]
      data_fields:
        - {field: Amount, agg: Sum}
      layout: Outline
      field_options:
        Region: {subtotal_top: false}

  - id: compact_no_subtotal
    description: Compact layout with the outer row field's subtotal turned off.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
      Report: {}
    pivot:
      source: Data!A1:C5
      anchor: Report!A1
      row_fields: [Region, Product]
      data_fields:
        - {field: Amount, agg: Sum}
      layout: Compact
      field_options:
        Region: {default_subtotal: false}

  - id: outline_no_subtotal
    description: Outline layout with the outer row field's subtotal turned off.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
      Report: {}
    pivot:
      source: Data!A1:C5
      anchor: Report!A1
      row_fields: [Region, Product]
      data_fields:
        - {field: Amount, agg: Sum}
      layout: Outline
      field_options:
