  - id: custom_subtotal_outline_sum_max
    description: Outline layout with Sum and Max subtotals on the outer row field, on the heading row.
    sheets:
      Data:
        A1: Region
        B1: Product
        C1: Amount
        A2: North
        B2: Widget
        C2: 100
        A3: North
        B3: Gadget
        C3: 50
        A4: South
        B4: Widget
        C4: 200
        A5: South
        B5: Gadget
        C5: 300
      Report: {}
    pivot:
      source: Data!A1:C5
      anchor: Report!A1
      row_fields: [Region, Product]
      data_fields:
        - {field: Amount, agg: Sum}
      layout: Outline
      field_options:
