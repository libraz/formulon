  - id: var_population_by_region
    description: Population variance VarP(Amount) grouped by Region.
    sheets:
      Data:
        A1: Region
        B1: Amount
        A2: North
        B2: 10
        A3: North
        B3: 20
        A4: North
        B4: 30
        A5: South
        B5: 40
        A6: South
        B6: 60
        A7: South
        B7: 80
      Report: {}
    pivot:
      source: Data!A1:B7
      anchor: Report!A1
      row_fields: [Region]
      data_fields:
