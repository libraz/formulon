suite: cf_smoke
description: |
  Smoke cases for the conditional-formatting (CF) oracle pipeline.

  These cases are authored in YAML for human readability, mirrored to
  cf_smoke.case.json (consumed by the schema validator and any future
  Mac-Excel capture tool), and pinned in cf_oracle_test.cpp as hardcoded
  C++ fixtures so the gtest binary can run on Linux without a YAML or
  JSON dependency.
locale: ja-JP

cases:
  - id: cellis_greater_than_50
    description: |
      cellIs > 50 over A1:A3 = [10, 60, 90]. Two cells should match
      (A2 = 60, A3 = 90); both surface a single DifferentialFormat
      match referencing dxfId=7, priority=1.
    sheet:
      A1: 10
      A2: 60
      A3: 90
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: CellIs
            priority: 1
            operator: GreaterThan
            dxf_id: 7
            formula1: "50"
    range: "A1:A3"
    expected:
      cells:
        - addr: A2
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 7
        - addr: A3
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 7

  - id: colorscale_three_stop_red_yellow_green
    description: |
      Three-stop colour scale Min / Percentile=50 / Max with colours
      red / yellow / green over A1:A3 = [0, 50, 100]. Each cell sits
      exactly on a stop, so the resolved fill colour is the exact stop
      colour with zero interpolation rounding.
    sheet:
      A1: 0
      A2: 50
      A3: 100
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: ColorScale
            priority: 1
            color_scale:
              thresholds:
                - { type: Min }
                - { type: Percentile, value: "50" }
                - { type: Max }
              colors:
                - { r: 255, g: 0,   b: 0,   a: 255 }
                - { r: 255, g: 255, b: 0,   a: 255 }
                - { r: 0,   g: 255, b: 0,   a: 255 }
    range: "A1:A3"
    expected:
      cells:
        - addr: A1
          matches:
            - kind: ColorScale
              priority: 1
              color: { r: 255, g: 0,   b: 0,   a: 255 }
        - addr: A2
          matches:
            - kind: ColorScale
              priority: 1
              color: { r: 255, g: 255, b: 0,   a: 255 }
        - addr: A3
          matches:
            - kind: ColorScale
              priority: 1
              color: { r: 0,   g: 255, b: 0,   a: 255 }

  - id: top10_top2_of_a1_to_a5
    description: |
      Top-2 over A1:A5 = [1, 5, 3, 4, 2]. The two largest values are
      5 (A2) and 4 (A4); both surface a single DifferentialFormat
      match referencing dxfId=11, priority=1. A1, A3, A5 yield no
      matches.
    sheet:
      A1: 1
      A2: 5
      A3: 3
      A4: 4
      A5: 2
    cf_blocks:
      - sqref: "A1:A5"
        rules:
          - type: Top10
            priority: 1
            dxf_id: 11
            rank: 2
            percent: false
            bottom: false
    range: "A1:A5"
    expected:
      cells:
        - addr: A2
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 11
        - addr: A4
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 11

  - id: above_average_a1_to_a5
    description: |
      Above-average over A1:A5 = [1, 5, 3, 4, 2]. Mean = 3; cells
      strictly above the mean are A2 (5) and A4 (4). Both surface a
      single DifferentialFormat match referencing dxfId=12, priority=1.
    sheet:
      A1: 1
      A2: 5
      A3: 3
      A4: 4
      A5: 2
    cf_blocks:
      - sqref: "A1:A5"
        rules:
          - type: AboveAverage
            priority: 1
            dxf_id: 12
            above_average: true
            equal_average: false
    range: "A1:A5"
    expected:
      cells:
        - addr: A2
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 12
        - addr: A4
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 12

  - id: begins_with_foo
    description: |
      BeginsWith "foo" over A1:A3 = ["foobar", "barfoo", "food"].
      A1 ("foobar") and A3 ("food") match; A2 ("barfoo") does not.
      Both matching cells surface a single DifferentialFormat match
      referencing dxfId=14, priority=1.
    sheet:
      A1: "foobar"
      A2: "barfoo"
      A3: "food"
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: BeginsWith
            priority: 1
            dxf_id: 14
            text: "foo"
    range: "A1:A3"
    expected:
      cells:
        - addr: A1
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 14
        - addr: A3
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 14

  - id: ends_with_bar
    description: |
      EndsWith "bar" over A1:A3 = ["foobar", "fooba", "barfoo"].
      A1 ("foobar") matches; A2 and A3 do not. The matching cell
      surfaces one DifferentialFormat match referencing dxfId=15,
      priority=1.
    sheet:
      A1: "foobar"
      A2: "fooba"
      A3: "barfoo"
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: EndsWith
            priority: 1
            dxf_id: 15
            text: "bar"
    range: "A1:A3"
    expected:
      cells:
        - addr: A1
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 15

  - id: not_contains_qux
    description: |
      NotContainsText "qux" over A1:A3 = ["abc", "quxy", "def"].
      A1 ("abc") and A3 ("def") match (do not contain "qux"); A2
      ("quxy") does not match. Both matching cells surface one
      DifferentialFormat match referencing dxfId=16, priority=1.
    sheet:
      A1: "abc"
      A2: "quxy"
      A3: "def"
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: NotContainsText
            priority: 1
            dxf_id: 16
            text: "qux"
    range: "A1:A3"
    expected:
      cells:
        - addr: A1
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 16
        - addr: A3
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 16

  - id: contains_blanks_a2
    description: |
      ContainsBlanks over A1:A3 = ["x", blank, "y"]. Only A2 (truly
      empty) matches; A1 and A3 do not. The matching cell surfaces a
      single DifferentialFormat match referencing dxfId=17, priority=1.
    sheet:
      A1: "x"
      A3: "y"
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: ContainsBlanks
            priority: 1
            dxf_id: 17
    range: "A1:A3"
    expected:
      cells:
        - addr: A2
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 17

  - id: not_contains_blanks_a1_a3
    description: |
      NotContainsBlanks over A1:A3 = ["x", blank, "y"]. A1 and A3
      (non-blank) match; A2 (empty) does not. Both surface one
      DifferentialFormat match referencing dxfId=18, priority=1.
    sheet:
      A1: "x"
      A3: "y"
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: NotContainsBlanks
            priority: 1
            dxf_id: 18
    range: "A1:A3"
    expected:
      cells:
        - addr: A1
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 18
        - addr: A3
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 18

  - id: contains_errors_a2
    description: |
      ContainsErrors over A1:A3 where A2 evaluates to #DIV/0!. Only A2
      matches; A1 and A3 (text values) do not. The matching cell
      surfaces a single DifferentialFormat match referencing dxfId=19,
      priority=1.
    sheet:
      A1: "x"
      A2: { kind: error, value: "#DIV/0!" }
      A3: "y"
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: ContainsErrors
            priority: 1
            dxf_id: 19
    range: "A1:A3"
    expected:
      cells:
        - addr: A2
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 19

  - id: not_contains_errors_a1_a3
    description: |
      NotContainsErrors over A1:A3 where A2 evaluates to #DIV/0!. A1
      and A3 (text values) match; A2 (error) does not. Both matching
      cells surface a single DifferentialFormat match referencing
      dxfId=20, priority=1.
    sheet:
      A1: "x"
      A2: { kind: error, value: "#DIV/0!" }
      A3: "y"
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: NotContainsErrors
            priority: 1
            dxf_id: 20
    range: "A1:A3"
    expected:
      cells:
        - addr: A1
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 20
        - addr: A3
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 20

  - id: duplicate_values_a1_a3
    description: |
      DuplicateValues over A1:A3 = [1, 2, 1]. A1 and A3 share the
      value 1 (duplicates); A2 is unique. Both matching cells surface
      a single DifferentialFormat match referencing dxfId=21,
      priority=1.
    sheet:
      A1: 1
      A2: 2
      A3: 1
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: DuplicateValues
            priority: 1
            dxf_id: 21
    range: "A1:A3"
    expected:
      cells:
        - addr: A1
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 21
        - addr: A3
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 21

  - id: unique_values_a2
    description: |
      UniqueValues over A1:A3 = [1, 2, 1]. Only A2 (value 2) is
      unique within the range; A1 and A3 share 1. The matching cell
      surfaces a single DifferentialFormat match referencing dxfId=22,
      priority=1.
    sheet:
      A1: 1
      A2: 2
      A3: 1
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: UniqueValues
            priority: 1
            dxf_id: 22
    range: "A1:A3"
    expected:
      cells:
        - addr: A2
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 22

  - id: expression_even_row
    description: |
      Expression `MOD(ROW(),2)=0` over A1:A4 = [1, 2, 3, 4]. The
      formula matches even-numbered rows (1-based ROW()). Sheet rows
      A2 and A4 (0-based 1, 3) match; A1 and A3 do not. Both matching
      cells surface a single DifferentialFormat match referencing
      dxfId=23, priority=1.
    sheet:
      A1: 1
      A2: 2
      A3: 3
      A4: 4
    cf_blocks:
      - sqref: "A1:A4"
        rules:
          - type: Expression
            priority: 1
            dxf_id: 23
            formula1: "MOD(ROW(),2)=0"
    range: "A1:A4"
    expected:
      cells:
        - addr: A2
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 23
        - addr: A4
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 23

  - id: contains_text_foo
    description: |
      Contains-text "foo" over A1:A3 = ["foobar", "bar", "foo"].
      A1 ("foobar") and A3 ("foo") match; A2 ("bar") does not. Both
      matching cells surface a single DifferentialFormat match
      referencing dxfId=13, priority=1.
    sheet:
      A1: "foobar"
      A2: "bar"
      A3: "foo"
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: ContainsText
            priority: 1
            dxf_id: 13
            text: "foo"
    range: "A1:A3"
    expected:
      cells:
        - addr: A1
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 13
        - addr: A3
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 13

  - id: databar_min0_max100
    description: |
      DataBar over A1:A5 = [0, 25, 50, 75, 100] with explicit Number
      thresholds min=0 / max=100, min_length_pct=0, max_length_pct=100,
      and a blue fill. Bar length is the linear fraction
      `(value - min) / (max - min)` scaled into [0, 100], so each cell
      reports a bar length equal to its value. Excel does not surface
      bar length through DisplayFormat; the generator computes the
      match payload directly from documented VBA semantics
      (https://learn.microsoft.com/en-us/office/vba/api/excel.databar).
    sheet:
      A1: 0
      A2: 25
      A3: 50
      A4: 75
      A5: 100
    cf_blocks:
      - sqref: "A1:A5"
        rules:
          - type: DataBar
            priority: 1
            data_bar:
              min: { type: Number, value: "0" }
              max: { type: Number, value: "100" }
              fill: { r: 33, g: 150, b: 243, a: 255 }
              min_length_pct: 0
              max_length_pct: 100
    range: "A1:A5"
    expected:
      cells:
        - addr: A1
          matches:
            - kind: DataBar
              priority: 1
              bar_length_pct: 0.0
              bar_axis_position_pct: 0.0
              is_negative: false
              fill: { r: 33, g: 150, b: 243, a: 255 }
        - addr: A2
          matches:
            - kind: DataBar
              priority: 1
              bar_length_pct: 25.0
              bar_axis_position_pct: 0.0
              is_negative: false
              fill: { r: 33, g: 150, b: 243, a: 255 }
        - addr: A3
          matches:
            - kind: DataBar
              priority: 1
              bar_length_pct: 50.0
              bar_axis_position_pct: 0.0
              is_negative: false
              fill: { r: 33, g: 150, b: 243, a: 255 }
        - addr: A4
          matches:
            - kind: DataBar
              priority: 1
              bar_length_pct: 75.0
              bar_axis_position_pct: 0.0
              is_negative: false
              fill: { r: 33, g: 150, b: 243, a: 255 }
        - addr: A5
          matches:
            - kind: DataBar
              priority: 1
              bar_length_pct: 100.0
              bar_axis_position_pct: 0.0
              is_negative: false
              fill: { r: 33, g: 150, b: 243, a: 255 }

  - id: iconset_three_arrows
    description: |
      IconSet (Three_Arrows) over A1:A5 = [10, 30, 50, 70, 90] with
      Number thresholds 33 / 67 (gte=true). Bucket index per cell:
      cell < 33 -> 0; 33 <= cell < 67 -> 1; cell >= 67 -> 2. Excel
      does not surface the bucket index through DisplayFormat; the
      generator computes the match payload directly from documented
      VBA semantics
      (https://learn.microsoft.com/en-us/office/vba/api/excel.iconsetcondition).
    sheet:
      A1: 10
      A2: 30
      A3: 50
      A4: 70
      A5: 90
    cf_blocks:
      - sqref: "A1:A5"
        rules:
          - type: IconSet
            priority: 1
            icon_set:
              name: Three_Arrows
              percent: false
              reverse: false
              thresholds:
                - { type: Number, value: "33", gte: true }
                - { type: Number, value: "67", gte: true }
    range: "A1:A5"
    expected:
      cells:
        - addr: A1
          matches:
            - kind: IconSet
              priority: 1
              icon_set_name: Three_Arrows
              icon_index: 0
        - addr: A2
          matches:
            - kind: IconSet
              priority: 1
              icon_set_name: Three_Arrows
              icon_index: 0
        - addr: A3
          matches:
            - kind: IconSet
              priority: 1
              icon_set_name: Three_Arrows
              icon_index: 1
        - addr: A4
          matches:
            - kind: IconSet
              priority: 1
              icon_set_name: Three_Arrows
              icon_index: 2
        - addr: A5
          matches:
            - kind: IconSet
              priority: 1
              icon_set_name: Three_Arrows
              icon_index: 2

  # ---------------------------------------------------------------------------
  # TimePeriod-equivalent cases. Excel's `timePeriod` rules read live
  # TODAY() at evaluation time, which makes deterministic golden capture
  # awkward without a frozen-clock harness. The smoke suite pins the
  # six day/month-bucket variants by rewriting each as an Expression
  # rule that references a baked-in serial:
  #
  #   today_serial    = 46145  (corresponds to 2026-05-03)
  #   yesterday       = 46144  (2026-05-02)
  #   tomorrow        = 46146  (2026-05-04)
  #   march mid 2026  = 46096
  #   april mid 2026  = 46127
  #   may mid 2026    = 46157
  #   june mid 2026   = 46188
  #
  # The four week-boundary buckets (Last7Days / ThisWeek / LastWeek /
  # NextWeek) need a frozen-clock capture path (libfaketime or similar)
  # and are deferred. See README.md "Not yet captured".
  # ---------------------------------------------------------------------------

  - id: time_period_today_via_expression
    description: |
      TimePeriod=Today rewritten as Expression `A1=46145`. Sheet
      A1=46145 (today), A2=46144 (yesterday), A3=46146 (tomorrow);
      only A1 matches. Mirrors the dxf-fingerprint capture path the
      other Expression cases use; dxfId=24, priority=1.
    sheet:
      A1: 46145
      A2: 46144
      A3: 46146
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: Expression
            priority: 1
            dxf_id: 24
            formula1: "A1=46145"
    range: "A1:A3"
    expected:
      cells:
        - addr: A1
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 24

  - id: time_period_yesterday_via_expression
    description: |
      TimePeriod=Yesterday rewritten as Expression `A1=46144`. Sheet
      A1=46145 (today), A2=46144 (yesterday), A3=46146 (tomorrow);
      only A2 matches. dxfId=25, priority=1.
    sheet:
      A1: 46145
      A2: 46144
      A3: 46146
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: Expression
            priority: 1
            dxf_id: 25
            formula1: "A1=46144"
    range: "A1:A3"
    expected:
      cells:
        - addr: A2
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 25

  - id: time_period_tomorrow_via_expression
    description: |
      TimePeriod=Tomorrow rewritten as Expression `A1=46146`. Sheet
      A1=46145 (today), A2=46144 (yesterday), A3=46146 (tomorrow);
      only A3 matches. dxfId=26, priority=1.
    sheet:
      A1: 46145
      A2: 46144
      A3: 46146
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: Expression
            priority: 1
            dxf_id: 26
            formula1: "A1=46146"
    range: "A1:A3"
    expected:
      cells:
        - addr: A3
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 26

  - id: time_period_last_month_via_expression
    description: |
      TimePeriod=LastMonth rewritten as Expression
      `AND(YEAR(A1)=2026,MONTH(A1)=4)` (with today=2026-05-03,
      LastMonth = April 2026). Sheet has serials in March (A1=46096),
      April (A2=46127), and May (A3=46157); only A2 matches.
      dxfId=27, priority=1.
    sheet:
      A1: 46096
      A2: 46127
      A3: 46157
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: Expression
            priority: 1
            dxf_id: 27
            formula1: "AND(YEAR(A1)=2026,MONTH(A1)=4)"
    range: "A1:A3"
    expected:
      cells:
        - addr: A2
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 27

  - id: time_period_this_month_via_expression
    description: |
      TimePeriod=ThisMonth rewritten as Expression
      `AND(YEAR(A1)=2026,MONTH(A1)=5)` (with today=2026-05-03,
      ThisMonth = May 2026). Sheet has serials in March (A1=46096),
      April (A2=46127), and May (A3=46157); only A3 matches.
      dxfId=28, priority=1.
    sheet:
      A1: 46096
      A2: 46127
      A3: 46157
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: Expression
            priority: 1
            dxf_id: 28
            formula1: "AND(YEAR(A1)=2026,MONTH(A1)=5)"
    range: "A1:A3"
    expected:
      cells:
        - addr: A3
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 28

  - id: time_period_next_month_via_expression
    description: |
      TimePeriod=NextMonth rewritten as Expression
      `AND(YEAR(A1)=2026,MONTH(A1)=6)` (with today=2026-05-03,
      NextMonth = June 2026). Sheet has serials in April (A1=46127),
      May (A2=46157), and June (A3=46188); only A3 matches.
      dxfId=29, priority=1.
    sheet:
      A1: 46127
      A2: 46157
      A3: 46188
    cf_blocks:
      - sqref: "A1:A3"
        rules:
          - type: Expression
            priority: 1
            dxf_id: 29
            formula1: "AND(YEAR(A1)=2026,MONTH(A1)=6)"
    range: "A1:A3"
    expected:
      cells:
        - addr: A3
          matches:
            - kind: DifferentialFormat
              priority: 1
              dxf_id: 29
