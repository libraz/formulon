    cells: {B1: S1, C1: S2, A2: a, A3: b, A4: c, A5: d, B2: 4, C2: 7, B3: 10, C3: 2, B4: 5, C4: 8, B5: 11, C5: 3}
  charts:
  - {id: c1, kind: column, source: 'A1:C5', direction: rows}
- id: create_scatter_columns_both_square
