    cells: {B1: S1, A2: a, A3: b, A4: c, A5: d, B2: 4, B3: 7, B4: 10, B5: 2}
  charts:
  - {id: c1, kind: pie, source: 'A1:B5', direction: columns}
- id: create_pie_auto_row_wide
