# Creation: the series Excel's set_source_data makes from a range against
# the series Formulon's insert_chart makes from the same range. Compared:
# series count, plot shape and every series reference. Capture also opens
# Formulon's own file in Excel and checks the re-save (parts present, refs
# unchanged, series and plot shape kept, chart object count).
#
# Factors (pairwise, coverwise seed 16; the four grouping cases at the end
# are added by hand):
#   kind      column | bar | line | area | pie | scatter | doughnut
#   direction auto | rows | columns
#   headers   both | row | col | none   (which heading row / column holds text)
#   shape     tall 4x2 | wide 2x4 | square 3x3 | single 4x1   (data body)
suite: create
description: Series insert_chart makes from a range, against Excel's set_source_data.
views: [shape, refs]
capture_formulon: true
cases:
- id: create_line_rows_none_wide
  sheets:
  - name: Sheet1
    cells: {A1: 4, B1: 7, C1: 10, D1: 2, A2: 5, B2: 8, C2: 11, D2: 3}
  charts:
  - {id: c1, kind: line, source: 'A1:D2', direction: rows}
- id: create_doughnut_columns_both_wide
  sheets:
  - name: Sheet1
    cells: {B1: S1, C1: S2, D1: S3, E1: S4, A2: a, A3: b, B2: 4, C2: 7, D2: 10, E2: 2, B3: 5, C3: 8, D3: 11, E3: 3}
  charts:
  - {id: c1, kind: doughnut, source: 'A1:E3', direction: columns}
- id: create_bar_columns_none_square
  sheets:
  - name: Sheet1
    cells: {A1: 4, B1: 7, C1: 10, A2: 2, B2: 5, C2: 8, A3: 11, B3: 3, C3: 6}
  charts:
  - {id: c1, kind: bar, source: 'A1:C3', direction: columns}
- id: create_pie_auto_both_square
  sheets:
  - name: Sheet1
    cells: {B1: S1, C1: S2, D1: S3, A2: a, A3: b, A4: c, B2: 4, C2: 7, D2: 10, B3: 2, C3: 5, D3: 8, B4: 11, C4: 3, D4: 6}
  charts:
  - {id: c1, kind: pie, source: 'A1:D4', direction: auto}
- id: create_column_auto_row_wide
  sheets:
  - name: Sheet1
    cells: {A1: S1, B1: S2, C1: S3, D1: S4, A2: 4, B2: 7, C2: 10, D2: 2, A3: 5, B3: 8, C3: 11, D3: 3}
  charts:
  - {id: c1, kind: column, source: 'A1:D3', direction: auto}
- id: create_bar_auto_col_wide
  sheets:
  - name: Sheet1
    cells: {A1: a, A2: b, B1: 4, C1: 7, D1: 10, E1: 2, B2: 5, C2: 8, D2: 11, E2: 3}
  charts:
  - {id: c1, kind: bar, source: 'A1:E2', direction: auto}
- id: create_scatter_rows_row_single
  sheets:
  - name: Sheet1
    cells: {A1: S1, A2: 4, A3: 7, A4: 10, A5: 2}
  charts:
  - {id: c1, kind: scatter, source: 'A1:A5', direction: rows}
- id: create_bar_rows_row_tall
  sheets:
  - name: Sheet1
    cells: {A1: S1, B1: S2, A2: 4, B2: 7, A3: 10, B3: 2, A4: 5, B4: 8, A5: 11, B5: 3}
  charts:
  - {id: c1, kind: bar, source: 'A1:B5', direction: rows}
- id: create_line_columns_row_square
  sheets:
  - name: Sheet1
    cells: {A1: S1, B1: S2, C1: S3, A2: 4, B2: 7, C2: 10, A3: 2, B3: 5, C3: 8, A4: 11, B4: 3, C4: 6}
  charts:
  - {id: c1, kind: line, source: 'A1:C4', direction: columns}
- id: create_area_columns_col_tall
  sheets:
  - name: Sheet1
    cells: {A1: a, A2: b, A3: c, A4: d, B1: 4, C1: 7, B2: 10, C2: 2, B3: 5, C3: 8, B4: 11, C4: 3}
  charts:
