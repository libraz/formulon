- id: create_column_auto_col_single
  sheets:
  - name: Sheet1
    cells: {A1: a, A2: b, A3: c, A4: d, B1: 4, B2: 7, B3: 10, B4: 2}
  charts:
  - {id: c1, kind: column, source: 'A1:B4', direction: auto}
- id: create_scatter_columns_col_wide
