    cells: {A1: S1, B1: S2, C1: S3, D1: S4, A2: 4, B2: 7, C2: 10, D2: 2, A3: 5, B3: 8, C3: 11, D3: 3}
  charts:
  - {id: c1, kind: pie, source: 'A1:D3', direction: auto}
