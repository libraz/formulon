  - op: series
    series: 0
    line: {color: FF0000, width_pt: 2.25, dash: dash}
  - op: filter
    hidden_series: [1]
- id: edit_format_09_pie
  factors: {chart: pie, title: text, legend: none, labels: keep, series_style: keep, axis: keep, plot: vary_colors, filter: keep,
