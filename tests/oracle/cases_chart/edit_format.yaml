# Typed edits on Excel-saved fixtures: Formulon applies the edits and saves;
# capture opens that file in Excel, re-saves it, checks the re-save (parts
# present, refs unchanged, series and plot shape kept, chart object count,
# and every formatting value read back as written) and records the
# re-saved model. The verifier compares Formulon's own model of the edited
# file with it. `factors` records the covering-array row each case came
# from; the edits are derived from it.
#
# Factors (pairwise, coverwise seed 22):
#   chart        column | bar | line | area | pie | scatter | doughnut
#   title        keep | text | none | auto
#   legend       keep | top | left | none | right_overlay
#   labels       keep | val | val_fmt_font | ser_cat_sep | clear   (all series)
#   series_style keep | fill_alpha | line_dash_width | marker | point_fill   (series 0)
#   axis         keep | scale | fmt_grid_reversed | log_crosses | hidden_title | tick_low
#   plot         keep | gap_overlap | vary_colors | first_slice | hole
#   filter       keep | hide_series | hide_category
#   display      keep | gap (written as zero + plotVisOnly off) | span
# Constraints: no axis edits on pie / doughnut; markers on line / scatter
# only; gap_overlap on column / bar; first_slice on pie / doughnut; hole on
# doughnut; no category filter on scatter; no series filter on the
# one-series doughnut; no fill on line / scatter series; span on line /
# area / scatter only; no log axis on area.
suite: edit_format
description: Formatting edits re-saved by Excel.
views: [shape, refs, format]
capture_formulon: true
cases:
- id: edit_format_01_pie
  factors: {chart: pie, title: auto, legend: top, labels: ser_cat_sep, series_style: point_fill, axis: keep, plot: first_slice,
    filter: hide_series, display: keep}
  fixture: chart_pie.xlsx
  target: {sheet: Sheet1, chart: pie_two}
  edits:
  - {op: title, kind: auto}
  - {op: legend, position: t}
  - {op: plot, first_slice_angle: 90}
  - op: point
    series: 0
    point: 1
    fill: {color: 7030A0}
  - op: series
    series: all
    labels: {ser: true, cat: true, separator: '; '}
  - op: filter
    hidden_series: [1]
- id: edit_format_02_bar
  factors: {chart: bar, title: text, legend: keep, labels: clear, series_style: keep, axis: hidden_title, plot: keep, filter: hide_series,
    display: gap}
  fixture: chart_bar.xlsx
  target: {sheet: Sheet1, chart: bar_stacked}
  edits:
  - {op: title, kind: text, text: 売上推移}
  - {op: display, blanks_as: zero, plot_vis_only: false}
  - {op: axis, axis: category, visible: false}
  - {op: axis, axis: value, title: 金額}
  - {op: series, series: all, labels: null}
  - op: filter
    hidden_series: [1]
- id: edit_format_03_scatter
  factors: {chart: scatter, title: none, legend: none, labels: ser_cat_sep, series_style: marker, axis: fmt_grid_reversed,
    plot: keep, filter: keep, display: span}
  fixture: chart_scatter.xlsx
  target: {sheet: Sheet1, chart: scatter_lines}
  edits:
  - {op: title, kind: none}
  - {op: legend, position: none}
  - {op: display, blanks_as: span}
  - {op: axis, axis: value, number_format: '0.0', major_gridlines: false, reversed: true}
  - op: series
    series: 0
    marker:
      symbol: diamond
      size: 8
      fill: {color: 00B050}
  - op: series
    series: all
    labels: {ser: true, cat: true, separator: '; '}
- id: edit_format_04_doughnut
  factors: {chart: doughnut, title: none, legend: keep, labels: keep, series_style: point_fill, axis: keep, plot: hole, filter: hide_category,
    display: gap}
  fixture: chart_combo.xlsx
  target: {sheet: Sheet1, chart: doughnut}
  edits:
  - {op: title, kind: none}
  - {op: plot, hole_size: 60}
  - {op: display, blanks_as: zero, plot_vis_only: false}
  - op: point
    series: 0
    point: 1
    fill: {color: 7030A0}
  - op: filter
    hidden_categories: [1]
- id: edit_format_05_column
  factors: {chart: column, title: keep, legend: left, labels: val_fmt_font, series_style: keep, axis: tick_low, plot: gap_overlap,
    filter: hide_category, display: keep}
  fixture: chart_column.xlsx
  target: {sheet: Sheet1, chart: col_clustered}
  edits:
  - {op: legend, position: l}
  - {op: plot, gap_width: 50, overlap: -20}
  - {op: axis, axis: category, tick_label_pos: low}
  - {op: axis, axis: value, crosses: at, crosses_at: 2}
  - op: series
    series: all
    labels: {val: true, number_format: '0.0', font_color: C00000, font_size: 11}
  - op: filter
    hidden_categories: [1]
- id: edit_format_06_bar
  factors: {chart: bar, title: none, legend: right_overlay, labels: val, series_style: line_dash_width, axis: tick_low, plot: vary_colors,
    filter: keep, display: keep}
  fixture: chart_bar.xlsx
  target: {sheet: Sheet1, chart: bar_stacked}
  edits:
  - {op: title, kind: none}
  - {op: legend, position: r, overlay: true}
  - {op: plot, vary_colors: true}
  - {op: axis, axis: category, tick_label_pos: low}
  - {op: axis, axis: value, crosses: at, crosses_at: 2}
  - op: series
    series: 0
    line: {color: FF0000, width_pt: 2.25, dash: dash}
  - op: series
    series: all
    labels: {val: true}
