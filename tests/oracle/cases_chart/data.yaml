# Series resolution: the cache Excel writes for a chart over given cells
# (ptCount, pt idx, value, formatCode) against the cache Formulon writes on
# save for the same cells. Each chart is created over a scratch block and
# pointed at its references with a SERIES formula, so only the references
# matter. `templates` only holds YAML anchors. Dates are serials;
# `format_id` names the built-in number format Excel stores for the
# `format` typed in a ja-JP session.
suite: data
description: Chart caches resolved from cell contents (hidden cells, blanks, errors, text, formats, names).
views: [cache]

templates:
  mixed: &mixed
    name: Sheet1
    cells:
