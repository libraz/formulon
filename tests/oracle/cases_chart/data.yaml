cases:
  # -- mixed cell kinds, digits and per-cell formats --------------------------
  - id: data_mixed_line
    description: Blank, #N/A, text, TRUE and #DIV/0! in a line series.
    sheets: [*mixed]
    charts:
      - {id: c1, kind: line, series: [{name: "Sheet1!$B$1", cat: "Sheet1!$A$2:$A$9", val: "Sheet1!$B$2:$B$9"}]}
  - id: data_mixed_column
    sheets: [*mixed]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$B$1", cat: "Sheet1!$A$2:$A$9", val: "Sheet1!$B$2:$B$9"}]}
  - id: data_mixed_scatter
    sheets: [*mixed]
    charts:
      - {id: c1, kind: scatter, series: [{name: "Sheet1!$B$1", x: "Sheet1!$J$2:$J$9", y: "Sheet1!$B$2:$B$9"}]}
  - id: data_formats_column
    description: Seventeen-digit spellings, cache formatCode from the second cell, per-point formatCode.
    sheets: [*mixed]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$C$1", cat: "Sheet1!$A$2:$A$9", val: "Sheet1!$C$2:$C$9"}]}
  - id: data_multilevel_cat
    sheets: [*mixed]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$H$1", cat: "Sheet1!$F$2:$G$9", val: "Sheet1!$H$2:$H$9"}]}
  - id: data_scatter_text_x
    description: One text X turns xVal into a strRef.
    sheets: [*mixed]
    charts:
      - {id: c1, kind: scatter, series: [{name: "Sheet1!$J$1", x: "Sheet1!$I$2:$I$9", y: "Sheet1!$J$2:$J$9"}]}

  # -- hidden rows and columns ------------------------------------------------
  - id: data_hidden_rows_visible_only
    sheets: [{<<: *mixed, hidden_rows: [14, 16]}]
    charts:
      - {id: c1, kind: line, series: [{name: "Sheet1!$B$11", cat: "Sheet1!$A$12:$A$19", val: "Sheet1!$B$12:$B$19"}]}
  - id: data_hidden_rows_plot_all
    sheets: [{<<: *mixed, hidden_rows: [14, 16]}]
    charts:
      - {id: c1, kind: line, plot_vis_only: false, series: [{name: "Sheet1!$B$11", cat: "Sheet1!$A$12:$A$19", val: "Sheet1!$B$12:$B$19"}]}
  - id: data_hidden_col_visible_only
    sheets: [{<<: *mixed, hidden_cols: [E]}]
    charts:
      - {id: c1, kind: line, series: [{name: "Sheet1!$E$1", cat: "Sheet1!$A$2:$A$9", val: "Sheet1!$E$2:$E$9"}]}
  - id: data_hidden_col_plot_all
    sheets: [{<<: *mixed, hidden_cols: [E]}]
    charts:
      - {id: c1, kind: line, plot_vis_only: false, series: [{name: "Sheet1!$E$1", cat: "Sheet1!$A$2:$A$9", val: "Sheet1!$E$2:$E$9"}]}

  # -- category kinds, cache formats and series names -------------------------
  - id: data_cat_mixed
    description: Text, number, blank, #N/A, TRUE and a date as categories.
    sheets: [*cache]
    charts:
      - {id: c1, kind: line, series: [{name: "Sheet1!$B$1", cat: "Sheet1!$A$2:$A$7", val: "Sheet1!$B$2:$B$7"}]}
  - id: data_percent_all
    sheets: [*cache]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$C$1", cat: "Sheet1!$A$2:$A$5", val: "Sheet1!$C$2:$C$5"}]}
  - id: data_first_cell_format
    sheets: [*cache]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$D$1", cat: "Sheet1!$A$2:$A$5", val: "Sheet1!$D$2:$D$5"}]}
  - id: data_name_number
    sheets: [*cache]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$E$1", cat: "Sheet1!$A$2:$A$5", val: "Sheet1!$B$2:$B$5"}]}
  - id: data_name_blank
    sheets: [*cache]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$F$1", cat: "Sheet1!$A$2:$A$5", val: "Sheet1!$B$2:$B$5"}]}
  - id: data_values_text
    sheets: [*cache]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$G$1", cat: "Sheet1!$A$2:$A$5", val: "Sheet1!$G$2:$G$5"}]}
  - id: data_date_cat
    sheets: [*cache]
    charts:
      - {id: c1, kind: line, series: [{name: "Sheet1!$I$1", cat: "Sheet1!$H$2:$H$5", val: "Sheet1!$I$2:$I$5"}]}
  - id: data_numeric_cat
    sheets: [*cache]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$K$1", cat: "Sheet1!$J$2:$J$5", val: "Sheet1!$K$2:$K$5"}]}
  - id: data_no_cat
    sheets: [*cache]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$K$1", val: "Sheet1!$K$2:$K$5"}]}

  # -- hidden name cells, empty strings, multi-cell names, scatter X ---------
  - id: data_name_hidden_row
    sheets: [*odd]
    charts:
      - {id: c1, kind: line, series: [{name: "Sheet1!$B$20", cat: "Sheet1!$A$21:$A$23", val: "Sheet1!$B$21:$B$23"}]}
  - id: data_name_hidden_col
    sheets: [*odd]
    charts:
      - {id: c1, kind: line, series: [{name: "Sheet1!$D$25", cat: "Sheet1!$A$21:$A$23", val: "Sheet1!$C$26:$C$28"}]}
  - id: data_empty_string_cells
    description: '="" reads 0 in a numRef and as blank in a strRef.'
    sheets: [*odd]
    charts:
      - {id: c1, kind: line, series: [{name: "Sheet1!$B$20", cat: "Sheet1!$A$40:$A$43", val: "Sheet1!$B$40:$B$43"}]}
  - id: data_multi_cell_name_mid_blank
    sheets: [*odd]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$G$1:$I$1", cat: "Sheet1!$A$21:$A$23", val: "Sheet1!$B$21:$B$23"}]}
  - id: data_multi_cell_name_end_blank
    sheets: [*odd]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$G$3:$I$3", cat: "Sheet1!$A$21:$A$23", val: "Sheet1!$B$21:$B$23"}]}
  - id: data_scatter_x_blank_error_bool
    sheets: [*odd]
    charts:
      - {id: c1, kind: scatter, series: [{name: "Sheet1!$B$20", x: "Sheet1!$K$2:$K$6", y: "Sheet1!$L$2:$L$6"}]}
  - id: data_scatter_x_error_only
    sheets: [*odd]
    charts:
      - {id: c1, kind: scatter, series: [{name: "Sheet1!$B$20", x: "Sheet1!$K$10:$K$12", y: "Sheet1!$L$10:$L$12"}]}
  - id: data_all_cats_hidden_str
    sheets: [*odd]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$B$20", cat: "Sheet1!$A$50:$A$52", val: "Sheet1!$B$50:$B$52"}]}
  - id: data_all_cats_hidden_multilevel
    sheets: [*odd]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$B$20", cat: "Sheet1!$F$50:$G$52", val: "Sheet1!$H$50:$H$52"}]}
  - id: data_number_spelling
    description: numCache value text for fixed and exponent ranges.
    sheets: [*odd]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$B$20", val: "Sheet1!$N$2:$N$18"}]}

  # -- names, other sheets, unions, whole columns ----------------------------
  - id: data_workbook_name
    sheets: [*refs]
    names: [{name: WbVals, refers_to: "=Sheet1!$B$2:$B$5"}]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$B$1", cat: "Sheet1!$A$2:$A$5", val: "[0]!WbVals"}]}
  - id: data_sheet_scoped_name
    sheets: [*refs]
    names: [{name: LocVals, refers_to: "=Sheet1!$C$2:$C$5", scope: Sheet1}]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$C$1", cat: "Sheet1!$A$2:$A$5", val: "Sheet1!LocVals"}]}
  - id: data_offset_name
    sheets: [*refs]
    names: [{name: DynVals, refers_to: "=OFFSET(Sheet1!$B$2,0,0,COUNT(Sheet1!$B$2:$B$100),1)"}]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$B$1", val: "[0]!DynVals"}]}
  - id: data_whole_column
    sheets: [*refs]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$B$1", val: "Sheet1!$B:$B"}]}
  - id: data_other_sheet
    sheets: [*refs, *my_data]
    charts:
      - {id: c1, kind: column, series: [{name: "'My Data'!$B$1", cat: "'My Data'!$A$2:$A$4", val: "'My Data'!$B$2:$B$4"}]}
  - id: data_hidden_sheet
    sheets: [*refs, *hid]
    charts:
      - {id: c1, kind: column, series: [{name: "Hid!$B$1", cat: "Hid!$A$2:$A$3", val: "Hid!$B$2:$B$3"}]}
  - id: data_two_cell_name
    sheets: [*refs]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$B$1:$C$1", cat: "Sheet1!$A$2:$A$5", val: "Sheet1!$B$2:$B$5"}]}
  - id: data_union
    sheets: [*refs]
    charts:
      - {id: c1, kind: column, series: [{name: "Sheet1!$B$1", cat: "(Sheet1!$A$2:$A$3,Sheet1!$A$5)", val: "(Sheet1!$B$2:$B$3,Sheet1!$B$5)"}]}
  - id: data_two_series
    description: Two series sharing categories.
    sheets: [*refs]
    charts:
      - id: c1
        kind: column
        series:
          - {name: "Sheet1!$B$1", cat: "Sheet1!$A$2:$A$5", val: "Sheet1!$B$2:$B$5"}
          - {name: "Sheet1!$C$1", cat: "Sheet1!$A$2:$A$5", val: "Sheet1!$C$2:$C$5"}
