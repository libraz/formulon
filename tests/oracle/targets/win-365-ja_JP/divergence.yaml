# Win Excel 365 (ja-JP) variant-specific divergences.
#
# Entries here merge on top of tests/divergence.yaml and override the
# primary file on key collision (more specific wins). Use this file when a
# case is fine on Mac Excel 365 but needs special handling against the
# Windows Excel 365 oracle (or vice versa) — global drift belongs in
# tests/divergence.yaml.
#
# Schema is identical to tests/divergence.yaml; see that file's header for
# documentation. `applies_to: [win-365-ja_JP]` is implied when the entry
# lives in this file and may be omitted.

entries:
  # Windows formats these financial results as text while Formulon returns
  # their numeric value. The verifier parses the documented numeric text.
  - suites: [financial, financial_accrual]
    compare_mode: numeric_text
    reason: "Win Excel 365 reads these financial result cells back as locale-formatted numeric text; Formulon returns equivalent numeric values."
    prefer: formulon
    first_noted: 2026-05-08
    last_verified_excel_version: "16.0.20228"
  # Excel's complex-function text rounding differs by a final display digit.
  - suite: complex
    compare_mode: complex_text
    reason: "Win Excel 365 rounds complex-number text differently at the final display digit; compare parsed real and imaginary components instead."
    prefer: formulon
    first_noted: 2026-05-08
    last_verified_excel_version: "16.0.20228"
  # Trigonometric values near poles are sensitive to the platform libm.
  - ids:
      - tan_neg_three_pi_over_two
      - tan_neg_pi_over_two
      - tan_pi_over_two
      - tan_three_pi_over_two
      - misc_cot_pi_minus_eps
      - misc_csc_pi_minus_eps
      - misc_sec_halfpi_minus_eps
      - misc_sec_halfpi_plus_eps
    tolerance: { rel: 0.001 }
    reason: "Near-pole trigonometric probes vary at the platform-libm level between Win Excel and Formulon; 0.1% relative tolerance preserves the observable sign and magnitude contract."
    prefer: formulon
    first_noted: 2026-05-08
    last_verified_excel_version: "16.0.20228"
  # The Windows golden records -1 for a date difference that is 0.
  - id: datevalue_agrees_with_date
    compare_mode: datevalue_roundtrip_readback
    reason: "DATEVALUE(\"2026-04-23\")-DATE(2026,4,23) is 0, which Formulon returns, but the Windows golden records -1. The compare mode accepts exactly that pair (golden -1, engine 0) and compares every other value normally. The -1 is consistent with the Range.Value read that date_year_snap_1900 records, which lands one day early below serial 61; the next capture through the Value2 driver replaces it."
    prefer: formulon
    first_noted: 2026-05-08
    last_verified_excel_version: "16.0.20228"
  # The four aggregator cases carried `prefer: formulon` here and
  # `prefer: mac-excel-365` in tests/divergence.yaml -- the same
  # divergence recorded with opposite verdicts. Both files also blamed the
  # "compact inline-array" form, which is not what Excel rejects: inline
  # arrays evaluate fine and the rejection came from a literal 0 in the
  # sort_order slot, outside Excel's signed-column-index domain. The cases
  # now pass an in-contract argument list, so nothing needs skipping on
  # that account; the rejection is pinned by its own live cases.
  # A bounded range spilling over its own formula cell reads differently per
  # host, and the verifier's anchor projection accepts both readings.
  - id: bounded_rectangle_containing_its_own_formula_cell
    reason: "`=A1:C3` entered in B2 is circular. Win Excel 365 captures the whole 3x3 rectangle as zeros; Mac Excel 365 captures the scalar 0 (tests/oracle/targets/mac-365-ja_JP/golden/whole_axis_spill.golden.json). The verifier compares the anchor, so both goldens pass without asserting the shape; recorded so that projection is not mistaken for agreement on the spill shape."
    prefer: formulon
    first_noted: 2026-09-30
    last_verified_excel_version: "16.0.20228"
  # The COM bridge read this date-formatted result through Range.Value, which
  # converts serial 1 to the OLE date 1899-12-31 and back to 0. The driver now
  # reads Value2; Excel answers 1, as Formulon does.
  - id: date_year_snap_1900
    applies_to: [win-365-ja_JP]
    mode: skip-oracle
    cause: harness-cannot-capture
    reason: "DATE(1899.9999999,1,1): the golden records 0 because the Windows driver read the date-formatted cell through Range.Value, whose OLE date has no 1900-02-29 and lands one day early below serial 61. Read through Value2 on the same host, Excel returns 1, as Formulon does; the next capture with the Value2 driver replaces the golden."
    prefer: formulon
    first_noted: 2026-10-13
    last_verified_excel_version: "16.0.20430"
  # Undocumented WEEKNUM return types have no stable answer on Windows.
  - id: weeknum_neg2
    applies_to: [win-365-ja_JP]
    mode: skip-oracle
    cause: excel-no-value
    reason: "WEEKNUM(DATE(2025,3,1),-2): the golden records 9, but the same formula on the same Excel build returned #NUM! in a later session. Over 10 dates x 16 return types, the undocumented types (negative ones and 22) return either the Sunday-start or the Monday-start week number for some cells and #NUM! for others, with no rule in the type, the date or its weekday, which is consistent with an out-of-range table read in Excel. Documented and fractional types are stable and match Formulon. Formulon keeps the documented contract: only 1, 2, 11-17 and 21 (after truncation) are accepted, anything else is #NUM!."
    prefer: formulon
    first_noted: 2026-10-13
    last_verified_excel_version: "16.0.20430"
