# Mac Excel 365 (ko-KR) variant-specific divergences.
#
# Entries here merge on top of tests/divergence.yaml (which supplies unscoped
# skips and entries whose applies_to includes mac-365-ko_KR) and override it
# on key collision. Schema is identical to tests/divergence.yaml.

entries:
  # CELL("address") on another sheet prints "[book]sheet!", quoted as a whole
  # when either part needs it. The default ko-KR book name contains a space,
  # so Excel quotes every such qualifier; Formulon has no book name to print.
  - id: cell_address_sheet_r
    applies_to: [mac-365-ko_KR]
    mode: skip-oracle
    cause: accepted-divergence
    reason: "Mac Excel ko-KR quotes the qualifier because the unsaved book's default name (통합 문서N) contains a space; the sheet name alone stays bare, which Formulon prints as it has no book name."
    prefer: formulon
    first_noted: 2026-10-26
    last_verified_excel_version: "16.114.1"
