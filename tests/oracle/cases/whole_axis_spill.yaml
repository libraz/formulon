suite: whole_axis_spill
description: >
  Bare whole-axis references (`=A:A`, `=A:C`, `=1:2`) used as the whole
  formula, i.e. as a spilling expression rather than as a function
  argument. Every case declares its own `formula_cell`, because the
  observable result depends on where the formula sits.

  Excel 365 treats a bare whole-axis reference like any other bare range:
  the value is the array of the *declared* rectangle — rows 1..1048576 for
  a column span, columns A..XFD for a row span — and it spills from the
  formula cell. Nothing is trimmed to the populated extent, and cells with
  no content spill as 0. Three consequences are directly observable and
  are what this suite pins:

    * the rectangle must fit inside the grid measured from the formula
      cell, so a whole-column reference only spills from row 1 and a
      whole-row reference only from column A; anywhere else is `#SPILL!`;
    * any occupied cell anywhere in that rectangle blocks the spill, even
      one far below or far to the right of the populated data, which is
      what shows the footprint is the full declared rectangle;
    * a formula that sits inside the axis it references is a circular
      reference, so it never spills at all.

  The four full-rectangle spills use `capture: shape`: their results are
  far larger than the cell-by-cell capture ceiling (the smallest is 16,384
  cells against a 4,096 ceiling), so the golden records the dynamic-array
  shape plus the listed sample cells instead of every cell. Excel answers
  them normally; only the recording differs.

  The remaining seven are recorded cell by cell and are currently
  registered in tests/divergence.yaml. Each `expect` block below is
  Excel's observed answer; deleting an entry and regenerating this suite
  turns the corresponding case back into a verified golden.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  # ------------------------------------------------------------------
  # Geometry: the declared rectangle has to fit from the formula cell.
  # ------------------------------------------------------------------

  - id: whole_col_below_row_one_overflows
    description: "=A:A at Z2; the 1048576-row rectangle no longer fits below row 2"
    formula: "=A:A"
    formula_cell: Z2
    setup:
      A1: 1
      A2: 2
      A3: 3
    expect: { kind: error, code: "#SPILL!" }

  - id: whole_multi_col_below_row_one_overflows
    description: "=A:C at Z2; same overflow with a three-column span"
    formula: "=A:C"
    formula_cell: Z2
    setup:
      A1: 1
      A2: 2
      B1: 10
      C1: 100
    expect: { kind: error, code: "#SPILL!" }

  - id: whole_row_right_of_column_a_overflows
    description: "=1:2 at B5; the 16384-column rectangle no longer fits right of column B"
    formula: "=1:2"
    formula_cell: B5
    setup:
      A1: 1
      A2: 2
      B1: 10
      C1: 100
    expect: { kind: error, code: "#SPILL!" }

  # ------------------------------------------------------------------
  # Footprint: a blocker anywhere in the declared rectangle stops the
  # spill, including far outside the populated extent of the source.
  # ------------------------------------------------------------------

  - id: whole_col_blocked_far_below_anchor
    description: "=A:A at Z1 with Z500 occupied; row 500 is inside the footprint"
    formula: "=A:A"
    formula_cell: Z1
    setup:
      A1: 1
      A2: 2
      A3: 3
      Z500: 7
    expect: { kind: error, code: "#SPILL!" }

  - id: whole_row_blocked_right_of_anchor
    description: "=3:3 at A5 with Z5 occupied; column Z is inside the footprint"
    formula: "=3:3"
    formula_cell: A5
    setup:
      A3: 3
      B3: 30
      Z5: 9
    expect: { kind: error, code: "#SPILL!" }

  # ------------------------------------------------------------------
  # Self-reference: the formula cell lies inside the referenced axis.
  # Both cases are laid out so the rectangle fits and the runway is
  # clear, leaving circularity as the only thing that can stop the
  # spill. Excel resolves the cycle to 0 with iterative calculation off.
  # ------------------------------------------------------------------

  - id: whole_col_containing_its_own_formula_cell
    description: "=A:A at A1; column A is otherwise empty, so only the cycle stops the spill"
    formula: "=A:A"
    formula_cell: A1
    setup:
      B1: 10
      C1: 100
    expect: 0

  - id: whole_row_containing_its_own_formula_cell
    description: "=5:5 at A5; row 5 is otherwise empty, so only the cycle stops the spill"
    formula: "=5:5"
    formula_cell: A5
    setup:
      A1: 1
      B1: 10
    expect: 0

  # The same cycle with the axis inside an expression. ROWS reads only the
  # declared shape, so its answer does not depend on how the cycle is seeded.
  - id: axis_self_ref_derived_col
    description: "=A:A+0 at A1; column A is otherwise empty"
    formula: "=A:A+0"
    formula_cell: A1
    expect: 0

  - id: axis_self_ref_sum_derived_col
    description: "=SUM(C:C*1) at C1; column C is otherwise empty"
    formula: "=SUM(C:C*1)"
    formula_cell: C1
    expect: 0

  - id: axis_self_ref_rows_derived_col
    description: "=ROWS(G:G+0) at G1; the declared height, cycle or not"
    formula: "=ROWS(G:G+0)"
    formula_cell: G1
    expect: 1048576

  # The two cases above isolate circularity by clearing the runway. This
  # pair instead makes both conditions true at once and shows which one
  # Excel decides first: the footprint fits from row 1, A2 and A3 occupy
  # it, and the formula cell is inside the referenced column. Excel
  # answers 0, not #SPILL!, so the cycle is decided before the blocking
  # check. Without the control below the observation would not be legible:
  # it is the same geometry with the formula cell moved out of the
  # referenced axis, and there the blocked spill does surface as #SPILL!.
  - id: whole_col_cycle_decided_before_blocking
    description: "=A:A at A1 with A2/A3 occupied; circular AND blocked -> Excel takes the cycle"
    formula: "=A:A"
    formula_cell: A1
    setup:
      A2: 2
      A3: 3
      B1: 10
    expect: 0

  - id: whole_col_blocked_when_formula_cell_is_outside_the_axis
    description: "=B:B at A1 with A2/A3 occupied; not circular, so the blocked spill is #SPILL!"
    formula: "=B:B"
    formula_cell: A1
    setup:
      A2: 2
      A3: 3
      B1: 10
      B3: 30
    expect: { kind: error, code: "#SPILL!" }

  # ------------------------------------------------------------------
  # The full-rectangle spills. Excel produces them; the oracle capture
  # ceiling (4096 cells) cannot record them, so these carry skip entries
  # in tests/divergence.yaml that state the shape Excel returned.
  # ------------------------------------------------------------------

  - id: whole_col_spills_full_declared_rectangle
    description: "=A:A at Z1; Excel spills 1048576x1, blanks below the data as 0"
    formula: "=A:A"
    formula_cell: Z1
    capture: shape
    samples: [Z1, Z2, Z3, Z4, Z1048576]
    setup:
      A1: 1
      A2: 2
      A3: 3

  - id: whole_multi_col_spills_full_declared_rectangle
    description: "=A:C at Z1; Excel spills 1048576x3, blanks inside the span as 0"
    formula: "=A:C"
    formula_cell: Z1
    capture: shape
    samples: [Z1, AA1, AB1, Z2, AA2, AB3]
    setup:
      A1: 1
      A2: 2
      B1: 10
      C1: 100

  - id: whole_row_pair_spills_full_declared_rectangle
    description: "=1:2 at A5; Excel spills 2x16384 across the full grid width"
    formula: "=1:2"
    formula_cell: A5
    capture: shape
    samples: [A5, B5, C5, A6, B6, XFD5, XFD6]
    setup:
      A1: 1
      A2: 2
      B1: 10
      C1: 100

  - id: whole_single_row_spills_full_declared_rectangle
    description: "=3:3 at A5; Excel spills 1x16384 across the full grid width"
    formula: "=3:3"
    formula_cell: A5
    capture: shape
    samples: [A5, B5, C5, XFD5]
    setup:
      A3: 3
      B3: 30

  # ------------------------------------------------------------------
  # The same rectangles written the bounded way. Excel does not treat
  # these as a separate form at all: it rewrites a full-height bounded
  # range into the whole-axis spelling on entry, so `=A1:A1048576` reads
  # back as `=A:A`. Anything that answers one spelling differently from
  # the other is therefore answering a distinction Excel does not make.
  # These cases sit next to their whole-axis twins so the pair is read
  # together.
  # ------------------------------------------------------------------

  - id: bounded_full_col_spills_like_the_whole_axis_spelling
    description: "=A1:A1048576 at B1; Excel canonicalises to =A:A and spills 1048576x1"
    formula: "=A1:A1048576"
    formula_cell: B1
    capture: shape
    samples: [B1, B2, B3, B1048576]
    setup:
      A1: 1
      A2: 2
      A3: 3

  - id: bounded_rectangle_containing_its_own_formula_cell
    description: "=A1:C3 at B2; the rectangle contains its own formula cell, so the spill never happens"
    formula: "=A1:C3"
    formula_cell: B2
    expect: 0

  - id: bounded_rectangle_outside_its_own_formula_cell
    description: "=A1:C3 at E1; control for the case above -- same rectangle, anchor outside it, spills 3x3"
    formula: "=A1:C3"
    formula_cell: E1

  # ------------------------------------------------------------------
  # Operators, LET and scalar functions over a whole axis keep the declared
  # shape. Data lives on Sheet2 (A1:A5 = k1,k2,k3,<blank>,k5; B1:B5 = 10..50);
  # the formula sits on Sheet1.
  # ------------------------------------------------------------------
  - id: axis_sum_col_times_one
    description: "SUM(L!B:B*1) = 150"
    formula: '=SUM(Sheet2!B:B*1)'
    formula_cell: Z1
    setup: &axis_data
      Sheet2!A1: k1
      Sheet2!A2: k2
      Sheet2!A3: k3
      Sheet2!A5: k5
      Sheet2!B1: 10
      Sheet2!B2: 20
      Sheet2!B3: 30
      Sheet2!B4: 40
      Sheet2!B5: 50
    expect: 150
  - id: axis_sum_cond_times_col
    description: "SUM((L!A:A='k2')*L!B:B) = 20"
    formula: '=SUM((Sheet2!A:A="k2")*Sheet2!B:B)'
    formula_cell: Z1
    setup: *axis_data
    expect: 20
  - id: axis_sumproduct_cond_times_col
    description: "SUMPRODUCT((L!A:A='k2')*L!B:B) = 20"
    formula: '=SUMPRODUCT((Sheet2!A:A="k2")*Sheet2!B:B)'
    formula_cell: Z1
    setup: *axis_data
    expect: 20
  - id: axis_col_plus_zero_spills_full_rectangle
    description: "=L!B:B+0 at A1 spills 1048576x1; rows past the data are 0"
    formula: '=Sheet2!B:B+0'
    formula_cell: A1
    capture: shape
    samples: [A1, A2, A5, A6, A1048576]
    setup: *axis_data
  - id: axis_col_plus_zero_below_row_one_overflows
    description: "=L!B:B+0 at A2; the 1048576-row result no longer fits"
    formula: '=Sheet2!B:B+0'
    formula_cell: A2
    setup: *axis_data
    expect: { kind: error, code: "#SPILL!" }
  - id: axis_rows_of_col_plus_zero
    description: "ROWS(L!B:B+0) = 1048576"
    formula: '=ROWS(Sheet2!B:B+0)'
    formula_cell: Z1
    setup: *axis_data
    expect: 1048576
  - id: axis_let_rows_of_col
    description: "LET(x,L!B:B,ROWS(x)) = 1048576"
    formula: '=LET(x,Sheet2!B:B,ROWS(x))'
    formula_cell: Z1
    setup: *axis_data
    expect: 1048576
  - id: axis_let_col_spills_full_rectangle
    description: "=LET(x,L!B:B,x) at A1 spills 1048576x1"
    formula: '=LET(x,Sheet2!B:B,x)'
    formula_cell: A1
    capture: shape
    samples: [A1, A5, A6, A1048576]
    setup: *axis_data

  # ------------------------------------------------------------------
  # COUNTBLANK counts the unused part of a whole axis.
  # ------------------------------------------------------------------
  - id: axis_countblank_col_c
    description: "COUNTBLANK(L!C:C) = 1048576"
    formula: '=COUNTBLANK(Sheet2!C:C)'
    formula_cell: Z1
    setup: *axis_data
    expect: 1048576
  - id: axis_countblank_col_b
    description: "COUNTBLANK(L!B:B) = 1048571"
    formula: '=COUNTBLANK(Sheet2!B:B)'
    formula_cell: Z1
    setup: *axis_data
    expect: 1048571
  - id: axis_countblank_bounded_a1_a5
    description: "COUNTBLANK(L!A1:A5) = 1"
    formula: '=COUNTBLANK(Sheet2!A1:A5)'
    formula_cell: Z1
    setup: *axis_data
    expect: 1
  - id: axis_countblank_col_a
    description: "COUNTBLANK(L!A:A) = 1048572"
    formula: '=COUNTBLANK(Sheet2!A:A)'
    formula_cell: Z1
    setup: *axis_data
    expect: 1048572
  - id: axis_countblank_row_1
    description: "COUNTBLANK(L!1:1) = 16382"
    formula: '=COUNTBLANK(Sheet2!1:1)'
    formula_cell: Z1
    setup: *axis_data
    expect: 16382
  - id: axis_countblank_cols_a_b
    description: "COUNTBLANK(L!A:B) = 2097143"
    formula: '=COUNTBLANK(Sheet2!A:B)'
    formula_cell: Z1
    setup: *axis_data
    expect: 2097143

  # ------------------------------------------------------------------
  # Reductions over derived whole-axis arrays.
  # ------------------------------------------------------------------
  - id: axis_max_col_minus_one
    description: "MAX(L!B:B-1) = 49"
    formula: '=MAX(Sheet2!B:B-1)'
    formula_cell: Z1
    setup: *axis_data
    expect: 49
  - id: axis_count_col_plus_zero
    description: "COUNT(L!B:B+0) = 1048576"
    formula: '=COUNT(Sheet2!B:B+0)'
    formula_cell: Z1
    setup: *axis_data
    expect: 1048576
  - id: axis_average_if_col_gt_15
    description: "AVERAGE(IF(L!B:B>15,L!B:B)) = 35"
    formula: '=AVERAGE(IF(Sheet2!B:B>15,Sheet2!B:B))'
    formula_cell: Z1
    setup: *axis_data
    expect: 35

  # ------------------------------------------------------------------
  # Same-sheet spill: data in Sheet1 A/B, formula at D1.
  # ------------------------------------------------------------------
  - id: axis_same_sheet_col_times_two_spills
    description: "=B:B*2 at D1 with data on the same sheet; D6 and the last row are 0"
    formula: '=B:B*2'
    formula_cell: D1
    capture: shape
    samples: [D1, D2, D5, D6, D1048576]
    setup:
      A1: k1
      A2: k2
      A3: k3
      A5: k5
      B1: 10
      B2: 20
      B3: 30
      B4: 40
      B5: 50

  # ------------------------------------------------------------------
  # COUNTIF / COUNTIFS count the unused part of the axis.
  # ------------------------------------------------------------------
  - id: axis_countif_col_a_not_k1
    description: "COUNTIF(L!A:A,'<>k1') = 1048575"
    formula: '=COUNTIF(Sheet2!A:A,"<>k1")'
    formula_cell: Z1
    setup: *axis_data
    expect: 1048575
  - id: axis_countif_col_a_empty
    description: "COUNTIF(L!A:A,'') = 1048572"
    formula: '=COUNTIF(Sheet2!A:A,"")'
    formula_cell: Z1
    setup: *axis_data
    expect: 1048572
  - id: axis_countif_col_a_nonblank
    description: "COUNTIF(L!A:A,'<>') = 4"
    formula: '=COUNTIF(Sheet2!A:A,"<>")'
    formula_cell: Z1
    setup: *axis_data
    expect: 4
  - id: axis_countifs_both_empty
    description: "COUNTIFS(L!A:A,'',L!B:B,'') = 1048571"
    formula: '=COUNTIFS(Sheet2!A:A,"",Sheet2!B:B,"")'
    formula_cell: Z1
    setup: *axis_data
    expect: 1048571
  - id: axis_countif_col_b_lt_20
    description: "COUNTIF(L!B:B,'<20') = 1"
    formula: '=COUNTIF(Sheet2!B:B,"<20")'
    formula_cell: Z1
    setup: *axis_data
    expect: 1
  - id: axis_countif_col_b_ne_20
    description: "COUNTIF(L!B:B,'<>20') = 1048575"
    formula: '=COUNTIF(Sheet2!B:B,"<>20")'
    formula_cell: Z1
    setup: *axis_data
    expect: 1048575
  - id: axis_sumproduct_blank_cond
    description: "SUMPRODUCT((L!A:A='')*1) = 1048572"
    formula: '=SUMPRODUCT((Sheet2!A:A="")*1)'
    formula_cell: Z1
    setup: *axis_data
    expect: 1048572

  # ------------------------------------------------------------------
  # Broadcast and tail behaviour of whole-axis results.
  # ------------------------------------------------------------------
  - id: axis_multi_col_plus_one_spills
    description: "=L!A:C+1 at A1 spills 1048576x3; rows past the data are 1,1,1"
    formula: '=Sheet2!A:C+1'
    formula_cell: A1
    capture: shape
    samples: [A1, B1, C1, A4, A6, B6, C6, A1048576, C1048576]
    setup: *axis_data
  - id: axis_col_plus_column_vector_tail_na
    description: "=L!B:B+{1;2;3}; rows 4 onward are #N/A"
    formula: '=Sheet2!B:B+{1;2;3}'
    formula_cell: A1
    capture: shape
    samples: [A1, A2, A3, A4, A6, A1048576]
    setup: *axis_data
  - id: axis_col_plus_row_vector_two_cols
    description: "=L!B:B+{1,2} spills 1048576x2; the tail rows are 1,2"
    formula: '=Sheet2!B:B+{1,2}'
    formula_cell: A1
    capture: shape
    samples: [A1, B1, A6, B6, A1048576, B1048576]
    setup: *axis_data
  - id: axis_row_plus_zero_spills
    description: "=L!1:1+0 at A1 spills 1x16384"
    formula: '=Sheet2!1:1+0'
    formula_cell: A1
    capture: shape
    samples: [A1, B1, C1, XFD1]
    setup: *axis_data
  - id: axis_col_concat_text_tail
    description: "=L!A:A&'x'; blanks and the tail read as empty text"
    formula: '=Sheet2!A:A&"x"'
    formula_cell: A1
    capture: shape
    samples: [A1, A4, A6, A1048576]
    setup: *axis_data
  - id: axis_isblank_col_tail
    description: "=ISBLANK(L!A:A); A4, the unused rows and the last row are TRUE"
    formula: '=ISBLANK(Sheet2!A:A)'
    formula_cell: A1
    capture: shape
    samples: [A1, A4, A6, A1048576]
    setup: *axis_data
  - id: axis_rows_of_abs_col
    description: "ROWS(ABS(L!B:B)) = 1048576"
    formula: '=ROWS(ABS(Sheet2!B:B))'
    formula_cell: Z1
    setup: *axis_data
    expect: 1048576
  - id: axis_sum_col_times_zero_plus_one
    description: "SUM(L!B:B*0+1) = 1048576"
    formula: '=SUM(Sheet2!B:B*0+1)'
    formula_cell: Z1
    setup: *axis_data
    expect: 1048576
  - id: axis_sum_col_plus_row_axis
    description: "SUM(L!A:A+L!1:1); Excel answers 0 (reason unknown, measured)"
    formula: '=SUM(Sheet2!A:A+Sheet2!1:1)'
    formula_cell: Z1
    setup: *axis_data
    expect: 0

  # ------------------------------------------------------------------
  # SUMPRODUCT argument shapes and accumulation order.
  # ------------------------------------------------------------------
  - id: axis_sumproduct_col_vs_bounded_mismatch
    description: "SUMPRODUCT(L!A:A,L!B1:B5) -> #VALUE! (dimension mismatch)"
    formula: '=SUMPRODUCT(Sheet2!A:A,Sheet2!B1:B5)'
    formula_cell: Z1
    setup: *axis_data
    expect: { kind: error, code: "#VALUE!" }
  - id: axis_sumproduct_col_b_squared
    description: "SUMPRODUCT(L!B:B,L!B:B) = 5500"
    formula: '=SUMPRODUCT(Sheet2!B:B,Sheet2!B:B)'
    formula_cell: Z1
    setup: *axis_data
    expect: 5500
  - id: axis_sumproduct_tail_sequential_sum
    description: "(L!A:A='')*0.1 summed row by row minus 104857.2 -> 1.6156118363142014e-06"
    formula: '=SUMPRODUCT((Sheet2!A:A="")*0.1)-104857.2'
    formula_cell: Z1
    setup: *axis_data
    expect: 1.6156118363142014e-06
