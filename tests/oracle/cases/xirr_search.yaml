suite: xirr_search
description: XIRR full-precision results from Excel's bracket-and-bisect search, compared as 15 digits plus the residual
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: documentation_schedule_default_guess_digits
    description: "Microsoft docs schedule, default guess (leading 15 digits)"
    formula: "=TEXT(XIRR({-10000,2750,4250,3250,2750},{39448,39508,39751,39859,39904}),\"0.00000000000000E+00\")"
  - id: documentation_schedule_default_guess_residual
    description: "Microsoft docs schedule, default guess (residual below the 15 digits)"
    formula: "=TEXT((XIRR({-10000,2750,4250,3250,2750},{39448,39508,39751,39859,39904}))-VALUE(TEXT(XIRR({-10000,2750,4250,3250,2750},{39448,39508,39751,39859,39904}),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: bracket_doubles_to_root_digits
    description: "[0, 2s] doubles until it brackets the root at 1 (leading 15 digits)"
    formula: "=TEXT(XIRR({-1,2},{39448,39813}),\"0.00000000000000E+00\")"
  - id: bracket_doubles_to_root_residual
    description: "[0, 2s] doubles until it brackets the root at 1 (residual below the 15 digits)"
    formula: "=TEXT((XIRR({-1,2},{39448,39813}))-VALUE(TEXT(XIRR({-1,2},{39448,39813}),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: root_on_midpoint_digits
    description: "root 1 hit exactly by a midpoint is approached from below (leading 15 digits)"
    formula: "=TEXT(XIRR({-1,2},{39448,39813},1),\"0.00000000000000E+00\")"
  - id: root_on_midpoint_residual
    description: "root 1 hit exactly by a midpoint is approached from below (residual below the 15 digits)"
    formula: "=TEXT((XIRR({-1,2},{39448,39813},1))-VALUE(TEXT(XIRR({-1,2},{39448,39813},1),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: root_at_zero_digits
    description: "root 0 stops on a halved guess (leading 15 digits)"
    formula: "=TEXT(XIRR({-1,1},{39448,39813},0.5),\"0.00000000000000E+00\")"
  - id: root_at_zero_residual
    description: "root 0 stops on a halved guess (residual below the 15 digits)"
    formula: "=TEXT((XIRR({-1,1},{39448,39813},0.5))-VALUE(TEXT(XIRR({-1,1},{39448,39813},0.5),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: zero_guess_digits
    description: "a zero guess steps from 1E-5 (leading 15 digits)"
    formula: "=TEXT(XIRR({-1,2},{39448,39848},0),\"0.00000000000000E+00\")"
  - id: zero_guess_residual
    description: "a zero guess steps from 1E-5 (residual below the 15 digits)"
    formula: "=TEXT((XIRR({-1,2},{39448,39848},0))-VALUE(TEXT(XIRR({-1,2},{39448,39848},0),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: guess_above_root_digits
    description: "a guess above the root still bisects from 0 (leading 15 digits)"
    formula: "=TEXT(XIRR({-100,110},{39448,39813},3),\"0.00000000000000E+00\")"
  - id: guess_above_root_residual
    description: "a guess above the root still bisects from 0 (residual below the 15 digits)"
    formula: "=TEXT((XIRR({-100,110},{39448,39813},3))-VALUE(TEXT(XIRR({-100,110},{39448,39813},3),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: negative_root_lower_bracket_digits
    description: "negative root below -guess uses [-1, -guess] (leading 15 digits)"
    formula: "=TEXT(XIRR({-1,0.2},{39448,39848},0.5),\"0.00000000000000E+00\")"
  - id: negative_root_lower_bracket_residual
    description: "negative root below -guess uses [-1, -guess] (residual below the 15 digits)"
    formula: "=TEXT((XIRR({-1,0.2},{39448,39848},0.5))-VALUE(TEXT(XIRR({-1,0.2},{39448,39848},0.5),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: negative_root_on_minus_guess_digits
    description: "f(-guess) = 0 brackets with -1 (leading 15 digits)"
    formula: "=TEXT(XIRR({-2,1},{39448,39813},0.5),\"0.00000000000000E+00\")"
  - id: negative_root_on_minus_guess_residual
    description: "f(-guess) = 0 brackets with -1 (residual below the 15 digits)"
    formula: "=TEXT((XIRR({-2,1},{39448,39813},0.5))-VALUE(TEXT(XIRR({-2,1},{39448,39813},0.5),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: negative_root_upper_bracket_digits
    description: "negative root above -guess uses [-guess, 0] (leading 15 digits)"
    formula: "=TEXT(XIRR({-1,0.8},{39448,39848},0.3),\"0.00000000000000E+00\")"
  - id: negative_root_upper_bracket_residual
    description: "negative root above -guess uses [-guess, 0] (residual below the 15 digits)"
    formula: "=TEXT((XIRR({-1,0.8},{39448,39848},0.3))-VALUE(TEXT(XIRR({-1,0.8},{39448,39848},0.3),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: multi_flow_large_root_digits
    description: "multi-flow schedule whose root lies past 4 (leading 15 digits)"
    setup:
      A1: -5440000
      A2: 63700000
      A3: -0.0717
      A4: -48800
      A5: -2870000
      A6: 0.0146
      B1: 39448
      B2: 40004
      B3: 40066
      B4: 41395
      B5: 61205
      B6: 75734
    formula: "=TEXT(XIRR(A1:A6,B1:B6,0),\"0.00000000000000E+00\")"
  - id: multi_flow_large_root_residual
    description: "multi-flow schedule whose root lies past 4 (residual below the 15 digits)"
    setup:
      A1: -5440000
      A2: 63700000
      A3: -0.0717
      A4: -48800
      A5: -2870000
      A6: 0.0146
      B1: 39448
      B2: 40004
      B3: 40066
      B4: 41395
      B5: 61205
      B6: 75734
    formula: "=TEXT(XIRR(A1:A6,B1:B6,0)-VALUE(TEXT(XIRR(A1:A6,B1:B6,0),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: nan_at_minus_one_digits
    description: "f(-1) is inf - inf; [-1, -s] is bisected without evaluating it (leading 15 digits)"
    formula: "=TEXT(XIRR({-100;-20;60},{40000;40100;40200},0.1),\"0.00000000000000E+00\")"
  - id: nan_at_minus_one_residual
    description: "f(-1) is inf - inf; [-1, -s] is bisected without evaluating it (residual below the 15 digits)"
    formula: "=TEXT(XIRR({-100;-20;60},{40000;40100;40200},0.1)-VALUE(TEXT(XIRR({-100;-20;60},{40000;40100;40200},0.1),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: negative_root_guess_at_least_one
    description: "a negative root with guess >= 1 is #NUM!"
    formula: "=XIRR({-2,1},{39448,39813},1)"
  - id: gate_equality_collapses_to_zero_digits
    description: "later flows exactly cover |v0|, the positive bisection collapses to 0 (leading 15 digits)"
    formula: "=TEXT(XIRR({-2.5,-4,1.5},{40000,40365,40730},0.1),\"0.00000000000000E+00\")"
  - id: gate_equality_collapses_to_zero_residual
    description: "later flows exactly cover |v0|, the positive bisection collapses to 0 (residual below the 15 digits)"
    formula: "=TEXT(XIRR({-2.5,-4,1.5},{40000,40365,40730},0.1)-VALUE(TEXT(XIRR({-2.5,-4,1.5},{40000,40365,40730},0.1),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: gate_fails_negative_lower_bracket_digits
    description: "later flows fall short of |v0|, root found in [-1, -s] (leading 15 digits)"
    formula: "=TEXT(XIRR({-2.55,-4,1.5},{40000,40365,40730},0.1),\"0.00000000000000E+00\")"
  - id: gate_fails_negative_lower_bracket_residual
    description: "later flows fall short of |v0|, root found in [-1, -s] (residual below the 15 digits)"
    formula: "=TEXT(XIRR({-2.55,-4,1.5},{40000,40365,40730},0.1)-VALUE(TEXT(XIRR({-2.55,-4,1.5},{40000,40365,40730},0.1),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: doubling_passes_near_root_digits
    description: "doubling continues while f stays below the root, the far root wins (leading 15 digits)"
    formula: "=TEXT(XIRR({3.85,-124,3340,-0.00297},{40000,42848,61195,74036},0.1),\"0.00000000000000E+00\")"
  - id: doubling_passes_near_root_residual
    description: "doubling continues while f stays below the root, the far root wins (residual below the 15 digits)"
    formula: "=TEXT(XIRR({3.85,-124,3340,-0.00297},{40000,42848,61195,74036},0.1)-VALUE(TEXT(XIRR({3.85,-124,3340,-0.00297},{40000,42848,61195,74036},0.1),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: gate_routes_three_roots_negative_digits
    description: "a three-root schedule routed to the negative root (leading 15 digits)"
    formula: "=TEXT(XIRR({1,-2.65,2.23,-0.5775},{40000,40365,40730,41095},0.045),\"0.00000000000000E+00\")"
  - id: gate_routes_three_roots_negative_residual
    description: "a three-root schedule routed to the negative root (residual below the 15 digits)"
    formula: "=TEXT(XIRR({1,-2.65,2.23,-0.5775},{40000,40365,40730,41095},0.045)-VALUE(TEXT(XIRR({1,-2.65,2.23,-0.5775},{40000,40365,40730,41095},0.045),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: lower_bracket_from_minus_one_digits
    description: "[-1, -s] starts at -1 exactly although f(-1) is NaN (leading 15 digits)"
    formula: "=TEXT(XIRR({230000000,-6030000,0.0275},{39448,64923,74785},0),\"0.00000000000000E+00\")"
  - id: lower_bracket_from_minus_one_residual
    description: "[-1, -s] starts at -1 exactly although f(-1) is NaN (residual below the 15 digits)"
    formula: "=TEXT(XIRR({230000000,-6030000,0.0275},{39448,64923,74785},0)-VALUE(TEXT(XIRR({230000000,-6030000,0.0275},{39448,64923,74785},0),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: negative_side_with_large_guess_digits
    description: "[-s, 0] is tried for s >= 1 when f(-s) is finite (leading 15 digits)"
    formula: "=TEXT(XIRR({-4,-4,1.5},{40000,40365,40730},1.5),\"0.00000000000000E+00\")"
  - id: negative_side_with_large_guess_residual
    description: "[-s, 0] is tried for s >= 1 when f(-s) is finite (residual below the 15 digits)"
    formula: "=TEXT(XIRR({-4,-4,1.5},{40000,40365,40730},1.5)-VALUE(TEXT(XIRR({-4,-4,1.5},{40000,40365,40730},1.5),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: positive_side_no_residual_test_digits
    description: "collapse to 0 accepted with a large residual (leading 15 digits)"
    setup:
      A1: -4.688
      A2: 5.168
      A3: -97.437
      A4: 0.811
      A5: 6.091
      A6: 9.528
      A7: -2.993
      B1: 39448
      B2: 39592
      B3: 40251
      B4: 41650
      B5: 42073
      B6: 42951
      B7: 43103
    formula: "=TEXT(XIRR(A1:A7,B1:B7,0.3),\"0.00000000000000E+00\")"
  - id: positive_side_no_residual_test_residual
    description: "collapse to 0 accepted with a large residual (residual below the 15 digits)"
    setup:
      A1: -4.688
      A2: 5.168
      A3: -97.437
      A4: 0.811
      A5: 6.091
      A6: 9.528
      A7: -2.993
      B1: 39448
      B2: 39592
      B3: 40251
      B4: 41650
      B5: 42073
      B6: 42951
      B7: 43103
    formula: "=TEXT(XIRR(A1:A7,B1:B7,0.3)-VALUE(TEXT(XIRR(A1:A7,B1:B7,0.3),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: positive_side_stops_on_step_digits
    description: "positive side stops at the first small step (leading 15 digits)"
    formula: "=TEXT(XIRR({-0.799,0.527,0.987},{39448,42861,43057},0.3),\"0.00000000000000E+00\")"
  - id: positive_side_stops_on_step_residual
    description: "positive side stops at the first small step (residual below the 15 digits)"
    formula: "=TEXT(XIRR({-0.799,0.527,0.987},{39448,42861,43057},0.3)-VALUE(TEXT(XIRR({-0.799,0.527,0.987},{39448,42861,43057},0.3),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: negative_residual_by_first_flow_digits
    description: "negative-side residual is scaled by |v0| (leading 15 digits)"
    formula: "=TEXT(XIRR({-2.6,-4,1.5},{40000,41825,43650},0.1),\"0.00000000000000E+00\")"
  - id: negative_residual_by_first_flow_residual
    description: "negative-side residual is scaled by |v0| (residual below the 15 digits)"
    formula: "=TEXT(XIRR({-2.6,-4,1.5},{40000,41825,43650},0.1)-VALUE(TEXT(XIRR({-2.6,-4,1.5},{40000,41825,43650},0.1),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: negative_residual_first_flow_small_digits
    description: "negative-side residual with v0 far from the largest flow (leading 15 digits)"
    formula: "=TEXT(XIRR({-10,-60,68},{40000,40300,40711},0.1),\"0.00000000000000E+00\")"
  - id: negative_residual_first_flow_small_residual
    description: "negative-side residual with v0 far from the largest flow (residual below the 15 digits)"
    formula: "=TEXT(XIRR({-10,-60,68},{40000,40300,40711},0.1)-VALUE(TEXT(XIRR({-10,-60,68},{40000,40300,40711},0.1),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: first_flow_added_last_digits
    description: "exact-root midpoint approached from below: v0 is added last (leading 15 digits)"
    formula: "=TEXT(XIRR({1,-2.1,1.08},{40000,40365,40730},0.2),\"0.00000000000000E+00\")"
  - id: first_flow_added_last_residual
    description: "exact-root midpoint approached from below: v0 is added last (residual below the 15 digits)"
    formula: "=TEXT(XIRR({1,-2.1,1.08},{40000,40365,40730},0.2)-VALUE(TEXT(XIRR({1,-2.1,1.08},{40000,40365,40730},0.2),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: later_flows_in_listed_order_digits
    description: "later flows accumulate in listed order (leading 15 digits)"
    formula: "=TEXT(XIRR({1,-2,1.13,-0.154},{40000,40365,40730,41095},0.1),\"0.00000000000000E+00\")"
  - id: later_flows_in_listed_order_residual
    description: "later flows accumulate in listed order (residual below the 15 digits)"
    formula: "=TEXT(XIRR({1,-2,1.13,-0.154},{40000,40365,40730,41095},0.1)-VALUE(TEXT(XIRR({1,-2,1.13,-0.154},{40000,40365,40730,41095},0.1),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: unsorted_dates_accepted_digits
    description: "listed order anchors the schedule, earlier dates discount backwards (leading 15 digits)"
    formula: "=TEXT(XIRR({-1,2,-0.3},{40365,40730,40000},0.1),\"0.00000000000000E+00\")"
  - id: unsorted_dates_accepted_residual
    description: "listed order anchors the schedule, earlier dates discount backwards (residual below the 15 digits)"
    formula: "=TEXT(XIRR({-1,2,-0.3},{40365,40730,40000},0.1)-VALUE(TEXT(XIRR({-1,2,-0.3},{40365,40730,40000},0.1),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: gate_skips_positive_bracket
    description: "the positive side is skipped although [0, 0.2] brackets a root"
    formula: "=XIRR({1,-2.63,1.695},{40000,40365,40730},0.1)"
  - id: unsorted_first_pair_anchors
    description: "the first listed pair anchors the schedule"
    formula: "=XIRR({2,-1},{40365,40000},0.1)"
