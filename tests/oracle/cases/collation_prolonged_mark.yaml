suite: collation_prolonged_mark
description: >
  Mac Excel text comparison around the prolonged sound mark: the half-width mark
  U+FF70 after a kana, either mark after a half-width voicing mark, and either mark
  at the start of the string, against full-width, hiragana and voiced twins. Each
  probe returns LT / EQ / GT. The last two probes are start-of-string controls.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: col_prolonged_mark_01
    description: "ﾃﾞｰﾀ (U+FF83 U+FF9E U+FF70 U+FF80) vs データ (U+30C7 U+30FC U+30BF)"
    formula: "=IF(\"ﾃﾞｰﾀ\"<\"データ\",\"LT\",IF(\"ﾃﾞｰﾀ\"=\"データ\",\"EQ\",\"GT\"))"

