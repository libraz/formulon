suite: aggregate
description: SUM / AVERAGE / MIN / MAX / PRODUCT with direct args, ranges, and coercion edge cases
tolerance: { abs: 1.0e-12, rel: 1.0e-12 }
locale: ja-JP
cases:
  # -- SUM -----------------------------------------------------------------
  - id: sum_three_integers
    formula: "=SUM(1,2,3)"

  - id: sum_with_floats
    formula: "=SUM(1.5,2.5,3.0)"

  - id: sum_from_range
    setup: { A1: 10, A2: 20, A3: 30 }
    formula: "=SUM(A1:A3)"

  - id: sum_range_skips_text
    description: "Excel: SUM silently ignores text cells in a range"
    setup: { A1: 10, A2: "text", A3: 30 }
    formula: "=SUM(A1:A3)"

  - id: sum_range_skips_bool
    description: "Excel: SUM skips bool in range (BUT counts bool as direct arg)"
    setup: { A1: 10, A2: true, A3: 30 }
    formula: "=SUM(A1:A3)"

  - id: sum_direct_arg_bool_counted
    description: "Excel: TRUE as direct arg contributes 1"
    formula: "=SUM(10,TRUE,30)"

  - id: sum_range_with_error
    description: "Excel: an error inside a range propagates (#DIV/0! wins)"
    setup: { A1: 10, A2: "=1/0", A3: 30 }
    formula: "=SUM(A1:A3)"

  - id: sum_empty_range
    setup: {}
    formula: "=SUM(A1:A3)"

  - id: sum_mixed_direct_and_range
    setup: { A1: 10, A2: 20 }
    formula: "=SUM(A1:A2,30,40)"

  # -- AVERAGE -------------------------------------------------------------
  - id: average_three_integers
    formula: "=AVERAGE(2,4,6)"

  - id: average_from_range
    setup: { A1: 10, A2: 20, A3: 30 }
    formula: "=AVERAGE(A1:A3)"

  - id: average_range_skips_text
    description: "AVERAGE skips text — denominator drops to 2, not 3"
    setup: { A1: 10, A2: "text", A3: 30 }
    formula: "=AVERAGE(A1:A3)"

  - id: average_range_skips_bool
    setup: { A1: 10, A2: true, A3: 30 }
    formula: "=AVERAGE(A1:A3)"

  - id: average_empty_range_is_div0
    description: "AVERAGE of nothing -> #DIV/0!"
    setup: {}
    formula: "=AVERAGE(A1:A3)"

  - id: average_direct_arg_bool_counted
    description: "Direct-arg TRUE contributes value 1 and count 1: avg(10,1,30)=41/3"
    formula: "=AVERAGE(10,TRUE,30)"

  # -- MIN -----------------------------------------------------------------
  - id: min_three_integers
    formula: "=MIN(3,1,2)"

  - id: min_with_negative
    formula: "=MIN(-5,0,5)"

  - id: min_from_range
    setup: { A1: 30, A2: 10, A3: 20 }
    formula: "=MIN(A1:A3)"

  - id: min_range_skips_text_and_bool
    setup: { A1: 30, A2: "text", A3: true, "A4": 5 }
    formula: "=MIN(A1:A4)"

  - id: min_empty_range_is_zero
    description: "Excel: MIN / MAX of an empty range returns 0 (not #DIV/0!)"
    setup: {}
    formula: "=MIN(A1:A3)"

  # -- MAX -----------------------------------------------------------------
  - id: max_three_integers
    formula: "=MAX(3,1,2)"

  - id: max_with_negative
    formula: "=MAX(-5,-10,-1)"

  - id: max_from_range
    setup: { A1: 10, A2: 30, A3: 20 }
    formula: "=MAX(A1:A3)"

  - id: max_empty_range_is_zero
    setup: {}
    formula: "=MAX(A1:A3)"

  # -- PRODUCT -------------------------------------------------------------
  - id: product_three_integers
    formula: "=PRODUCT(2,3,4)"

  - id: product_with_zero
    formula: "=PRODUCT(2,0,5)"

  - id: product_from_range
    setup: { A1: 2, A2: 3, A3: 4 }
    formula: "=PRODUCT(A1:A3)"

  - id: product_empty_range_is_zero
    description: "Excel: PRODUCT of empty range returns 0"
    setup: {}
    formula: "=PRODUCT(A1:A3)"

  - id: product_range_skips_text
    setup: { A1: 2, A2: "text", A3: 4 }
    formula: "=PRODUCT(A1:A3)"

  # =========================================================================
  # AGGREGATE — multi-mode aggregator with configurable error / nested filter
  # =========================================================================

  - id: aggregate_sum_no_errors
    description: "fn=9 SUM, options=0; basic happy path"
    setup: { A1: 10, A2: 20, A3: 30, A4: 40 }
    formula: "=AGGREGATE(9, 0, A1:A4)"

  - id: aggregate_average_with_error_ignore
    description: "fn=1 AVERAGE, options=2 (ignore errors); range contains #DIV/0!"
    setup: { A1: 10, A2: 20, A3: "=1/0", A4: 40 }
    formula: "=AGGREGATE(1, 2, A1:A4)"

  - id: aggregate_average_with_error_propagate
    description: "fn=1 AVERAGE, options=0; first range error short-circuits"
    setup: { A1: 10, A2: 20, A3: "=1/0", A4: 40 }
    formula: "=AGGREGATE(1, 0, A1:A4)"

  - id: aggregate_large_with_k
    description: "fn=14 LARGE, k=2 — trailing-arg dispatch"
    setup: { A1: 10, A2: 50, A3: 30, A4: 40, A5: 20 }
    formula: "=AGGREGATE(14, 0, A1:A5, 2)"

  - id: aggregate_percentile_inc
    description: "fn=16 PERCENTILE.INC, p=0.5 (median equivalent)"
    setup: { A1: 10, A2: 20, A3: 30, A4: 40, A5: 50 }
    formula: "=AGGREGATE(16, 0, A1:A5, 0.5)"

  - id: aggregate_quartile_inc_q2
    description: "fn=17 QUARTILE.INC, quart=2 (median)"
    setup: { A1: 10, A2: 20, A3: 30, A4: 40, A5: 50 }
    formula: "=AGGREGATE(17, 0, A1:A5, 2)"

  - id: aggregate_function_num_out_of_range
    description: "fn=20 — outside [1,19] -> #VALUE!"
    setup: { A1: 10, A2: 20, A3: 30 }
    formula: "=AGGREGATE(20, 0, A1:A3)"

  - id: aggregate_options_out_of_range
    description: "options=8 — outside [0,7] -> #VALUE!"
    setup: { A1: 10, A2: 20, A3: 30 }
    formula: "=AGGREGATE(9, 8, A1:A3)"

  # -- Nested SUBTOTAL / AGGREGATE bit (options 0..3 exclude, 4..7 keep) --------
  - id: aggregate_nested_fn9_opt0
    description: "AGGREGATE(9,0) over the nested marker mask"
    setup: { A1: 1000, A2: 2000, X1: 1, X2: 2, X3: 4, X4: 8, X5: 16, X8: 128, X9: 256, A3: "=SUBTOTAL(9,X1)", A4: "=0+SUBTOTAL(9,X2)", A5: "=X3", A6: "=LET(x,SUBTOTAL(9,X4),x)", A7: "=AGGREGATE(9,0,X5)", A8: "=A3*32", A9: "=IF(1,64,\"SUBTOTAL(9)\")", A10: "=IF(TRUE,SUBTOTAL(9,X8),0)", A11: "=IF(1,256,AGGREGATE(9,0,X9))" }
    formula: "=AGGREGATE(9,0,A1:A11)"

