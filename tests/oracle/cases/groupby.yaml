suite: groupby
description: GROUPBY dynamic-array group-and-aggregate (Excel 365). Perspectives spanning bare-name aggregator dispatch (spill), LAMBDA aggregator dispatch (spill), unknown-name -> #NAME?, field_headers out-of-range -> #VALUE!, filter_array length mismatch -> #VALUE!, filter_array empty selection -> #VALUE!, and sort_order 0 -> #VALUE!. Inline array arguments are fine; it is a literal 0 in the sort_order slot that Excel rejects, since that argument is a signed column index with no zero member.
tolerance: { abs: 1.0e-12, rel: 1.0e-12 }
locale: ja-JP
cases:
  # =========================================================================
  # Aggregator dispatch, bare name and inline LAMBDA. Both pass
  # field_headers=0 and total_depth=0 and omit sort_order: Excel's
  # sort_order domain is a signed column index with no zero member, so a
  # literal 0 there is rejected with #VALUE! before any of this is
  # reached. That rejection has its own cases below.
  # =========================================================================

  - id: groupby_bare_sum
    description: 'GROUPBY({"A";"B";"A"}, {10;20;30}, SUM, 0, 0) -> 2x2 spill {"A",40;"B",20} (anchor="A")'
    formula: '=GROUPBY({"A";"B";"A"}, {10;20;30}, SUM, 0, 0)'

  - id: groupby_lambda_sum
    description: 'GROUPBY({"A";"B";"A";"C"}, {10;20;30;40}, LAMBDA(v, SUM(v)), 0, 0) -> 3x2 spill (anchor="A")'
    formula: '=GROUPBY({"A";"B";"A";"C"}, {10;20;30;40}, LAMBDA(v, SUM(v)), 0, 0)'

  - id: groupby_sort_order_zero_rejected
    description: 'GROUPBY(..., SUM, 0, 0, 0) -> #VALUE!: sort_order 0 is outside Excel''s signed-column-index domain'
    formula: '=GROUPBY({"A";"B";"A"}, {10;20;30}, SUM, 0, 0, 0)'
    expect: { kind: error, code: "#VALUE!" }

  # =========================================================================
  # Live scalar errors.
  # =========================================================================

  - id: groupby_unknown_name_error
    description: 'GROUPBY({"A";"B"}, {1;2}, NOPE_THIS_IS_NOT_A_FUNCTION, 0, 0, 0) -> #NAME? (unknown aggregator)'
    formula: '=GROUPBY({"A";"B"}, {1;2}, NOPE_THIS_IS_NOT_A_FUNCTION, 0, 0, 0)'

  - id: groupby_field_headers_out_of_range
    description: 'GROUPBY({"A";"B"}, {1;2}, SUM, 5, 0, 0) -> #VALUE! (field_headers must be 0..3)'
    formula: '=GROUPBY({"A";"B"}, {1;2}, SUM, 5, 0, 0)'

  - id: groupby_filter_array_length_mismatch
    description: 'GROUPBY({"A";"B";"A"}, {1;2;3}, SUM, 0, 0, 0, {TRUE;FALSE;TRUE;TRUE}) -> #VALUE! (mask length 4 vs data length 3)'
    formula: '=GROUPBY({"A";"B";"A"}, {1;2;3}, SUM, 0, 0, 0, {TRUE;FALSE;TRUE;TRUE})'

  - id: groupby_filter_array_excludes_all
    description: 'GROUPBY({"A";"B"}, {1;2}, SUM, 0, 0, 0, {FALSE;FALSE}) -> #VALUE! (filter eliminates every row)'
    formula: '=GROUPBY({"A";"B"}, {1;2}, SUM, 0, 0, 0, {FALSE;FALSE})'

  # =========================================================================
  # |total_depth| == 2 requests per-outer-group subtotal rows for a
  # multi-column grouping. Each subtotal row restates its outer key in the
  # first key column and blanks the inner ones; the ja-JP grand total moves
  # from 合計 to 総計 so the two levels stay distinguishable.
  # =========================================================================

  - id: groupby_subtotal_depth_two
    description: 'GROUPBY({"A","x";"A","y";"B","x"}, {10;20;30}, SUM, 0, 2) -> per-outer-group subtotal rows under a 総計 row'
    formula: '=GROUPBY({"A","x";"A","y";"B","x"}, {10;20;30}, SUM, 0, 2)'
