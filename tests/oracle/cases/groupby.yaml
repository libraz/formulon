suite: groupby
description: GROUPBY dynamic-array group-and-aggregate (Excel 365). Six perspectives spanning bare-name aggregator dispatch (spill), LAMBDA aggregator dispatch (spill), unknown-name -> #NAME?, field_headers out-of-range -> #VALUE!, filter_array length mismatch -> #VALUE!, and filter_array empty selection -> #CALC!. The two compact inline-array aggregator formulas are skipped for Mac Excel 16.109, which returns #VALUE! while Formulon implements the documented spill behavior.
tolerance: { abs: 1.0e-12, rel: 1.0e-12 }
locale: ja-JP
cases:
  # =========================================================================
  # Mac Excel 16.109 returns #VALUE! for these compact inline-array
  # aggregator formulas. Unit tests validate Formulon's documented spill
  # behavior.
  # =========================================================================

  - id: groupby_bare_sum
    description: 'GROUPBY({"A";"B";"A"}, {10;20;30}, SUM, 0, 0, 0) -> 2x2 spill {"A",40;"B",20} (anchor="A")'
    formula: '=GROUPBY({"A";"B";"A"}, {10;20;30}, SUM, 0, 0, 0)'

  - id: groupby_lambda_sum
    description: 'GROUPBY({"A";"B";"A";"C"}, {10;20;30;40}, LAMBDA(v, SUM(v)), 0, 0, 0) -> 3x2 spill (anchor="A")'
    formula: '=GROUPBY({"A";"B";"A";"C"}, {10;20;30;40}, LAMBDA(v, SUM(v)), 0, 0, 0)'

  # =========================================================================
  # Live scalar errors.
  # =========================================================================

  - id: groupby_unknown_name_error
    description: 'GROUPBY({"A";"B"}, {1;2}, NOPE_THIS_IS_NOT_A_FUNCTION, 0, 0, 0) -> #NAME? (unknown aggregator)'
    formula: '=GROUPBY({"A";"B"}, {1;2}, NOPE_THIS_IS_NOT_A_FUNCTION, 0, 0, 0)'

  - id: groupby_field_headers_out_of_range
    description: 'GROUPBY({"A";"B"}, {1;2}, SUM, 5, 0, 0) -> #VALUE! (field_headers must be 0..3)'
    formula: '=GROUPBY({"A";"B"}, {1;2}, SUM, 5, 0, 0)'

  - id: groupby_filter_array_length_mismatch
    description: 'GROUPBY({"A";"B";"A"}, {1;2;3}, SUM, 0, 0, 0, {TRUE;FALSE;TRUE;TRUE}) -> #VALUE! (mask length 4 vs data length 3)'
    formula: '=GROUPBY({"A";"B";"A"}, {1;2;3}, SUM, 0, 0, 0, {TRUE;FALSE;TRUE;TRUE})'

  - id: groupby_filter_array_excludes_all
    description: 'GROUPBY({"A";"B"}, {1;2}, SUM, 0, 0, 0, {FALSE;FALSE}) -> #VALUE! (filter eliminates every row)'
    formula: '=GROUPBY({"A";"B"}, {1;2}, SUM, 0, 0, 0, {FALSE;FALSE})'

  # =========================================================================
  # |total_depth| == 2 requests per-outer-group subtotal rows for a
  # multi-column grouping. Formulon does not yet implement nested subtotals
  # and falls back to the grand-total-only layout; this case is skipped via
  # tests/divergence.yaml until the layout is built. Needs macOS golden
  # regeneration once implemented.
  # =========================================================================

  - id: groupby_subtotal_depth_two
    description: 'GROUPBY({"A","x";"A","y";"B","x"}, {10;20;30}, SUM, 0, 2) -> per-outer-group subtotals (not yet implemented; falls back to grand total)'
    formula: '=GROUPBY({"A","x";"A","y";"B","x"}, {10;20;30}, SUM, 0, 2)'
