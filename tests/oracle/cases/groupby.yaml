suite: groupby
description: GROUPBY dynamic-array group-and-aggregate (Excel 365). Perspectives spanning bare-name aggregator dispatch (spill), LAMBDA aggregator dispatch (spill), unknown-name -> #NAME?, field_headers out-of-range -> #VALUE!, filter_array length mismatch -> #VALUE!, filter_array empty selection -> #VALUE!, and sort_order 0 -> #VALUE!. Inline array arguments are fine; it is a literal 0 in the sort_order slot that Excel rejects, since that argument is a signed column index with no zero member.
tolerance: { abs: 1.0e-12, rel: 1.0e-12 }
locale: ja-JP
cases:
  # =========================================================================
  # Aggregator dispatch, bare name and inline LAMBDA. Both pass
  # field_headers=0 and total_depth=0 and omit sort_order: Excel's
  # sort_order domain is a signed column index with no zero member, so a
  # literal 0 there is rejected with #VALUE! before any of this is
  # reached. That rejection has its own cases below.
  # =========================================================================

  - id: groupby_bare_sum
    description: 'GROUPBY({"A";"B";"A"}, {10;20;30}, SUM, 0, 0) -> 2x2 spill {"A",40;"B",20} (anchor="A")'
    formula: '=GROUPBY({"A";"B";"A"}, {10;20;30}, SUM, 0, 0)'

  - id: groupby_lambda_sum
    description: 'GROUPBY({"A";"B";"A";"C"}, {10;20;30;40}, LAMBDA(v, SUM(v)), 0, 0) -> 3x2 spill (anchor="A")'
    formula: '=GROUPBY({"A";"B";"A";"C"}, {10;20;30;40}, LAMBDA(v, SUM(v)), 0, 0)'

  - id: groupby_sort_order_zero_rejected
    description: 'GROUPBY(..., SUM, 0, 0, 0) -> #VALUE!: sort_order 0 is outside Excel''s signed-column-index domain'
    formula: '=GROUPBY({"A";"B";"A"}, {10;20;30}, SUM, 0, 0, 0)'
    expect: { kind: error, code: "#VALUE!" }

  # =========================================================================
  # Live scalar errors.
  # =========================================================================

  - id: groupby_unknown_name_error
    description: 'GROUPBY({"A";"B"}, {1;2}, NOPE_THIS_IS_NOT_A_FUNCTION, 0, 0, 0) -> #NAME? (unknown aggregator)'
    formula: '=GROUPBY({"A";"B"}, {1;2}, NOPE_THIS_IS_NOT_A_FUNCTION, 0, 0, 0)'

  - id: groupby_field_headers_out_of_range
    description: 'GROUPBY({"A";"B"}, {1;2}, SUM, 5, 0, 0) -> #VALUE! (field_headers must be 0..3)'
    formula: '=GROUPBY({"A";"B"}, {1;2}, SUM, 5, 0, 0)'

  - id: groupby_filter_array_length_mismatch
    description: 'GROUPBY({"A";"B";"A"}, {1;2;3}, SUM, 0, 0, 0, {TRUE;FALSE;TRUE;TRUE}) -> #VALUE! (mask length 4 vs data length 3)'
    formula: '=GROUPBY({"A";"B";"A"}, {1;2;3}, SUM, 0, 0, 0, {TRUE;FALSE;TRUE;TRUE})'

  - id: groupby_filter_array_excludes_all
    description: 'GROUPBY({"A";"B"}, {1;2}, SUM, 0, 0, 0, {FALSE;FALSE}) -> #VALUE! (filter eliminates every row)'
    formula: '=GROUPBY({"A";"B"}, {1;2}, SUM, 0, 0, 0, {FALSE;FALSE})'

  # =========================================================================
  # |total_depth| == 2 requests per-outer-group subtotal rows for a
  # multi-column grouping. Each subtotal row restates its outer key in the
  # first key column and blanks the inner ones; the ja-JP grand total moves
  # from 合計 to 総計 so the two levels stay distinguishable.
  # =========================================================================

  - id: groupby_subtotal_depth_two
    description: 'GROUPBY({"A","x";"A","y";"B","x"}, {10;20;30}, SUM, 0, 2) -> per-outer-group subtotal rows under a 総計 row'
    formula: '=GROUPBY({"A","x";"A","y";"B","x"}, {10;20;30}, SUM, 0, 2)'

  # total_depth omitted: a grand total at the bottom.
  - id: groupby_total_depth_default_grand_total
    formula: '=GROUPBY({"a";"a";"b"},{1;2;3},SUM)'

  # field_headers omitted: a text first row over non-text data is consumed
  # as headers and not shown.
  - id: groupby_field_headers_auto_header_row
    setup:
      A1: k
      B1: v
      A2: b
      B2: 1
      A3: a
      B3: 2
      A4: b
      B4: 3
    formula: '=GROUPBY(A1:A4,B1:B4,SUM)'

  - id: groupby_field_headers_auto_no_header_row
    setup:
      A1: b
      B1: 1
      A2: a
      B2: 2
      A3: b
      B3: 3
    formula: '=GROUPBY(A1:A3,B1:B3,SUM)'

  # sort_order omitted: ascending on the first key column.
  - id: groupby_sort_order_omitted_text_keys_ascending
    formula: '=GROUPBY({"b";"a";"c";"a"},{1;2;3;4},SUM,0,0)'

  - id: groupby_sort_order_omitted_number_keys_ascending
    formula: '=GROUPBY({3;1;2},{1;2;3},SUM,0,0)'

  # GROUPBY defaults and header handling, placeholder text cells, key ordering.
  - id: groupby_measured_fh0_hdr
    setup:
      A1: "k"
      B1: "v"
      A2: "b"
      B2: 1
      A3: "a"
      B3: 2
      A4: "b"
      B4: 3
    formula: '=GROUPBY(A1:A4,B1:B4,SUM,0)'

  - id: groupby_measured_fh0_nohdr
    setup:
      A1: "k"
      B1: "v"
      A2: "b"
      B2: 1
      A3: "a"
      B3: 2
      A4: "b"
      B4: 3
    formula: '=GROUPBY(A2:A4,B2:B4,SUM,0)'

  - id: groupby_measured_fh1_hdr
    setup:
      A1: "k"
      B1: "v"
      A2: "b"
      B2: 1
      A3: "a"
      B3: 2
      A4: "b"
      B4: 3
    formula: '=GROUPBY(A1:A4,B1:B4,SUM,1)'

  - id: groupby_measured_fh1_nohdr
    setup:
      A1: "k"
      B1: "v"
      A2: "b"
      B2: 1
      A3: "a"
      B3: 2
      A4: "b"
      B4: 3
    formula: '=GROUPBY(A2:A4,B2:B4,SUM,1)'

  - id: groupby_measured_fh2_hdr
    setup:
      A1: "k"
      B1: "v"
      A2: "b"
      B2: 1
      A3: "a"
      B3: 2
      A4: "b"
      B4: 3
    formula: '=GROUPBY(A1:A4,B1:B4,SUM,2)'

  - id: groupby_measured_fh2_nohdr
    setup:
      A1: "k"
      B1: "v"
      A2: "b"
      B2: 1
      A3: "a"
      B3: 2
      A4: "b"
      B4: 3
    formula: '=GROUPBY(A2:A4,B2:B4,SUM,2)'

  - id: groupby_measured_fh3_hdr
    setup:
      A1: "k"
      B1: "v"
      A2: "b"
      B2: 1
      A3: "a"
      B3: 2
      A4: "b"
      B4: 3
    formula: '=GROUPBY(A1:A4,B1:B4,SUM,3)'

  - id: groupby_measured_fh3_nohdr
    setup:
      A1: "k"
      B1: "v"
      A2: "b"
      B2: 1
      A3: "a"
      B3: 2
      A4: "b"
      B4: 3
    formula: '=GROUPBY(A2:A4,B2:B4,SUM,3)'

  - id: groupby_measured_auto_numhdr
    setup:
      A1: "k"
      B1: 5
      A2: "a"
      B2: 1
      A3: "b"
      B3: 2
    formula: '=GROUPBY(A1:A3,B1:B3,SUM)'

  - id: groupby_measured_auto_textvals
    setup:
      A1: "k"
      B1: "v"
      A2: "a"
      B2: "x"
      A3: "b"
      B3: "y"
    formula: '=GROUPBY(A1:A3,B1:B3,COUNTA)'

  - id: groupby_measured_auto_rowfield_num
    setup:
      A1: 1
      B1: "v"
      A2: 2
      B2: 1
      A3: 3
      B3: 2
    formula: '=GROUPBY(A1:A3,B1:B3,SUM)'

  - id: groupby_measured_auto_2valcols
    setup:
      A1: "k"
      B1: "v1"
      C1: "v2"
      A2: "a"
      B2: 1
      C2: 10
      A3: "b"
      B3: 2
      C3: 20
    formula: '=GROUPBY(A1:A3,B1:C3,SUM)'

  - id: groupby_measured_auto_2valcols_mixed
    setup:
      A1: "k"
      B1: "v1"
      C1: 5
      A2: "a"
      B2: 1
      C2: 10
      A3: "b"
      B3: 2
      C3: 20
    formula: '=GROUPBY(A1:A3,B1:C3,SUM)'

  - id: groupby_measured_auto_2keycols
    setup:
      A1: "k1"
      B1: "k2"
      C1: "v"
      A2: "b"
      B2: "y"
      C2: 1
      A3: "a"
      B3: "z"
      C3: 2
      A4: "a"
      B4: "y"
      C4: 3
    formula: '=GROUPBY(A1:B4,C1:C4,SUM)'

  - id: groupby_measured_sort_2keys
    setup:
      A2: "b"
      B2: "y"
      C2: 1
      A3: "a"
      B3: "z"
      C3: 2
      A4: "a"
      B4: "y"
      C4: 3
    formula: '=GROUPBY(A2:B4,C2:C4,SUM,0,0)'

  - id: groupby_measured_sort_2keys_total
    setup:
      A2: "b"
      B2: "y"
      C2: 1
      A3: "a"
      B3: "z"
      C3: 2
      A4: "a"
      B4: "y"
      C4: 3
    formula: '=GROUPBY(A2:B4,C2:C4,SUM,0,2)'

  - id: groupby_measured_sort_mixed_types
    formula: '=GROUPBY({"b";2;TRUE;"a";1},{1;2;3;4;5},SUM,0,0)'

  - id: groupby_measured_sort_case
    formula: '=GROUPBY({"b";"B";"a";"A"},{1;2;3;4},SUM,0,0)'

  - id: gb2_lit_total
    formula: '=GROUPBY({"b","y";"a","z";"a","y"},{1;2;3},SUM,0)'

  - id: gb2_lit_total_type
    formula: '=TYPE(INDEX(GROUPBY({"b","y";"a","z";"a","y"},{1;2;3},SUM,0),4,2))'

  - id: gb2_lit_total_len
    formula: '=ISBLANK(INDEX(GROUPBY({"b","y";"a","z";"a","y"},{1;2;3},SUM,0),4,2))'
