suite: munit
description: MUNIT(n) — n-by-n identity matrix; spill array reduced to scalar via INDEX / SUMPRODUCT for oracle capture.
tolerance: { abs: 1.0e-12, rel: 1.0e-12 }
locale: ja-JP
cases:
  # =========================================================================
  # MUNIT(n) -> n x n identity matrix. Result is a spill array; each case
  # below collapses the array to a scalar so xlwings can capture an anchor
  # value the oracle can compare 1-bit.
  # =========================================================================

  - id: munit_index_diagonal
    description: "Diagonal element (2,2) of MUNIT(3) is 1"
    formula: '=INDEX(MUNIT(3), 2, 2)'

  - id: munit_index_off_diagonal
    description: "Off-diagonal element (1,3) of MUNIT(3) is 0"
    formula: '=INDEX(MUNIT(3), 1, 3)'

  - id: munit_size_one
    description: "MUNIT(1) is the 1x1 identity {{1}}"
    formula: '=INDEX(MUNIT(1), 1, 1)'

  - id: munit_fractional_truncates
    description: "MUNIT(3.7) truncates to 3, so element (3,3) exists and is 1"
    formula: '=INDEX(MUNIT(3.7), 3, 3)'

  - id: munit_sumproduct_trace
    description: "SUMPRODUCT(MUNIT(4)) collapses to 4 (sum of identity = n)"
    formula: '=SUMPRODUCT(MUNIT(4))'

  - id: munit_zero_value_error
    description: "MUNIT(0) -> #VALUE! (non-positive dimension)"
    formula: '=MUNIT(0)'

  - id: munit_negative_value_error
    description: "MUNIT(-2) -> #VALUE! (negative dimension)"
    formula: '=MUNIT(-2)'

  - id: munit_text_value_error
    description: "MUNIT(\"hello\") -> #VALUE! (text fails number coercion)"
    formula: '=MUNIT("hello")'
