    setup: { B1: "=NA()" }
    formula: "=MDETERM(B1)"
  - id: mdeterm_arg1_blank_cell
    formula: "=MDETERM(B2)"
  - id: mirr_arg1_na_cell
    setup: { B1: "=NA()" }
    formula: "=MIRR(B1,0.1,0.1)"
  - id: mirr_arg1_blank_cell
    formula: "=MIRR(B2,0.1,0.1)"
  - id: mirr_arg2_na_cell
    setup: { B1: "=NA()" }
    formula: "=MIRR({-1000, 500, 700},B1,0.1)"
  - id: mirr_arg2_blank_cell
    formula: "=MIRR({-1000, 500, 700},B2,0.1)"
  - id: mirr_arg3_na_cell
    setup: { B1: "=NA()" }
    formula: "=MIRR({-1000, 500, 700},0.1,B1)"
  - id: mirr_arg3_blank_cell
    formula: "=MIRR({-1000, 500, 700},0.1,B2)"
  - id: mirr_arg2_array_lifted
    formula: "=INDEX(MIRR({-1000, 500, 700},{0.1,0.1},0.1),2)"
  - id: mirr_arg2_zero
    formula: "=MIRR({-1000, 500, 700},0,0.1)"
  - id: mirr_arg2_negative
    formula: "=MIRR({-1000, 500, 700},-0.1,0.1)"
