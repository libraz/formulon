suite: locale_tokens
description: >
  Locale-dependent spellings Excel accepts or produces: date format tokens
  across every month and weekday, General and colour keywords, AM/PM
  designators, currency text parsing, error names in text output, and
  formula text separators. Each case is captured under every target, so a
  token another locale ignores still records what it does here.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: months_mmmm
    formula: '=TEXTJOIN("|",FALSE,TEXT(DATE(2024,SEQUENCE(12),1),"mmmm"))'
  - id: weekdays_mmmm
    formula: '=TEXTJOIN("|",FALSE,TEXT(DATE(2024,1,SEQUENCE(7)),"mmmm"))'
