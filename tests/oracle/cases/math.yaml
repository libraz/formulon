  # The same decimal midpoint through distinct Excel input paths.
  - id: mround_provenance_arithmetic_6_05
    description: "Arithmetic expression supplies the decimal midpoint"
    formula: "=MROUND(6+0.05,0.1)"

  - id: mround_provenance_value_6_05
    description: "VALUE() supplies both decimal midpoint arguments"
    formula: "=MROUND(VALUE(\"6.05\"),VALUE(\"0.1\"))"

  - id: mround_provenance_cell_reference_6_05
    description: "Cell references supply the decimal midpoint arguments"
    setup: { A1: 6.05, B1: 0.1 }
    formula: "=MROUND(A1,B1)"

  - id: mround_negative
    formula: "=MROUND(-10,-3)"

  - id: mround_sign_mismatch_is_num
    formula: "=MROUND(10,-3)"

  - id: mround_sign_mismatch_negative_is_num
    description: "Opposite-sign negative number and positive multiple"
    formula: "=MROUND(-10,3)"

  - id: mround_zero_zero
    description: "Zero number and zero multiple"
    formula: "=MROUND(0,0)"

  - id: mround_multiple_zero
    description: "MROUND: multiple=0 returns 0 (no #DIV/0!)"
    formula: "=MROUND(5,0)"

  # Boolean relationship probes. The captured booleans document whether the
  # decimal-significance form agrees with ROUND at each representative scale.
  - id: mround_equals_round_6_05
    description: "Compare MROUND(x,10^-d) with ROUND(x,d)"
    formula: "=MROUND(6.05,10^-1)=ROUND(6.05,1)"

  - id: mround_equals_round_7_05
    description: "Compare MROUND(x,10^-d) with ROUND(x,d)"
    formula: "=MROUND(7.05,10^-1)=ROUND(7.05,1)"

  - id: mround_equals_round_1_005
    description: "Compare MROUND(x,10^-d) with ROUND(x,d)"
    formula: "=MROUND(1.005,10^-2)=ROUND(1.005,2)"

  - id: mround_equals_round_0_145
    description: "Compare MROUND(x,10^-d) with ROUND(x,d)"
    formula: "=MROUND(0.145,10^-2)=ROUND(0.145,2)"

  - id: mround_equals_round_neg_6_05
    description: "Compare the same-sign negative form with ROUND"
    formula: "=MROUND(-6.05,-(10^-1))=ROUND(-6.05,1)"

  - id: mround_equals_round_neg_7_05
    description: "Compare the same-sign negative form with ROUND"
    formula: "=MROUND(-7.05,-(10^-1))=ROUND(-7.05,1)"

  - id: mround_equals_round_neg_1_005
    description: "Compare the same-sign negative form with ROUND"
    formula: "=MROUND(-1.005,-(10^-2))=ROUND(-1.005,2)"

  - id: mround_equals_round_neg_0_145
    description: "Compare the same-sign negative form with ROUND"
    formula: "=MROUND(-0.145,-(10^-2))=ROUND(-0.145,2)"

  - id: mround_equals_round_near_half_below
    description: "Compare the below-half control with ROUND at zero digits"
    formula: "=MROUND(0.49999999999999,10^-0)=ROUND(0.49999999999999,0)"

  - id: mround_equals_round_near_half_above
    description: "Compare the above-half control with ROUND at zero digits"
    formula: "=MROUND(0.50000000000001,10^-0)=ROUND(0.50000000000001,0)"

  - id: mround_equals_round_7_1
    description: "Compare an exact decimal multiple with ROUND"
    formula: "=MROUND(7.1,10^-1)=ROUND(7.1,1)"

  - id: ceiling_math_default_sig
    formula: "=CEILING.MATH(4.3)"

  - id: ceiling_math_neg_default_mode
    description: "Default mode=0 rounds negatives toward +inf (toward zero)"
    formula: "=CEILING.MATH(-4.3)"

  - id: ceiling_math_neg_mode_away
    description: "mode != 0 rounds negatives away from zero (toward -inf)"
    formula: "=CEILING.MATH(-4.3,1,1)"

  - id: ceiling_math_sig_neg_uses_abs
    description: "Negative significance is allowed in *.MATH; uses |sig|"
    formula: "=CEILING.MATH(4.3,-2)"

  - id: ceiling_math_positive_explicit_sig
    description: "Positive value with explicit significance=2 -> 6"
    formula: "=CEILING.MATH(4.3,2)"

  - id: floor_math_default_sig
    formula: "=FLOOR.MATH(4.7)"

  - id: floor_math_neg_default_mode
    description: "Default mode=0 rounds negatives toward -inf (away from zero)"
    formula: "=FLOOR.MATH(-4.3)"

  - id: floor_math_neg_mode_toward_zero
    description: "mode != 0 rounds negatives toward zero (toward +inf)"
    formula: "=FLOOR.MATH(-4.3,1,1)"

  - id: floor_math_positive_explicit_sig
    description: "Positive value with explicit significance=2 -> 4"
    formula: "=FLOOR.MATH(4.7,2)"

  - id: floor_math_sig_neg_uses_abs
    description: "Negative significance uses |sig| in *.MATH variant"
    formula: "=FLOOR.MATH(4.7,-2)"

  # -- SUMSQ / SUMX2PY2 / SUMX2MY2 / SUMXMY2 / SERIESSUM --------------------
  - id: sumsq_basic
    formula: "=SUMSQ(3, 4)"

  - id: sumsq_range
    setup: { A1: 3, A2: 4, A3: 5 }
    formula: "=SUMSQ(A1:A3)"

  - id: sumsq_skips_text_in_range
    description: "Text cells in a range argument are dropped silently"
    setup: { A1: 3, A2: "x", A3: 5 }
    formula: "=SUMSQ(A1:A3)"

  - id: sumsq_direct_text_is_value
    description: "A non-numeric direct text argument surfaces #VALUE!"
    formula: "=SUMSQ(3, \"abc\")"

  - id: sumsq_single_zero
    description: "Sum of squares of a single zero is zero"
    formula: "=SUMSQ(0)"

  - id: sumx2py2_basic
    description: "Σ (x² + y²) over {1,2,3} and {4,5,6} = 91"
    formula: "=SUMX2PY2({1;2;3}, {4;5;6})"

  - id: sumx2my2_basic
    description: "Σ (x² - y²) over {1,2,3} and {4,5,6} = -63"
    formula: "=SUMX2MY2({1;2;3}, {4;5;6})"

  - id: sumxmy2_basic
    description: "Σ (x - y)² over {1,2,3} and {4,5,6} = 27"
    formula: "=SUMXMY2({1;2;3}, {4;5;6})"

  - id: sumx2py2_shape_mismatch_is_na
    description: "Mismatched rectangles return #N/A"
    formula: "=SUMX2PY2({1;2;3}, {4;5})"

  - id: sumx2py2_single_point
    description: "Single-element arrays: 3^2 + 4^2 = 25"
    formula: "=SUMX2PY2({3}, {4})"

  - id: sumx2py2_zero_arrays
    description: "All zeros yields zero"
    formula: "=SUMX2PY2({0;0;0}, {0;0;0})"

  - id: sumx2py2_negatives
    description: "Squaring eliminates sign: (-1)^2 + 2^2 + (-3)^2 + 4^2 = 30"
    formula: "=SUMX2PY2({-1;-3}, {2;4})"

  - id: sumx2my2_single_point
    description: "Single-element arrays: 2² - 5² = -21"
    formula: "=SUMX2MY2({2}, {5})"

  - id: sumx2my2_shape_mismatch_is_na
    description: "Mismatched rectangles return #N/A"
    formula: "=SUMX2MY2({1;2;3}, {4;5})"

  - id: sumx2my2_equal_arrays_zero
    description: "Identical arrays cancel: each x^2 - y^2 term is 0"
    formula: "=SUMX2MY2({1;2;3}, {1;2;3})"

  - id: sumx2my2_swap_negates
    description: "Swapping arguments negates the result: 63 (vs basic -63)"
    formula: "=SUMX2MY2({4;5;6}, {1;2;3})"

  - id: sumxmy2_single_point
    description: "Single-element arrays: (5-3)^2 = 4"
    formula: "=SUMXMY2({5}, {3})"

  - id: sumxmy2_shape_mismatch_is_na
    description: "Mismatched rectangles return #N/A"
    formula: "=SUMXMY2({1;2}, {3})"

  - id: sumxmy2_zero_arrays
    description: "All zeros yields zero"
    formula: "=SUMXMY2({0;0}, {0;0})"

  - id: sumxmy2_negatives
    description: "Squared diff is sign-insensitive: ((-1)-1)^2 + ((-2)-2)^2 = 4 + 16 = 20"
    formula: "=SUMXMY2({-1;-2}, {1;2})"

  - id: seriessum_binary_polynomial
    description: "Σ xⁱ for i=0..3 with x=2 and unit coefficients -> 15"
    formula: "=SERIESSUM(2, 0, 1, {1;1;1;1})"

  - id: seriessum_step_two
    description: "2² + 2⁴ = 20"
    formula: "=SERIESSUM(2, 2, 2, {1;1})"

  - id: seriessum_x_equals_one
    description: "x=1 makes every power one: sum is just Σ coefficients"
    formula: "=SERIESSUM(1, 0, 1, {5;5;5})"

  - id: seriessum_negative_x
    description: "x=-1 with unit coefficients alternates: 1 + (-1) + 1 + (-1) = 0"
    formula: "=SERIESSUM(-1, 0, 1, {1;1;1;1})"

  - id: seriessum_offset_initial_power
    description: "Initial power n=2 with x=3: 1*3^2 + 1*3^3 = 9 + 27 = 36"
    formula: "=SERIESSUM(3, 2, 1, {1;1})"

  # Every case above passes the coefficients as an array literal. The
  # argument is documented as a range or array, and what a bare scalar
  # there means -- a one-term series, or a rejected argument -- is not
  # something the array cases can answer. The range spelling is captured
  # beside it so the three forms can be compared as one set.
  - id: seriessum_scalar_coefficient
    description: "A bare scalar coefficient: 1*2^0 read as a one-term series?"
    formula: "=SERIESSUM(2, 0, 1, 1)"

  - id: seriessum_scalar_coefficient_nonunit
    description: "A bare non-unit scalar coefficient with a non-zero initial power"
    formula: "=SERIESSUM(3, 2, 1, 5)"

  - id: seriessum_single_cell_range_coefficient
    description: "A one-cell range coefficient, the spelling between scalar and array"
    setup: { A1: 5 }
    formula: "=SERIESSUM(3, 2, 1, A1)"

  - id: seriessum_range_coefficients
    description: "A multi-cell range coefficient: the range spelling of {1;1}"
    setup: { A1: 1, A2: 1 }
    formula: "=SERIESSUM(3, 2, 1, A1:A2)"

  - id: seriessum_scalar_text_coefficient
    description: "A text coefficient in the scalar position"
    formula: "=SERIESSUM(2, 0, 1, \"x\")"
