suite: math
description: ABS / SIGN / INT / TRUNC / MOD / ROUND* / POWER / SQRT / EXP / LN / LOG / LOG10 / PI / VALUE
tolerance: { abs: 1.0e-12, rel: 1.0e-12 }
locale: ja-JP
cases:
  # -- ABS -----------------------------------------------------------------
  - id: abs_positive
    formula: "=ABS(5)"

  - id: abs_negative
    formula: "=ABS(-5)"

  - id: abs_zero
    formula: "=ABS(0)"

  - id: abs_fraction
    formula: "=ABS(-3.14)"

  # -- SIGN ----------------------------------------------------------------
  - id: sign_positive
    formula: "=SIGN(42)"

  - id: sign_negative
    formula: "=SIGN(-42)"

  - id: sign_zero
    formula: "=SIGN(0)"

  - id: sign_of_bool_true
    description: "TRUE coerces to 1, so SIGN(TRUE) = 1"
    formula: "=SIGN(TRUE)"

  # -- INT (floor toward -inf) --------------------------------------------
  - id: int_positive_fraction
    formula: "=INT(3.7)"

  - id: int_negative_fraction
    description: "INT rounds toward -inf: INT(-3.7) = -4, not -3"
    formula: "=INT(-3.7)"

  - id: int_already_integer
    formula: "=INT(5)"

  - id: int_negative_already_integer
    description: "INT of a negative integer is itself"
    formula: "=INT(-5)"

  # -- TRUNC (truncate toward zero) ---------------------------------------
  - id: trunc_positive_fraction
    formula: "=TRUNC(3.7)"

  - id: trunc_negative_fraction
    description: "TRUNC rounds toward 0: TRUNC(-3.7) = -3 (not -4)"
    formula: "=TRUNC(-3.7)"

  - id: trunc_with_digits
    formula: "=TRUNC(3.14159,2)"

  - id: trunc_negative_digits
    description: "Negative second arg truncates to tens place: TRUNC(1234,-2) = 1200"
    formula: "=TRUNC(1234,-2)"

  - id: trunc_default_digits_zero
    description: "Single-arg TRUNC behaves like digits=0"
    formula: "=TRUNC(5.99)"

  # -- MOD -----------------------------------------------------------------
  - id: mod_positive
    formula: "=MOD(10,3)"

  - id: mod_exact_division
    formula: "=MOD(10,5)"

  - id: mod_negative_dividend
    description: "Excel MOD sign follows divisor: MOD(-10,3) = 2"
    formula: "=MOD(-10,3)"

  - id: mod_zero_divisor_is_div0
    formula: "=MOD(5,0)"

  - id: mod_negative_divisor
    description: "Excel MOD result has same sign as divisor: MOD(10,-3) = -2"
    formula: "=MOD(10,-3)"

  # -- ROUND / ROUNDUP / ROUNDDOWN ----------------------------------------
  - id: round_half_up
    description: "Excel: banker's rounding NOT used; .5 always rounds away from zero"
    formula: "=ROUND(2.5,0)"

  - id: round_neg_half
    formula: "=ROUND(-2.5,0)"

  - id: round_to_two_digits
    formula: "=ROUND(3.14159,2)"

  - id: round_to_neg_digits
    description: "Negative digits round to tens/hundreds"
    formula: "=ROUND(1234.5,-2)"

  - id: round_zero_digits_default
    description: "Zero digits rounds to nearest integer (away from zero on tie)"
    formula: "=ROUND(2.49,0)"

  - id: roundup_positive
    description: "ROUNDUP rounds away from zero"
    formula: "=ROUNDUP(3.14,1)"

  - id: roundup_negative
    formula: "=ROUNDUP(-3.14,1)"

  - id: roundup_zero_digits
    description: "Zero digits rounds away from zero to integer: 2.1 -> 3"
    formula: "=ROUNDUP(2.1,0)"

  - id: roundup_negative_digits
    description: "Negative digits rounds up to next ten: 123 -> 130"
    formula: "=ROUNDUP(123,-1)"

  - id: roundup_zero_input
    description: "Zero is its own ceiling regardless of digits"
    formula: "=ROUNDUP(0,2)"

  - id: rounddown_positive
    formula: "=ROUNDDOWN(3.19,1)"

  - id: rounddown_negative
    formula: "=ROUNDDOWN(-3.19,1)"

  - id: rounddown_zero_digits
    description: "Zero digits truncates toward zero to integer: 2.9 -> 2"
    formula: "=ROUNDDOWN(2.9,0)"

  - id: rounddown_negative_digits
    description: "Negative digits truncates toward zero at the tens place"
    formula: "=ROUNDDOWN(178,-1)"

  - id: rounddown_zero_input
    description: "Zero rounds down to zero regardless of digits"
    formula: "=ROUNDDOWN(0,2)"

  # -- POWER / SQRT -------------------------------------------------------
  - id: power_square
    formula: "=POWER(5,2)"

  - id: power_fraction
    formula: "=POWER(2,0.5)"

  - id: power_negative_base_int_exp
    formula: "=POWER(-2,3)"

  - id: power_zero_to_zero
    description: "Excel treats POWER(0,0) as indeterminate -> #NUM!, diverging from IEEE-754 pow (which returns 1)"
    formula: "=POWER(0,0)"

  - id: power_negative_base_fractional_exp_is_num
    description: "Real-valued root of a negative base is undefined -> #NUM!"
    formula: "=POWER(-4,0.5)"

  - id: sqrt_of_nine
    formula: "=SQRT(9)"

  - id: sqrt_of_zero
    formula: "=SQRT(0)"

  - id: sqrt_of_negative_is_num
    formula: "=SQRT(-1)"

  - id: sqrt_fractional_input
    description: "SQRT(2) is the canonical irrational example"
    formula: "=SQRT(2)"

  # -- EXP / LN / LOG / LOG10 ---------------------------------------------
  - id: exp_of_zero
    formula: "=EXP(0)"

  - id: exp_of_one
    formula: "=EXP(1)"

  - id: exp_of_negative_one
    description: "EXP(-1) = 1/e ~= 0.3678794411714423"
    formula: "=EXP(-1)"

  - id: exp_of_two
    description: "EXP(2) = e^2 ~= 7.38905609893065"
    formula: "=EXP(2)"

  - id: ln_of_one
    formula: "=LN(1)"

  - id: ln_of_e
    formula: "=LN(EXP(1))"

  - id: ln_of_zero_is_num
    formula: "=LN(0)"

  - id: ln_of_negative_is_num
    description: "Logarithm of a negative real is undefined -> #NUM!"
    formula: "=LN(-1)"

  - id: ln_fractional_input
    description: "LN of 0.5 is -ln(2) ~= -0.6931471805599453"
    formula: "=LN(0.5)"

  - id: log_default_base_10
    description: "LOG(n) with no base defaults to base 10"
    formula: "=LOG(1000)"

  - id: log_explicit_base_2
    formula: "=LOG(8,2)"

  - id: log_of_one_is_zero
    description: "log_b(1) = 0 for any base"
    formula: "=LOG(1)"

  - id: log_of_zero_is_num
    description: "LOG(0) is undefined -> #NUM!"
    formula: "=LOG(0)"

  - id: log_base_one_is_div0
    description: "Logarithm with base 1 divides by ln(1)=0 -> #DIV/0!"
    formula: "=LOG(10,1)"

  - id: log10_of_100
    formula: "=LOG10(100)"

  - id: log10_of_one
    description: "LOG10(1) = 0"
    formula: "=LOG10(1)"

  - id: log10_of_zero_is_num
    description: "LOG10(0) is undefined -> #NUM!"
    formula: "=LOG10(0)"

  - id: log10_of_negative_is_num
    description: "LOG10(-1) is undefined for real numbers -> #NUM!"
    formula: "=LOG10(-1)"

  - id: log10_fractional_input
    description: "LOG10(0.1) = -1"
    formula: "=LOG10(0.1)"

  # -- Empty-string function-arg coercion ---------------------------------
  # Probe whether Excel rejects "" in numeric function contexts. Used to
  # decide whether coerce_to_number("") returns 0 or #VALUE! for the
  # function-arg path (separate from the arithmetic-operator path tested
  # in operators.yaml).
  - id: exp_of_empty_string
    formula: "=EXP(\"\")"

  - id: sign_of_empty_string
    formula: "=SIGN(\"\")"

  - id: abs_of_empty_string
    formula: "=ABS(\"\")"

  - id: int_of_empty_string
    formula: "=INT(\"\")"

  - id: sqrt_of_empty_string
    formula: "=SQRT(\"\")"

  # -- PI ------------------------------------------------------------------
  - id: pi_value
    formula: "=PI()"

  - id: pi_times_two
    formula: "=PI()*2"

  - id: pi_divided_by_two
    description: "PI()/2 ~= 1.5707963267948966 (quarter-turn radians)"
    formula: "=PI()/2"

  - id: pi_squared
    description: "PI()^2 ~= 9.869604401089358"
    formula: "=PI()^2"

  - id: pi_in_round
    description: "ROUND of PI to 5 digits exercises PI() inside another call"
    formula: "=ROUND(PI(),5)"

  - id: pi_arithmetic_subtract
    description: "PI()-3 ~= 0.14159265358979 (irrational tail probe)"
    formula: "=PI()-3"

  # -- VALUE ---------------------------------------------------------------
  - id: value_of_numeric_string
    formula: "=VALUE(\"42\")"

  - id: value_of_float_string
    formula: "=VALUE(\"3.14\")"

  - id: value_of_non_numeric_text
    formula: "=VALUE(\"hello\")"

  - id: value_of_percent_string
    description: "Percent suffix is recognised: VALUE(\"50%\") = 0.5"
    formula: "=VALUE(\"50%\")"

  - id: value_of_negative_string
    description: "Negative-number string: VALUE(\"-3.14\") = -3.14"
    formula: "=VALUE(\"-3.14\")"

  # -- CEILING / FLOOR / MROUND / *.MATH ----------------------------------
  - id: ceiling_pos
    formula: "=CEILING(4.3,1)"

  - id: ceiling_neg_same_sign
    description: "Legacy CEILING with matching negative significance"
    formula: "=CEILING(-4.3,-1)"

  - id: ceiling_sign_mismatch_rounds_toward_plus_inf
    description: |
      Excel 365 Mac: legacy CEILING with opposite signs rounds toward
      +infinity (math ceil), NOT #NUM! as documented for pre-365 builds.
    formula: "=CEILING(-4.3,1)"

  - id: ceiling_sig_zero
    description: "Legacy CEILING: significance=0 short-circuits to 0"
    formula: "=CEILING(4.3,0)"

  - id: ceiling_sig_two
    description: "Significance > 1 rounds to next multiple of 2"
    formula: "=CEILING(4.3,2)"

  - id: floor_pos
    formula: "=FLOOR(4.7,1)"

  - id: floor_neg_same_sign
    formula: "=FLOOR(-4.3,-1)"

  - id: floor_sign_mismatch_rounds_toward_minus_inf
    description: |
      Excel 365 Mac: legacy FLOOR with opposite signs rounds toward
      -infinity (math floor), NOT #NUM! as documented for pre-365 builds.
    formula: "=FLOOR(-4.3,1)"

  - id: floor_sig_zero_is_div0
    description: "Legacy FLOOR quirk: significance=0 -> #DIV/0!, not 0"
    formula: "=FLOOR(4.3,0)"

  - id: floor_sig_two
    description: "Significance > 1 rounds down to previous multiple of 2"
    formula: "=FLOOR(4.7,2)"

  - id: mround_basic
    formula: "=MROUND(10,3)"

  - id: mround_tie_away_from_zero
    description: "MROUND ties round away from zero: 7.5/3 = 2.5 -> 3 -> 9"
    formula: "=MROUND(7.5,3)"

  # Decimal midpoint probes. Excel documents these as a known limitation of
  # MROUND's binary-decimal midpoint handling; capture the current Mac oracle
  # result rather than predicting it in YAML.
  - id: mround_decimal_midpoint_6_05
    description: "Decimal midpoint probe at one decimal place"
    formula: "=MROUND(6.05,0.1)"

  - id: mround_decimal_midpoint_7_05
    description: "Decimal midpoint probe at one decimal place"
    formula: "=MROUND(7.05,0.1)"

  - id: mround_decimal_midpoint_1_005
    description: "Decimal midpoint probe at two decimal places"
    formula: "=MROUND(1.005,0.01)"

  - id: mround_decimal_midpoint_0_145
    description: "Decimal midpoint probe at two decimal places"
    formula: "=MROUND(0.145,0.01)"

  - id: mround_decimal_midpoint_neg_6_05
    description: "Same-sign negative counterpart of the one-decimal midpoint probe"
    formula: "=MROUND(-6.05,-0.1)"

  - id: mround_decimal_midpoint_neg_7_05
    description: "Same-sign negative counterpart of the one-decimal midpoint probe"
    formula: "=MROUND(-7.05,-0.1)"

  - id: mround_decimal_midpoint_neg_1_005
    description: "Same-sign negative counterpart of the two-decimal midpoint probe"
    formula: "=MROUND(-1.005,-0.01)"

  - id: mround_decimal_midpoint_neg_0_145
    description: "Same-sign negative counterpart of the two-decimal midpoint probe"
    formula: "=MROUND(-0.145,-0.01)"

  - id: mround_near_half_below
    description: "Near-half value just below the integer midpoint"
    formula: "=MROUND(0.49999999999999,1)"

  - id: mround_near_half_above
    description: "Near-half value just above the integer midpoint"
    formula: "=MROUND(0.50000000000001,1)"

  - id: mround_decimal_exact_multiple
    description: "Decimal input already on the requested multiple"
    formula: "=MROUND(7.1,0.1)"

  # Phase-1 midpoint-offset fence. Capture the raw Excel decision across
  # several magnitudes before choosing any implementation rule.
  - id: mround_midpoint_offset_b0_d_2neg48
    description: "Midpoint offset fence: b=0, d=2^-48"
    formula: "=MROUND(0+0.5-2^-48,1)"

  - id: mround_midpoint_offset_b0_d_3x2neg49
    description: "Midpoint offset fence: b=0, d=3*2^-49"
    formula: "=MROUND(0+0.5-3*2^-49,1)"

  - id: mround_midpoint_offset_b0_d_2neg47
    description: "Midpoint offset fence: b=0, d=2^-47"
    formula: "=MROUND(0+0.5-2^-47,1)"

  - id: mround_midpoint_offset_b14_d_2neg48
    description: "Midpoint offset fence: b=14, d=2^-48"
    formula: "=MROUND(14+0.5-2^-48,1)"

  - id: mround_midpoint_offset_b14_d_3x2neg49
    description: "Midpoint offset fence: b=14, d=3*2^-49"
    formula: "=MROUND(14+0.5-3*2^-49,1)"

  - id: mround_midpoint_offset_b14_d_2neg47
    description: "Midpoint offset fence: b=14, d=2^-47"
    formula: "=MROUND(14+0.5-2^-47,1)"

  - id: mround_midpoint_offset_b60_d_2neg48
    description: "Midpoint offset fence: b=60, d=2^-48"
    formula: "=MROUND(60+0.5-2^-48,1)"

  - id: mround_midpoint_offset_b60_d_3x2neg49
    description: "Midpoint offset fence: b=60, d=3*2^-49"
    formula: "=MROUND(60+0.5-3*2^-49,1)"

  - id: mround_midpoint_offset_b60_d_2neg47
    description: "Midpoint offset fence: b=60, d=2^-47"
    formula: "=MROUND(60+0.5-2^-47,1)"

  - id: mround_midpoint_offset_b100_d_2neg48
    description: "Midpoint offset fence: b=100, d=2^-48"
    formula: "=MROUND(100+0.5-2^-48,1)"

  - id: mround_midpoint_offset_b100_d_3x2neg49
    description: "Midpoint offset fence: b=100, d=3*2^-49"
    formula: "=MROUND(100+0.5-3*2^-49,1)"

  - id: mround_midpoint_offset_b100_d_2neg47
    description: "Midpoint offset fence: b=100, d=2^-47"
    formula: "=MROUND(100+0.5-2^-47,1)"

  # Phase-2 threshold fence. Extend the below-half boundary at the same
  # b-values with smaller and larger offsets, plus exact-midpoint controls.
  - id: mround_midpoint_threshold_b0_d_2neg49
    description: "Below-half threshold fence: b=0, d=2^-49"
    formula: "=MROUND(0+0.5-2^-49,1)"

  - id: mround_midpoint_threshold_b0_d_2neg46
    description: "Below-half threshold fence: b=0, d=2^-46"
    formula: "=MROUND(0+0.5-2^-46,1)"

  - id: mround_midpoint_threshold_b14_d_2neg49
    description: "Below-half threshold fence: b=14, d=2^-49"
    formula: "=MROUND(14+0.5-2^-49,1)"

  - id: mround_midpoint_threshold_b14_d_2neg46
    description: "Below-half threshold fence: b=14, d=2^-46"
    formula: "=MROUND(14+0.5-2^-46,1)"

  - id: mround_midpoint_threshold_b60_d_2neg49
    description: "Below-half threshold fence: b=60, d=2^-49"
    formula: "=MROUND(60+0.5-2^-49,1)"

  - id: mround_midpoint_threshold_b60_d_2neg46
    description: "Below-half threshold fence: b=60, d=2^-46"
    formula: "=MROUND(60+0.5-2^-46,1)"

  - id: mround_midpoint_threshold_b100_d_2neg49
    description: "Below-half threshold fence: b=100, d=2^-49"
    formula: "=MROUND(100+0.5-2^-49,1)"

  - id: mround_midpoint_threshold_b100_d_2neg46
    description: "Below-half threshold fence: b=100, d=2^-46"
    formula: "=MROUND(100+0.5-2^-46,1)"

  - id: mround_midpoint_exact_b0
    description: "Exact midpoint control: b=0"
    formula: "=MROUND(0+0.5,1)"

  - id: mround_midpoint_exact_b14
    description: "Exact midpoint control: b=14"
    formula: "=MROUND(14+0.5,1)"

  - id: mround_midpoint_exact_b60
    description: "Exact midpoint control: b=60"
    formula: "=MROUND(60+0.5,1)"

  - id: mround_midpoint_exact_b100
    description: "Exact midpoint control: b=100"
    formula: "=MROUND(100+0.5,1)"

  - id: mround_midpoint_above_b14_d_2neg48
    description: "Above-half control: b=14, d=2^-48"
    formula: "=MROUND(14+0.5+2^-48,1)"

  - id: mround_midpoint_above_b60_d_2neg48
    description: "Above-half control: b=60, d=2^-48"
    formula: "=MROUND(60+0.5+2^-48,1)"

  - id: mround_midpoint_above_b100_d_2neg48
    description: "Above-half control: b=100, d=2^-48"
    formula: "=MROUND(100+0.5+2^-48,1)"

  # Exact binary64 sweep through the remaining ambiguous below-half window.
  # k=64 and k=96 overlap earlier coarse fences intentionally: this contiguous
  # series must establish one monotone Excel transition before a local rule is
  # considered.  Do not infer a cutoff from the YAML source itself.
  - id: mround_midpoint_ulp_sweep_k063
    formula: "=MROUND(0.5-63*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k064
    formula: "=MROUND(0.5-64*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k065
    formula: "=MROUND(0.5-65*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k066
    formula: "=MROUND(0.5-66*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k067
    formula: "=MROUND(0.5-67*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k068
    formula: "=MROUND(0.5-68*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k069
    formula: "=MROUND(0.5-69*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k070
    formula: "=MROUND(0.5-70*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k071
    formula: "=MROUND(0.5-71*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k072
    formula: "=MROUND(0.5-72*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k073
    formula: "=MROUND(0.5-73*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k074
    formula: "=MROUND(0.5-74*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k075
    formula: "=MROUND(0.5-75*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k076
    formula: "=MROUND(0.5-76*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k077
    formula: "=MROUND(0.5-77*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k078
    formula: "=MROUND(0.5-78*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k079
    formula: "=MROUND(0.5-79*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k080
    formula: "=MROUND(0.5-80*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k081
    formula: "=MROUND(0.5-81*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k082
    formula: "=MROUND(0.5-82*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k083
    formula: "=MROUND(0.5-83*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k084
    formula: "=MROUND(0.5-84*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k085
    formula: "=MROUND(0.5-85*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k086
    formula: "=MROUND(0.5-86*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k087
    formula: "=MROUND(0.5-87*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k088
    formula: "=MROUND(0.5-88*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k089
    formula: "=MROUND(0.5-89*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k090
    formula: "=MROUND(0.5-90*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k091
    formula: "=MROUND(0.5-91*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k092
    formula: "=MROUND(0.5-92*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k093
    formula: "=MROUND(0.5-93*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k094
    formula: "=MROUND(0.5-94*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k095
    formula: "=MROUND(0.5-95*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k096
    formula: "=MROUND(0.5-96*2^-54,1)"
  - id: mround_midpoint_ulp_sweep_k097
    formula: "=MROUND(0.5-97*2^-54,1)"

  # Re-run the discovered adjacent cutoffs across base magnitude, multiple,
  # and sign. The quotient records preserve the exact payload used by each
  # decision, so a local rule is admitted only if this matrix agrees.
  - id: mround_midpoint_quotient_b0_m0p1_k090
    formula: "=ABS((0+0.5-90*2^-54)*0.1)/ABS(0.1)"
  - id: mround_midpoint_scale_b0_m0p1_pos_k090
    formula: "=MROUND((0+0.5-90*2^-54)*0.1,0.1)"
  - id: mround_midpoint_scale_b0_m0p1_neg_k090
    formula: "=MROUND(-((0+0.5-90*2^-54)*0.1),-0.1)"
  - id: mround_midpoint_quotient_b0_m0p1_k091
    formula: "=ABS((0+0.5-91*2^-54)*0.1)/ABS(0.1)"
  - id: mround_midpoint_scale_b0_m0p1_pos_k091
    formula: "=MROUND((0+0.5-91*2^-54)*0.1,0.1)"
  - id: mround_midpoint_scale_b0_m0p1_neg_k091
    formula: "=MROUND(-((0+0.5-91*2^-54)*0.1),-0.1)"
  - id: mround_midpoint_quotient_b0_m1_k090
