suite: locale_profile_measurements
description: >
  Behaviour that may differ between Excel locales and hosts: width and kana
  folding at COUNTIF criteria, exact MATCH / XLOOKUP / VLOOKUP and DCOUNT
  criteria; a blank scalar reference in GCD / LCM; a fractional INDEX row;
  and two-digit years in DATEVALUE and VALUE.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP

# The folding cases are a site x character-pair matrix. The counterpart is placed before the
# requested spelling, and lookup returns/fields use distinct numeric sentinels,
# so a folded match and an exact-only match produce different observations.
# Character pairs: fullwidth digits １２３/123, fullwidth Latin ＡＢＣ/ABC,
# halfwidth kana ｱ/ア, and hiragana あ/ア.
cases:
  # -----------------------------------------------------------------------
  # Folding: COUNTIF criteria
  # -----------------------------------------------------------------------
  - id: fold_countif_fullwidth_digits
    description: "COUNTIF criteria １２３ against rows 123 and １２３; folded count differs from exact count"
    setup: { A1: "123", A2: "１２３", A3: "124", A4: "１２４" }
    formula: '=COUNTIF(A1:A4, "１２３")'

  - id: fold_countif_fullwidth_latin
    description: "COUNTIF criteria ＡＢＣ against rows ABC and ＡＢＣ; folded count differs from exact count"
    setup: { A1: "ABC", A2: "ＡＢＣ", A3: "ABD", A4: "ＡＢＤ" }
    formula: '=COUNTIF(A1:A4, "ＡＢＣ")'

  - id: fold_countif_halfwidth_kana
    description: "COUNTIF criteria ｱ against rows ア and ｱ; folded count differs from exact count"
    setup: { A1: "ア", A2: "ｱ", A3: "イ", A4: "ｲ" }
    formula: '=COUNTIF(A1:A4, "ｱ")'

  - id: fold_countif_hiragana_katakana
    description: "COUNTIF criteria あ against rows ア and あ; folded count differs from exact count"
    setup: { A1: "ア", A2: "あ", A3: "イ", A4: "い" }
    formula: '=COUNTIF(A1:A4, "あ")'

  # -----------------------------------------------------------------------
  # Folding: exact MATCH. The first row is the counterpart so the returned index
  # distinguishes folding (1) from matching only the requested spelling (2).
  # -----------------------------------------------------------------------
  - id: fold_match_fullwidth_digits
    description: "MATCH exact １２３ in [123, １２３, 124]; counterpart-first row index distinguishes folding"
    setup: { A1: "123", A2: "１２３", A3: "124" }
    formula: '=MATCH("１２３", A1:A3, 0)'

  - id: fold_match_fullwidth_latin
    description: "MATCH exact ＡＢＣ in [ABC, ＡＢＣ, ABD]; counterpart-first row index distinguishes folding"
    setup: { A1: "ABC", A2: "ＡＢＣ", A3: "ABD" }
    formula: '=MATCH("ＡＢＣ", A1:A3, 0)'

  - id: fold_match_halfwidth_kana
    description: "MATCH exact ｱ in [ア, ｱ, イ]; counterpart-first row index distinguishes folding"
    setup: { A1: "ア", A2: "ｱ", A3: "イ" }
    formula: '=MATCH("ｱ", A1:A3, 0)'

  - id: fold_match_hiragana_katakana
    description: "MATCH exact あ in [ア, あ, イ]; counterpart-first row index distinguishes folding"
    setup: { A1: "ア", A2: "あ", A3: "イ" }
    formula: '=MATCH("あ", A1:A3, 0)'

  # -----------------------------------------------------------------------
  # Folding: exact XLOOKUP. Return columns contain distinct numeric sentinels so
  # a folded match returns the counterpart's row value.
  # -----------------------------------------------------------------------
  - id: fold_xlookup_fullwidth_digits
    description: "XLOOKUP exact １２３ in [123, １２３] with numeric return sentinels 101/202"
    setup: { A1: "123", B1: 101, A2: "１２３", B2: 202, A3: "124", B3: 303 }
    formula: '=XLOOKUP("１２３", A1:A3, B1:B3)'

  - id: fold_xlookup_fullwidth_latin
    description: "XLOOKUP exact ＡＢＣ in [ABC, ＡＢＣ] with numeric return sentinels 101/202"
    setup: { A1: "ABC", B1: 101, A2: "ＡＢＣ", B2: 202, A3: "ABD", B3: 303 }
    formula: '=XLOOKUP("ＡＢＣ", A1:A3, B1:B3)'

  - id: fold_xlookup_halfwidth_kana
    description: "XLOOKUP exact ｱ in [ア, ｱ] with numeric return sentinels 101/202"
    setup: { A1: "ア", B1: 101, A2: "ｱ", B2: 202, A3: "イ", B3: 303 }
    formula: '=XLOOKUP("ｱ", A1:A3, B1:B3)'

  - id: fold_xlookup_hiragana_katakana
    description: "XLOOKUP exact あ in [ア, あ] with numeric return sentinels 101/202"
    setup: { A1: "ア", B1: 101, A2: "あ", B2: 202, A3: "イ", B3: 303 }
    formula: '=XLOOKUP("あ", A1:A3, B1:B3)'

  # -----------------------------------------------------------------------
  # Folding: DCOUNT criterion/value pairs. Every database has the same Key and
  # Value headers; only the criterion value in D2 changes between pairs.
  # Value is numeric so DCOUNT's selected field cannot be confused with the
  # text key column.
  # -----------------------------------------------------------------------
  - id: fold_dcount_fullwidth_digits
    description: "DCOUNT Key criterion １２３ against 123/１２３; numeric Value field and stable Key header"
    setup:
      A1: Key
      B1: Value
      A2: "123"
      B2: 101
      A3: "１２３"
      B3: 202
      A4: "124"
      B4: 303
      D1: Key
      D2: "１２３"
    formula: '=DCOUNT(A1:B4, "Value", D1:D2)'

  - id: fold_dcount_fullwidth_latin
    description: "DCOUNT Key criterion ＡＢＣ against ABC/ＡＢＣ; numeric Value field and stable Key header"
    setup:
      A1: Key
      B1: Value
      A2: "ABC"
      B2: 101
      A3: "ＡＢＣ"
      B3: 202
      A4: "ABD"
      B4: 303
      D1: Key
      D2: "ＡＢＣ"
    formula: '=DCOUNT(A1:B4, "Value", D1:D2)'

  - id: fold_dcount_halfwidth_kana
    description: "DCOUNT Key criterion ｱ against ア/ｱ; numeric Value field and stable Key header"
    setup:
      A1: Key
      B1: Value
      A2: "ア"
      B2: 101
      A3: "ｱ"
      B3: 202
      A4: "イ"
      B4: 303
      D1: Key
      D2: "ｱ"
    formula: '=DCOUNT(A1:B4, "Value", D1:D2)'

  - id: fold_dcount_hiragana_katakana
    description: "DCOUNT Key criterion あ against ア/あ; numeric Value field and stable Key header"
    setup:
      A1: Key
      B1: Value
      A2: "ア"
      B2: 101
      A3: "あ"
      B3: 202
      A4: "イ"
      B4: 303
      D1: Key
      D2: "あ"
    formula: '=DCOUNT(A1:B4, "Value", D1:D2)'

  # -----------------------------------------------------------------------
  # Folding: exact VLOOKUP for the same four pairs.
  # -----------------------------------------------------------------------
  - id: fold_vlookup_fullwidth_digits
    description: "VLOOKUP exact １２３ in [123, １２３] with numeric return sentinels 101/202"
    setup: { A1: "123", B1: 101, A2: "１２３", B2: 202, A3: "124", B3: 303 }
    formula: '=VLOOKUP("１２３", A1:B3, 2, FALSE)'

  - id: fold_vlookup_fullwidth_latin
    description: "VLOOKUP exact ＡＢＣ in [ABC, ＡＢＣ] with numeric return sentinels 101/202"
    setup: { A1: "ABC", B1: 101, A2: "ＡＢＣ", B2: 202, A3: "ABD", B3: 303 }
    formula: '=VLOOKUP("ＡＢＣ", A1:B3, 2, FALSE)'

  - id: fold_vlookup_halfwidth_kana
    description: "VLOOKUP exact ｱ in [ア, ｱ] with numeric return sentinels 101/202"
    setup: { A1: "ア", B1: 101, A2: "ｱ", B2: 202, A3: "イ", B3: 303 }
    formula: '=VLOOKUP("ｱ", A1:B3, 2, FALSE)'

  - id: fold_vlookup_hiragana_katakana
    description: "VLOOKUP exact あ in [ア, あ] with numeric return sentinels 101/202"
    setup: { A1: "ア", B1: 101, A2: "あ", B2: 202, A3: "イ", B3: 303 }
    formula: '=VLOOKUP("あ", A1:B3, 2, FALSE)'

  # -----------------------------------------------------------------------
  # Blank scalar arguments. The blank is deliberate and must remain a
  # null setup value rather than an empty string or an omitted argument.
  # -----------------------------------------------------------------------
  - id: gcd_blank_scalar_ref
    description: "GCD(10,3,blank scalar reference)"
    setup: { A3: null }
    formula: '=GCD(10, 3, A3)'

  - id: lcm_blank_scalar_ref
    description: "LCM(10,3,blank scalar reference)"
    setup: { A3: null }
    formula: '=LCM(10, 3, A3)'

  # -----------------------------------------------------------------------
  # Fractional row index.
  # -----------------------------------------------------------------------
  - id: index_fractional_row
    description: "INDEX with a fractional row below 1"
    setup: { A1: "A", A2: "B", A3: "C" }
    formula: '=INDEX(A1:A3, 0.4)'

  # -----------------------------------------------------------------------
  # Two-digit-year parsing in DATEVALUE and VALUE.
  # -----------------------------------------------------------------------
  - id: datevalue_two_digit_year
    description: "DATEVALUE with US month/day order and a two-digit year"
    formula: '=DATEVALUE("3/15/29")'

  - id: value_two_digit_year
    description: "VALUE with hyphenated month/day order and a two-digit year"
    formula: '=VALUE("3-15-29")'
