suite: atp_financial_array_lift
description: >
  The Analysis-ToolPak financial date functions with their first argument
  given as a two-element array constant: whether each lifts element by
  element (the second element through INDEX, the width through COLUMNS).
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: accrint_first_arg_array_lifted
    formula: "=INDEX(ACCRINT({45444,45444},DATE(2024,3,31),DATE(2024,9,15),0.05,1000,1,0,TRUE),2)"
  - id: accrint_first_arg_array_rows
    formula: "=COLUMNS(ACCRINT({45444,45444},DATE(2024,3,31),DATE(2024,9,15),0.05,1000,1,0,TRUE))"
  - id: accrintm_first_arg_array_lifted
