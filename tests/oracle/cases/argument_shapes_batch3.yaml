suite: argument_shapes_batch3
description: >
  Each argument position of a scalar call the existing suites pin, replaced
  by a cell holding #N/A and by a blank cell; the first literal argument as an
  array constant read through INDEX; the first number as zero and negated.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
