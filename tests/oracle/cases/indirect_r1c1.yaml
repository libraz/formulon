suite: indirect_r1c1
description: >
  INDIRECT's `a1` flag. The `a1 = FALSE` cases show the R1C1 grammar being
  read rather than the flag being ignored: `R2C3` resolves to the same cell
  `C2` names, and the string ADDRESS itself emits under `a1 = FALSE` round
  trips back through INDIRECT.

  The `a1 = TRUE` cases are what make that meaningful. The first shows the
  reference resolves at all; the second shows Excel rejects R1C1 text when
  the flag says A1 -- without it, "R2C3 resolved" would not distinguish
  Excel honouring the flag from Excel ignoring ref_text's syntax entirely.
  Each style rejects the other's spelling, so the flag selects a grammar
  instead of adding a fallback.

  Relative axes (`R[1]C[-1]`, bare `RC`) are not covered here: they measure
  from the cell holding the formula, and the harness places every case at a
  fixed anchor, so a golden would pin the anchor rather than the semantics.
  Those live in tests/unit/eval/builtins_references_test.cpp.
tolerance: { abs: 0.0, rel: 0.0 }
locale: ja-JP
cases:
  - id: indirect_a1_true_resolves
    description: '=INDIRECT("C2", TRUE) with C2 = 42 -> 42'
    setup:
      'C2': 42
    formula: '=INDIRECT("C2", TRUE)'

  - id: indirect_r1c1_text_under_a1_true_is_ref
    description: '=INDIRECT("R2C3", TRUE) -> #REF! (R1C1 text is not an A1 reference)'
    setup:
      'C2': 42
    formula: '=INDIRECT("R2C3", TRUE)'

  - id: indirect_r1c1_absolute
    description: '=INDIRECT("R2C3", FALSE) with C2 = 42 -> 42'
    setup:
      'C2': 42
    formula: '=INDIRECT("R2C3", FALSE)'

  - id: indirect_r1c1_from_address
    description: '=INDIRECT(ADDRESS(2,3,1,FALSE), FALSE) with C2 = 42 -> 42'
    setup:
      'C2': 42
    formula: '=INDIRECT(ADDRESS(2,3,1,FALSE), FALSE)'
