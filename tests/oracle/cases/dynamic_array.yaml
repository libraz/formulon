suite: dynamic_array
description: Dynamic-array (spilling) functions. SEQUENCE is the first acceptance case for cell-level spill machinery; the oracle reads back the anchor scalar (top-left of the spill region) since xlwings does not surface phantom cells through a single-cell read.
tolerance: { abs: 0.0, rel: 0.0 }
locale: ja-JP
cases:
  # -- SEQUENCE -----------------------------------------------------------
  - id: sequence_3
    description: "SEQUENCE(3) spills to a 3x1 column vector; oracle reads the anchor (1)."
    formula: "=SEQUENCE(3)"

  - id: sequence_2_3
    description: "SEQUENCE(2,3) spills to a 2x3 grid; oracle reads the anchor (1)."
    formula: "=SEQUENCE(2,3)"

  - id: sequence_2_2_10_5
    description: "SEQUENCE(2,2,10,5); oracle reads the anchor (10)."
    formula: "=SEQUENCE(2,2,10,5)"

  - id: sequence_3_1_10_neg2
    description: "SEQUENCE(3,1,10,-2); negative step yields [10,8,6]; anchor reads as 10."
    formula: "=SEQUENCE(3,1,10,-2)"

  - id: sequence_3_1_half_quarter
    description: "SEQUENCE(3,1,0.5,0.25); fractional start/step yield [0.5,0.75,1.0]; anchor reads as 0.5."
    formula: "=SEQUENCE(3,1,0.5,0.25)"

  - id: sequence_zero_rows_value
    description: "SEQUENCE(0) -> #VALUE! per Mac Excel (rows must be a positive integer)."
    formula: "=SEQUENCE(0)"

  - id: sequence_negative_rows_value
    description: "SEQUENCE(-1) -> #VALUE! (truncates to -1, fails the positive-integer guard)."
    formula: "=SEQUENCE(-1)"

  - id: sequence_text_arg_value
    description: "SEQUENCE(\"abc\") -> #VALUE! via numeric coercion failure on the rows arg."
    formula: "=SEQUENCE(\"abc\")"

  # -- TRANSPOSE ----------------------------------------------------------
  - id: transpose_array_literal
    description: "TRANSPOSE({1,2,3;4,5,6}) -> 3x2; oracle reads the anchor (1)."
    formula: "=TRANSPOSE({1,2,3;4,5,6})"

  - id: transpose_range
    description: "TRANSPOSE(A1:B2) where A1:B2 = {1,2;3,4} -> 2x2; anchor reads as 1."
    setup:
      A1: 1
      B1: 2
      A2: 3
      B2: 4
    formula: "=TRANSPOSE(A1:B2)"

  - id: transpose_scalar
    description: "TRANSPOSE(42) returns the scalar (Excel reads back the 1x1 anchor)."
    formula: "=TRANSPOSE(42)"

  - id: transpose_single_row_to_column
    description: "TRANSPOSE({1,2,3,4}) -> 4x1 column; anchor reads as 1."
    formula: "=TRANSPOSE({1,2,3,4})"

  - id: transpose_single_column_to_row
    description: "TRANSPOSE({1;2;3;4}) -> 1x4 row; anchor reads as 1."
    formula: "=TRANSPOSE({1;2;3;4})"

  - id: transpose_text_array
    description: "TRANSPOSE over text array literal; anchor reads as text."
    formula: "=TRANSPOSE({\"a\",\"b\";\"c\",\"d\"})"

  # -- Spilled-range `#` -------------------------------------------------
  - id: spill_ref_after_sequence_sum
    description: "A1=SEQUENCE(3); A1# returns the entire spill; SUM consumes it = 6."
    setup:
      A1: "=SEQUENCE(3)"
    formula: "=SUM(A1#)"

  # -- ANCHORARRAY (OOXML internal `_xlfn.` form of `ref#`) ---------------
  # ANCHORARRAY(ref) returns the spill region anchored at `ref` as an
  # array, mirroring the postfix `#` operator. xlsx serialises `=ref#` as
  # `=_xlfn.ANCHORARRAY(ref)`; the prefix is stripped before dispatch so
  # both forms route to `eval_anchorarray_lazy`. The cases below use the
  # explicit `_xlfn.ANCHORARRAY(...)` literal so the closure-check
  # function-name regex matches.
  #
  # The oracle harness materializes setup-formula spills before evaluating
  # the formula under test, so setup sources like `A1: =SEQUENCE(...)`
  # behave like already-calculated worksheet spills.

  - id: anchorarray_static_value_anchor
    description: "B1 holds a static number, not a spill anchor. Formulon: #REF!. Mac probe via xlwings reads blank because Mac does not evaluate `=_xlfn.ANCHORARRAY(...)` typed via the formula2 API and Z1 displays as blank — see divergence.yaml. Unit-test coverage in spill_ref_eval_test.cpp covers the documented #REF! semantics."
    setup:
      B1: 42
    formula: "=_xlfn.ANCHORARRAY(B1)"

  - id: anchorarray_blank_anchor
    description: "E1 is genuinely blank; no spill anchor at E1. Formulon: #REF!. Same `formula2`-typed `_xlfn.ANCHORARRAY` Mac probe artefact as anchorarray_static_value_anchor — see divergence.yaml."
    formula: "=_xlfn.ANCHORARRAY(E1)"

  - id: anchorarray_resolves_sequence_sum
    description: "A1=SEQUENCE(3) spills to A1:A3. SUM(_xlfn.ANCHORARRAY(A1)) = 1+2+3 = 6."
    setup:
      A1: "=SEQUENCE(3)"
    formula: "=SUM(_xlfn.ANCHORARRAY(A1))"

  - id: anchorarray_resolves_sequence_rows
    description: "A1=SEQUENCE(3) spills 3x1. ROWS(_xlfn.ANCHORARRAY(A1)) = 3."
    setup:
      A1: "=SEQUENCE(3)"
    formula: "=ROWS(_xlfn.ANCHORARRAY(A1))"

  - id: anchorarray_offset_resolved_anchor
    description: "A2=SEQUENCE(2,2) spills 2x2; OFFSET(A1,1,0) -> A2 -> spill anchor; SUM = 1+2+3+4 = 10."
    setup:
      A2: "=SEQUENCE(2,2)"
    formula: "=SUM(_xlfn.ANCHORARRAY(OFFSET(A1,1,0)))"
