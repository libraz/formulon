  - id: arabic_vx
    formula: "=ARABIC(\"VX\")"

  - id: arabic_xxc
    formula: "=ARABIC(\"XXC\")"

  - id: th_fact_230
    formula: "=FACT(10.99999977)"

  - id: th_fact_235
    formula: "=FACT(10.999999765)"

  - id: th_fact_238
    formula: "=FACT(10.9999997616)"

  - id: th_fact_239
    formula: "=FACT(10.999999761)"

  - id: th_fact_240
    formula: "=FACT(10.99999976)"

  - id: th_fact_245
    formula: "=FACT(10.999999755)"

  - id: th_fact_250
    formula: "=FACT(10.99999975)"

  - id: th_fact_260
