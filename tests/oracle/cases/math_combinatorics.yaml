  - id: pf_permut
    formula: "=PERMUT(5.9999999,2)"
    tolerance: { abs: 0, rel: 0 }

  - id: atp_gcd_bool
    formula: "=GCD(TRUE,2)"

  - id: atp_gcd_omit
    formula: "=GCD(,2)"

  - id: atp_gcd_boolcell
    setup: { A1: true }
    formula: "=GCD(A1,2)"

  - id: atp_lcm_bool
    formula: "=LCM(TRUE,2)"

  - id: atp_lcm_omit
    formula: "=LCM(,2)"

  - id: atp_lcm_boolcell
    setup: { A1: true }
    formula: "=LCM(A1,2)"

  - id: atp_factdouble_bool
    formula: "=FACTDOUBLE(TRUE)"

  - id: atp_factdouble_boolcell
    setup: { A1: true }
    formula: "=FACTDOUBLE(A1)"

  - id: atp_sqrtpi_bool
