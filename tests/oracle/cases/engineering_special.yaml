suite: engineering_special
description: >
  Continuous-math engineering built-ins: error function family (ERF,
  ERF.PRECISE, ERFC, ERFC.PRECISE) and Bessel function family (BESSELJ,
  BESSELY, BESSELI, BESSELK). Cases cover canonical handbook values,
  oddness / integral form for ERF, order truncation for BESSEL*, and
  singularity / negative-domain rejection for the second-kind Bessel
  members. Tolerance is loose (1e-8) because BESSELK uses Abramowitz &
  Stegun 9.8.5-9.8.8 polynomial approximations whose rated accuracy is
  |epsilon| < 1.9e-7.
tolerance: { abs: 1e-8, rel: 1e-8 }
locale: ja-JP
cases:
  # -- ERF -----------------------------------------------------------------
  - id: erf_zero
    formula: "=ERF(0)"

  - id: erf_one
    formula: "=ERF(1)"
    tolerance: { abs: 0, rel: 0 }

  - id: erf_negative_one_odd
    description: "erf(-x) = -erf(x)"
    formula: "=ERF(-1)"
    tolerance: { abs: 0, rel: 0 }

  - id: erf_two_arg_from_zero
    description: "2-arg form: erf(upper) - erf(lower)"
    formula: "=ERF(0,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: erf_two_arg_interval
    description: "erf(2) - erf(1)"
    formula: "=ERF(1,2)"
    tolerance: { abs: 0, rel: 0 }

  # -- ERF.PRECISE / ERFC / ERFC.PRECISE -----------------------------------
  - id: erf_precise_one
    formula: "=ERF.PRECISE(1)"
    tolerance: { abs: 0, rel: 0 }

  - id: erfc_zero
    formula: "=ERFC(0)"

  - id: erfc_one
    description: "1 - erf(1) ~= 0.157299207"
    formula: "=ERFC(1)"
    tolerance: { abs: 0, rel: 0 }

  - id: erfc_precise_one
    formula: "=ERFC.PRECISE(1)"
    tolerance: { abs: 0, rel: 0 }

  # -- BESSELJ -------------------------------------------------------------
  - id: besselj_zero_zero
    description: "J_0(0) = 1"
    formula: "=BESSELJ(0,0)"
    tolerance: { abs: 0, rel: 0 }

  - id: besselj_one_zero
    description: "J_0(1)"
    formula: "=BESSELJ(1,0)"
    tolerance: { abs: 0, rel: 0 }

  - id: besselj_one_one
    description: "J_1(1)"
    formula: "=BESSELJ(1,1)"
    tolerance: { abs: 0, rel: 0 }

  # -- BESSELY -------------------------------------------------------------
  - id: bessely_one_zero
    description: "Y_0(1)"
    formula: "=BESSELY(1,0)"
    tolerance: { abs: 0, rel: 0 }

  - id: bessely_zero_singular
    description: "Y_n(0) is singular -> #NUM!"
    formula: "=BESSELY(0,0)"
    tolerance: { abs: 0, rel: 0 }

  # -- BESSELI -------------------------------------------------------------
  - id: besseli_one_zero
    description: "I_0(1)"
    formula: "=BESSELI(1,0)"
    tolerance: { abs: 0, rel: 0 }

  - id: besseli_two_one
    description: "I_1(2)"
    formula: "=BESSELI(2,1)"
    tolerance: { abs: 0, rel: 0 }

  # -- BESSELK -------------------------------------------------------------
  - id: besselk_one_zero
    description: "K_0(1)"
    formula: "=BESSELK(1,0)"
    tolerance: { abs: 0, rel: 0 }

  - id: besselk_two_one
    description: "K_1(2)"
    formula: "=BESSELK(2,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: besselk_zero_singular
    description: "K_n(0) is singular -> #NUM!"
    formula: "=BESSELK(0,0)"
    tolerance: { abs: 0, rel: 0 }

  # =========================================================================
  # Edge probes appended for engineering_special expansion.
  # =========================================================================

  # -- ERF asymptotes / sign / 2-arg shape ---------------------------------
  - id: erf_large_positive_asymptote
    description: "erf(6) is indistinguishable from 1.0 at double precision"
    formula: "=ERF(6)"

  - id: erf_large_negative_asymptote
    description: "erf(-6) ~ -1.0"
    formula: "=ERF(-6)"

  - id: erf_two_arg_negative_bounds
    description: "erf(-1) - erf(-2): both negative, result positive"
    formula: "=ERF(-2,-1)"
    tolerance: { abs: 0, rel: 0 }

  - id: erf_two_arg_reversed_bounds
    description: "lower=2, upper=1 -> erf(1) - erf(2) (negative)"
    formula: "=ERF(2,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: erf_two_arg_same_value
    description: "lower == upper -> 0"
    formula: "=ERF(1,1)"

  - id: erf_text_numeric
    description: "Text that parses as number is coerced"
    formula: "=ERF(\"1.5\")"

  - id: erf_bool_rejected
    description: "Excel 365 rejects TRUE/FALSE for ERF -> #VALUE!"
    formula: "=ERF(TRUE)"

  - id: erf_propagates_error
    description: "Error in argument propagates"
    formula: "=ERF(#N/A)"

  - id: erf_precise_two_arg_rejected
    description: "ERF.PRECISE is strict 1-arg; 2nd arg surfaces #VALUE!"
    formula: "=ERF.PRECISE(1,2)"

  # -- ERFC tail / sign ----------------------------------------------------
  - id: erfc_large_positive_to_zero
    description: "erfc(6) ~ 1e-17, far below typical tolerance"
    formula: "=ERFC(6)"
    tolerance: { abs: 0, rel: 0 }

  - id: erfc_negative
    description: "erfc(-1) = 2 - erfc(1) ~= 1.842700793"
    formula: "=ERFC(-1)"

  # -- BESSELJ -------------------------------------------------------------
  - id: besselj_fractional_order_truncates
    description: "Excel truncates n toward zero: J_1.7 -> J_1"
    formula: "=BESSELJ(1,1.7)"
    tolerance: { abs: 0, rel: 0 }

  - id: besselj_negative_order_rejected
    description: "Negative order -> #NUM! (Excel rejects negative orders)"
    formula: "=BESSELJ(1,-1)"
    tolerance: { abs: 0, rel: 0 }

  - id: besselj_zero_higher_order
    description: "J_n(0) = 0 for n >= 1"
    formula: "=BESSELJ(0,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: besselj_large_x_oscillation
    description: "J_0(10) is in the oscillatory regime"
    formula: "=BESSELJ(10,0)"
    tolerance: { abs: 0, rel: 0 }

  # -- BESSELY -------------------------------------------------------------
  - id: bessely_negative_x_rejected
    description: "Y_n is undefined for x < 0 in Excel"
    formula: "=BESSELY(-1,0)"
    tolerance: { abs: 0, rel: 0 }

  - id: bessely_large_order_decay
    description: "Y_5 at moderate x shows heavy growth in magnitude"
    formula: "=BESSELY(2,5)"
    tolerance: { abs: 0, rel: 0 }

  # -- BESSELI -------------------------------------------------------------
  - id: besseli_zero_zero
    description: "I_0(0) = 1"
    formula: "=BESSELI(0,0)"
    tolerance: { abs: 0, rel: 0 }

  - id: besseli_zero_higher_order
    description: "I_n(0) = 0 for n >= 1"
    formula: "=BESSELI(0,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: besseli_large_x_growth
    description: "I_0(20) grows exponentially; verify against Excel cap"
    formula: "=BESSELI(20,0)"
    tolerance: { abs: 0, rel: 0 }

  # -- BESSELK -------------------------------------------------------------
  - id: besselk_negative_x_rejected
    description: "K_n is undefined for x < 0 in Excel"
    formula: "=BESSELK(-1,0)"
    tolerance: { abs: 0, rel: 0 }

  - id: besselk_small_x_log_asymptote
    description: "K_0(0.01) is large; -log(x/2) dominant"
    formula: "=BESSELK(0.01,0)"
    tolerance: { abs: 0, rel: 0 }

  - id: besselk_large_x_decay
    description: "K_0(20) decays exponentially"
    formula: "=BESSELK(20,0)"
    tolerance: { abs: 0, rel: 0 }

  # -- Cross-family --------------------------------------------------------
  - id: besselj_order_via_cell_ref
    description: "Order argument resolved through a cell reference, with fractional truncation"
    setup: { A1: 2.9 }
    formula: "=BESSELJ(1,A1)"
    tolerance: { abs: 0, rel: 0 }

  - id: besseli_text_x_coerces
    description: "Text x is parsed as a number for BESSELI"
    formula: "=BESSELI(\"1\",0)"
    tolerance: { abs: 0, rel: 0 }

  - id: besselk_blank_x_rejected
    description: "Blank x -> 0; K_n(0) -> #NUM!"
    setup: { A1: null }
    formula: "=BESSELK(A1,0)"
    tolerance: { abs: 0, rel: 0 }

  # ========================================================================
  # Closure expansion (appended 2026-04-29) — bring BESSELY / ERFC /
  # ERF.PRECISE / ERFC.PRECISE up to 5 perspectives each.
  # ========================================================================

  # -- BESSELY -------------------------------------------------------------
  - id: bessely_one_one
    description: "Y_1(1)"
    formula: "=BESSELY(1,1)"
    tolerance: { abs: 0, rel: 0 }

  # -- ERFC ----------------------------------------------------------------
  - id: erfc_negative_two
    description: "erfc(-2) = 2 - erf(-2)*-1 = 1 + erf(2) ~= 1.99532"
    formula: "=ERFC(-2)"

  # -- ERF.PRECISE ---------------------------------------------------------
  - id: erf_precise_zero
    description: "ERF.PRECISE(0) = 0"
    formula: "=ERF.PRECISE(0)"

  - id: erf_precise_negative
    description: "ERF.PRECISE(-1) = -ERF.PRECISE(1) (odd function)"
    formula: "=ERF.PRECISE(-1)"
    tolerance: { abs: 0, rel: 0 }

  - id: erf_precise_large_positive
    description: "ERF.PRECISE(6) ~= 1 (saturates)"
    formula: "=ERF.PRECISE(6)"

  # -- ERFC.PRECISE --------------------------------------------------------
  - id: erfc_precise_zero
    description: "ERFC.PRECISE(0) = 1"
    formula: "=ERFC.PRECISE(0)"

  - id: erfc_precise_negative
    description: "ERFC.PRECISE(-1) = 2 - ERFC.PRECISE(1) ~= 1.842700793"
    formula: "=ERFC.PRECISE(-1)"

  - id: erfc_precise_large_positive
    description: "ERFC.PRECISE(6) ~ 0 (saturates)"
    formula: "=ERFC.PRECISE(6)"
    tolerance: { abs: 0, rel: 0 }

  - id: erfc_precise_two_arg_rejected
    description: "ERFC.PRECISE is strict 1-arg; 2nd arg surfaces #VALUE!"
    formula: "=ERFC.PRECISE(1,2)"

  # -- Argument coercion: Analysis-ToolPak booleans / omitted
  #    arguments, and the near-integer snap of integer arguments --------------
  - id: atp_erf_bool
    formula: "=ERF(TRUE)"

  - id: atp_erf_omit
    formula: "=ERF(,1)"

  - id: atp_erf_boolcell
    setup: { A1: true }
    formula: "=ERF(A1)"

  - id: atp_besselj_bool
    formula: "=BESSELJ(TRUE,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: atp_besselj_omit
    formula: "=BESSELJ(,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: atp_besselj_boolcell
    setup: { A1: true }
    formula: "=BESSELJ(A1,1)"
    tolerance: { abs: 0, rel: 0 }

  # -- Analysis-ToolPak arguments and near-integer snap, round 2 ---
  - id: a4_erfc_bool
    formula: "=ERFC(TRUE)"

  - id: a4_bessely_bool
    formula: "=BESSELY(TRUE,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: a4_bessely_omit
    formula: "=BESSELY(,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: a4_besseli_bool
    formula: "=BESSELI(TRUE,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: a4_besseli_omit
    formula: "=BESSELI(,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: a4_besselk_bool
    formula: "=BESSELK(TRUE,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: a4_besselk_omit
    formula: "=BESSELK(,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: a4_erf_precise_bool
    formula: "=ERF.PRECISE(TRUE)"

  - id: a4_erfc_precise_bool
    formula: "=ERFC.PRECISE(TRUE)"

  - id: opt_besselj_omit_n
    formula: "=BESSELJ(1,)"
    tolerance: { abs: 0, rel: 0 }

  - id: opt_erf_upper_omit
    formula: "=ERF(0.5,)"

  - id: bessel_floor_neg_j
    formula: "=BESSELJ(-100,-0.5)"
    tolerance: { abs: 0, rel: 0 }

  - id: bessel_floor_neg_y
    formula: "=BESSELY(1,-0.5)"
    tolerance: { abs: 0, rel: 0 }

  - id: bessel_floor_neg_i
    formula: "=BESSELI(-40,-0.5)"
    tolerance: { abs: 0, rel: 0 }

  - id: bessel_floor_neg_k
    formula: "=BESSELK(1,-0.5)"
    tolerance: { abs: 0, rel: 0 }

  - id: bessely_phase_cap_at
    formula: "=BESSELY(134217727,0)"
    tolerance: { abs: 0, rel: 0 }

  - id: bessely_phase_cap_past
    formula: "=BESSELY(134217728,0)"
    tolerance: { abs: 0, rel: 0 }

  - id: bessely_phase_cap_far
    formula: "=BESSELY(10000000000,0)"
    tolerance: { abs: 0, rel: 0 }

  - id: bessely_small_x_order_9
    formula: "=BESSELY(3.689,9)"
    tolerance: { abs: 0, rel: 0 }

  - id: bessely_small_x_order_4
    formula: "=BESSELY(1.593,4)"
    tolerance: { abs: 0, rel: 0 }

  - id: bessely_small_x_order_2
    formula: "=BESSELY(1.5,2)"
    tolerance: { abs: 0, rel: 0 }

  - id: bessely_small_x_order_3
    formula: "=BESSELY(1.5,3)"
    tolerance: { abs: 0, rel: 0 }

  - id: besseli_renorm_flush_490
    formula: "=BESSELI(100,490)"
    tolerance: { abs: 0, rel: 0 }

  - id: besseli_renorm_flush_300
    formula: "=BESSELI(10,300)"
    tolerance: { abs: 0, rel: 0 }

  - id: besselk_asymptotic_flush_n0
    formula: "=BESSELK(710,0)"
    tolerance: { abs: 0, rel: 0 }

  - id: besselk_asymptotic_flush_n1
    formula: "=BESSELK(710,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: besselk_asymptotic_flush_high_order
    formula: "=BESSELK(710,1000000)"
    tolerance: { abs: 0, rel: 0 }
