suite: financial_dcc
description: financial_dcc family — bond pricing/yield/duration with shared day-count basis matrix (0..4). 8 members (PRICE, YIELD, ODDFPRICE, ODDFYIELD, ODDLPRICE, ODDLYIELD, DURATION, MDURATION) × 7 perspectives = 56 cases. Each member exercises all 5 DCC bases plus two error paths (boundary date and invalid basis 5). Tolerance 1e-8 covers Mac Excel's bond-math ULP drift.
tolerance: { abs: 1.0e-8, rel: 1.0e-8 }
locale: ja-JP
cases:
  # =========================================================================
  # PRICE
  # =========================================================================
  - id: price_canonical_basis_0
    description: "PRICE docs canonical (basis 0 US 30/360) -> ~94.6346"
    formula: '=PRICE(DATE(2008,2,15),DATE(2017,11,15),0.0575,0.065,100,2,0)'
  - id: price_basis_1_actual_actual
    description: "PRICE basis 1 (actual/actual) on docs example"
    formula: '=PRICE(DATE(2008,2,15),DATE(2017,11,15),0.0575,0.065,100,2,1)'
  - id: price_basis_2_actual_360
    description: "PRICE basis 2 (actual/360)"
    formula: '=PRICE(DATE(2008,2,15),DATE(2017,11,15),0.0575,0.065,100,2,2)'
  - id: price_basis_3_actual_365
    description: "PRICE basis 3 (actual/365)"
    formula: '=PRICE(DATE(2008,2,15),DATE(2017,11,15),0.0575,0.065,100,2,3)'
  - id: price_basis_4_european_30_360
    description: "PRICE basis 4 (European 30/360)"
    formula: '=PRICE(DATE(2008,2,15),DATE(2017,11,15),0.0575,0.065,100,2,4)'
  - id: price_settlement_eq_maturity_error
    description: "PRICE settlement >= maturity -> #NUM!"
    formula: '=PRICE(DATE(2024,6,1),DATE(2024,6,1),0.05,0.06,100,2,0)'
  - id: price_invalid_basis_error
    description: "PRICE invalid basis 5 -> #NUM!"
    formula: '=PRICE(DATE(2020,1,1),DATE(2030,1,1),0.05,0.06,100,2,5)'

