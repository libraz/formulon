suite: error_args_lookup_shape
description: >
  Which error lookup, array-shape, text and reference functions report when an argument is a
  referenced cell or a range holding a plain #VALUE!, #N/A or #DIV/0!, with the other arguments
  valid, plus a valid control. GETPIVOTDATA has no pivot behind it, so its control reports the
  no-pivot failure.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: vlookup_control
    setup:
      B1: 1
      B2: 2
      B3: 4
      C1: 2
      C2: 3
      C3: 7
    formula: '=VLOOKUP(2,B1:C3,2,FALSE)'
  - id: vlookup_p1_cell_v
    setup:
      A1: '="a"+1'
      A2: '=NA()'
      A3: '=1/0'
      B1: 1
      B2: 2
      B3: 4
      C1: 2
      C2: 3
      C3: 7
    formula: '=VLOOKUP(A1,B1:C3,2,FALSE)'
