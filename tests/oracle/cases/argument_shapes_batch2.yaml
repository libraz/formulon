suite: argument_shapes_batch2
description: >
  Each argument position of a scalar call the existing suites pin, replaced
  by a cell holding #N/A and by a blank cell; the first literal argument as an
  array constant read through INDEX; the first number as zero and negated.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: gestep_arg1_na_cell
    setup: { B1: "=NA()" }
    formula: "=GESTEP(B1,4)"
  - id: gestep_arg1_blank_cell
    formula: "=GESTEP(B2,4)"
  - id: gestep_arg2_na_cell
    setup: { B1: "=NA()" }
    formula: "=GESTEP(5,B1)"
  - id: gestep_arg2_blank_cell
    formula: "=GESTEP(5,B2)"
  - id: gestep_arg1_array_lifted
    formula: "=INDEX(GESTEP({5,5},4),2)"
  - id: gestep_arg1_zero
    formula: "=GESTEP(0,4)"
  - id: gestep_arg1_negative
    formula: "=GESTEP(-5,4)"
  - id: hex2bin_arg1_na_cell
