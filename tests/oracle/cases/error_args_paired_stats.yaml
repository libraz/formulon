suite: error_args_paired_stats
description: >
  Which error a paired-array statistic reports when an argument is a referenced cell or a range
  holding a plain #VALUE!, #N/A or #DIV/0!, with the other arguments valid, plus a valid control.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
