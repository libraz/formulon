    setup:
      B1: 1
      B2: 2
      B3: 4
      C1: 2
      C2: 3
      C3: 7
    formula: '=CORREL(B1:B3,C1:C3)'
  - id: correl_p1_cell_v
    setup:
      A1: '="a"+1'
      A2: '=NA()'
      A3: '=1/0'
      C1: 2
      C2: 3
      C3: 7
    formula: '=CORREL(A1,C1:C3)'
