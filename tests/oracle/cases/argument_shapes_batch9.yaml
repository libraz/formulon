suite: argument_shapes_batch9
description: >
  For a function no other suite calls with an error, a blank cell or an array:
  its first literal argument replaced by a cell holding #N/A, a blank cell, or
  an array constant read through INDEX; or, when every call takes a range, one
  number inside the range set to #N/A or left blank.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: frequency_arg1_blank_cell
    formula: "=FREQUENCY(B2,{2,0,2})"
  - id: ftest_range_cell_b3_blank
    setup: { B1: 1, B2: 2, C1: 2, C2: 3, C3: 7 }
    formula: "=FTEST(B1:B3,C1:C3)"
  - id: fv_arg2_array_lifted
    formula: "=INDEX(FV(0.08/12,{120,120},-200,0,1),2)"
  - id: gamma_inv_arg2_array_lifted
    formula: "=INDEX(GAMMA.INV(GAMMA.DIST(4, 3, 2, TRUE),{3,3},2),2)"
  - id: gcd_arg1_na_cell
    setup: { B1: "=NA()" }
    formula: "=GCD(B1,0,0)"
  - id: hlookup_arg1_blank_cell
    formula: "=HLOOKUP(B2,{1;2;3},1.9999999,FALSE)"
  - id: hour_arg1_array_lifted
    formula: "=INDEX(HOUR({0,0}),2)"
  - id: iferror_arg2_blank_cell
    formula: "=IFERROR(MATCH(\"ß\",{\"ss\";\"zz\"},0),B2)"
