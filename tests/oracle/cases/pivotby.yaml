suite: pivotby
description: PIVOTBY dynamic-array pivot (Excel 365). Perspectives parallel GROUPBY's structure — bare-name aggregator dispatch (spill), LAMBDA aggregator dispatch (spill), unknown-name -> #NAME?, field_headers out-of-range -> #VALUE!, filter_array length mismatch -> #VALUE!, filter_array empty selection -> error, and row_sort_order 0 -> #VALUE! (both sort_order slots take a signed column index with no zero member).
tolerance: { abs: 1.0e-12, rel: 1.0e-12 }
locale: ja-JP
cases:
  # =========================================================================
  # Aggregator dispatch, bare name and inline LAMBDA. Arguments are
  # field_headers=0, row_total_depth=0, row_sort_order omitted,
  # col_total_depth=0: Excel's sort_order domain is a signed column index
  # with no zero member, so a literal 0 in either sort slot is rejected
  # with #VALUE! before the aggregation runs. That rejection has its own
  # case below.
  #
  # The result is 3x3, not 2x2: a pivot always carries the column-field
  # value row and the row-field label column, so the top-left corner cell
  # is blank and the aggregated values sit on the diagonal.
  # =========================================================================

  - id: pivotby_bare_sum
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, , 0) -> 3x3 spill, blank corner, values on the diagonal'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, , 0)'

  - id: pivotby_lambda_sum
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, LAMBDA(v, SUM(v)), 0, 0, , 0) -> 3x3 spill, blank corner'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, LAMBDA(v, SUM(v)), 0, 0, , 0)'

  - id: pivotby_row_sort_order_zero_rejected
    description: 'PIVOTBY(..., SUM, 0, 0, 0, 0) -> #VALUE!: row_sort_order 0 is outside Excel''s signed-column-index domain'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0)'
    expect: { kind: error, code: "#VALUE!" }

  # =========================================================================
  # Live scalar errors.
  # =========================================================================

  - id: pivotby_unknown_name_error
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, NOPE_NAME, 0, 0, 0, 0, 0) -> #NAME? (unknown aggregator)'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, NOPE_NAME, 0, 0, 0, 0, 0)'

  - id: pivotby_field_headers_out_of_range
    description: 'PIVOTBY({"A"}, {"X"}, {1}, SUM, 5, 0, 0, 0, 0) -> #VALUE! (field_headers must be 0..3)'
    formula: '=PIVOTBY({"A"}, {"X"}, {1}, SUM, 5, 0, 0, 0, 0)'

  - id: pivotby_filter_array_length_mismatch
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0, {TRUE;FALSE;TRUE}) -> #VALUE! (mask length 3 vs data length 2)'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0, {TRUE;FALSE;TRUE})'

  - id: pivotby_filter_array_excludes_all
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0, {FALSE;FALSE}) -> #VALUE! (filter eliminates every row)'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0, {FALSE;FALSE})'

  # =========================================================================
  # Multi-column row_fields / col_fields / values. Mac Excel 365 16.109
  # ja-JP emits cross-product spills; these are live oracle entries using
  # shape-aware array capture.
  # =========================================================================

  - id: pivotby_multi_col_rows_basic
    description: 'Multi-column row_fields (K=2). PIVOTBY({"A","P";"B","Q";"A","P"}, {"X";"Y";"X"}, {1;2;3}, SUM, 0) -> 4x5 spill with 2 row-key cols.'
    formula: '=PIVOTBY({"A","P";"B","Q";"A","P"}, {"X";"Y";"X"}, {1;2;3}, SUM, 0)'

  - id: pivotby_multi_col_cols_basic
    description: 'Multi-column col_fields (L=2). PIVOTBY({"A";"B";"A"}, {"X","M";"Y","N";"X","M"}, {1;2;3}, SUM, 0) -> 5x4 spill with 2 col-key rows.'
    formula: '=PIVOTBY({"A";"B";"A"}, {"X","M";"Y","N";"X","M"}, {1;2;3}, SUM, 0)'

  - id: pivotby_multi_values_basic
    description: 'Multi-column values (V=2). PIVOTBY({"A";"B";"A"}, {"X";"Y";"X"}, {1,10;2,20;3,30}, SUM, 0) -> 4x7 spill, value cols tiled per col-group.'
    formula: '=PIVOTBY({"A";"B";"A"}, {"X";"Y";"X"}, {1,10;2,20;3,30}, SUM, 0)'

  - id: pivotby_multi_all_axes
    description: 'All multi (K=2, L=2, V=2). 5x8 spill, dense cross-product layout.'
    formula: '=PIVOTBY({"A","P";"B","Q";"A","P"}, {"X","M";"Y","N";"X","M"}, {1,10;2,20;3,30}, SUM, 0)'

  - id: pivotby_multi_with_input_header
    description: 'Multi-col rows + input/output header (K=2, fh=3). 6x5 spill including col_fields header, row_fields header, and values header tiled.'
    formula: '=PIVOTBY({"R1","R2";"A","P";"B","Q";"A","P"}, {"C";"X";"Y";"X"}, {"V";1;2;3}, SUM, 3)'

  # =========================================================================
  # |row_total_depth| / |col_total_depth| == 2 requests per-region subtotal
  # rows / columns for a multi-column grouping. The row axis is implemented:
  # each subtotal row restates its outer row key and the ja-JP grand-total
  # row moves from 合計 to 総計. Column subtotals remain unimplemented and
  # still fall back to the grand-total-only layout.
  # =========================================================================

  - id: pivotby_row_subtotal_depth_two
    description: 'PIVOTBY with row_total_depth=2 over multi-column row_fields -> per-outer-group row subtotals under a 総計 row'
    formula: '=PIVOTBY({"A","x";"A","y";"B","x"}, {"X";"Y";"X"}, {10;20;30}, SUM, 0, 2)'
