suite: pivotby
description: PIVOTBY dynamic-array pivot (Excel 365). Six perspectives parallel GROUPBY's structure — bare-name aggregator dispatch (spill), LAMBDA aggregator dispatch (spill), unknown-name -> #NAME?, field_headers out-of-range -> #VALUE!, filter_array length mismatch -> #VALUE!, and filter_array empty selection -> error.
tolerance: { abs: 1.0e-12, rel: 1.0e-12 }
locale: ja-JP
cases:
  # =========================================================================
  # Spill outputs — committed oracle golden predates array-spill comparison, so the
  # two pivot-output cases are registered skip-oracle in
  # tests/divergence.yaml. Unit tests in
  # tests/unit/eval/builtins_pivotby_test.cpp validate spill content.
  # =========================================================================

  - id: pivotby_bare_sum
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0) -> 2x2 spill (anchor=1)'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0)'

  - id: pivotby_lambda_sum
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, LAMBDA(v, SUM(v)), 0, 0, 0, 0, 0) -> 2x2 spill (anchor=1)'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, LAMBDA(v, SUM(v)), 0, 0, 0, 0, 0)'

  # =========================================================================
  # Live scalar errors.
  # =========================================================================

  - id: pivotby_unknown_name_error
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, NOPE_NAME, 0, 0, 0, 0, 0) -> #NAME? (unknown aggregator)'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, NOPE_NAME, 0, 0, 0, 0, 0)'

  - id: pivotby_field_headers_out_of_range
    description: 'PIVOTBY({"A"}, {"X"}, {1}, SUM, 5, 0, 0, 0, 0) -> #VALUE! (field_headers must be 0..3)'
    formula: '=PIVOTBY({"A"}, {"X"}, {1}, SUM, 5, 0, 0, 0, 0)'

  - id: pivotby_filter_array_length_mismatch
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0, {TRUE;FALSE;TRUE}) -> #VALUE! (mask length 3 vs data length 2)'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0, {TRUE;FALSE;TRUE})'

  - id: pivotby_filter_array_excludes_all
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0, {FALSE;FALSE}) -> #VALUE! (filter eliminates every row)'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0, {FALSE;FALSE})'

  # =========================================================================
  # Multi-column row_fields / col_fields / values. Mac Excel 365 (16.108.1,
  # ja-JP) emits a cross-product spill; oracle compare_value cannot
  # navigate ArrayValue. Unit tests in tests/unit/eval/builtins_pivotby_test.cpp
  # (PivotBy.MultiColumn*) validate the spill content. Layout was captured
  # via xlwings INDEX(spill, r, c) probes against Mac Excel; per-shape
  # verification is in the unit suite. These oracle entries are skip-oracle
  # placeholders so the closure surface is still discoverable from the YAML.
  # =========================================================================

  - id: pivotby_multi_col_rows_basic
    description: 'Multi-column row_fields (K=2). PIVOTBY({"A","P";"B","Q";"A","P"}, {"X";"Y";"X"}, {1;2;3}, SUM, 0) -> 4x5 spill with 2 row-key cols.'
    formula: '=PIVOTBY({"A","P";"B","Q";"A","P"}, {"X";"Y";"X"}, {1;2;3}, SUM, 0)'

  - id: pivotby_multi_col_cols_basic
    description: 'Multi-column col_fields (L=2). PIVOTBY({"A";"B";"A"}, {"X","M";"Y","N";"X","M"}, {1;2;3}, SUM, 0) -> 5x4 spill with 2 col-key rows.'
    formula: '=PIVOTBY({"A";"B";"A"}, {"X","M";"Y","N";"X","M"}, {1;2;3}, SUM, 0)'

  - id: pivotby_multi_values_basic
    description: 'Multi-column values (V=2). PIVOTBY({"A";"B";"A"}, {"X";"Y";"X"}, {1,10;2,20;3,30}, SUM, 0) -> 4x7 spill, value cols tiled per col-group.'
    formula: '=PIVOTBY({"A";"B";"A"}, {"X";"Y";"X"}, {1,10;2,20;3,30}, SUM, 0)'

  - id: pivotby_multi_all_axes
    description: 'All multi (K=2, L=2, V=2). 5x8 spill, dense cross-product layout.'
    formula: '=PIVOTBY({"A","P";"B","Q";"A","P"}, {"X","M";"Y","N";"X","M"}, {1,10;2,20;3,30}, SUM, 0)'

  - id: pivotby_multi_with_input_header
    description: 'Multi-col rows + input/output header (K=2, fh=3). 5x5 spill including row_fields header row + values header tiled.'
    formula: '=PIVOTBY({"R1","R2";"A","P";"B","Q";"A","P"}, {"C";"X";"Y";"X"}, {"V";1;2;3}, SUM, 3)'
