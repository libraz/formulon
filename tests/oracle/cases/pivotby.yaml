suite: pivotby
description: PIVOTBY dynamic-array pivot (Excel 365). Six perspectives parallel GROUPBY's structure — bare-name aggregator dispatch (spill), LAMBDA aggregator dispatch (spill), unknown-name -> #NAME?, field_headers out-of-range -> #VALUE!, filter_array length mismatch -> #VALUE!, and filter_array empty selection -> error.
tolerance: { abs: 1.0e-12, rel: 1.0e-12 }
locale: ja-JP
cases:
  # =========================================================================
  # Spill outputs — oracle compare_value cannot navigate ArrayValue, so the
  # two pivot-output cases are registered skip-oracle in
  # tests/divergence.yaml. Unit tests in
  # tests/unit/eval/builtins_pivotby_test.cpp validate spill content.
  # =========================================================================

  - id: pivotby_bare_sum
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0) -> 2x2 spill (anchor=1)'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0)'

  - id: pivotby_lambda_sum
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, LAMBDA(v, SUM(v)), 0, 0, 0, 0, 0) -> 2x2 spill (anchor=1)'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, LAMBDA(v, SUM(v)), 0, 0, 0, 0, 0)'

  # =========================================================================
  # Live scalar errors.
  # =========================================================================

  - id: pivotby_unknown_name_error
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, NOPE_NAME, 0, 0, 0, 0, 0) -> #NAME? (unknown aggregator)'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, NOPE_NAME, 0, 0, 0, 0, 0)'

  - id: pivotby_field_headers_out_of_range
    description: 'PIVOTBY({"A"}, {"X"}, {1}, SUM, 5, 0, 0, 0, 0) -> #VALUE! (field_headers must be 0..3)'
    formula: '=PIVOTBY({"A"}, {"X"}, {1}, SUM, 5, 0, 0, 0, 0)'

  - id: pivotby_filter_array_length_mismatch
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0, {TRUE;FALSE;TRUE}) -> #VALUE! (mask length 3 vs data length 2)'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0, {TRUE;FALSE;TRUE})'

  - id: pivotby_filter_array_excludes_all
    description: 'PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0, {FALSE;FALSE}) -> error (Formulon #CALC!, Mac #VALUE!)'
    formula: '=PIVOTBY({"A";"B"}, {"X";"Y"}, {1;2}, SUM, 0, 0, 0, 0, 0, {FALSE;FALSE})'
