    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_tan_at_limit
    formula: "=TAN(134217728)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_sec_below_limit
    formula: "=SEC(134217727)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_sec_at_limit
    formula: "=SEC(134217728)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_csc_below_limit
    formula: "=CSC(134217727)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_csc_at_limit
