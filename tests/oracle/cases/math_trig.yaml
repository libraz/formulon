  - id: hyp_rules_acoth_log_two
    formula: "=ACOTH(2)"
    tolerance: { abs: 0, rel: 0 }

  - id: hyp_rules_acoth_log_below_switch
    formula: "=ACOTH(3.69)"
    tolerance: { abs: 0, rel: 0 }

  - id: hyp_rules_acoth_series_above_switch
    formula: "=ACOTH(3.7)"
    tolerance: { abs: 0, rel: 0 }

  - id: hyp_rules_acoth_series_ten
