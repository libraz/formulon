    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_csch_zero
    formula: "=CSCH(0)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_sech_overflow_to_zero
    formula: "=SECH(1000)"
    tolerance: { abs: 0, rel: 0 }

  # -- ATANH cubic / log regimes and ACOTH log / series regimes ---
  - id: hyp_rules_atanh_cubic_tiny
    formula: "=ATANH(1E-8)"
    tolerance: { abs: 0, rel: 0 }

  - id: hyp_rules_atanh_cubic_small
    formula: "=ATANH(0.00005)"
    tolerance: { abs: 0, rel: 0 }

  - id: hyp_rules_atanh_cubic_below_limit
    formula: "=ATANH(0.0001028)"
    tolerance: { abs: 0, rel: 0 }

  - id: hyp_rules_atanh_log_above_limit
    formula: "=ATANH(0.0001029)"
    tolerance: { abs: 0, rel: 0 }

  - id: hyp_rules_atanh_log_small
