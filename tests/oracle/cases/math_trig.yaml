  - id: trig_rules_cot_below_limit
    formula: "=COT(134217727)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_cot_at_limit
    formula: "=COT(134217728)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_radians_constant_first
    formula: "=RADIANS(12345678900)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_radians_fraction
    formula: "=RADIANS(0.123456)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_degrees_constant_first
    formula: "=DEGREES(12345678900)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_degrees_fraction
    formula: "=DEGREES(0.123456)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_acosh_log_form_small
    formula: "=ACOSH(1.0001)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_acosh_log_form_medium
    formula: "=ACOSH(7.5)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_acosh_log_form_large
    formula: "=ACOSH(1E+100)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_acosh_square_overflow
    formula: "=ACOSH(1E+200)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_csch_excel_sinh
    formula: "=CSCH(0.5)"
    tolerance: { abs: 0, rel: 0 }

  - id: trig_rules_csch_excel_sinh_large
