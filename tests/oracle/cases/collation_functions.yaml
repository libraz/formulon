suite: collation_functions
description: >
  Mac Excel text collation through the worksheet functions: the 16 function columns
  (SORT, SORTBY, UNIQUE, MATCH 0/1, VLOOKUP FALSE/TRUE, HLOOKUP FALSE, XLOOKUP, XMATCH,
  COUNTIF, SUMIF, SWITCH, FILTER, GROUPBY, DCOUNTA) against 8 representative pairs, plus a
  pairwise selection of further pairs, directions and data positions on one function per
  strength and addition rule. Every probe resolves to a single scalar. Range-based
  functions use setup cells; no setup cell is empty.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: colfn_sort_sharp_s
    description: "SORT: ß vs ss"
    formula: "=INDEX(SORT({\"ß\";\"ss\"}),1)"

  - id: colfn_sort_hw_voiced
    description: "SORT: ｶﾞ vs ガ"
    formula: "=INDEX(SORT({\"ｶﾞ\";\"ガ\"}),1)"

  - id: colfn_sort_kata_hira
    description: "SORT: ア vs あ"
    formula: "=INDEX(SORT({\"ア\";\"あ\"}),1)"

  - id: colfn_sort_fw_latin
    description: "SORT: Ａ vs A"
    formula: "=INDEX(SORT({\"Ａ\";\"A\"}),1)"

  - id: colfn_sort_circled_1
    description: "SORT: ① vs 1"
    formula: "=INDEX(SORT({\"①\";\"1\"}),1)"

  - id: colfn_sort_umlaut
    description: "SORT: ä vs a"
    formula: "=INDEX(SORT({\"ä\";\"a\"}),1)"

  - id: colfn_sort_choon
    description: "SORT: かー vs かあ"
    formula: "=INDEX(SORT({\"かー\";\"かあ\"}),1)"

  - id: colfn_sort_thai_prefix
    description: "SORT: เก vs กา"
    formula: "=INDEX(SORT({\"เก\";\"กา\"}),1)"

  - id: colfn_sortby_sharp_s
    description: "SORTBY: ß vs ss"
    formula: "=INDEX(SORTBY({1;2},{\"ß\";\"ss\"}),1)"

  - id: colfn_sortby_hw_voiced
