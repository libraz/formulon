suite: distributions
description: NORM.DIST / NORM.S.DIST / NORM.INV / NORM.S.INV / BINOM.DIST / POISSON.DIST / EXPON.DIST — probability-distribution family
# xlwings returns Excel-computed floats as their displayed value (typically
# ~15 digits but with some tail-digit truncation). Stats values here have
# magnitudes between ~1e-4 and 1e0, so 1e-6 absolute / relative tolerances
# comfortably absorb any display-rounding artefact while still catching
# real divergence.
tolerance: { abs: 1.0e-6, rel: 1.0e-6 }
locale: ja-JP
cases:
  # -- NORM.DIST -----------------------------------------------------------
  - id: norm_dist_pdf_zero
    description: "PDF of N(0, 1) at 0 = 1/sqrt(2*pi) ~ 0.398942"
    formula: "=NORM.DIST(0, 0, 1, FALSE)"

  - id: norm_dist_cdf_zero
    description: "CDF of N(0, 1) at 0 = 0.5"
    formula: "=NORM.DIST(0, 0, 1, TRUE)"

  - id: norm_dist_cdf_one
    description: "CDF of N(0, 1) at 1 ~ 0.841345"
    formula: "=NORM.DIST(1, 0, 1, TRUE)"

  - id: norm_dist_scaled
    description: "N(100, 15) CDF at 105 ~ 0.630559"
    formula: "=NORM.DIST(105, 100, 15, TRUE)"

  - id: norm_dist_negative_sd_is_num
    description: "sd <= 0 yields #NUM!"
    formula: "=NORM.DIST(0, 0, -1, TRUE)"

  # -- NORM.S.DIST ---------------------------------------------------------
  - id: norm_s_dist_zero_cdf
    formula: "=NORM.S.DIST(0, TRUE)"

  - id: norm_s_dist_z2_cdf
    description: "Standard-normal CDF at z=2 ~ 0.977250"
    formula: "=NORM.S.DIST(2, TRUE)"

  - id: norm_s_dist_z0_pdf
    formula: "=NORM.S.DIST(0, FALSE)"

  # -- NORM.INV ------------------------------------------------------------
  - id: norm_inv_half
    description: "p=0.5 maps to the mean"
    formula: "=NORM.INV(0.5, 0, 1)"

  - id: norm_inv_95pct
    description: "95th percentile of N(0, 1) ~ 1.644854"
    formula: "=NORM.INV(0.95, 0, 1)"

  - id: norm_inv_scaled
    description: "97.5th percentile of N(100, 15) ~ 129.3995"
    formula: "=NORM.INV(0.975, 100, 15)"

  - id: norm_inv_p_zero_is_num
    description: "p <= 0 yields #NUM!"
    formula: "=NORM.INV(0, 0, 1)"

  - id: norm_inv_p_one_is_num
    description: "p >= 1 yields #NUM!"
    formula: "=NORM.INV(1, 0, 1)"

  # -- NORM.S.INV ----------------------------------------------------------
  - id: norm_s_inv_half
    formula: "=NORM.S.INV(0.5)"

  - id: norm_s_inv_95pct
    formula: "=NORM.S.INV(0.95)"

  # -- BINOM.DIST ----------------------------------------------------------
  - id: binom_pmf_fair_coin
    description: "BINOM(10, 0.5) PMF at 5 = 252/1024 = 0.24609375"
    formula: "=BINOM.DIST(5, 10, 0.5, FALSE)"

  - id: binom_cdf_fair_coin
    description: "P(X<=5) for BINOM(10, 0.5) ~ 0.623047"
    formula: "=BINOM.DIST(5, 10, 0.5, TRUE)"

  - id: binom_edge_zero_success
    description: "P(X=0) for BINOM(10, 0.5) = 2^-10 ~ 0.000977"
    formula: "=BINOM.DIST(0, 10, 0.5, FALSE)"

  - id: binom_edge_all_success
    description: "P(X=10) for BINOM(10, 0.5) = 2^-10 ~ 0.000977"
    formula: "=BINOM.DIST(10, 10, 0.5, FALSE)"

  - id: binom_out_of_range_is_num
    description: "number_s > trials yields #NUM!"
    formula: "=BINOM.DIST(11, 10, 0.5, FALSE)"

  # -- POISSON.DIST --------------------------------------------------------
  - id: poisson_pmf_mean3
    description: "Poisson(3) PMF at 2 ~ 0.224042"
    formula: "=POISSON.DIST(2, 3, FALSE)"

  - id: poisson_cdf_mean3
    description: "Poisson(3) CDF at 2 ~ 0.423190"
    formula: "=POISSON.DIST(2, 3, TRUE)"

  - id: poisson_zero_count
    description: "Poisson(3) PMF at 0 = e^-3 ~ 0.049787"
    formula: "=POISSON.DIST(0, 3, FALSE)"

  - id: poisson_negative_x_is_num
    description: "x < 0 yields #NUM!"
    formula: "=POISSON.DIST(-1, 3, FALSE)"

  # -- EXPON.DIST ----------------------------------------------------------
  - id: expon_pdf_zero
    description: "Exponential(1) PDF at 0 = lambda = 1"
    formula: "=EXPON.DIST(0, 1, FALSE)"

  - id: expon_cdf_zero
    description: "Exponential CDF at 0 = 0"
    formula: "=EXPON.DIST(0, 1, TRUE)"

  - id: expon_cdf_ln2
    description: "Exponential(1) CDF at ln(2) = 0.5 (median)"
    formula: "=EXPON.DIST(LN(2), 1, TRUE)"

  - id: expon_negative_lambda_is_num
    description: "lambda <= 0 yields #NUM!"
    formula: "=EXPON.DIST(1, -1, TRUE)"

  # -- CONFIDENCE / CONFIDENCE.NORM / CONFIDENCE.T -------------------------
  - id: confidence_norm_basic
    description: "z_{0.975} * 20 / sqrt(100) ~ 3.919928"
    formula: "=CONFIDENCE(0.05, 20, 100)"

  - id: confidence_norm_dot_matches
    description: "CONFIDENCE.NORM equals CONFIDENCE for the same inputs"
    formula: "=CONFIDENCE.NORM(0.05, 20, 100)"

  - id: confidence_alpha_zero_is_num
    formula: "=CONFIDENCE(0, 20, 100)"

  - id: confidence_t_basic
    description: "t_{0.975, 29} * 20 / sqrt(30) ~ 7.468123"
    formula: "=CONFIDENCE.T(0.05, 20, 30)"

  - id: confidence_t_size_one_is_div0
    description: "df = size - 1 = 0 collapses the distribution; Excel returns #DIV/0!"
    formula: "=CONFIDENCE.T(0.05, 20, 1)"

  # -- BINOM.INV / CRITBINOM -----------------------------------------------
  - id: binom_inv_median
    description: "Smallest k with P(X<=k) >= 0.5 under BINOM(100, 0.5) is 50"
    formula: "=BINOM.INV(100, 0.5, 0.5)"

  - id: binom_inv_three_quarter
    description: "Smallest k with P(X<=k) >= 0.75 under BINOM(100, 0.5) is 53"
    formula: "=BINOM.INV(100, 0.5, 0.75)"

  - id: critbinom_matches_binom_inv
    description: "CRITBINOM is the pre-2010 alias for BINOM.INV"
    formula: "=CRITBINOM(100, 0.5, 0.75)"

  - id: binom_inv_alpha_zero
    formula: "=BINOM.INV(10, 0.3, 0)"

  # -- FISHER / FISHERINV --------------------------------------------------
  - id: fisher_zero
    formula: "=FISHER(0)"

  - id: fisher_half
    description: "0.5 * ln(3) ~ 0.549306"
    formula: "=FISHER(0.5)"

  - id: fisher_boundary_is_num
    formula: "=FISHER(1)"

  - id: fisherinv_round_trip
    description: "FISHERINV(FISHER(0.3)) = 0.3"
    formula: "=FISHERINV(FISHER(0.3))"

  - id: fisherinv_zero
    formula: "=FISHERINV(0)"

  # -- GAUSS / PHI ---------------------------------------------------------
  - id: gauss_zero
    formula: "=GAUSS(0)"

  - id: gauss_one
    description: "NORM.S.DIST(1, TRUE) - 0.5 ~ 0.341345"
    formula: "=GAUSS(1)"

  - id: phi_zero
    description: "1 / sqrt(2*pi) ~ 0.398942"
    formula: "=PHI(0)"

  - id: phi_one
    description: "exp(-0.5) / sqrt(2*pi) ~ 0.241971"
    formula: "=PHI(1)"

  # -- NEGBINOM.DIST / NEGBINOMDIST ----------------------------------------
  - id: negbinom_dist_pmf
    description: "C(14,4) * 0.25^5 * 0.75^10 ~ 0.055049"
    formula: "=NEGBINOM.DIST(10, 5, 0.25, FALSE)"

  - id: negbinom_dist_cdf
    description: "CDF strictly exceeds the PMF at the same point"
    formula: "=NEGBINOM.DIST(10, 5, 0.25, TRUE)"

  - id: negbinomdist_legacy_matches
    description: "Legacy 3-arg spelling always returns the PMF"
    formula: "=NEGBINOMDIST(10, 5, 0.25)"

  - id: negbinom_dist_prob_zero_is_num
    formula: "=NEGBINOM.DIST(10, 5, 0, FALSE)"

  # -- BINOM.DIST.RANGE ----------------------------------------------------
  - id: binom_dist_range_basic
    description: "PMF(4)+PMF(5)+PMF(6) for BINOM(10, 0.5) = 672/1024 = 0.65625"
    formula: "=BINOM.DIST.RANGE(10, 0.5, 4, 6)"

  - id: binom_dist_range_three_arg_matches_pmf
    description: "3-arg form is a single-point PMF query"
    formula: "=BINOM.DIST.RANGE(10, 0.5, 5)"

  - id: binom_dist_range_reversed_is_num
    formula: "=BINOM.DIST.RANGE(10, 0.5, 6, 4)"

  - id: binom_dist_range_full_support
    description: "Full-support sum over BINOM(10, 0.5) equals 1"
    formula: "=BINOM.DIST.RANGE(10, 0.5, 0, 10)"

  - id: binom_dist_range_p_out_of_range_is_num
    description: "p > 1 yields #NUM!"
    formula: "=BINOM.DIST.RANGE(10, 1.5, 0, 10)"

  # -- BINOM.INV / CRITBINOM (extra perspectives) --------------------------
  - id: binom_inv_alpha_one_boundary
    description: "alpha=1 returns trials"
    formula: "=BINOM.INV(10, 0.3, 1)"

  - id: binom_inv_alpha_negative_is_num
    description: "alpha < 0 yields #NUM!"
    formula: "=BINOM.INV(10, 0.3, -0.1)"

  - id: critbinom_alpha_zero
    description: "CRITBINOM at alpha=0 returns 0"
    formula: "=CRITBINOM(10, 0.3, 0)"

  - id: critbinom_basic_median
    description: "CRITBINOM(20, 0.4, 0.5) = 8 matches BINOM.INV"
    formula: "=CRITBINOM(20, 0.4, 0.5)"

  - id: critbinom_alpha_out_of_range_is_num
    description: "alpha > 1 yields #NUM!"
    formula: "=CRITBINOM(10, 0.5, 1.5)"

  - id: critbinom_negative_trials_is_num
    description: "trials < 0 yields #NUM!"
    formula: "=CRITBINOM(-1, 0.5, 0.5)"

  # -- CONFIDENCE / CONFIDENCE.NORM (extra perspectives) -------------------
  - id: confidence_alpha_one_is_num
    description: "alpha >= 1 yields #NUM!"
    formula: "=CONFIDENCE(1, 20, 100)"

  - id: confidence_size_one
    description: "Single-observation sample still produces an interval"
    formula: "=CONFIDENCE(0.05, 20, 1)"

  - id: confidence_large_stddev
    description: "Linear in stddev: doubling stddev doubles half-width"
    formula: "=CONFIDENCE(0.05, 100, 100)"

  - id: confidence_norm_alpha_zero_is_num
    description: "CONFIDENCE.NORM with alpha <= 0 yields #NUM!"
    formula: "=CONFIDENCE.NORM(0, 20, 100)"

  - id: confidence_norm_size_one
    description: "CONFIDENCE.NORM mirrors CONFIDENCE for n=1"
    formula: "=CONFIDENCE.NORM(0.05, 20, 1)"

  - id: confidence_norm_large_stddev
    description: "CONFIDENCE.NORM scales linearly with stddev"
    formula: "=CONFIDENCE.NORM(0.05, 100, 100)"

  - id: confidence_norm_alpha_one_is_num
    description: "CONFIDENCE.NORM with alpha >= 1 yields #NUM!"
    formula: "=CONFIDENCE.NORM(1, 20, 100)"

  # -- CONFIDENCE.T (extra perspectives) -----------------------------------
  - id: confidence_t_alpha_zero_is_num
    description: "alpha <= 0 yields #NUM!"
    formula: "=CONFIDENCE.T(0, 20, 30)"

  - id: confidence_t_alpha_one_is_num
    description: "alpha >= 1 yields #NUM!"
    formula: "=CONFIDENCE.T(1, 20, 30)"

  - id: confidence_t_large_sample
    description: "Large n converges toward the normal-z half-width"
    formula: "=CONFIDENCE.T(0.05, 20, 1000)"

  # -- EXPON.DIST (extra perspective) --------------------------------------
  - id: expon_pdf_lambda_two_at_one
    description: "Exponential(2) PDF at 1 = 2*exp(-2) ~ 0.270671"
    formula: "=EXPON.DIST(1, 2, FALSE)"

  # -- FISHER / FISHERINV (extra perspectives) -----------------------------
  - id: fisher_negative_half
    description: "FISHER is odd: FISHER(-0.5) = -FISHER(0.5)"
    formula: "=FISHER(-0.5)"

  - id: fisher_out_of_range_is_num
    description: "x outside (-1, 1) yields #NUM!"
    formula: "=FISHER(2)"

  - id: fisherinv_one
    description: "FISHERINV(1) = tanh(1) ~ 0.761594"
    formula: "=FISHERINV(1)"

  - id: fisherinv_negative
    description: "FISHERINV is odd: FISHERINV(-1) = -tanh(1)"
    formula: "=FISHERINV(-1)"

  - id: fisherinv_large
    description: "Large positive y saturates near 1"
    formula: "=FISHERINV(5)"

  # -- GAUSS (extra perspectives) ------------------------------------------
  - id: gauss_negative
    description: "GAUSS is odd: GAUSS(-1) = -GAUSS(1)"
    formula: "=GAUSS(-1)"

  - id: gauss_two
    description: "NORM.S.DIST(2, TRUE) - 0.5 ~ 0.477250"
    formula: "=GAUSS(2)"

  - id: gauss_large
    description: "Large z approaches 0.5 (upper tail vanishes)"
    formula: "=GAUSS(6)"

  # -- NEGBINOM.DIST (extra perspectives) ----------------------------------
  - id: negbinom_dist_zero_failures
    description: "PMF at f=0 = p^r"
    formula: "=NEGBINOM.DIST(0, 5, 0.25, FALSE)"

  - id: negbinom_dist_prob_one_pmf
    description: "Excel rejects p=1 with #NUM! (degenerate distribution)"
    formula: "=NEGBINOM.DIST(0, 5, 1, FALSE)"

  # -- NEGBINOMDIST (legacy) extra perspectives ----------------------------
  - id: negbinomdist_zero_failures
    description: "Legacy PMF at f=0 = p^r"
    formula: "=NEGBINOMDIST(0, 5, 0.25)"

  - id: negbinomdist_prob_zero_is_num
    description: "Legacy alias rejects p=0 with #NUM!"
    formula: "=NEGBINOMDIST(10, 5, 0)"

  - id: negbinomdist_prob_out_of_range_is_num
    description: "Legacy alias rejects p > 1 with #NUM!"
    formula: "=NEGBINOMDIST(10, 5, 1.5)"

  - id: negbinomdist_large_count
    description: "Larger failure count produces a smaller PMF tail"
    formula: "=NEGBINOMDIST(20, 5, 0.25)"

  # -- NORM.S.DIST (extra perspectives) ------------------------------------
  - id: norm_s_dist_negative_cdf
    description: "Standard-normal CDF at z=-1 ~ 0.158655"
    formula: "=NORM.S.DIST(-1, TRUE)"

  - id: norm_s_dist_z2_pdf
    description: "Standard-normal PDF at z=2 ~ 0.053991"
    formula: "=NORM.S.DIST(2, FALSE)"

  # -- NORM.S.INV (extra perspectives) -------------------------------------
  - id: norm_s_inv_lower_tail
    description: "Lower-tail z_{0.025} ~ -1.959964"
    formula: "=NORM.S.INV(0.025)"

  - id: norm_s_inv_p_zero_is_num
    description: "p <= 0 yields #NUM!"
    formula: "=NORM.S.INV(0)"

  - id: norm_s_inv_p_one_is_num
    description: "p >= 1 yields #NUM!"
    formula: "=NORM.S.INV(1)"

  # -- PHI (extra perspectives) --------------------------------------------
  - id: phi_negative
    description: "PHI is symmetric: PHI(-1) = PHI(1)"
    formula: "=PHI(-1)"

  - id: phi_two
    description: "Standard-normal PDF at 2 ~ 0.053991"
    formula: "=PHI(2)"

  - id: phi_large
    description: "Large |x| drives the PDF to ~0"
    formula: "=PHI(6)"

  # -- POISSON.DIST (extra perspective) ------------------------------------
  - id: poisson_dist_large_mean
    description: "Poisson(10) CDF at 5 ~ 0.067086"
    formula: "=POISSON.DIST(5, 10, TRUE)"
