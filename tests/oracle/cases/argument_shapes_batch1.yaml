suite: argument_shapes_batch1
description: >
  Each argument position of a scalar call the existing suites pin, replaced
  by a cell holding #N/A and by a blank cell; the first literal argument as an
  array constant read through INDEX; the first number as zero and negated.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: atan2_arg1_na_cell
    setup: { B1: "=NA()" }
    formula: "=ATAN2(B1,0)"
  - id: atan2_arg1_blank_cell
    formula: "=ATAN2(B2,0)"
  - id: atan2_arg2_na_cell
    setup: { B1: "=NA()" }
    formula: "=ATAN2(1,B1)"
  - id: atan2_arg2_blank_cell
    formula: "=ATAN2(1,B2)"
  - id: atan2_arg1_array_lifted
    formula: "=INDEX(ATAN2({1,1},0),2)"
  - id: atan2_arg1_zero
    formula: "=ATAN2(0,0)"
  - id: atan2_arg1_negative
    formula: "=ATAN2(-1,0)"
