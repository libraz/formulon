    setup:
      A1: 1
      B1: true
      A2: 3
      B2: 4
      D1: 1
      D2: 2
      D3: 4
      D4: 8
      E1: 1
      E2: 2
      E3: 3
      E4: 4
      G1: 1
      G2: 0
      H1: 0
      H2: 1
    formula: '=MMULT(A1:B2,G1:H2)'
