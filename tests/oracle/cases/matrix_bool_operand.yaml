suite: matrix_bool_operand
description: >
  Whether the numeric-matrix functions refuse a boolean, text, numeric text,
  blank or empty-text cell in a matrix operand, and whether an array constant
  with a boolean behaves like the range.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
