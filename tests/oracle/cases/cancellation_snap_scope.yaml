    A2: 20
    A3: 30
    A4: 40
    A5: 50
    A6: 60
    A7: 70
    B3: '2'
    B4: 0.5
    C1: 1
    C2: 3
    D1: 0.5
    D2: -0.4
    D3: -0.1
    B5: 0.5
    B6: -0.4
    B7: -0.1
    E1: v
    E2: 0.5
    E3: -0.4
    E4: -0.1
    F1: v
    F2: <>x
