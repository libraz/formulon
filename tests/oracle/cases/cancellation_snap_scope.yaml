suite: cancellation_snap_scope
description: 'Where the near-zero cancellation snap applies: aggregates, the AVERAGE family, root array arithmetic'
tolerance:
  abs: 0
  rel: 0
locale: ja-JP
cases:
- id: agg9_sum_o0_ref
  formula: =AGGREGATE(9,0,A1:A3)
  setup: &id001
    A1: 0.5
    A2: -0.4
    A3: -0.1
    C1: 1
    C2: 0.5
- id: agg9_sum_o4_ref
  formula: =AGGREGATE(9,4,A1:A3)
  setup: *id001
- id: agg9_sum_o6_ref
  formula: =AGGREGATE(9,6,A1:A3)
  setup: *id001
- id: agg1_avg_o0_ref
  formula: =AGGREGATE(1,0,A1:A3)
  setup: *id001
- id: agg1_avg_o4_ref
  formula: =AGGREGATE(1,4,A1:A3)
  setup: *id001
- id: agg1_avg_o6_ref
  formula: =AGGREGATE(1,6,A1:A3)
  setup: *id001
- id: agg4_max_o0_ref
  formula: =AGGREGATE(4,0,A1:A3)
  setup: *id001
- id: agg4_max_o4_ref
  formula: =AGGREGATE(4,4,A1:A3)
  setup: *id001
- id: agg4_max_o6_ref
  formula: =AGGREGATE(4,6,A1:A3)
  setup: *id001
- id: agg9_o4_array
  formula: =AGGREGATE(9,4,{0.5,-0.4,-0.1})
- id: agg9_o4_k50
  formula: =AGGREGATE(9,4,{1,-0.99999999999999911})
- id: agg9_o4_k49
  formula: =AGGREGATE(9,4,{1,-0.99999999999999822})
- id: sum_array_lit
  formula: =SUM({0.5,-0.4,-0.1})
- id: subtotal109
  formula: =SUBTOTAL(109,A1:A3)
  setup: *id001
- id: subtotal1
  formula: =SUBTOTAL(1,A1:A3)
  setup: *id001
- id: subtotal101
  formula: =SUBTOTAL(101,A1:A3)
  setup: *id001
- id: root_array_1x1
  formula: ={0.5}-0.4-0.1
- id: root_array_1x2
  formula: ={0.5,1}-0.4-0.1
- id: root_array_2x1_second
  formula: ={1;0.5}-0.4-0.1
- id: root_range_spill
  formula: =A1:A2-0.4-0.1
  setup: *id001
- id: root_range_1cell
  formula: =A1:A1-0.4-0.1
  setup: *id001
- id: root_index_of_array
  formula: =INDEX({0.5,1}-0.4-0.1,1)
- id: root_sequence
  formula: =SEQUENCE(1,1,0.5)-0.4-0.1
- id: agg1_array
  formula: =AGGREGATE(1,4,{0.5,-0.4,-0.1})
  setup: &id002
    A1: 10
    A2: 20
    A3: 30
    A4: 40
    A5: 50
    A6: 60
    A7: 70
    B1: '35'
    B2: true
    B3: '2'
    B4: 0.5
    B5: -0.4
    B6: -0.1
    B7: abc
- id: agg9_ref_snap
  formula: =AGGREGATE(9,4,B4:B6)
  setup: *id002
- id: agg1_ref_snap
  formula: =AGGREGATE(1,4,B4:B6)
  setup: *id002
- id: agg2_ref
  formula: =AGGREGATE(2,4,B4:B6)
  setup: *id002
- id: sub109_ref_snap
  formula: =SUBTOTAL(109,B4:B6)
  setup: *id002
- id: sub1_ref_snap
  formula: =SUBTOTAL(1,B4:B6)
  setup: *id002
- id: avg_ref_snap
  formula: =AVERAGE(B4:B6)
  setup: *id002
- id: avg_lit_snap
  formula: =AVERAGE(0.5,-0.4,-0.1)
  setup: *id002
- id: averagea_ref
  formula: =AVERAGEA(B4:B6)
  setup: *id002
- id: averageif_ref
  formula: =AVERAGEIF(B4:B6,"<>x")
  setup: *id002
- id: root_arr_mul
  formula: ={0.5}*1-0.4-0.1
  setup: *id002
- id: root_arr_paren
  formula: =({0.5}-0.4-0.1)
  setup: *id002
- id: root_arr_in_if
  formula: =IF(TRUE,{0.5}-0.4-0.1)
  setup: *id002
- id: root_arr_plus_ref
  formula: =B4:B4+B5+B6
  setup: *id002
- id: root_arr_mixed
  formula: ={0.5;0.25}-{0.4;0.2}-{0.1;0.05}
  setup: *id002
- id: root_seq_two
  formula: =SEQUENCE(2,1,0.5,0.5)-0.4-0.1
  setup: *id002
- id: avgifs_snap
