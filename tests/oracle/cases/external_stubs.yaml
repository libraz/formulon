suite: external_stubs
description: "Unavailable host-service / connection stubs. These functions are recognized by name and arity, but Formulon deliberately returns a deterministic unavailable surface because the required service, network client, runtime, or OLAP connection is outside the pure calculation engine. Real implementations (ARRAYTOTEXT/FILTERXML), environment-bound functions (INFO/CELL), and real lazy forms (GETPIVOTDATA/PHONETIC) are intentionally not part of this suite."
tolerance: { abs: 1.0e-12, rel: 1.0e-12 }
locale: ja-JP
cases:
  # =========================================================================
  # Each case is `mode: skip-oracle`. Fixed unavailable-surface correctness
  # is enforced by unit tests; oracle parity is impractical because the
  # underlying service / connection is unavailable in the oracle harness.
  # =========================================================================

  - id: external_stub_image
    description: "IMAGE() fetches a network image; Formulon stubs to #VALUE!"
    formula: '=IMAGE("https://example.com/img.png")'

  - id: external_stub_py
    description: "PY() runs Python in the cloud; Formulon stubs to #NAME?"
    formula: '=PY("import math")'

  - id: external_stub_rtd
    description: "RTD() reads from a COM real-time data server; Formulon stubs to #N/A"
    formula: '=RTD("server", "topic", "p1")'

  - id: external_stub_stockhistory
    description: "STOCKHISTORY() pulls market data; Formulon stubs to a fixed-error surface"
    formula: '=STOCKHISTORY("MSFT", DATE(2024,1,1))'

  - id: external_stub_webservice
    description: "WEBSERVICE() makes an HTTP request; Formulon stubs to #VALUE!"
    formula: '=WEBSERVICE("https://example.com")'

  - id: external_stub_copilot
    description: "COPILOT() dispatches to an LLM backend; Formulon stubs to #NAME?"
    formula: '=COPILOT("hello")'

  - id: external_stub_detectlanguage
    description: "DETECTLANGUAGE() calls a translation cloud; Formulon stubs to #NAME?"
    formula: '=DETECTLANGUAGE("hello world")'

  - id: external_stub_translate
    description: "TRANSLATE() calls a translation cloud; Formulon stubs to #NAME?"
    formula: '=TRANSLATE("hello", "en", "ja")'

  - id: external_stub_cubekpimember
    description: "CUBEKPIMEMBER() requires a cube connection; Formulon has none, returns #NAME?"
    formula: '=CUBEKPIMEMBER("conn", "kpi", 1)'

  - id: external_stub_cubemember
    description: "CUBEMEMBER() requires a cube connection; Formulon has none, returns #NAME?"
    formula: '=CUBEMEMBER("conn", "[Measures].[Sales]")'

  - id: external_stub_cubememberproperty
    description: "CUBEMEMBERPROPERTY() requires a cube connection; Formulon has none, returns #NAME?"
    formula: '=CUBEMEMBERPROPERTY("conn", "[Measures].[Sales]", "Caption")'

  - id: external_stub_cuberankedmember
    description: "CUBERANKEDMEMBER() requires a cube connection; Formulon has none, returns #NAME?"
    formula: '=CUBERANKEDMEMBER("conn", "set", 1)'

  - id: external_stub_cubeset
    description: "CUBESET() requires a cube connection; Formulon has none, returns #NAME?"
    formula: '=CUBESET("conn", "{[A].[B]}")'

  - id: external_stub_cubesetcount
    description: "CUBESETCOUNT() requires a cube set; Formulon has none, returns #NAME?"
    formula: '=CUBESETCOUNT(A1)'

  - id: external_stub_cubevalue
    description: "CUBEVALUE() requires a cube connection; Formulon has none, returns #NAME?"
    formula: '=CUBEVALUE("conn", "[Measures].[Sales]")'
