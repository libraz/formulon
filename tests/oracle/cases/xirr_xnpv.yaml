suite: xirr_xnpv
description: XIRR / XNPV — irregular cash-flow NPV and IRR over date schedules
# XIRR and XNPV are compared bit-for-bit against Mac Excel.
tolerance: { abs: 0.0, rel: 0.0 }
locale: ja-JP
cases:
  # -- XNPV ----------------------------------------------------------------
  - id: xnpv_microsoft_doc
    description: "Classic Microsoft XNPV docs fixture: rate=9%, irregular schedule"
    setup:
      A1: -10000
      A2: 2750
      A3: 4250
      A4: 3250
      A5: 2750
      B1: 39448   # 2008-01-01
      B2: 39508   # 2008-03-01
      B3: 39751   # 2008-10-30
      B4: 39859   # 2009-02-15
      B5: 39904   # 2009-04-01
    formula: "=XNPV(0.09, A1:A5, B1:B5)"

  - id: xnpv_zero_rate
    description: "rate=0 collapses XNPV to the sum of the values"
    setup:
      A1: -10000
      A2: 2750
      A3: 4250
      A4: 3250
      A5: 2750
      B1: 39448
      B2: 39508
      B3: 39751
      B4: 39859
      B5: 39904
    formula: "=XNPV(0, A1:A5, B1:B5)"

  - id: xnpv_rate_minus_one_is_num
    description: "rate = -1 drives divisor to zero -> #NUM!"
    setup: { A1: -100, A2: 100, B1: 39448, B2: 39508 }
    formula: "=XNPV(-1, A1:A2, B1:B2)"

  # -- XIRR ----------------------------------------------------------------
  - id: xirr_microsoft_doc
    description: "Classic Microsoft XIRR docs fixture with explicit guess=0.1"
    setup:
      A1: -10000
      A2: 2750
      A3: 4250
      A4: 3250
      A5: 2750
      B1: 39448
      B2: 39508
      B3: 39751
      B4: 39859
      B5: 39904
    formula: "=XIRR(A1:A5, B1:B5, 0.1)"

  - id: xirr_default_guess
    description: "Arity-2 XIRR uses default guess 0.1; same result as explicit case"
    setup:
      A1: -10000
      A2: 2750
      A3: 4250
      A4: 3250
      A5: 2750
      B1: 39448
      B2: 39508
      B3: 39751
      B4: 39859
      B5: 39904
    formula: "=XIRR(A1:A5, B1:B5)"

  - id: xirr_all_positive_is_num
    description: "No sign change in cash flows -> #NUM!"
    setup: { A1: 100, A2: 200, A3: 300, B1: 39448, B2: 39508, B3: 39751 }
    formula: "=XIRR(A1:A3, B1:B3)"

  # =========================================================================
  # Expanded probes: solver convergence edges, schedule irregularities,
  # array shape mismatches, error / blank propagation.
  # =========================================================================

  # -- XNPV: schedule edges -----------------------------------------------
  - id: xnpv_two_flow_minimum
    description: "Minimum schedule: one outflow + one inflow"
    setup:
      A1: -1000
      A2: 1100
      B1: 39448
      B2: 39813   # +1 year
    formula: "=XNPV(0.05, A1:A2, B1:B2)"

  - id: xnpv_negative_rate
    description: "Negative rate (-0.05) — XNPV computes formal NPV with rate<0"
    setup:
      A1: -1000
      A2: 1100
      B1: 39448
      B2: 39813
    formula: "=XNPV(-0.05, A1:A2, B1:B2)"

  - id: xnpv_dates_unsorted
    description: "Excel does not require sorted dates — XNPV uses dates[i]-dates[0] regardless"
    setup:
      A1: -10000
      A2: 4250
      A3: 2750
      B1: 39448
      B2: 39751   # later
      B3: 39508   # earlier (out of order)
    formula: "=XNPV(0.09, A1:A3, B1:B3)"

  - id: xnpv_size_mismatch_is_num
    description: "values length != dates length -> #NUM! (Mac Excel)"
    setup: { A1: -100, A2: 50, B1: 39448 }
    formula: "=XNPV(0.05, A1:A2, B1:B1)"

  - id: xnpv_first_date_after_others_is_num
    description: "Excel: first date in schedule must be the earliest -> if not, #NUM!"
    setup:
      A1: -1000
      A2: 1100
      B1: 39813   # later
      B2: 39448   # earlier
    formula: "=XNPV(0.05, A1:A2, B1:B2)"

  - id: xnpv_blank_in_values_is_zero
    description: "A blank cash-flow cell is treated as zero — Mac Excel does not propagate blank"
    setup:
      A1: -1000
      A3: 1100
      B1: 39448
      B2: 39600
      B3: 39813
    formula: "=XNPV(0.05, A1:A3, B1:B3)"

  - id: xnpv_text_in_values_is_value
    description: "A text cash-flow cell -> #VALUE!"
    setup:
      A1: -1000
      A2: "x"
      A3: 1100
      B1: 39448
      B2: 39600
      B3: 39813
    formula: "=XNPV(0.05, A1:A3, B1:B3)"

  - id: xnpv_error_in_values_propagates
    setup:
      A1: -1000
      A2: { kind: formula, formula: "=NA()" }
      A3: 1100
      B1: 39448
      B2: 39600
      B3: 39813
    formula: "=XNPV(0.05, A1:A3, B1:B3)"

  # -- XIRR: solver edges -------------------------------------------------
  - id: xirr_negative_guess
    description: "Negative guess; Newton-Raphson should still converge"
    setup:
      A1: -10000
      A2: 2750
      A3: 4250
      A4: 3250
      A5: 2750
      B1: 39448
      B2: 39508
      B3: 39751
      B4: 39859
      B5: 39904
    formula: "=XIRR(A1:A5, B1:B5, -0.5)"

  - id: xirr_extreme_guess
    description: "Very high guess (10) — solver may diverge to #NUM! or still converge"
    setup:
      A1: -10000
      A2: 2750
      A3: 4250
      A4: 3250
      A5: 2750
      B1: 39448
      B2: 39508
      B3: 39751
      B4: 39859
      B5: 39904
    formula: "=XIRR(A1:A5, B1:B5, 10)"

  - id: xirr_two_flow_simple
    description: "Two-flow schedule: -1000 / +1100 over 1 year — XIRR ≈ 0.10"
    setup:
      A1: -1000
      A2: 1100
      B1: 39448
      B2: 39813
    formula: "=XIRR(A1:A2, B1:B2)"

  - id: xirr_two_flow_with_loss
    description: "Two-flow with loss: -1000 / +500 -> negative IRR"
    setup:
      A1: -1000
      A2: 500
      B1: 39448
      B2: 39813
    formula: "=XIRR(A1:A2, B1:B2)"

  - id: xirr_all_negative_is_num
    description: "Symmetric to all-positive: no sign change -> #NUM!"
    setup: { A1: -100, A2: -200, A3: -300, B1: 39448, B2: 39508, B3: 39751 }
    formula: "=XIRR(A1:A3, B1:B3)"

  - id: xirr_size_mismatch_is_num
    description: "values length != dates length -> #NUM!"
    setup: { A1: -1000, A2: 1100, B1: 39448 }
    formula: "=XIRR(A1:A2, B1:B1)"

  - id: xirr_blank_in_values
    description: "Blank cash-flow cell treated as zero (matches XNPV blank semantics)"
    setup:
      A1: -1000
      A3: 1100
      B1: 39448
      B2: 39600
      B3: 39813
    formula: "=XIRR(A1:A3, B1:B3)"

  - id: xirr_error_in_values_propagates
    setup:
      A1: -1000
      A2: { kind: formula, formula: "=NA()" }
      A3: 1100
      B1: 39448
      B2: 39600
      B3: 39813
    formula: "=XIRR(A1:A3, B1:B3)"

  - id: xirr_zero_cashflow_padding
    description: "Zero cash flows interleaved — solver still converges"
    setup:
      A1: -1000
      A2: 0
      A3: 0
      A4: 1200
      B1: 39448
      B2: 39600
      B3: 39750
      B4: 39813
    formula: "=XIRR(A1:A4, B1:B4)"

  - id: xirr_text_guess_is_value
    description: "Text guess -> #VALUE!"
    setup: { A1: -1000, A2: 1100, B1: 39448, B2: 39813 }
    formula: "=XIRR(A1:A2, B1:B2, \"x\")"

  - id: xnpv_text_rate_is_value
    description: "Text rate -> #VALUE!"
    setup: { A1: -1000, A2: 1100, B1: 39448, B2: 39813 }
    formula: "=XNPV(\"x\", A1:A2, B1:B2)"

  # -- Argument coercion: Analysis-ToolPak booleans / omitted
  #    arguments, and the near-integer snap of integer arguments --------------
  - id: atp_xnpv_bool
    formula: "=XNPV(TRUE,{1,2},{1,2})"

  - id: atp_xnpv_omit
    formula: "=XNPV(,{-1,2},{1,2})"

  - id: atp_xnpv_boolcell
    setup: { A1: true }
    formula: "=XNPV(A1,{1,2},{1,2})"

  # -- Analysis-ToolPak arguments and near-integer snap, round 2 ---
  - id: a4_xirr_bool
    formula: "=XIRR({-100,110},{TRUE,400})"

  - id: a4_xirr_omit
    formula: "=XIRR(,{1,400})"

  - id: opt_xirr_guess_bool
    formula: "=XIRR({-100,110},{1,400},TRUE)"

  - id: opt_xirr_guess_omit
    formula: "=XIRR({-100,110},{1,400},)"

  - id: xirr_negative_guess_00_gm0p2
    description: "XIRR with a guess in (-1, 0) searches only below zero; -1 and below is #NUM!"
    formula: "=XIRR({-7655.62;3049.09;1527.8},{44382;45951;46005},-0.2)"

  - id: xirr_negative_guess_01_gm0p9
    description: "XIRR with a guess in (-1, 0) searches only below zero; -1 and below is #NUM!"
    formula: "=XIRR({-7655.62;3049.09;1527.8},{44382;45951;46005},-0.9)"

  - id: xirr_negative_guess_02_gm0p99
    description: "XIRR with a guess in (-1, 0) searches only below zero; -1 and below is #NUM!"
    formula: "=XIRR({-6390.17;2529.16;494.31;3.81},{40182;40249;41906;42115},-0.99)"

  - id: xirr_negative_guess_03_gm0p5
    description: "XIRR with a guess in (-1, 0) searches only below zero; -1 and below is #NUM!"
    formula: "=XIRR({-6390.17;2529.16;494.31;3.81},{40182;40249;41906;42115},-0.5)"

  - id: xirr_negative_guess_04_gm0p7
    description: "XIRR with a guess in (-1, 0) searches only below zero; -1 and below is #NUM!"
    formula: "=XIRR({-5735.12;3912.46;-152.91;148.55},{43364;44142;44332;44699},-0.7)"

  - id: xirr_negative_guess_05_gm0p9
    description: "XIRR with a guess in (-1, 0) searches only below zero; -1 and below is #NUM!"
    formula: "=XIRR({-5735.12;3912.46;-152.91;148.55},{43364;44142;44332;44699},-0.9)"

  - id: xirr_negative_guess_06_gm0p2
    description: "XIRR with a guess in (-1, 0) searches only below zero; -1 and below is #NUM!"
    formula: "=XIRR({-5152.23;989.51;42.47;2748.5;-116.35;-131.51},{43249;43290;43586;44288;44704;45187},-0.2)"

  - id: xirr_negative_guess_07_gm0p2
    description: "XIRR with a guess in (-1, 0) searches only below zero; -1 and below is #NUM!"
    formula: "=XIRR({-5735.12;3912.46;-152.91;148.55},{43364;44142;44332;44699},-0.2)"

  - id: xirr_negative_guess_08_gm0p9
    description: "XIRR with a guess in (-1, 0) searches only below zero; -1 and below is #NUM!"
    formula: "=XIRR({-6390.17;2529.16;494.31;3.81},{40182;40249;41906;42115},-0.9)"

  - id: xirr_negative_guess_09_gm0p4
    description: "XIRR with a guess in (-1, 0) searches only below zero; -1 and below is #NUM!"
    formula: "=XIRR({-7655.62;3049.09;1527.8},{44382;45951;46005},-0.4)"

  - id: xirr_negative_guess_10_gm1
    description: "XIRR with a guess in (-1, 0) searches only below zero; -1 and below is #NUM!"
    formula: "=XIRR({-5735.12;3912.46;-152.91;148.55},{43364;44142;44332;44699},-1)"

  - id: xirr_negative_guess_11_gm1p5
    description: "XIRR with a guess in (-1, 0) searches only below zero; -1 and below is #NUM!"
    formula: "=XIRR({-5735.12;3912.46;-152.91;148.55},{43364;44142;44332;44699},-1.5)"

  - id: xirr_solver_widening_00
    description: "XIRR search below zero widens the bracket as Excel does"
    formula: "=XIRR({-6390.17;2529.16;494.31;3.81},{40182;40249;41906;42115},-0.02)"

  - id: xirr_solver_widening_01
    description: "XIRR search below zero widens the bracket as Excel does"
    formula: "=XIRR({-5152.23;989.51;42.47;2748.5;-116.35;-131.51},{43249;43290;43586;44288;44704;45187},-0.02)"

  - id: xirr_solver_widening_02
    description: "XIRR search below zero widens the bracket as Excel does"
    formula: "=XIRR({-1000;100;100;100},{43831;44197;44562;44927},-0.3)"

  - id: xirr_solver_widening_03
    description: "XIRR search below zero widens the bracket as Excel does"
    formula: "=XIRR({-7655.62;3049.09;1527.8},{44382;45951;46005},-0.005)"

  - id: xirr_solver_widening_04
    description: "XIRR search below zero widens the bracket as Excel does"
    formula: "=XIRR({-5152.23;989.51;42.47;2748.5;-116.35;-131.51},{43249;43290;43586;44288;44704;45187},-0.12)"

  - id: xirr_solver_widening_05
    description: "XIRR search below zero widens the bracket as Excel does"
    formula: "=XIRR({-6390.17;2529.16;494.31;3.81},{40182;40249;41906;42115},-0.1)"

  - id: xirr_solver_widening_06
    description: "XIRR search below zero widens the bracket as Excel does"
    formula: "=XIRR({-1000;100;100;100},{43831;44197;44562;44927},-0.12)"

  - id: xirr_solver_widening_07
    description: "XIRR search below zero widens the bracket as Excel does"
    formula: "=XIRR({-1000;100;100;100},{43831;44197;44562;44927},-0.005)"

  - id: xirr_solver_widening_08
    description: "XIRR search below zero widens the bracket as Excel does"
    formula: "=XIRR({-6390.17;2529.16;494.31;3.81},{40182;40249;41906;42115},-0.05)"

  - id: xirr_solver_widening_09
    description: "XIRR search below zero widens the bracket as Excel does"
    formula: "=XIRR({-1000;100;100;100},{43831;44197;44562;44927},-0.05)"

  - id: xirr_solver_widening_10
    description: "XIRR search below zero widens the bracket as Excel does"
    formula: "=XIRR({-6390.17;2529.16;494.31;3.81},{40182;40249;41906;42115},-0.15)"

  - id: xirr_solver_widening_11
    description: "XIRR search below zero widens the bracket as Excel does"
    formula: "=XIRR({-5735.12;3912.46;-152.91;148.55},{43364;44142;44332;44699},-0.005)"

  - id: xirr_solver_edge_00
    description: "XIRR solver edges: single flow, flipped guess, zero discount factor"
    formula: "=XIRR({-100},{43831})"

  - id: xirr_solver_edge_01
    description: "XIRR solver edges: single flow, flipped guess, zero discount factor"
    formula: "=XIRR({-100;50},{43831;44196},1)"

  - id: xirr_solver_edge_02
    description: "XIRR solver edges: single flow, flipped guess, zero discount factor"
    formula: "=XIRR({-1000;300;300;300;300},{43831;44196;44561;44926;45291},-0.3)"

  - id: xirr_solver_edge_03
    description: "XIRR solver edges: single flow, flipped guess, zero discount factor"
    formula: "=XIRR({-1000;1000},{43831;44196},-0.1)"

  - id: xirr_solver_edge_04
    description: "XIRR solver edges: single flow, flipped guess, zero discount factor"
    formula: "=XIRR({100;-50},{43831;44196},0.1)"

  - id: xirr_solver_edge_05
    description: "XIRR solver edges: single flow, flipped guess, zero discount factor"
    formula: "=XIRR({-100;150},{43831;44196},1E+300)"
