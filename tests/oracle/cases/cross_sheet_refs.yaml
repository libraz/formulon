suite: cross_sheet_refs
description: >
  Cross-sheet and 3-D references. The case formula sits at Sheet1!Z1 (the
  oracle driver convention) and reaches into other sheets via direct
  Sheet2!A1 references, INDIRECT("Sheet2!A1") runtime resolution, and
  Excel's 3-D-range syntax (Sheet1:Sheet3!A1). Setup keys carry the
  Sheet!Addr form; the driver creates the referenced sheet inside the
  per-case workbook on first use, and the C++ verifier mirrors that
  inside a single Workbook by adding sheets via add_sheet on first
  occurrence.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  # =========================================================================
  # Direct cross-sheet ref. Sheet2!A1 holds 42; the formula reads it back.
  # =========================================================================

  - id: direct_sheet2_a1
    description: 'Direct ref =Sheet2!A1 with Sheet2!A1 = 42 -> 42'
    setup:
      'Sheet2!A1': 42
    formula: '=Sheet2!A1'

  # =========================================================================
  # SUM aggregating across two sheets. Sheet2!A1=10, Sheet3!A1=20 ->
  # SUM(Sheet2!A1, Sheet3!A1) = 30.
  # =========================================================================

  - id: sum_across_two_sheets
    description: '=SUM(Sheet2!A1, Sheet3!A1) with values 10 and 20 -> 30'
    setup:
      'Sheet2!A1': 10
      'Sheet3!A1': 20
    formula: '=SUM(Sheet2!A1, Sheet3!A1)'

  # =========================================================================
  # INDIRECT resolving a runtime-built cross-sheet address. Confirms the
  # text-to-ref path handles the sheet qualifier.
  # =========================================================================

  - id: indirect_cross_sheet
    description: '=INDIRECT("Sheet2!A1") with Sheet2!A1 = 7 -> 7'
    setup:
      'Sheet2!A1': 7
    formula: '=INDIRECT("Sheet2!A1")'

  - id: indirect_unquoted_non_ascii_sheet
    description: '=INDIRECT("売上!A1") with 売上!A1 = 11 -> 11; the unquoted non-ASCII sheet name is accepted'
    setup:
      '売上!A1': 11
    formula: '=INDIRECT("売上!A1")'

  - id: indirect_unquoted_dotted_sheet
    description: '=INDIRECT("Sheet.1!A1") with Sheet.1!A1 = 13 -> 13; the unquoted dotted sheet name is accepted'
    setup:
      'Sheet.1!A1': 13
    formula: '=INDIRECT("Sheet.1!A1")'

  # =========================================================================
  # 3-D range. SUM(Sheet2:Sheet3!A1) iterates over A1 on Sheet2 and Sheet3
  # (inclusive). Mac and Win Excel resolve the sheet range by position in
  # the workbook, not by name pattern, so we make Sheet2 come before
  # Sheet3 by writing setup in that order. The driver appends new sheets
  # to the end on creation, preserving order.
  # =========================================================================

  - id: three_d_sum_two_sheet_span
    description: '=SUM(Sheet2:Sheet3!A1) with Sheet2!A1=3, Sheet3!A1=4 -> 7'
    setup:
      'Sheet2!A1': 3
      'Sheet3!A1': 4
    formula: '=SUM(Sheet2:Sheet3!A1)'

  # =========================================================================
  # Quoted sheet name with a space. ADDRESS-builder coverage already pins
  # the text shape; here we exercise the runtime ref-resolution path.
  # =========================================================================

  - id: quoted_sheet_name_with_space
    description: "='My Sheet'!A1 with 'My Sheet'!A1 = 99 -> 99"
    setup:
      "'My Sheet'!A1": 99
    formula: "='My Sheet'!A1"

  # =========================================================================
  # Cross-sheet ref to a missing sheet -> #REF!. The setup intentionally
  # does not write to Sheet9, and Excel evaluates =Sheet9!A1 against a
  # nonexistent sheet as the runtime #REF! sentinel.
  # =========================================================================

  - id: missing_sheet_is_ref_error
    description: '=Sheet9!A1 with Sheet9 absent from the workbook -> #REF!'
    setup:
      'Sheet2!A1': 0
    formula: '=Sheet9!A1'

  # =========================================================================
  # 3-D MAX. Probes that the aggregator visits both endpoints inclusively.
  # =========================================================================

  - id: three_d_max
    description: '=MAX(Sheet2:Sheet3!A1) with Sheet2!A1=5, Sheet3!A1=12 -> 12'
    setup:
      'Sheet2!A1': 5
      'Sheet3!A1': 12
    formula: '=MAX(Sheet2:Sheet3!A1)'

  # =========================================================================
  # 3-D whole-column scan over dynamic-array spills. Each sheet contributes
  # SEQUENCE(3,2) to A1:B3, so the B-column sums are 12 + 30 + 48 = 90.
  # This pins both the inclusive sheet span and the populated extent on the
  # referenced whole column; the remaining rows of B:B are phantom.
  # =========================================================================

  - id: three_d_sum_spilled_whole_column
    description: '=SUM(Sheet1:Sheet3!B:B) with A1=SEQUENCE(3,2,start=1/7/13) on Sheet1/2/3 -> 90; pins 3-D whole-column spill extent.'
    setup:
      'Sheet1!A1': '=SEQUENCE(3,2,1)'
      'Sheet2!A1': '=SEQUENCE(3,2,7)'
      'Sheet3!A1': '=SEQUENCE(3,2,13)'
    formula: '=SUM(Sheet1:Sheet3!B:B)'

  - id: ref3d_whole_column_then_cell
    description: 'A 3-D whole-column reference continued by a cell is #VALUE!'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(Sheet2:Sheet3!A:A:B2)'

  - id: ref3d_cell_then_whole_column
    description: 'A 3-D cell range continued by a whole column is #VALUE!'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(Sheet2:Sheet3!B2:A:A)'

  - id: ref3d_whole_row_then_cell
    description: 'A 3-D whole-row reference continued by a cell is #VALUE!'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(Sheet2:Sheet3!1:1:B3)'

  - id: ref3d_column_span_then_cell
    description: 'A 3-D column span continued by a cell is #VALUE!'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(Sheet2:Sheet3!A:B:C1)'

  - id: ref3d_cell_range_chain
    description: 'A 3-D cell range continued by a cell is #VALUE!'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(Sheet2:Sheet3!A1:B2:C3)'

  - id: ref3d_column_chain
    description: 'A 3-D whole-column range continued by another column is #VALUE!'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(Sheet2:Sheet3!A:A:B:B)'

  - id: ref3d_row_chain
    description: 'A 3-D whole-row range continued by another row is #VALUE!'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(Sheet2:Sheet3!1:1:2:2)'

  - id: ref3d_chain_into_sheet_ref
    description: 'A 3-D range continued by a sheet reference is #VALUE!'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(Sheet2:Sheet3!A1:B2:Sheet2!C3)'

  - id: ref3d_chain_rows
    description: 'ROWS over a 3-D chain is #VALUE!'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=ROWS(Sheet2:Sheet3!A:A:B2)'

  - id: ref3d_cell_range_sum
    description: 'A 3-D cell range sums over the sheet span'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(Sheet2:Sheet3!A1:B2)'

  - id: ref3d_whole_column_sum
    description: 'A 3-D whole-column reference sums over the sheet span'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(Sheet2:Sheet3!A:A)'

  - id: sheet_whole_column_then_cell
    description: 'A one-sheet whole-column reference continued by a cell is #VALUE!'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(Sheet2!A:A:B2)'

  - id: ref3d_intersect_ref3d
    description: 'Intersecting two 3-D references is #VALUE!'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(Sheet2:Sheet3!A1:B2 Sheet2:Sheet3!B2)'

  - id: ref3d_intersect_cell
    description: 'Intersecting a 3-D reference with a cell is #VALUE!'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(Sheet2:Sheet3!A1:B2 B2)'

  - id: cell_intersect_ref3d
    description: 'Intersecting a cell with a 3-D reference is #VALUE!'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(B2 Sheet2:Sheet3!A1:B2)'

  - id: ref3d_intersect_isref
    description: 'ISREF of an intersection of 3-D references is FALSE'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=ISREF(Sheet2:Sheet3!A1 Sheet2:Sheet3!A1)'

  - id: ref3d_single_cell_range
    description: 'A one-cell 3-D range sums over the sheet span'
    setup:
      'Sheet2!A5': 1
      'Sheet2!B1': 10
      'Sheet2!B3': 100
      'Sheet3!A7': 1000
      'Sheet3!B2': 5
      'Sheet3!C1': 7
    formula: '=SUM(Sheet2:Sheet3!B2:B2)'
