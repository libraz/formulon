suite: valuetotext_general_threshold_probes
description: >
  Probe suite for pinning Mac Excel General-format rendering inside
  VALUETOTEXT(value, 0). Each case isolates one boundary so the
  format_double / format_excel_general implementation can be aligned to
  Mac. Group A: powers of ten across magnitudes (positive). Group B:
  negative-exponent powers of ten (when does General switch to
  scientific?). Group C: representative mantissas with trailing zeros.
  Group D: integer round-trip and very large integers. Group E: signed
  variants and zero. Group F: 15-significant-digit precision.

  Mac probes via xlwings: the formula is typed via formula2 and read back
  through `range.value`, then VALUETOTEXT round-trips the cell value to
  text. The static oracle harness writes the literal numeric in the
  formula and reads back the surfaced text.
tolerance: { abs: 0.0, rel: 0.0 }
locale: ja-JP
cases:
  # ---- Group A: positive powers of ten ----------------------------------
  - id: vtt_general_pos_1e0
    description: "VALUETOTEXT(1) -> 1"
    formula: "=VALUETOTEXT(1)"
  - id: vtt_general_pos_1e1
    description: "VALUETOTEXT(10)"
    formula: "=VALUETOTEXT(10)"
  - id: vtt_general_pos_1e3
    description: "VALUETOTEXT(1000)"
    formula: "=VALUETOTEXT(1000)"
  - id: vtt_general_pos_1e6
    description: "VALUETOTEXT(1000000)"
    formula: "=VALUETOTEXT(1000000)"
  - id: vtt_general_pos_1e9
    description: "VALUETOTEXT(1e9) integer"
    formula: "=VALUETOTEXT(1000000000)"
  - id: vtt_general_pos_1e12
    description: "VALUETOTEXT(1e12) integer"
    formula: "=VALUETOTEXT(1000000000000)"
  - id: vtt_general_pos_1e14
    description: "VALUETOTEXT(1e14) integer"
    formula: "=VALUETOTEXT(100000000000000)"
  - id: vtt_general_pos_1e15
    description: "VALUETOTEXT(1e15) integer"
    formula: "=VALUETOTEXT(1000000000000000)"
  - id: vtt_general_pos_1e16
    description: "VALUETOTEXT(1e16) - boundary of integer fast path"
    formula: "=VALUETOTEXT(10000000000000000)"
  - id: vtt_general_pos_1e17
    description: "VALUETOTEXT(1e17)"
    formula: "=VALUETOTEXT(100000000000000000)"
  - id: vtt_general_pos_1e20
    description: "VALUETOTEXT(1e20)"
    formula: "=VALUETOTEXT(1E20)"

  # ---- Group B: negative-exponent powers of ten -------------------------
  - id: vtt_general_neg_1em1
    description: "VALUETOTEXT(0.1)"
    formula: "=VALUETOTEXT(0.1)"
  - id: vtt_general_neg_1em3
    description: "VALUETOTEXT(0.001)"
    formula: "=VALUETOTEXT(0.001)"
  - id: vtt_general_neg_1em4
    description: "VALUETOTEXT(0.0001) - %g switches here"
    formula: "=VALUETOTEXT(0.0001)"
  - id: vtt_general_neg_1em5
    description: "VALUETOTEXT(1E-5)"
    formula: "=VALUETOTEXT(0.00001)"
  - id: vtt_general_neg_1em6
    description: "VALUETOTEXT(1E-6)"
    formula: "=VALUETOTEXT(0.000001)"
  - id: vtt_general_neg_1em7
    description: "VALUETOTEXT(1E-7)"
    formula: "=VALUETOTEXT(0.0000001)"
  - id: vtt_general_neg_1em8
    description: "VALUETOTEXT(1E-8)"
    formula: "=VALUETOTEXT(0.00000001)"
  - id: vtt_general_neg_1em9
    description: "VALUETOTEXT(1E-9)"
    formula: "=VALUETOTEXT(1E-9)"
  - id: vtt_general_neg_1em10
    description: "VALUETOTEXT(1E-10)"
    formula: "=VALUETOTEXT(1E-10)"
  - id: vtt_general_neg_1em11
    description: "VALUETOTEXT(1E-11)"
    formula: "=VALUETOTEXT(1E-11)"
  - id: vtt_general_neg_1em12
    description: "VALUETOTEXT(1E-12)"
    formula: "=VALUETOTEXT(1E-12)"
  - id: vtt_general_neg_1em13
    description: "VALUETOTEXT(1E-13)"
    formula: "=VALUETOTEXT(1E-13)"
  - id: vtt_general_neg_1em14
    description: "VALUETOTEXT(1E-14)"
    formula: "=VALUETOTEXT(1E-14)"
  - id: vtt_general_neg_1em15
    description: "VALUETOTEXT(1E-15)"
    formula: "=VALUETOTEXT(1E-15)"
  - id: vtt_general_neg_1em20
    description: "VALUETOTEXT(1E-20)"
    formula: "=VALUETOTEXT(1E-20)"

  # ---- Group C: mantissa with leading zeros (the canonical bug case) ---
  - id: vtt_general_mant_7p123_em9
    description: "Anchor case from divergence.yaml: 7.123456E-9"
    formula: "=VALUETOTEXT(7.123456E-9)"
  - id: vtt_general_mant_1p5_em5
    description: "1.5E-5 -> 0.000015"
    formula: "=VALUETOTEXT(1.5E-5)"
  - id: vtt_general_mant_2p71828_em10
    description: "2.71828E-10"
    formula: "=VALUETOTEXT(2.71828E-10)"
  - id: vtt_general_mant_3p14_em8
    description: "3.14159265358979E-8"
    formula: "=VALUETOTEXT(3.14159265358979E-8)"
  - id: vtt_general_mant_9p99_em5
    description: "9.99E-5 (close to 1e-4 boundary)"
    formula: "=VALUETOTEXT(9.99E-5)"
  - id: vtt_general_mant_1p0001_em4
    description: "1.0001E-4 (just past boundary)"
    formula: "=VALUETOTEXT(1.0001E-4)"

  # ---- Group D: integer round-trip and very large integers --------------
  - id: vtt_general_int_123
    description: "VALUETOTEXT(123)"
    formula: "=VALUETOTEXT(123)"
  - id: vtt_general_int_123456789012
    description: "VALUETOTEXT(123456789012) - 12-digit integer"
    formula: "=VALUETOTEXT(123456789012)"
  - id: vtt_general_int_123456789012345
    description: "VALUETOTEXT(123456789012345) - 15-digit integer"
    formula: "=VALUETOTEXT(123456789012345)"
  - id: vtt_general_int_999999999999999
    description: "VALUETOTEXT(999999999999999) - 15 nines"
    formula: "=VALUETOTEXT(999999999999999)"
  - id: vtt_general_int_1234567890123456
    description: "VALUETOTEXT(1234567890123456) - 16-digit integer (above fast path)"
    formula: "=VALUETOTEXT(1234567890123456)"

  # ---- Group E: signed variants and zero --------------------------------
  - id: vtt_general_zero
    description: "VALUETOTEXT(0)"
    formula: "=VALUETOTEXT(0)"
  - id: vtt_general_neg_one
    description: "VALUETOTEXT(-1)"
    formula: "=VALUETOTEXT(-1)"
  - id: vtt_general_neg_small_decimal
    description: "VALUETOTEXT(-0.5)"
    formula: "=VALUETOTEXT(-0.5)"
  - id: vtt_general_neg_tiny_em9
    description: "VALUETOTEXT(-7.123456E-9)"
    formula: "=VALUETOTEXT(-7.123456E-9)"
  - id: vtt_general_neg_huge_pos
    description: "VALUETOTEXT(-1E20)"
    formula: "=VALUETOTEXT(-1E20)"

  # ---- Group F: 15-significant-digit precision --------------------------
  - id: vtt_general_15digits_pi
    description: "VALUETOTEXT(PI()) - 15 sig digits expected"
    formula: "=VALUETOTEXT(PI())"
  - id: vtt_general_15digits_one_third
    description: "VALUETOTEXT(1/3) - 15 sig digits 0.333..."
    formula: "=VALUETOTEXT(1/3)"
  - id: vtt_general_15digits_two_thirds
    description: "VALUETOTEXT(2/3)"
    formula: "=VALUETOTEXT(2/3)"
  - id: vtt_general_trailing_zero_50pct
    description: "VALUETOTEXT(0.5)"
    formula: "=VALUETOTEXT(0.5)"
  - id: vtt_general_trailing_zero_125e5
    description: "VALUETOTEXT(125000)"
    formula: "=VALUETOTEXT(125000)"
