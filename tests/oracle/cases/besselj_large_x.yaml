suite: besselj_large_x
description: BESSELJ at |x| >= 8 and around the phase limit, compared as 15 digits plus the residual
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: besselj_8_0_digits
    description: "BESSELJ(8,0) (leading 15 digits): x = 8 branch boundary, J0 coefficient slip"
    formula: "=TEXT(BESSELJ(8,0),\"0.00000000000000E+00\")"
  - id: besselj_8_0_residual
    description: "BESSELJ(8,0) (residual below the 15 digits)"
    formula: "=TEXT((BESSELJ(8,0))-VALUE(TEXT(BESSELJ(8,0),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: besselj_8_1_digits
    description: "BESSELJ(8,1) (leading 15 digits): x = 8, J1 repeated P coefficient"
    formula: "=TEXT(BESSELJ(8,1),\"0.00000000000000E+00\")"
  - id: besselj_8_1_residual
    description: "BESSELJ(8,1) (residual below the 15 digits)"
    formula: "=TEXT((BESSELJ(8,1))-VALUE(TEXT(BESSELJ(8,1),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: besselj_m7p999_1_digits
    description: "BESSELJ(-7.999,1) (leading 15 digits): just below 8, rational branch"
    formula: "=TEXT(BESSELJ(-7.999,1),\"0.00000000000000E+00\")"
  - id: besselj_m7p999_1_residual
    description: "BESSELJ(-7.999,1) (residual below the 15 digits)"
    formula: "=TEXT((BESSELJ(-7.999,1))-VALUE(TEXT(BESSELJ(-7.999,1),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: besselj_10_1_digits
