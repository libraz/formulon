suite: power_fractional
description: >
  Last-bit behaviour of ^ and POWER for a positive base: a fractional
  exponent goes through exp(log(x)*y) rather than a correctly rounded pow,
  0.5 is a square root, a negative exponent is the reciprocal of the
  positive power, and an integer exponent is square-and-multiply. Values
  far from 1 are scaled so the readback keeps every digit.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - { id: cube_root_8, formula: "=8^(1/3)" }
  - { id: cube_root_8_fn, formula: "=POWER(8,1/3)" }
  - { id: cube_root_27, formula: "=27^(1/3)" }
  - { id: cube_root_2, formula: "=2^(1/3)" }
  - { id: cube_root_7, formula: "=7^(1/3)" }
  - { id: cube_root_1000, formula: "=1000^(1/3)" }
  - { id: cube_root_0_001, formula: "=0.001^(1/3)" }
  - { id: cube_root_1e300_scaled, formula: "=1E300^(1/3)/1E100" }
  - { id: cube_root_1e_neg300_scaled, formula: "=1E-300^(1/3)*1E100" }
  - { id: neg_cube_root_8, formula: "=8^(-1/3)" }
  - { id: neg_cube_root_125, formula: "=125^(-1/3)" }
  - { id: half_2, formula: "=2^0.5" }
  - { id: half_2_fn, formula: "=POWER(2,0.5)" }
  - { id: half_9, formula: "=9^0.5" }
  - { id: tenth_10, formula: "=10^0.1" }
  - { id: seventh_3, formula: "=3^(1/7)" }
  - { id: fifth_32, formula: "=32^0.2" }
  - { id: fifth_2, formula: "=2^0.2" }
  - { id: three_halves_2, formula: "=2^1.5" }
  - { id: e_to_pi, formula: "=EXP(1)^PI()" }
  - { id: integer_square, formula: "=5^2" }
  - { id: integer_1000th, formula: "=1.0001^1000" }
