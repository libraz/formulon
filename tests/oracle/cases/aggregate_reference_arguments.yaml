suite: aggregate_reference_arguments
description: AGGREGATE functions 1-13 accept references only; the array form's k and a fourth array argument evaluate per
  element
tolerance:
  abs: 0
  rel: 0
locale: ja-JP
cases:
- id: agg9_o4_1_2
  formula: =AGGREGATE(9,4,1,2)
  setup: &id001
    A1: 10
    A2: 20
    A3: 30
    A4: 40
    A5: 50
    A6: 60
    A7: 70
    B1: '35'
    B2: true
    B3: '2'
    B4: 0.5
    B5: -0.4
    B6: -0.1
    B7: abc
- id: agg9_o4_B4_B5_B6
  formula: =AGGREGATE(9,4,B4,B5,B6)
  setup: *id001
- id: agg9_o4_A1A3x1
  formula: =AGGREGATE(9,4,A1:A3*1)
  setup: *id001
- id: agg9_o4_A1A3p
  formula: =AGGREGATE(9,4,(A1:A3))
  setup: *id001
- id: agg9_o4_B4B6_1
  formula: =AGGREGATE(9,4,B4:B6,1)
  setup: *id001
- id: agg14_array
  formula: =AGGREGATE(14,4,{3,1,2},1)
  setup: *id001
- id: aggexc_1v_q2
  formula: =AGGREGATE(19,4,{10},2)
  setup: &id002
    A1: 10
    A2: 20
    A3: 30
    A4: 40
    A5: 50
    A6: 60
    A7: 70
    B3: '2'
    B4: 0.5
    C1: 1
    C2: 3
- id: aggpexc_1v
  formula: =AGGREGATE(18,4,{10},0.5)
  setup: *id002
- id: agg9_offset
  formula: =AGGREGATE(9,4,OFFSET(A1,0,0,3))
  setup: *id002
- id: agg9_index
  formula: =AGGREGATE(9,4,INDEX(A1:A3,0,1))
  setup: *id002
- id: agg9_indirect
  formula: =AGGREGATE(9,4,INDIRECT("A1:A3"))
  setup: *id002
- id: agg9_if
  formula: =AGGREGATE(9,4,IF(TRUE,A1:A3))
  setup: *id002
- id: agg9_choose
  formula: =AGGREGATE(9,4,CHOOSE(1,A1:A3))
  setup: *id002
- id: agg9_isect
  formula: =AGGREGATE(9,4,A1:A3 A2:A4)
  setup: *id002
- id: agg9_union
  formula: =AGGREGATE(9,4,(A1,A3))
  setup: *id002
- id: agg9_spill_lit
  formula: =AGGREGATE(9,4,TRUE)
  setup: *id002
- id: agg9_text
  formula: =AGGREGATE(9,4,"1")
  setup: *id002
- id: agg2_lit
  formula: =AGGREGATE(2,4,1)
  setup: *id002
- id: agg3_arr
  formula: =AGGREGATE(3,4,{1,2})
  setup: *id002
- id: agg4_arr
  formula: =AGGREGATE(4,4,{1,2})
  setup: *id002
- id: agg9_ref_then_arr
  formula: =AGGREGATE(9,4,A1,{1,2})
  setup: *id002
- id: agg9_xlookup
  formula: =AGGREGATE(9,4,XLOOKUP(10,A1:A7,A1:A7))
  setup: *id002
- id: agg9_let
  formula: =LET(r,A1:A3,AGGREGATE(9,4,r))
  setup: *id002
- id: agg9_let_arr
  formula: =LET(r,{1,2},AGGREGATE(9,4,r))
  setup: *id002
- id: agg14_computed
  formula: =AGGREGATE(14,4,A1:A3*1,1)
  setup: *id002
- id: agg14_k_arr
  formula: =AGGREGATE(14,4,A1:A3,{1,2})
  setup: *id002
- id: agg14_lit
  formula: =AGGREGATE(14,4,5,1)
  setup: *id002
- id: sub9_offset
  formula: =SUBTOTAL(9,OFFSET(A1,0,0,3))
  setup: *id002
