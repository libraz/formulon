suite: besselj_small_x
description: BESSELJ below |x| = 8 at full precision, compared as 15 digits plus the residual
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: besselj_0p1_0_digits
    description: "BESSELJ(0.1,0) (leading 15 digits)"
    formula: "=TEXT(BESSELJ(0.1,0),\"0.00000000000000E+00\")"
  - id: besselj_0p1_0_residual
    description: "BESSELJ(0.1,0) (residual below the 15 digits)"
    formula: "=TEXT((BESSELJ(0.1,0))-VALUE(TEXT(BESSELJ(0.1,0),\"0.00000000000000E+00\")),\"0.00000000000000E+00\")"
  - id: besselj_1_0_digits
    description: "BESSELJ(1,0) (leading 15 digits)"
    formula: "=TEXT(BESSELJ(1,0),\"0.00000000000000E+00\")"
