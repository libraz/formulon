suite: complex
description: >
  Excel's complex-number family: COMPLEX + the 24 IM* functions. Cases
  focus on the formatting rules (pure real, pure imag, +/-1 coefficient
  elision, alternate 'j' suffix), the arithmetic core (IMSUM / IMSUB /
  IMPRODUCT / IMDIV / IMPOWER) including mixed-suffix error cases, and
  exponential / logarithmic / root operations where floating-point drift
  is most likely. Trigonometric and hyperbolic variants are exercised at
  stable points (z=0, pure real) to keep goldens robust.
tolerance: { abs: 1.0e-5, rel: 1.0e-5 }
locale: ja-JP
cases:
  # -- COMPLEX: formatting table ------------------------------------------
  - id: complex_full_default_suffix
    formula: "=COMPLEX(3,4)"

  - id: complex_full_j_suffix
    formula: "=COMPLEX(3,4,\"j\")"

  - id: complex_pure_imag_plus_one
    description: "imag=+1 collapses to bare 'i'"
    formula: "=COMPLEX(0,1)"

  - id: complex_pure_imag_minus_one
    description: "imag=-1 collapses to '-i'"
    formula: "=COMPLEX(0,-1)"

  - id: complex_pure_imag_five
    formula: "=COMPLEX(0,5)"

  - id: complex_pure_real
    formula: "=COMPLEX(3,0)"

  - id: complex_full_plus_one_imag
    description: "full form, imag=+1 drops the coefficient"
    formula: "=COMPLEX(3,1)"

  - id: complex_full_minus_one_imag
    formula: "=COMPLEX(3,-1)"

  - id: complex_invalid_suffix_is_value
    description: "Suffix other than i/j -> #VALUE!"
    formula: "=COMPLEX(3,4,\"x\")"

  # -- Inspectors ----------------------------------------------------------
  - id: imabs_three_four
    formula: "=IMABS(\"3+4i\")"

  - id: imreal_three_four
    formula: "=IMREAL(\"3+4i\")"

  - id: imaginary_three_four
    formula: "=IMAGINARY(\"3+4i\")"

  - id: imconjugate_three_four
    formula: "=IMCONJUGATE(\"3+4i\")"

  - id: imargument_three_four
    formula: "=IMARGUMENT(\"3+4i\")"

  - id: imargument_zero_is_div0
    formula: "=IMARGUMENT(\"0\")"

  # -- Arithmetic ----------------------------------------------------------
  - id: imsum_two_args
    formula: "=IMSUM(\"1+i\",\"2+3i\")"

  - id: imsum_mixed_suffix_is_value
    description: "Mixing i and j is rejected with #VALUE!"
    formula: "=IMSUM(\"1+i\",\"2+3j\")"

  - id: imsub_basic
    formula: "=IMSUB(\"5+3i\",\"2+i\")"

  - id: improduct_two_args
    description: "(2+i)(3+4i) = 2+11i"
    formula: "=IMPRODUCT(\"2+i\",\"3+4i\")"

  - id: imdiv_one_plus_i_over_one_minus_i
    description: "(1+i)/(1-i) = i; snap_zeros keeps the real part clean"
    formula: "=IMDIV(\"1+i\",\"1-i\")"

  - id: impower_square
    description: "(1+i)^2 = 2i"
    formula: "=IMPOWER(\"1+i\",2)"

  # -- Exponentials / logs / roots -----------------------------------------
  - id: imln_one_plus_i
    formula: "=IMLN(\"1+i\")"

  - id: imsqrt_i
    formula: "=IMSQRT(\"i\")"

  - id: imexp_zero
    formula: "=IMEXP(\"0\")"

  # =========================================================================
  # Expanded probes: trig/hyperbolic family, log variants, more arithmetic
  # forms, error inputs, edge values (zero, large magnitude, branch cuts).
  # =========================================================================

  # -- Trig / hyperbolic at non-trivial points ----------------------------
  - id: imsin_one_plus_i
    description: "sin(1+i) = sin(1)cosh(1) + cos(1)sinh(1)i ≈ 1.298+0.635i"
    formula: "=IMSIN(\"1+i\")"

  - id: imcos_one_plus_i
    description: "cos(1+i) ≈ 0.834-0.989i"
    formula: "=IMCOS(\"1+i\")"

  - id: imtan_one_plus_i
    formula: "=IMTAN(\"1+i\")"

  - id: imsinh_one_plus_i
    formula: "=IMSINH(\"1+i\")"

  - id: imcosh_one_plus_i
    formula: "=IMCOSH(\"1+i\")"

  - id: imsec_one_plus_i
    description: "sec(z) = 1/cos(z) — Excel ja-JP locale check"
    formula: "=IMSEC(\"1+i\")"

  - id: imcsc_one_plus_i
    description: "IMCSC(1+i) -- 1-ULP drift at 15th digit (libm); compare components numerically"
    formula: "=IMCSC(\"1+i\")"
    compare_mode: complex_text
    tolerance: { abs: 1e-14 }

  # -- Logarithm variants ------------------------------------------------
  - id: imlog2_two_plus_i
    description: "IMLOG2(2+i) — base-2 complex logarithm"
    formula: "=IMLOG2(\"2+i\")"

  - id: imlog10_two_plus_i
    formula: "=IMLOG10(\"2+i\")"

  - id: imln_negative_real
    description: "IMLN(-1) = pi*i — branch cut on the negative real axis"
    formula: "=IMLN(\"-1\")"

  - id: imln_zero_is_num
    description: "IMLN(0) is undefined; Excel: #NUM!"
    formula: "=IMLN(\"0\")"

  # -- Arithmetic edge cases ----------------------------------------------
  - id: imsum_three_args
    description: "IMSUM accepts more than 2 args"
    formula: "=IMSUM(\"1+i\",\"2+2i\",\"3+3i\")"

  - id: improduct_three_args
    formula: "=IMPRODUCT(\"1+i\",\"1+i\",\"1+i\")"

  - id: imdiv_by_zero_is_num
    formula: "=IMDIV(\"1+i\",\"0\")"

  - id: improduct_zero_factor
    description: "Zero factor collapses product to 0"
    formula: "=IMPRODUCT(\"3+4i\",\"0\")"

  - id: imsub_self_is_zero
    formula: "=IMSUB(\"3+4i\",\"3+4i\")"

  # -- IMPOWER edges ------------------------------------------------------
  - id: impower_zero_exp
    description: "(any)^0 = 1"
    formula: "=IMPOWER(\"3+4i\",0)"

  - id: impower_negative_exp
    description: "Negative exponent — (1+i)^-1 = 0.5 - 0.5i"
    formula: "=IMPOWER(\"1+i\",-1)"

  - id: impower_fractional_exp
    description: "(1+i)^0.5 = sqrt(z) on principal branch"
    formula: "=IMPOWER(\"1+i\",0.5)"

  - id: impower_zero_base_zero_exp
    description: "0^0 — Excel: 1, but IMPOWER may differ"
    formula: "=IMPOWER(\"0\",0)"

  - id: impower_zero_base_negative_exp_is_num
    formula: "=IMPOWER(\"0\",-2)"

  # -- IMSQRT branch cut -------------------------------------------------
  - id: imsqrt_negative_one
    description: "sqrt(-1) = i (principal branch)"
    formula: "=IMSQRT(\"-1\")"

  - id: imsqrt_negative_real
    description: "sqrt(-4) = 2i"
    formula: "=IMSQRT(\"-4\")"

  - id: imsqrt_zero
    formula: "=IMSQRT(\"0\")"

  # -- Argument across quadrants ------------------------------------------
  - id: imargument_negative_real
    description: "arg(-1) = pi"
    formula: "=IMARGUMENT(\"-1\")"

  - id: imargument_negative_imag
    description: "arg(-i) = -pi/2"
    formula: "=IMARGUMENT(\"-i\")"

  - id: imargument_third_quadrant
    description: "arg(-1-i) = -3pi/4"
    formula: "=IMARGUMENT(\"-1-i\")"

  # -- IMABS edges -------------------------------------------------------
  - id: imabs_zero
    formula: "=IMABS(\"0\")"

  - id: imabs_pure_imag
    formula: "=IMABS(\"5i\")"

  - id: imabs_negative
    formula: "=IMABS(\"-3-4i\")"

  # -- IMEXP edges -------------------------------------------------------
  - id: imexp_pi_i
    description: "exp(pi*i) = -1 (Euler's identity)"
    formula: "=IMEXP(COMPLEX(0, PI()))"

  - id: imexp_one_plus_i
    description: "exp(1+i) = e*cos(1) + e*sin(1)*i"
    formula: "=IMEXP(\"1+i\")"

  # -- Error / parse edges -----------------------------------------------
  - id: imreal_invalid_string_is_num
    formula: "=IMREAL(\"abc\")"

  - id: imsum_error_arg_propagates
    formula: "=IMSUM(\"1+i\", #REF!)"

  - id: improduct_one_arg
    description: "IMPRODUCT with single arg returns that arg"
    formula: "=IMPRODUCT(\"3+4i\")"

  # -- COMPLEX with text args ---------------------------------------------
  - id: complex_text_real_is_value
    formula: "=COMPLEX(\"x\",4)"

  - id: complex_blank_real_is_zero
    description: "Blank real coerces to 0"
    setup: {}
    formula: "=COMPLEX(A1,4)"

  # =========================================================================
  # Closure expansion: per-function perspective coverage to satisfy the
  # 5-behaviors-per-member threshold for the `complex` closure family.
  # Each block below adds the minimum number of cases needed to make the
  # member declare 5 distinct probes in tools/catalog/behaviors.yaml.
  # =========================================================================

  # -- IMABS extra perspective --------------------------------------------
  - id: imabs_pure_real
    description: "|3+0i| = 3 — pure real magnitude"
    formula: "=IMABS(\"3\")"

  # -- IMAGINARY perspectives ---------------------------------------------
  - id: imaginary_pure_real
    description: "Imaginary(3+0i) = 0"
    formula: "=IMAGINARY(\"3\")"

  - id: imaginary_pure_imag
    description: "Imaginary(5i) = 5"
    formula: "=IMAGINARY(\"5i\")"

  - id: imaginary_negative_imag
    description: "Imaginary(2-3i) = -3"
    formula: "=IMAGINARY(\"2-3i\")"

  - id: imaginary_j_suffix
    description: "Imaginary(3+4j) — j-suffix form"
    formula: "=IMAGINARY(\"3+4j\")"

  # -- IMCONJUGATE perspectives ------------------------------------------
  - id: imconjugate_pure_real
    description: "conj(3) = 3 — real has no flip"
    formula: "=IMCONJUGATE(\"3\")"

  - id: imconjugate_pure_imag
    description: "conj(5i) = -5i"
    formula: "=IMCONJUGATE(\"5i\")"

  - id: imconjugate_negative_imag
    description: "conj(3-4i) = 3+4i"
    formula: "=IMCONJUGATE(\"3-4i\")"

  - id: imconjugate_double_is_identity
    description: "conj(conj(z)) = z"
    formula: "=IMCONJUGATE(IMCONJUGATE(\"3+4i\"))"

  # -- IMCOS perspectives -------------------------------------------------
  - id: imcos_zero
    description: "cos(0) = 1+0i"
    formula: "=IMCOS(\"0\")"

  - id: imcos_pure_real
    description: "cos(1) — pure real input matches scalar cos"
    formula: "=IMCOS(\"1\")"

  - id: imcos_pure_imag
    description: "cos(i) = cosh(1)+0i"
    formula: "=IMCOS(\"i\")"

  - id: imcos_negative_real
    description: "cos(-1) = cos(1) — even function"
    formula: "=IMCOS(\"-1\")"

  # -- IMCOSH perspectives ------------------------------------------------
  - id: imcosh_zero
    description: "cosh(0) = 1+0i"
    formula: "=IMCOSH(\"0\")"

  - id: imcosh_pure_real
    description: "cosh(1) — matches scalar cosh"
    formula: "=IMCOSH(\"1\")"

  - id: imcosh_pure_imag
    description: "cosh(i) = cos(1)+0i"
    formula: "=IMCOSH(\"i\")"

  - id: imcosh_negative_real
    description: "cosh(-1) = cosh(1) — even function"
    formula: "=IMCOSH(\"-1\")"

  # -- IMCSC perspectives -------------------------------------------------
  - id: imcsc_pure_real
    description: "csc(1) = 1/sin(1) — real input"
    formula: "=IMCSC(\"1\")"

  - id: imcsc_pure_imag
    description: "csc(i) = -i/sinh(1)"
    formula: "=IMCSC(\"i\")"

  - id: imcsc_negative_real
    description: "csc(-1) = -csc(1) — odd function"
    formula: "=IMCSC(\"-1\")"

  - id: imcsc_zero_is_num
    description: "csc(0) is undefined — Excel: #NUM!"
    formula: "=IMCSC(\"0\")"

  # -- IMDIV perspectives -------------------------------------------------
  - id: imdiv_by_real
    description: "(3+4i)/2 = 1.5+2i"
    formula: "=IMDIV(\"3+4i\",\"2\")"

  - id: imdiv_by_pure_imag
    description: "(3+4i)/i = 4-3i"
    formula: "=IMDIV(\"3+4i\",\"i\")"

  - id: imdiv_self_is_one
    description: "z/z = 1+0i (real)"
    formula: "=IMDIV(\"3+4i\",\"3+4i\")"

  # -- IMEXP perspectives -------------------------------------------------
  - id: imexp_pure_real
    description: "exp(1) = e+0i — matches scalar exp"
    formula: "=IMEXP(\"1\")"

  - id: imexp_negative_real
    description: "exp(-1) = 1/e+0i"
    formula: "=IMEXP(\"-1\")"

  # -- IMLN perspectives --------------------------------------------------
  - id: imln_one
    description: "ln(1) = 0+0i — unit"
    formula: "=IMLN(\"1\")"

  - id: imln_pure_imag
    description: "ln(i) = (pi/2)i"
    formula: "=IMLN(\"i\")"

  # -- IMLOG10 perspectives -----------------------------------------------
  - id: imlog10_one
    description: "log10(1) = 0+0i"
    formula: "=IMLOG10(\"1\")"

  - id: imlog10_pure_real
    description: "log10(10) = 1+0i — matches scalar log10"
    formula: "=IMLOG10(\"10\")"

  - id: imlog10_pure_imag
    description: "log10(i) = (pi/(2*ln(10)))i"
    formula: "=IMLOG10(\"i\")"

  - id: imlog10_negative_real
    description: "log10(-1) = (pi/ln(10))i — branch cut"
    formula: "=IMLOG10(\"-1\")"

  # -- IMLOG2 perspectives ------------------------------------------------
  - id: imlog2_one
    description: "log2(1) = 0+0i"
    formula: "=IMLOG2(\"1\")"

  - id: imlog2_pure_real
    description: "log2(2) = 1+0i — matches scalar log2"
    formula: "=IMLOG2(\"2\")"

  - id: imlog2_pure_imag
    description: "log2(i) = (pi/(2*ln(2)))i"
    formula: "=IMLOG2(\"i\")"

  - id: imlog2_negative_real
    description: "log2(-1) = (pi/ln(2))i — branch cut"
    formula: "=IMLOG2(\"-1\")"

  # -- IMPRODUCT extra perspective ----------------------------------------
  - id: improduct_i_times_i
    description: "i*i = -1+0i — imaginary unit identity"
    formula: "=IMPRODUCT(\"i\",\"i\")"

  # -- IMREAL perspectives ------------------------------------------------
  - id: imreal_pure_imag
    description: "Real(5i) = 0"
    formula: "=IMREAL(\"5i\")"

  - id: imreal_pure_real
    description: "Real(7) = 7"
    formula: "=IMREAL(\"7\")"

  - id: imreal_negative_real_part
    description: "Real(-3+4i) = -3"
    formula: "=IMREAL(\"-3+4i\")"

  # -- IMSEC perspectives -------------------------------------------------
  - id: imsec_zero
    description: "sec(0) = 1+0i"
    formula: "=IMSEC(\"0\")"

  - id: imsec_pure_real
    description: "sec(1) = 1/cos(1)"
    formula: "=IMSEC(\"1\")"

  - id: imsec_pure_imag
    description: "sec(i) = 1/cosh(1)+0i"
    formula: "=IMSEC(\"i\")"

  - id: imsec_negative_real
    description: "sec(-1) = sec(1) — even function"
    formula: "=IMSEC(\"-1\")"

  # -- IMSIN perspectives -------------------------------------------------
  - id: imsin_zero
    description: "sin(0) = 0+0i"
    formula: "=IMSIN(\"0\")"

  - id: imsin_pure_real
    description: "sin(1) — matches scalar sin"
    formula: "=IMSIN(\"1\")"

  - id: imsin_pure_imag
    description: "sin(i) = sinh(1)i"
    formula: "=IMSIN(\"i\")"

  - id: imsin_negative_real
    description: "sin(-1) = -sin(1) — odd function"
    formula: "=IMSIN(\"-1\")"

  # -- IMSINH perspectives ------------------------------------------------
  - id: imsinh_zero
    description: "sinh(0) = 0+0i"
    formula: "=IMSINH(\"0\")"

  - id: imsinh_pure_real
    description: "sinh(1) — matches scalar sinh"
    formula: "=IMSINH(\"1\")"

  - id: imsinh_pure_imag
    description: "sinh(i) = sin(1)i"
    formula: "=IMSINH(\"i\")"

  - id: imsinh_negative_real
    description: "sinh(-1) = -sinh(1) — odd function"
    formula: "=IMSINH(\"-1\")"

  # -- IMSQRT extra perspective -------------------------------------------
  - id: imsqrt_pure_real
    description: "sqrt(4) = 2+0i — matches scalar sqrt"
    formula: "=IMSQRT(\"4\")"

  # -- IMSUB perspectives -------------------------------------------------
  - id: imsub_pure_real
    description: "(5)-(2) = 3+0i"
    formula: "=IMSUB(\"5\",\"2\")"

  - id: imsub_pure_imag
    description: "(5i)-(2i) = 3i"
    formula: "=IMSUB(\"5i\",\"2i\")"

  - id: imsub_negative_result
    description: "(1+i)-(3+4i) = -2-3i"
    formula: "=IMSUB(\"1+i\",\"3+4i\")"

  # -- IMSUM extra perspective --------------------------------------------
  - id: imsum_pure_imag_pair
    description: "(2i)+(3i) = 5i — pure imaginary sum"
    formula: "=IMSUM(\"2i\",\"3i\")"

  # -- IMTAN perspectives -------------------------------------------------
  - id: imtan_zero
    description: "tan(0) = 0+0i"
    formula: "=IMTAN(\"0\")"

  - id: imtan_pure_real
    description: "tan(1) — matches scalar tan"
    formula: "=IMTAN(\"1\")"

  - id: imtan_pure_imag
    description: "tan(i) = tanh(1)i"
    formula: "=IMTAN(\"i\")"

  - id: imtan_negative_real
    description: "tan(-1) = -tan(1) — odd function"
    formula: "=IMTAN(\"-1\")"

  # -- IMCOT perspectives -------------------------------------------------
  - id: imcot_pure_real
    description: "cot(1) — matches scalar cot (cos/sin)"
    formula: "=IMCOT(\"1\")"

  - id: imcot_pure_imag
    description: "cot(i) = -i*coth(1) — pure imaginary axis"
    formula: "=IMCOT(\"i\")"

  - id: imcot_zero_is_div0
    description: "cot(0) -> #NUM! (sin(0)=0 in denominator)"
    formula: "=IMCOT(\"0\")"

  - id: imcot_identity_with_imtan
    description: "IMCOT(z) * IMTAN(z) = 1+0i — reciprocal identity (1-ULP libm drift on imag tail)"
    formula: "=IMPRODUCT(IMCOT(\"1+i\"),IMTAN(\"1+i\"))"
    compare_mode: complex_text
    tolerance: { abs: 1e-14 }

  - id: imcot_negative_real
    description: "cot(-1) = -cot(1) — odd function"
    formula: "=IMCOT(\"-1\")"

  # -- IMCSCH perspectives ------------------------------------------------
  - id: imcsch_pure_real
    description: "csch(1) = 1/sinh(1) — matches scalar csch"
    formula: "=IMCSCH(\"1\")"

  - id: imcsch_pure_imag
    description: "csch(i) = -i/sin(1) — pure imaginary axis"
    formula: "=IMCSCH(\"i\")"

  - id: imcsch_zero_is_div0
    description: "csch(0) -> #NUM! (sinh(0)=0 in denominator)"
    formula: "=IMCSCH(\"0\")"

  - id: imcsch_identity_with_imsinh
    description: "IMCSCH(z) * IMSINH(z) = 1+0i — reciprocal identity (1-ULP libm drift on imag tail)"
    formula: "=IMPRODUCT(IMCSCH(\"1+i\"),IMSINH(\"1+i\"))"
    compare_mode: complex_text
    tolerance: { abs: 1e-14 }

  - id: imcsch_negative_real
    description: "csch(-1) = -csch(1) — odd function"
    formula: "=IMCSCH(\"-1\")"

  # -- IMSECH perspectives ------------------------------------------------
  - id: imsech_zero_is_one
    description: "sech(0) = 1/cosh(0) = 1+0i"
    formula: "=IMSECH(\"0\")"

  - id: imsech_pure_real
    description: "sech(1) = 1/cosh(1) — matches scalar sech"
    formula: "=IMSECH(\"1\")"

  - id: imsech_pure_imag
    description: "sech(i) = 1/cos(1) — pure imaginary axis"
    formula: "=IMSECH(\"i\")"

  - id: imsech_identity_with_imcosh
    description: "IMSECH(z) * IMCOSH(z) = 1+0i — reciprocal identity (1-ULP libm drift on imag tail)"
    formula: "=IMPRODUCT(IMSECH(\"1+i\"),IMCOSH(\"1+i\"))"
    compare_mode: complex_text
    tolerance: { abs: 1e-14 }

  - id: imsech_negative_real
    description: "sech(-1) = sech(1) — even function"
    formula: "=IMSECH(\"-1\")"
