suite: matrix_bool_operand_control
description: >
  All-numeric controls for matrix_bool_operand: the same setups with the swapped
  cell numeric, so the refusal cases are measured against a working baseline.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: mbc_mmult
    setup:
      A1: 1
      B1: 2
      A2: 3
      B2: 4
      D1: 1
      D2: 2
      D3: 4
      D4: 8
      E1: 1
      E2: 2
      E3: 3
      E4: 4
      F1: 5
      G1: 1
      G2: 0
      H1: 0
      H2: 1
    formula: '=MMULT(A1:B2,G1:H2)'
  - id: mbc_minverse
