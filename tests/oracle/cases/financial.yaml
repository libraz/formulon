  - id: db_whole_year_rule_11
    formula: "=DB(135229.88,42371.69,5,10)"
    tolerance: { abs: 0, rel: 0 }

  - id: db_whole_year_rule_12
    formula: "=DB(135229.88,42371.69,5,10,6)"
    tolerance: { abs: 0, rel: 0 }

  - id: db_whole_year_rule_13
    formula: "=DB(135229.88,42371.69,5,0)"
    tolerance: { abs: 0, rel: 0 }

  - id: db_whole_year_rule_14
    formula: "=DB(135229.88,42371.69,5,0,11)"
    tolerance: { abs: 0, rel: 0 }

  - id: db_whole_year_rule_15
    formula: "=DB(973279.0,25039.99,0.5,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: db_whole_year_rule_16
