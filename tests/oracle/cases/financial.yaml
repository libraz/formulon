  - id: db_whole_year_rule_07
    formula: "=DB(135229.88,42371.69,5,0.5)"
    tolerance: { abs: 0, rel: 0 }

  - id: db_whole_year_rule_08
    formula: "=DB(135229.88,42371.69,5,0.5,1)"
    tolerance: { abs: 0, rel: 0 }

  - id: db_whole_year_rule_09
    formula: "=DB(135229.88,42371.69,5,1.5)"
    tolerance: { abs: 0, rel: 0 }

  - id: db_whole_year_rule_10
