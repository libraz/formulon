suite: aggregate_argument_order
description: >
  Which failure an aggregate reports when a non-numeric text literal comes
  before or after an error argument, and how an IF argument that picks a
  plain value is read, across the numeric and A-family aggregates.
tolerance: { abs: 1.0e-12, rel: 1.0e-12 }
locale: ja-JP
cases:
  - id: sum_text_err
    formula: =SUM("abc",NA())
  - id: sum_err_text
    formula: =SUM(NA(),"abc")
  - id: sum_text_div0
    formula: =SUM("abc",1/0)
  - id: sum_numtext_err
    formula: =SUM("1",NA())
  - id: sum_ref_text_err
    setup:
      A1: abc
    formula: =SUM(A1,NA())
  - id: sum_if_text
    formula: =SUM(IF(TRUE,"",1))
  - id: sum_if_numtext
    formula: =SUM(IF(TRUE,"5",1))
  - id: sum_if_bool
    formula: =SUM(IF(TRUE,TRUE,1),2)
  - id: average_text_err
    formula: =AVERAGE("abc",NA())
  - id: average_err_text
    formula: =AVERAGE(NA(),"abc")
  - id: average_text_div0
