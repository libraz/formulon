suite: name_union
description: >
  A workbook-scope defined name whose body is a comma list of references:
  how the bare, parenthesised, cross-sheet and intersection-then-union
  bodies are read by the aggregates, AREAS, INDEX, ROWS, ISREF and the
  functions that read their arguments in order.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: sum_bare
    names: { u: "=Sheet1!$A$1,Sheet1!$B$1" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =SUM(u)
  - id: areas_bare
    names: { u: "=Sheet1!$A$1,Sheet1!$B$1" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =AREAS(u)
  - id: index_bare_area2
    names: { u: "=Sheet1!$A$1,Sheet1!$B$1" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =INDEX(u,1,1,2)
  - id: index_bare_area_omitted
    names: { u: "=Sheet1!$A$1,Sheet1!$B$1" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =INDEX(u,1,1)
  - id: concat_bare
    names: { u: "=Sheet1!$A$1,Sheet1!$B$1" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =CONCAT(u)
  - id: gcd_bare
    names: { u: "=Sheet1!$A$1,Sheet1!$B$1" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =GCD(u)
  - id: textjoin_bare
    names: { u: "=Sheet1!$A$1,Sheet1!$B$1" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: '=TEXTJOIN(",",TRUE,u)'
  - id: sum_three
    names: { uthree: "=Sheet1!$A$1,Sheet1!$B$1,Sheet1!$A$2" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =SUM(uthree)
  - id: areas_three
    names: { uthree: "=Sheet1!$A$1,Sheet1!$B$1,Sheet1!$A$2" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =AREAS(uthree)
  - id: index_three_area3
    names: { uthree: "=Sheet1!$A$1,Sheet1!$B$1,Sheet1!$A$2" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =INDEX(uthree,1,1,3)
  - id: concat_three
    names: { uthree: "=Sheet1!$A$1,Sheet1!$B$1,Sheet1!$A$2" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =CONCAT(uthree)
  - id: rows_three
    names: { uthree: "=Sheet1!$A$1,Sheet1!$B$1,Sheet1!$A$2" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =ROWS(uthree)
  - id: isref_three
    names: { uthree: "=Sheet1!$A$1,Sheet1!$B$1,Sheet1!$A$2" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =ISREF(uthree)
  - id: sum_paren
    names: { pu: "=(Sheet1!$A$1,Sheet1!$B$1)" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =SUM(pu)
  - id: areas_paren
    names: { pu: "=(Sheet1!$A$1,Sheet1!$B$1)" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =AREAS(pu)
  - id: index_paren_area2
    names: { pu: "=(Sheet1!$A$1,Sheet1!$B$1)" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =INDEX(pu,1,1,2)
  - id: sum_cross_sheet
    names: { m: "=Sheet1!$A$1,Sheet2!$B$1" }
    setup: { A1: 4, B1: 6, Sheet2!B1: 5 }
    formula: =SUM(m)
  - id: areas_cross_sheet
    names: { m: "=Sheet1!$A$1,Sheet2!$B$1" }
    setup: { A1: 4, B1: 6, Sheet2!B1: 5 }
    formula: =AREAS(m)
  - id: index_cross_sheet
    names: { m: "=Sheet1!$A$1,Sheet2!$B$1" }
    setup: { A1: 4, B1: 6, Sheet2!B1: 5 }
    formula: =INDEX(m,1,1,2)
  - id: rows_cross_sheet
    names: { m: "=Sheet1!$A$1,Sheet2!$B$1" }
    setup: { A1: 4, B1: 6, Sheet2!B1: 5 }
    formula: =ROWS(m)
  - id: isref_cross_sheet
    names: { m: "=Sheet1!$A$1,Sheet2!$B$1" }
    setup: { A1: 4, B1: 6, Sheet2!B1: 5 }
    formula: =ISREF(m)
  - id: sum_intersect_then_union
    names: { x: "=Sheet1!$A$1:$B$2 Sheet1!$B$1:$B$3,Sheet1!$A$1" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =SUM(x)
  - id: areas_intersect_then_union
    names: { x: "=Sheet1!$A$1:$B$2 Sheet1!$B$1:$B$3,Sheet1!$A$1" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =AREAS(x)
  - id: formula_body
    names: { f: "=SUM(Sheet1!$A$1,Sheet1!$B$1)" }
    setup: { A1: 4, B1: 6, A2: 8, B2: 1 }
    formula: =f
