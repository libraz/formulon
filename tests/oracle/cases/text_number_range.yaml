suite: text_number_range
description: 'Text-to-number acceptance range, 15-digit truncation, percent folding and the length cap (VALUE and arithmetic on text)'
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: largest_accepted
    formula: "=VALUE(\"9.99999999999999E+307\")"
  - id: upper_bound_rejected
    formula: "=VALUE(\"1e308\")"
  - id: sixteenth_digit_truncated
    formula: "=VALUE(\"9.999999999999995e307\")"
  - id: normalised_upper_rejected
    formula: "=VALUE(\"1000e305\")"
  - id: normalised_into_range
    formula: "=VALUE(\"0.1e308\")"
  - id: lower_bound_flushed
    formula: "=VALUE(\"1e-309\")"
  - id: below_lower_bound
    formula: "=VALUE(\"1e-310\")"
  - id: normalised_lower_accepted
    formula: "=VALUE(\"10e-310\")"
  - id: normalised_below_lower
    formula: "=VALUE(\"0.1e-309\")"
  - id: below_lower_written_fine
    formula: "=VALUE(\"9.99e-310\")"
  - id: dbl_min_cut_below_flushed
    formula: "=VALUE(\"2.2250738585072014e-308\")"
  - id: just_above_dbl_min_kept
    formula: "=VALUE(\"2.22507385850721e-308\")"
  - id: zero_written_exponent_rejected
    formula: "=VALUE(\"0e309\")"
  - id: zero_fraction_shifts_exponent
    formula: "=VALUE(\"0.0e309\")"
  - id: zero_negative_exponent_rejected
    formula: "=VALUE(\"0e-309\")"
  - id: zero_negative_exponent_accepted
    formula: "=VALUE(\"0e-308\")"
  - id: percent_folded_upper
    formula: "=VALUE(\"1e309%\")"
  - id: percent_folded_lower
    formula: "=VALUE(\"1e-308%\")"
  - id: sixteen_digit_integer
    formula: "=VALUE(\"9999999999999999\")"
  - id: seventeen_nines_fraction
    formula: "=VALUE(\"0.99999999999999999\")"
  - id: double_percent_rejected
    formula: "=VALUE(\"1e-306%%\")"
  - id: percent_folded_exactly
    formula: "=VALUE(\"1e-9%\")=1E-11"
  - id: length_cap_255_accepted
    formula: "=VALUE(REPT(\" \",254)&\"1\")"
  - id: length_cap_256_rejected
    formula: "=VALUE(REPT(\" \",255)&\"1\")"
  - id: dropped_integer_digits_scale
    formula: "=\"1234567890123456789e289\"+0"
  - id: dropped_integer_digits_reject
    formula: "=\"1234567890123456789e290\"+0"
  - id: arithmetic_lower_bound
    formula: "=\"1e-310\"+0"
  - id: leading_percent
    formula: "=VALUE(\"%5\")"
  - id: percent_before_sign
    formula: "=VALUE(\"%-5\")"
  - id: percent_after_parenthesised_negative
    formula: "=VALUE(\"(5)%\")"
  - id: percent_inside_parentheses
    formula: "=VALUE(\"(%5)\")"
  - id: two_percents_rejected
    formula: "=VALUE(\"%5%\")"
  - id: length_cap_counts_characters
    formula: "=VALUE(REPT(\"　\",254)&\"1\")"
  - id: length_cap_characters_rejected
    formula: "=VALUE(REPT(\"　\",255)&\"1\")"
