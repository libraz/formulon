suite: text_regex
description: REGEXTEST / REGEXEXTRACT / REGEXREPLACE — PCRE2-backed regex closure against Mac Excel 365 (ja-JP).
tolerance: { abs: 1.0e-12, rel: 1.0e-12 }
locale: ja-JP
cases:
  # =========================================================================
  # REGEXTEST(text, pattern, [case_sensitivity=0]) -> Bool
  # =========================================================================

  - id: regextest_simple_match
    description: "Pattern matches anywhere in text -> TRUE"
    formula: '=REGEXTEST("abc123", "[0-9]+")'

  - id: regextest_no_match
    description: "Pattern never matches -> FALSE"
    formula: '=REGEXTEST("abcdef", "[0-9]+")'

  - id: regextest_case_insensitive_default
    description: "Default case_sensitivity=0 (ignore case)"
    formula: '=REGEXTEST("ABC", "abc")'

  - id: regextest_case_sensitive
    description: "case_sensitivity=1 -> case-sensitive match fails"
    formula: '=REGEXTEST("ABC", "abc", 1)'

  - id: regextest_invalid_pattern
    description: "Unbalanced character class -> #VALUE!"
    formula: '=REGEXTEST("abc", "[")'

  # =========================================================================
  # REGEXEXTRACT(text, pattern, [return_mode=0], [case_sensitivity=0])
  # =========================================================================

  - id: regexextract_mode_0_first_match
    description: "Mode 0 (default) returns scalar text of first whole match"
    formula: '=REGEXEXTRACT("foo123bar456", "[0-9]+")'

  - id: regexextract_mode_1_all_matches
    description: "Mode 1 returns row array of all whole matches"
    formula: '=REGEXEXTRACT("foo123bar456", "[0-9]+", 1)'

  - id: regexextract_mode_2_capture_groups
    description: "Mode 2 returns row array of capture groups from FIRST match"
    formula: '=REGEXEXTRACT("john@example", "(\w+)@(\w+)", 2)'

  - id: regexextract_mode_3_all_capture_groups
    description: "Mode 3 is not a documented return_mode -> #VALUE!"
    formula: '=REGEXEXTRACT("a1 b2 c3", "(\w)(\d)", 3)'

  - id: regexextract_no_match
    description: "No match -> #N/A"
    formula: '=REGEXEXTRACT("abc", "xyz_nomatch")'

  # =========================================================================
  # REGEXREPLACE(text, pattern, replacement, [occurrence=0], [case_sensitivity=0])
  # =========================================================================

  - id: regexreplace_global_default
    description: "occurrence=0 (default) replaces every match (PCRE2_SUBSTITUTE_GLOBAL)"
    formula: '=REGEXREPLACE("aXbXcX", "X", "-")'

  - id: regexreplace_first_only
    description: "occurrence=1 replaces only the first match"
    formula: '=REGEXREPLACE("aXbXcX", "X", "-", 1)'

  - id: regexreplace_nth_match
    description: "occurrence=3 replaces only the third match"
    formula: '=REGEXREPLACE("aXbXcX", "X", "-", 3)'

  - id: regexreplace_no_match_passthrough
    description: "No match returns the original text unchanged"
    formula: '=REGEXREPLACE("abc", "X", "-")'

  - id: regexreplace_growth_digits
    description: "Global replacement can grow beyond the writer's initial output-buffer estimate"
    formula: '=REGEXREPLACE("a1b2c3d4e5f6g7h8", "[0-9]", "<num>")'

  - id: regexreplace_growth_commas
    description: "Global replacement with a longer separator grows the output buffer"
    formula: '=REGEXREPLACE("a,b,c,d,e,f,g,h,i,j", ",", "; and ")'

  - id: regexreplace_negative_occurrence
    description: "Negative occurrence -> #VALUE!"
    formula: '=REGEXREPLACE("abc", "a", "x", -1)'

  - id: regextest_empty_pattern
    description: "Empty pattern is valid and matches"
    formula: '=REGEXTEST("abc","")'

  - id: regexextract_empty_pattern
    description: "Empty pattern extracts empty text"
    formula: '=REGEXEXTRACT("abc","")'

  - id: regexextract_empty_pattern_type
    description: "Empty-pattern extract is text"
    formula: '=TYPE(REGEXEXTRACT("abc",""))'

  - id: regexextract_empty_pattern_all_columns
    description: "Mode 1 yields one empty match per position"
    formula: '=COLUMNS(REGEXEXTRACT("abc","",1))'

  - id: regexreplace_empty_pattern
    description: "Empty pattern inserts at every position"
    formula: '=REGEXREPLACE("abc","","-")'

  - id: regexextract_mode1_single_is_array
    description: "Mode 1 with one match is still an array"
    formula: '=TYPE(REGEXEXTRACT("abc","b",1))'

  - id: regexextract_mode2_single_is_array
    description: "Mode 2 with one group is still an array"
    formula: '=TYPE(REGEXEXTRACT("abc","(b)",2))'

  - id: regexextract_mode0_is_text
    description: "Mode 0 stays scalar text"
    formula: '=TYPE(REGEXEXTRACT("abc","b",0))'

  - id: type_of_array_literal
    description: "TYPE of an array is 64"
    formula: '=TYPE({1,2;3,4})'

  - id: type_of_sequence
    description: "TYPE of a spilled array is 64"
    formula: '=TYPE(SEQUENCE(3))'

  - id: regexreplace_dollar_whole_match
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","$&")'

  - id: regexreplace_dollar_before_after
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","$`$''")'

  - id: regexreplace_dollar_subject
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","$_")'

  - id: regexreplace_dollar_bare
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","$")'

  - id: regexreplace_dollar_unknown
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","$x")'

  - id: regexreplace_dollar_trailing
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","x$")'

  - id: regexreplace_dollar_plus
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","$+")'

  - id: regexreplace_dollar_zero_pair
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","$0$0")'

  - id: regexreplace_backslash_tab_code
    description: "Replacement grammar"
    formula: '=CODE(MID(REGEXREPLACE("abc","b","\t"),2,1))'

  - id: regexreplace_backslash_hex
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","\x41")'

  - id: regexreplace_backslash_hex_braced
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","\x{41}")'

  - id: regexreplace_backslash_octal
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","\101")'

  - id: regexreplace_backslash_unknown
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","\q")'

  - id: regexreplace_backslash_trailing
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","x\")'

  - id: regexreplace_backslash_zero
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","\0")'

  - id: regexreplace_backslash_escaped_backslash
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","\\n")'

  - id: regexreplace_backslash_escaped_dollar
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","b","\$1")'

  - id: regexreplace_group_ref_ok
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(b)","$1x")'

  - id: regexreplace_group_braced
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(b)","${1}x")'

  - id: regexreplace_group_two_digit_missing
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(b)","$11")'

  - id: regexreplace_group_missing
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(b)","$2")'

  - id: regexreplace_group_unmatched_empty
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(b)|(x)","[$2]")'

  - id: regexreplace_group_named_unbraced
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(?<g>b)","$g")'

  - id: regexreplace_group_named_longer
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(?<g>b)","$gx")'

  - id: regexreplace_group_named_angle
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(?<g>b)","$<g>")'

  - id: regexreplace_group_backslash_ref
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(b)","\1\1")'

  - id: regexreplace_group_backslash_g
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(b)","\g<1>")'

  - id: regexreplace_group_backslash_g_name
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(?<g>b)","\g<g>")'

  - id: regexreplace_group_backslash_g_bare
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(b)","\g1")'

  - id: regexreplace_group_backslash_k
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(?<g>b)","\k<g>")'

  - id: regexreplace_group_backslash_two_digit_missing
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(b)","\10")'

  - id: regexreplace_upper_next
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(b)","\u\1")'

  - id: regexreplace_upper_run
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(b)","\U\1\E")'

  - id: regexreplace_quote_span
    description: "Replacement grammar"
    formula: '=REGEXREPLACE("abc","(b)","\Q\1\E")'

  - id: regexreplace_before_after_nth
    description: "Before/after text per occurrence"
    formula: '=REGEXREPLACE("abcb","b","[$`|$'']",2)'

  - id: regexreplace_two_digit_group_ok
    description: "Greedy two-digit group with eleven groups"
    formula: '=REGEXREPLACE("abcdefghijkl","(a)(b)(c)(d)(e)(f)(g)(h)(i)(j)(k)","$11")'

  - id: regexreplace_backslash_ten_ok
    description: "Backslash two-digit group with eleven groups"
    formula: '=REGEXREPLACE("abcdefghijkl","(a)(b)(c)(d)(e)(f)(g)(h)(i)(j)(k)","\10")'

  - id: regexreplace_unicode_u_literal
    description: "A u escape upper-cases the next character, not a Unicode escape"
    formula: '=REGEXREPLACE("aéb","é","\u00e9")'

  - id: regexreplace_lower_next
    description: "Lower-case the next character"
    formula: '=REGEXREPLACE("B","(B)","\l\1")'

  - id: regexreplace_lower_run
    description: "Lower-case a span to the end marker"
    formula: '=REGEXREPLACE("BC","(B)(C)","\L\1\EX\2")'

  - id: regexreplace_lower_run_unterminated
    description: "Unterminated lower-case span runs to the end"
    formula: '=REGEXREPLACE("BC","(B)(C)","\L\1\2")'

  - id: regexreplace_title_compose
    description: "Upper-case first then lower-case span"
    formula: '=REGEXREPLACE("BC","(BC)","\u\L\1\E")'

  - id: regexreplace_lower_upper_compose
    description: "Lower-case first then upper-case span"
    formula: '=REGEXREPLACE("bc","(bc)","\l\U\1\E")'

  - id: regexreplace_lone_end_ignored
    description: "A lone end marker is ignored"
    formula: '=REGEXREPLACE("abc","b","x\E")'



  - id: regexreplace_nul_length
    description: "A NUL escape inserts a real character"
    formula: '=LEN(REGEXREPLACE("abc","b","\00"))'

  - id: regexreplace_nul_code
    description: "The inserted NUL is code 0"
    formula: '=CODE(MID(REGEXREPLACE("abc","b","\x00"),2,1))'

  - id: regexreplace_nul_tail
    description: "Text after a NUL is kept"
    formula: '=RIGHT(REGEXREPLACE("abc","b","\x{0}"),1)'

  - id: regexreplace_angle_numeric
    description: "Numeric angle reference is an error"
    formula: '=REGEXREPLACE("abc","(b)","$<1>")'

  - id: regexreplace_angle_named_ok
    description: "Named angle reference"
    formula: '=REGEXREPLACE("abc","(?<g>b)","$<g>x")'

  - id: regexreplace_subject_then_literal
    description: "Subject followed by literal name characters"
    formula: '=REGEXREPLACE("abc","b","$_x")'

  - id: regexreplace_subject_with_group_name
    description: "Subject wins over a group named like the following characters"
    formula: '=REGEXREPLACE("abc","(?<_x>b)","$_x")'

  - id: regexreplace_malformed_no_match
    description: "Malformed replacement without a match is not an error"
    formula: '=REGEXREPLACE("abc","x","$1")'

  - id: regexreplace_malformed_missing_occurrence
    description: "Malformed replacement with a missing occurrence is not an error"
    formula: '=REGEXREPLACE("abc","b","$1",3)'

  - id: regexreplace_upper_next_accented
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\uéa")'

  - id: regexreplace_upper_run_greek
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\Uαςβ\E")'

  - id: regexreplace_upper_next_digraph
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\uǆ")'

  - id: regexreplace_upper_next_digraph_title
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\uǅ")'

  - id: regexreplace_lower_next_digraph_title
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\lǲ")'

  - id: regexreplace_upper_sharp_s_kept
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\Uß\E")'

  - id: regexreplace_lower_span_final_sigma
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\LΑΣ\E")'

  - id: regexreplace_lower_span_medial_sigma
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\LΣΑ\E")'

  - id: regexreplace_lower_span_lone_sigma
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\LΣ\E")'

  - id: regexreplace_lower_span_sigma_between
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\LΑΣΑ\E")'

  - id: regexreplace_lower_next_sigma_first
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\lΣΑ")'

  - id: regexreplace_lower_next_sigma_alone
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\lΣ")'

  - id: regexreplace_upper_next_dotted
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\uı")'

  - id: regexreplace_lower_dotted_capital
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\LΙ\E")'

  - id: regexreplace_upper_fullwidth
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\Uａ\E")'

  - id: regexreplace_upper_next_digit
    description: "Case escapes map non-ASCII characters"
    formula: '=REGEXREPLACE("abc","b","\u1x")'
