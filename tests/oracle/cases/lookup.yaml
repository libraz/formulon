suite: lookup
description: MATCH / INDEX / CHOOSE / VLOOKUP / HLOOKUP / XLOOKUP / XMATCH
tolerance: { abs: 0.0, rel: 0.0 }
locale: ja-JP
cases:
  # -- MATCH ---------------------------------------------------------------
  - id: match_exact_found
    setup: { A1: 10, A2: 20, A3: 30 }
    formula: "=MATCH(20,A1:A3,0)"

  - id: match_exact_not_found
    setup: { A1: 10, A2: 20, A3: 30 }
    formula: "=MATCH(25,A1:A3,0)"

  - id: match_asc_smaller
    setup: { A1: 10, A2: 20, A3: 30 }
    formula: "=MATCH(25,A1:A3,1)"

  - id: match_desc_larger
    setup: { A1: 30, A2: 20, A3: 10 }
    formula: "=MATCH(15,A1:A3,-1)"

  - id: match_text_wildcard
    setup: { A1: "cat", A2: "cart", A3: "dog" }
    formula: "=MATCH(\"ca?\",A1:A3,0)"

  # -- INDEX ---------------------------------------------------------------
  - id: index_single_cell
    setup: { A1: 10, A2: 20, A3: 30 }
    formula: "=INDEX(A1:A3,2)"

  - id: index_two_d
    setup: { A1: 1, B1: 2, A2: 3, B2: 4 }
    formula: "=INDEX(A1:B2,2,1)"

  # -- CHOOSE --------------------------------------------------------------
  - id: choose_second_value
    formula: "=CHOOSE(2,\"a\",\"b\",\"c\")"

  - id: choose_index_out_of_range
    formula: "=CHOOSE(5,\"a\",\"b\",\"c\")"

  # -- VLOOKUP -------------------------------------------------------------
  - id: vlookup_exact_found
    setup: { A1: "apple",  B1: 1,
             A2: "banana", B2: 2,
             A3: "cherry", B3: 3 }
    formula: "=VLOOKUP(\"banana\",A1:B3,2,FALSE)"

  - id: vlookup_exact_not_found
    setup: { A1: "apple",  B1: 1,
             A2: "banana", B2: 2 }
    formula: "=VLOOKUP(\"cherry\",A1:B2,2,FALSE)"

  - id: vlookup_approx
    setup: { A1: 10, B1: "low",
             A2: 20, B2: "mid",
             A3: 30, B3: "high" }
    formula: "=VLOOKUP(25,A1:B3,2,TRUE)"

  # -- HLOOKUP -------------------------------------------------------------
  - id: hlookup_exact_found
    setup: { A1: "a", B1: "b", C1: "c",
             A2: 10, B2: 20, C2: 30 }
    formula: "=HLOOKUP(\"b\",A1:C2,2,FALSE)"

  # -- XLOOKUP -------------------------------------------------------------
  - id: xlookup_exact_found
    setup: { A1: 10, B1: "ten",
             A2: 20, B2: "twenty" }
    formula: "=XLOOKUP(20,A1:A2,B1:B2)"

  - id: xlookup_if_not_found
    setup: { A1: 10, B1: "ten",
             A2: 20, B2: "twenty" }
    formula: "=XLOOKUP(30,A1:A2,B1:B2,\"missing\")"

  - id: xlookup_match_mode_smaller
    setup: { A1: 10, A2: 20, A3: 30, B1: "ten", B2: "twenty", B3: "thirty" }
    formula: "=XLOOKUP(25,A1:A3,B1:B3,,-1)"

  - id: xlookup_omitted_modes_default_forward
    description: "Omitted match_mode and search_mode retain the default forward exact search"
    setup: { A1: 20, A2: 20, A3: 30, B1: "first", B2: "last", B3: "other" }
    formula: "=XLOOKUP(20,A1:A3,B1:B3,,,)"

  - id: xlookup_omitted_match_mode_reverse_search
    description: "An omitted match_mode does not coerce before explicit search_mode=-1"
    setup: { A1: 20, A2: 20, A3: 30, B1: "first", B2: "last", B3: "other" }
    formula: "=XLOOKUP(20,A1:A3,B1:B3,,,-1)"

  # -- H-5: lookup_value arrays ------------------------------------------
  # These are captured from the primary Mac Excel oracle before lifting
  # XLOOKUP/XMATCH's first argument.  Only lookup_value is array-shaped;
  # lookup_array, return_array, and modes remain whole-call arguments.
  - id: xlookup_array_vertical_scalar_mixed
    setup:
      A1: 20
      A2: 99
      A3: { kind: formula, formula: "=NA()" }
      D1: 10
      D2: 20
      D3: 30
      E1: "ten"
      E2: "twenty"
      E3: "thirty"
    formula: "=XLOOKUP(A1:A3,D1:D3,E1:E3,1/0)"

  - id: xlookup_array_horizontal_scalar
    setup:
      A1: 30
      B1: 10
      C1: 99
      E1: 10
      E2: 20
      E3: 30
      F1: "ten"
      F2: "twenty"
      F3: "thirty"
    formula: "=XLOOKUP(A1:C1,E1:E3,F1:F3,\"missing\")"

  - id: xlookup_array_vertical_multicolumn
    setup:
      A1: 20
      A2: 99
      A3: { kind: formula, formula: "=NA()" }
      D1: 10
      D2: 20
      D3: 30
      E1: 101
      F1: 102
      G1: 103
      E2: 201
      F2: 202
      G2: 203
      E3: 301
      F3: 302
      G3: 303
    formula: "=XLOOKUP(A1:A3,D1:D3,E1:G3,\"missing\")"

  - id: xlookup_array_horizontal_multicolumn
    setup:
      A1: 20
      B1: 99
      C1: { kind: formula, formula: "=NA()" }
      E1: 10
      E2: 20
      E3: 30
      F1: 101
      G1: 102
      H1: 103
      F2: 201
      G2: 202
      H2: 203
      F3: 301
      G3: 302
      H3: 303
    formula: "=XLOOKUP(A1:C1,E1:E3,F1:H3,\"missing\")"

  - id: xlookup_array_vertical_multirow
    setup:
      A1: 20
      A2: 99
      A3: { kind: formula, formula: "=NA()" }
      E1: 10
      F1: 20
      G1: 30
      E2: 101
      F2: 201
      G2: 301
      E3: 102
      F3: 202
      G3: 302
      E4: 103
      F4: 203
      G4: 303
    formula: "=XLOOKUP(A1:A3,E1:G1,E2:G4,\"missing\")"

  - id: xlookup_array_horizontal_multirow
    setup:
      A1: 20
      B1: 99
      C1: { kind: formula, formula: "=NA()" }
      E1: 10
      F1: 20
      G1: 30
      E2: 101
      F2: 201
      G2: 301
      E3: 102
      F3: 202
      G3: 302
      E4: 103
      F4: 203
      G4: 303
    formula: "=XLOOKUP(A1:C1,E1:G1,E2:G4,\"missing\")"

  - id: xlookup_array_vertical_if_not_found_array
    setup:
      A1: 10
      A2: 99
      A3: 30
      D1: 10
      D2: 20
      D3: 30
      E1: 100
      E2: 200
      E3: 300
      H1: 900
      H2: 901
      H3: 902
    formula: "=XLOOKUP(A1:A3,D1:D3,E1:E3,H1:H3)"

  - id: xlookup_array_horizontal_if_not_found_array
    setup:
      A1: 10
      B1: 99
      C1: 30
      E1: 10
      E2: 20
      E3: 30
      F1: 100
      F2: 200
      F3: 300
      H1: 900
      I1: 901
      J1: 902
    formula: "=XLOOKUP(A1:C1,E1:E3,F1:F3,H1:J1)"

  - id: xlookup_array_all_hits_keeps_fallback_lazy
    setup:
      A1: 10
      A2: 20
      D1: 10
      D2: 20
      E1: 100
      E2: 200
    formula: "=XLOOKUP(A1:A2,D1:D2,E1:E2,1/0)"

  # -- XMATCH --------------------------------------------------------------
  - id: xmatch_exact_found
    setup: { A1: 10, A2: 20, A3: 30 }
    formula: "=XMATCH(20,A1:A3,0)"

  - id: xmatch_wildcard
    setup: { A1: "cat", A2: "cart", A3: "dog" }
    formula: "=XMATCH(\"ca?\",A1:A3,2)"

  - id: xmatch_omitted_modes_default_forward
    description: "Omitted match_mode and search_mode retain the default forward exact search"
    setup: { A1: 20, A2: 20, A3: 30 }
    formula: "=XMATCH(20,A1:A3,,)"

  - id: xmatch_omitted_match_mode_reverse_search
    description: "An omitted match_mode does not coerce before explicit search_mode=-1"
    setup: { A1: 20, A2: 20, A3: 30 }
    formula: "=XMATCH(20,A1:A3,,-1)"

  - id: xmatch_array_vertical_mixed
    setup:
      A1: 20
      A2: 99
      A3: { kind: formula, formula: "=1/0" }
      D1: 10
      D2: 20
      D3: 30
    formula: "=XMATCH(A1:A3,D1:D3)"

  - id: xmatch_array_horizontal_mixed
    setup:
      A1: 30
      B1: 99
      C1: { kind: formula, formula: "=1/0" }
      E1: 10
      E2: 20
      E3: 30
    formula: "=XMATCH(A1:C1,E1:E3)"

  # =========================================================================
  # Expanded probes — semantic edges around match modes, wildcards, error
  # propagation, type coercion, sort-order requirements, and ja-JP edges.
  # =========================================================================

  # -- MATCH: wildcard variants -------------------------------------------
  - id: match_text_star_wildcard
    setup: { A1: "cat", A2: "cart", A3: "dog" }
    formula: "=MATCH(\"ca*\",A1:A3,0)"

  - id: match_text_escape_question
    description: "Tilde-escape: literal '?' in lookup_value"
    setup: { A1: "what", A2: "what?", A3: "where" }
    formula: "=MATCH(\"what~?\",A1:A3,0)"

  - id: match_case_insensitive
    description: "MATCH is case-insensitive for ASCII text"
    setup: { A1: "Apple", A2: "Banana" }
    formula: "=MATCH(\"banana\",A1:A2,0)"

  # -- MATCH: error / type edges ------------------------------------------
  - id: match_error_in_array_propagates
    setup:
      A1: 10
      A2: { kind: formula, formula: "=NA()" }
      A3: 30
    formula: "=MATCH(30,A1:A3,0)"

  - id: match_error_lookup_value
    setup: { A1: 10, A2: 20 }
    formula: "=MATCH(#REF!,A1:A2,0)"

  - id: match_bool_lookup_value
    description: "Excel: booleans match cells holding TRUE/FALSE"
    setup: { A1: true, A2: false }
    formula: "=MATCH(FALSE,A1:A2,0)"

  - id: match_unsorted_with_approx
    description: "match_type=1 requires ascending sort; behaviour with unsorted data is undefined but Excel returns *something*"
    setup: { A1: 30, A2: 10, A3: 20 }
    formula: "=MATCH(15,A1:A3,1)"

  # -- VLOOKUP: column out of range ---------------------------------------
  - id: vlookup_col_out_of_range
    setup: { A1: "apple", B1: 1, A2: "banana", B2: 2 }
    formula: "=VLOOKUP(\"apple\",A1:B2,3,FALSE)"

  - id: vlookup_zero_col
    setup: { A1: "apple", B1: 1 }
    formula: "=VLOOKUP(\"apple\",A1:B1,0,FALSE)"

  - id: vlookup_negative_col
    setup: { A1: "apple", B1: 1 }
    formula: "=VLOOKUP(\"apple\",A1:B1,-1,FALSE)"

  - id: vlookup_wildcard_with_exact
    description: "Wildcard interpretation requires range_lookup=FALSE; * matches multi-char prefix"
    setup: { A1: "apple", B1: 1, A2: "banana", B2: 2, A3: "blueberry", B3: 3 }
    formula: "=VLOOKUP(\"b*\",A1:B3,2,FALSE)"

  - id: vlookup_approx_unsorted
    description: "range_lookup=TRUE on unsorted ascending data gives undefined-but-deterministic Excel value"
    setup: { A1: 30, B1: "x", A2: 10, B2: "y", A3: 20, B3: "z" }
    formula: "=VLOOKUP(15,A1:B3,2,TRUE)"

  - id: vlookup_error_in_array
    setup:
      A1: "apple"
      B1: 1
      A2: { kind: formula, formula: "=NA()" }
      B2: 2
      A3: "cherry"
      B3: 3
    formula: "=VLOOKUP(\"cherry\",A1:B3,2,FALSE)"

  # -- XLOOKUP: match_mode and search_mode --------------------------------
  - id: xlookup_match_mode_larger
    setup: { A1: 10, A2: 20, A3: 30, B1: "ten", B2: "twenty", B3: "thirty" }
    formula: "=XLOOKUP(25,A1:A3,B1:B3,,1)"

  - id: xlookup_wildcard_match_mode_2
    setup: { A1: "apple", A2: "banana", A3: "cherry", B1: 1, B2: 2, B3: 3 }
    formula: "=XLOOKUP(\"b*\",A1:A3,B1:B3,,2)"

  - id: xlookup_search_reverse
    setup: { A1: "x", A2: "y", A3: "x", B1: 1, B2: 2, B3: 3 }
    formula: "=XLOOKUP(\"x\",A1:A3,B1:B3,,0,-1)"

  - id: xlookup_no_match_no_default
    setup: { A1: 10, A2: 20, B1: "ten", B2: "twenty" }
    formula: "=XLOOKUP(99,A1:A2,B1:B2)"

  - id: xlookup_error_in_lookup_array
    setup:
      A1: 10
      A2: { kind: formula, formula: "=NA()" }
      A3: 30
      B1: "ten"
      B2: "na"
      B3: "thirty"
    formula: "=XLOOKUP(30,A1:A3,B1:B3)"

  # -- INDEX edge cases ---------------------------------------------------
  - id: index_zero_row
    description: "INDEX with row=0 returns the entire column (or behaves array-like)"
    setup: { A1: 1, A2: 2, A3: 3 }
    formula: "=INDEX(A1:A3,0)"

  - id: index_zero_col
    description: "INDEX with col=0 on 2D returns the entire row"
    setup: { A1: 1, B1: 2, A2: 3, B2: 4 }
    formula: "=INDEX(A1:B2,1,0)"

  - id: index_out_of_range
    setup: { A1: 1, A2: 2, A3: 3 }
    formula: "=INDEX(A1:A3,5)"

  - id: index_negative_row
    setup: { A1: 1, A2: 2 }
    formula: "=INDEX(A1:A2,-1)"

  # -- CHOOSE edge cases --------------------------------------------------
  - id: choose_index_zero
    formula: "=CHOOSE(0,\"a\",\"b\",\"c\")"

  - id: choose_index_negative
    formula: "=CHOOSE(-1,\"a\",\"b\",\"c\")"

  - id: choose_with_error_value
    description: "CHOOSE with #REF! as the index propagates"
    formula: "=CHOOSE(#REF!,\"a\",\"b\",\"c\")"

  # -- ja-JP wildcard with full-width characters --------------------------
  - id: match_jp_wildcard
    description: "ja-JP wildcards: ? must match a single full-width char"
    setup: { A1: "りんご", A2: "りんごジュース", A3: "ぶどう" }
    formula: "=MATCH(\"り*\",A1:A3,0)"

  - id: vlookup_jp_text
    setup: { A1: "りんご", B1: 100, A2: "ぶどう", B2: 200 }
    formula: "=VLOOKUP(\"ぶどう\",A1:B2,2,FALSE)"

  # =========================================================================
  # HLOOKUP coverage extension: range_lookup TRUE / FALSE, multi-match,
  # not-found, and row_index out-of-bounds.
  # =========================================================================
  - id: hlookup_approx_sorted
    description: "range_lookup=TRUE on ascending row -> largest value <= lookup"
    setup: { A1: 10, B1: 20, C1: 30,
             A2: "low", B2: "mid", C2: "high" }
    formula: "=HLOOKUP(25,A1:C2,2,TRUE)"

  - id: hlookup_first_match_wins
    description: "Multiple equal-key columns: HLOOKUP returns the first match"
    setup: { A1: "x", B1: "y", C1: "y",
             A2: 1,   B2: 2,   C2: 3 }
    formula: "=HLOOKUP(\"y\",A1:C2,2,FALSE)"

  - id: hlookup_not_found_exact
    description: "Exact match but value absent -> #N/A"
    setup: { A1: "a", B1: "b", C1: "c",
             A2: 10,  B2: 20,  C2: 30 }
    formula: "=HLOOKUP(\"z\",A1:C2,2,FALSE)"

  - id: hlookup_row_out_of_range
    description: "row_index_num > height of table_array -> #REF!"
    setup: { A1: "a", B1: "b",
             A2: 10,  B2: 20 }
    formula: "=HLOOKUP(\"a\",A1:B2,5,FALSE)"

  # =========================================================================
  # XMATCH coverage extension: search_mode reverse, sorted binary, not-found.
  # =========================================================================
  - id: xmatch_search_reverse_returns_last
    description: "search_mode=-1 returns the last (highest-index) match"
    setup: { A1: "x", A2: "y", A3: "x" }
    formula: "=XMATCH(\"x\",A1:A3,0,-1)"

  - id: xmatch_binary_search_ascending
    description: "search_mode=2 binary search on ascending data"
    setup: { A1: 10, A2: 20, A3: 30, A4: 40 }
    formula: "=XMATCH(30,A1:A4,0,2)"

  - id: xmatch_not_found_returns_na
    description: "Exact match (mode=0) without a hit -> #N/A"
    setup: { A1: 10, A2: 20, A3: 30 }
    formula: "=XMATCH(99,A1:A3,0)"

  # =========================================================================
  # LOOKUP coverage: legacy 2-argument (array form) and 3-argument (vector
  # form). Always approximate match; lookup vector must be sorted ascending.
  # Returns the last value <= lookup_value, or #N/A if no value <= lookup_value.
  # =========================================================================
  - id: lookup_vector_form_exact
    description: "vector form: lookup_value, lookup_vector, result_vector — exact match"
    setup: { A1: 10, A2: 20, A3: 30,
             B1: "low", B2: "mid", B3: "high" }
    formula: "=LOOKUP(20,A1:A3,B1:B3)"

  - id: lookup_vector_form_approx
    description: "Approximate match: 25 falls between 20 and 30 -> 'mid'"
    setup: { A1: 10, A2: 20, A3: 30,
             B1: "low", B2: "mid", B3: "high" }
    formula: "=LOOKUP(25,A1:A3,B1:B3)"

  - id: lookup_array_form_square
    description: "array form: square table; LOOKUP returns the last column on a row match"
    setup: { A1: 1, B1: "a",
             A2: 2, B2: "b",
             A3: 3, B3: "c" }
    formula: "=LOOKUP(2,A1:B3)"

  - id: lookup_below_smallest_is_na
    description: "lookup_value < smallest in vector -> #N/A"
    setup: { A1: 10, A2: 20, A3: 30,
             B1: "low", B2: "mid", B3: "high" }
    formula: "=LOOKUP(5,A1:A3,B1:B3)"

  - id: lookup_above_largest_returns_last
    description: "lookup_value >= largest -> last result"
    setup: { A1: 10, A2: 20, A3: 30,
             B1: "low", B2: "mid", B3: "high" }
    formula: "=LOOKUP(99,A1:A3,B1:B3)"

  # =========================================================================
  # H-5 classic lookup_value array lift — primary Oracle capture before
  # implementation. Only lookup_value is array-shaped; table/range and
  # index/match-mode remain whole-call arguments.
  # =========================================================================
  - id: vlookup_array_vertical_exact_mixed
    setup:
      A1: 20
      A2: 99
      A3: { kind: formula, formula: "=1/0" }
      D1: 10
      E1: "ten"
      D2: 20
      E2: "twenty"
      D3: 30
      E3: "thirty"
    formula: "=VLOOKUP(A1:A3,D1:E3,2,FALSE)"

  - id: vlookup_array_horizontal_approx
    setup:
      A1: 25
      B1: 5
      C1: 99
      E1: 10
      F1: "low"
      E2: 20
      F2: "mid"
      E3: 30
      F3: "high"
    formula: "=VLOOKUP(A1:C1,E1:F3,2,TRUE)"

  - id: vlookup_array_matrix_exact
    setup:
      A1: 30
      B1: 10
      A2: 99
      B2: 20
      D1: 10
      E1: 100
      D2: 20
      E2: 200
      D3: 30
      E3: 300
    formula: "=VLOOKUP(A1:B2,D1:E3,2,FALSE)"

  - id: vlookup_array_invalid_col_precedence
    setup:
      A1: 20
      A2: { kind: formula, formula: "=1/0" }
      D1: 10
      E1: 100
      D2: 20
      E2: 200
    formula: "=VLOOKUP(A1:A2,D1:E2,3,FALSE)"

  - id: hlookup_array_vertical_exact_mixed
    setup:
      A1: 20
      A2: 99
      A3: { kind: formula, formula: "=1/0" }
      D1: 10
      E1: 20
      F1: 30
      D2: "ten"
      E2: "twenty"
      F2: "thirty"
    formula: "=HLOOKUP(A1:A3,D1:F2,2,FALSE)"

  - id: hlookup_array_horizontal_approx
    setup:
      A1: 25
      B1: 5
      C1: 99
      E1: 10
      F1: 20
      G1: 30
      E2: "low"
      F2: "mid"
      G2: "high"
    formula: "=HLOOKUP(A1:C1,E1:G2,2,TRUE)"

  - id: hlookup_array_matrix_exact
    setup:
      A1: 30
      B1: 10
      A2: 99
      B2: 20
      D1: 10
      E1: 20
      F1: 30
      D2: 100
      E2: 200
      F2: 300
    formula: "=HLOOKUP(A1:B2,D1:F2,2,FALSE)"

  - id: hlookup_array_invalid_row_precedence
    setup:
      A1: 20
      A2: { kind: formula, formula: "=1/0" }
      D1: 10
      E1: 20
      F1: 30
      D2: 100
      E2: 200
      F2: 300
    formula: "=HLOOKUP(A1:A2,D1:F2,3,FALSE)"

  - id: match_array_vertical_exact_mixed
    setup:
      A1: 20
      A2: 99
      A3: { kind: formula, formula: "=1/0" }
      D1: 10
      D2: 20
      D3: 30
    formula: "=MATCH(A1:A3,D1:D3,0)"

  - id: match_array_horizontal_approx_ascending
    setup:
      A1: 25
      B1: 5
      C1: 99
      E1: 10
      E2: 20
      E3: 30
    formula: "=MATCH(A1:C1,E1:E3,1)"

  - id: match_array_matrix_approx_descending
    setup:
      A1: 25
      B1: 15
      A2: 35
      B2: 5
      D1: 30
      D2: 20
      D3: 10
    formula: "=MATCH(A1:B2,D1:D3,-1)"

  - id: match_array_invalid_match_type_precedence
    setup:
      A1: 20
      A2: { kind: formula, formula: "=1/0" }
      D1: 10
      D2: 20
      D3: 30
    formula: "=MATCH(A1:A2,D1:D3,2)"

  # =========================================================================
  # H-5 / H-7 composition: an array lookup_value materialises a value array.
  # A blank selected from a worksheet reference remains blank to COUNT and
  # ISBLANK, but contributes to COUNTA. Scalar reference-return controls must
  # retain the original reference semantics.
  # =========================================================================
  - id: xlookup_array_reference_blank_counta
    setup:
      D1: 1
      D2: 2
      D3: 3
      E1: 2
      E3: 1
    formula: "=COUNTA(XLOOKUP(SEQUENCE(3),D1:D3,E1:E3))"

  - id: xlookup_array_reference_blank_count
    setup:
      D1: 1
      D2: 2
