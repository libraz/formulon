    formula: '=GCD(A2,(A1,B1))'
  - id: ua_gcd_same_area_alone
    setup: { A1: 4, B1: 6, A2: 8 }
    formula: '=GCD((A1:A2,A1:A2))'
  - id: ua_gcd_same_area_beside
