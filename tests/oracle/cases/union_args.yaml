suite: union_args
description: >
  A multi-area reference as a function argument: which functions read every
  area and which refuse it, as the only argument and beside another one,
  against a same-area union and a parenthesised single area.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  - id: ua_concat_two_areas_alone
    setup: { A1: 4, B1: 6, A2: 8 }
    formula: '=CONCAT((A1,B1))'
  - id: ua_concat_two_areas_beside
    setup: { A1: 4, B1: 6, A2: 8 }
    formula: '=CONCAT(A2,(A1,B1))'
  - id: ua_concat_same_area_alone
    setup: { A1: 4, B1: 6, A2: 8 }
    formula: '=CONCAT((A1:A2,A1:A2))'
  - id: ua_concat_same_area_beside
    setup: { A1: 4, B1: 6, A2: 8 }
    formula: '=CONCAT(A2,(A1:A2,A1:A2))'
  - id: ua_concat_one_area_alone
    setup: { A1: 4, B1: 6, A2: 8 }
    formula: '=CONCAT((A1:B1))'
  - id: ua_concat_one_area_beside
    setup: { A1: 4, B1: 6, A2: 8 }
    formula: '=CONCAT(A2,(A1:B1))'
  - id: ua_textjoin_two_areas_alone
    setup: { A1: 4, B1: 6, A2: 8 }
    formula: '=TEXTJOIN(",",TRUE,(A1,B1))'
  - id: ua_textjoin_two_areas_beside
    setup: { A1: 4, B1: 6, A2: 8 }
    formula: '=TEXTJOIN(",",TRUE,A2,(A1,B1))'
  - id: ua_textjoin_same_area_alone
    setup: { A1: 4, B1: 6, A2: 8 }
    formula: '=TEXTJOIN(",",TRUE,(A1:A2,A1:A2))'
  - id: ua_textjoin_same_area_beside
    setup: { A1: 4, B1: 6, A2: 8 }
    formula: '=TEXTJOIN(",",TRUE,A2,(A1:A2,A1:A2))'
  - id: ua_textjoin_one_area_alone
    setup: { A1: 4, B1: 6, A2: 8 }
    formula: '=TEXTJOIN(",",TRUE,(A1:B1))'
  - id: ua_textjoin_one_area_beside
    setup: { A1: 4, B1: 6, A2: 8 }
    formula: '=TEXTJOIN(",",TRUE,A2,(A1:B1))'
