  - id: yieldmat_issue_after_settlement_is_num
    description: "YIELDMAT with issue >= settlement -> #NUM!"
    formula: "=YIELDMAT(DATE(2008,3,15), DATE(2008,11,3), DATE(2008,4,1), 0.0625, 100.0123, 0)"

  - id: yieldmat_zero_price_is_num
    description: "YIELDMAT with pr <= 0 -> #NUM!"
    formula: "=YIELDMAT(DATE(2008,3,15), DATE(2008,11,3), DATE(2007,11,8), 0.0625, 0, 0)"

  # -- Argument coercion: Analysis-ToolPak booleans / omitted
  #    arguments, and the near-integer snap of integer arguments --------------
  - id: atp_disc_bool
    formula: "=DISC(TRUE,40000,97,100)"

  - id: atp_disc_omit
    formula: "=DISC(,40000,97,100)"

  - id: atp_disc_boolcell
    setup: { A1: true }
    formula: "=DISC(A1,40000,97,100)"

  - id: atp_yielddisc_bool
    formula: "=YIELDDISC(TRUE,40000,97,100)"

  - id: atp_yielddisc_omit
    formula: "=YIELDDISC(,40000,97,100)"

  - id: atp_yielddisc_boolcell
    setup: { A1: true }
    formula: "=YIELDDISC(A1,40000,97,100)"

  - id: atp_tbillprice_bool
    formula: "=TBILLPRICE(TRUE,100,0.1)"

  - id: atp_tbillprice_omit
    formula: "=TBILLPRICE(,100,0.1)"

  - id: atp_tbillprice_boolcell
    setup: { A1: true }
    formula: "=TBILLPRICE(A1,100,0.1)"

  # -- Analysis-ToolPak arguments and near-integer snap, round 2 ---
