  # -- PRICEMAT additional perspectives -----------------------------------
  - id: pricemat_basis_actual_360
    description: "PRICEMAT with basis 2 (actual/360)"
    formula: "=PRICEMAT(DATE(2008,2,15), DATE(2008,4,13), DATE(2007,11,11), 0.061, 0.061, 2)"

  - id: pricemat_zero_rate_is_num
    description: "PRICEMAT with rate < 0 -> #NUM!"
    formula: "=PRICEMAT(DATE(2008,2,15), DATE(2008,4,13), DATE(2007,11,11), -0.01, 0.061, 0)"

  # -- YIELDDISC additional perspectives ----------------------------------
  - id: yielddisc_basis_actual_actual
    description: "YIELDDISC with basis 1 (actual/actual)"
    formula: "=YIELDDISC(DATE(2008,2,16), DATE(2008,3,1), 99.795, 100, 1)"
