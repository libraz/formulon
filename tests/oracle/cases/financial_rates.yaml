  - id: yielddisc_zero_price_is_num
    description: "YIELDDISC with pr <= 0 -> #NUM!"
    formula: "=YIELDDISC(DATE(2008,2,16), DATE(2008,3,1), 0, 100, 2)"

  # -- YIELDMAT additional perspectives -----------------------------------
  - id: yieldmat_basis_actual_360
    description: "YIELDMAT with basis 2 (actual/360)"
    formula: "=YIELDMAT(DATE(2008,3,15), DATE(2008,11,3), DATE(2007,11,8), 0.0625, 100.0123, 2)"
