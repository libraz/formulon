suite: financial_rates
description: Security-rate / T-Bill financial builtins — DISC / INTRATE / RECEIVED / TBILLPRICE / TBILLYIELD / TBILLEQ. See `eval/builtins/financial_rates.cpp`.
# Results are compared exactly.
tolerance: { abs: 0, rel: 0 }
locale: ja-JP
cases:
  # -- DISC ---------------------------------------------------------------
  - id: disc_basis_actual_actual
    description: "Microsoft docs example: DISC with basis 1 (actual/actual) ~ 0.05279"
    formula: "=DISC(DATE(2018,1,25), DATE(2018,6,15), 97.975, 100, 1)"
    tolerance: { abs: 0, rel: 0 }

  - id: disc_default_basis
    description: "DISC with default basis 0 (US 30/360)"
    formula: "=DISC(DATE(2018,1,25), DATE(2018,6,15), 97.975, 100)"
    tolerance: { abs: 0, rel: 0 }

  - id: disc_basis_actual_360
    description: "DISC with basis 2 (actual/360)"
    formula: "=DISC(DATE(2018,1,25), DATE(2018,6,15), 97.975, 100, 2)"
    tolerance: { abs: 0, rel: 0 }

  - id: disc_invalid_basis_is_num
    description: "DISC with unsupported basis -> #NUM!"
    formula: "=DISC(DATE(2018,1,25), DATE(2018,6,15), 97.975, 100, 5)"

  # -- INTRATE ------------------------------------------------------------
  - id: intrate_basis_actual_360
    description: "Microsoft docs example: INTRATE with basis 2 ~ 0.05768"
    formula: "=INTRATE(DATE(2008,2,15), DATE(2008,5,15), 1000000, 1014420, 2)"
    tolerance: { abs: 0, rel: 0 }

  - id: intrate_default_basis
    description: "INTRATE with default basis 0"
    formula: "=INTRATE(DATE(2008,2,15), DATE(2008,5,15), 1000000, 1014420)"
    tolerance: { abs: 0, rel: 0 }

  - id: intrate_settlement_after_maturity_is_num
    description: "INTRATE with settlement after maturity -> #NUM!"
    formula: "=INTRATE(DATE(2008,5,15), DATE(2008,2,15), 1000000, 1014420, 2)"

  # -- RECEIVED -----------------------------------------------------------
  - id: received_basis_actual_360
    description: "Microsoft docs example: RECEIVED with basis 2 ~ 1014584.65"
    formula: "=RECEIVED(DATE(2008,2,15), DATE(2008,5,15), 1000000, 0.0575, 2)"
    tolerance: { abs: 0, rel: 0 }

  - id: received_default_basis
    description: "RECEIVED with default basis 0"
    formula: "=RECEIVED(DATE(2008,2,15), DATE(2008,5,15), 1000000, 0.0575)"
    tolerance: { abs: 0, rel: 0 }

  # -- TBILLPRICE ---------------------------------------------------------
  - id: tbillprice_basic
    description: "Microsoft docs example: TBILLPRICE ~ 98.45"
    formula: "=TBILLPRICE(DATE(2008,3,31), DATE(2008,6,1), 0.09)"

  - id: tbillprice_dsm_over_365_is_num
    description: "TBILLPRICE with maturity > 1 year after settlement -> #NUM!"
    formula: "=TBILLPRICE(DATE(2008,3,31), DATE(2010,3,31), 0.09)"

  # -- TBILLYIELD ---------------------------------------------------------
  - id: tbillyield_basic
    description: "Microsoft docs example: TBILLYIELD ~ 0.09141"
    formula: "=TBILLYIELD(DATE(2008,3,31), DATE(2008,6,1), 98.45)"

  # -- TBILLEQ ------------------------------------------------------------
  - id: tbilleq_short_branch
    description: "Microsoft docs example: TBILLEQ short branch (DSM <= 182) ~ 0.09414"
    formula: "=TBILLEQ(DATE(2008,3,31), DATE(2008,6,1), 0.0914)"

  - id: tbilleq_long_branch
    description: "TBILLEQ long branch (DSM > 182): semi-annual-compounding quadratic"
    formula: "=TBILLEQ(DATE(2020,1,1), DATE(2020,10,27), 0.05)"

  - id: tbilleq_dsm_over_365_is_num
    description: "TBILLEQ with maturity > 1 year -> #NUM!"
    formula: "=TBILLEQ(DATE(2008,3,31), DATE(2010,3,31), 0.09)"

  # -- PRICEDISC ----------------------------------------------------------
  - id: pricedisc_basis_actual_360
    description: "PRICEDISC: 100 - discount*redemption*YEARFRAC, basis 2"
    formula: "=PRICEDISC(DATE(2018,2,16), DATE(2018,3,1), 0.0525, 100, 2)"
    tolerance: { abs: 0, rel: 0 }

  - id: pricedisc_default_basis
    description: "PRICEDISC with default basis 0 (US 30/360)"
    formula: "=PRICEDISC(DATE(2018,2,16), DATE(2018,3,1), 0.0525, 100)"
    tolerance: { abs: 0, rel: 0 }

  - id: pricedisc_invalid_basis_is_num
    description: "PRICEDISC with unsupported basis -> #NUM!"
    formula: "=PRICEDISC(DATE(2018,2,16), DATE(2018,3,1), 0.0525, 100, 5)"

  # -- PRICEMAT -----------------------------------------------------------
  - id: pricemat_basis_zero
    description: "Microsoft docs shape: PRICEMAT basis 0 ~ 99.98 range"
    formula: "=PRICEMAT(DATE(2008,2,15), DATE(2008,4,13), DATE(2007,11,11), 0.061, 0.061, 0)"

  - id: pricemat_default_basis
    description: "PRICEMAT with default basis 0 (omit trailing arg)"
    formula: "=PRICEMAT(DATE(2008,2,15), DATE(2008,4,13), DATE(2007,11,11), 0.061, 0.061)"

  - id: pricemat_issue_after_settlement_is_num
    description: "PRICEMAT with issue >= settlement -> #NUM!"
    formula: "=PRICEMAT(DATE(2008,2,15), DATE(2008,4,13), DATE(2008,3,1), 0.061, 0.061, 0)"

  # -- YIELDDISC ----------------------------------------------------------
  - id: yielddisc_basis_actual_360
    description: "Microsoft docs example: YIELDDISC basis 2 ~ 0.052823"
    formula: "=YIELDDISC(DATE(2008,2,16), DATE(2008,3,1), 99.795, 100, 2)"
    tolerance: { abs: 0, rel: 0 }

  - id: yielddisc_default_basis
    description: "YIELDDISC with default basis 0 (US 30/360)"
    formula: "=YIELDDISC(DATE(2008,2,16), DATE(2008,3,1), 99.795, 100)"
    tolerance: { abs: 0, rel: 0 }

  # -- YIELDMAT -----------------------------------------------------------
  - id: yieldmat_basis_zero
    description: "Microsoft docs example: YIELDMAT basis 0 ~ 0.060954"
    formula: "=YIELDMAT(DATE(2008,3,15), DATE(2008,11,3), DATE(2007,11,8), 0.0625, 100.0123, 0)"
    tolerance: { abs: 0, rel: 0 }

  - id: yieldmat_default_basis
    description: "YIELDMAT with default basis 0 (omit trailing arg)"
    formula: "=YIELDMAT(DATE(2008,3,15), DATE(2008,11,3), DATE(2007,11,8), 0.0625, 100.0123)"
    tolerance: { abs: 0, rel: 0 }

  # -- DISC additional perspectives ---------------------------------------
  - id: disc_settlement_after_maturity_is_num
    description: "DISC with settlement after maturity -> #NUM!"
    formula: "=DISC(DATE(2018,6,15), DATE(2018,1,25), 97.975, 100, 0)"

  # -- INTRATE additional perspectives ------------------------------------
  - id: intrate_basis_european_30_360
    description: "INTRATE with basis 4 (European 30/360)"
    formula: "=INTRATE(DATE(2008,2,15), DATE(2008,5,15), 1000000, 1014420, 4)"
    tolerance: { abs: 0, rel: 0 }

  - id: intrate_zero_investment_is_num
    description: "INTRATE with investment <= 0 -> #NUM!"
    formula: "=INTRATE(DATE(2008,2,15), DATE(2008,5,15), 0, 1014420, 2)"

  # -- RECEIVED additional perspectives -----------------------------------
  - id: received_basis_actual_actual
    description: "RECEIVED with basis 1 (actual/actual)"
    formula: "=RECEIVED(DATE(2008,2,15), DATE(2008,5,15), 1000000, 0.0575, 1)"
    tolerance: { abs: 0, rel: 0 }

  - id: received_settlement_after_maturity_is_num
    description: "RECEIVED with settlement >= maturity -> #NUM!"
    formula: "=RECEIVED(DATE(2008,5,15), DATE(2008,2,15), 1000000, 0.0575, 2)"

  - id: received_zero_discount_is_num
    description: "RECEIVED with discount <= 0 -> #NUM!"
    formula: "=RECEIVED(DATE(2008,2,15), DATE(2008,5,15), 1000000, 0, 2)"

  # -- TBILLEQ additional perspectives ------------------------------------
  - id: tbilleq_zero_discount_is_num
    description: "TBILLEQ with discount <= 0 -> #NUM!"
    formula: "=TBILLEQ(DATE(2008,3,31), DATE(2008,6,1), 0)"

  - id: tbilleq_settlement_after_maturity_is_num
    description: "TBILLEQ with settlement >= maturity -> #NUM!"
    formula: "=TBILLEQ(DATE(2008,6,1), DATE(2008,3,31), 0.0914)"

  # -- TBILLPRICE additional perspectives ---------------------------------
  - id: tbillprice_short_dated_next_day
    description: "TBILLPRICE: next-day maturity (DSM=1) ~ 99.975"
    formula: "=TBILLPRICE(DATE(2020,1,1), DATE(2020,1,2), 0.09)"

  - id: tbillprice_zero_discount_is_num
    description: "TBILLPRICE with discount <= 0 -> #NUM!"
    formula: "=TBILLPRICE(DATE(2008,3,31), DATE(2008,6,1), 0)"

  - id: tbillprice_settlement_after_maturity_is_num
    description: "TBILLPRICE with settlement >= maturity -> #NUM!"
    formula: "=TBILLPRICE(DATE(2008,6,1), DATE(2008,3,31), 0.09)"

  # -- TBILLYIELD additional perspectives ---------------------------------
  - id: tbillyield_short_dated_next_day
    description: "TBILLYIELD: next-day maturity (DSM=1) yields very high annualised rate"
    formula: "=TBILLYIELD(DATE(2020,1,1), DATE(2020,1,2), 99.975)"

  - id: tbillyield_dsm_over_365_is_num
    description: "TBILLYIELD with maturity > 1 year after settlement -> #NUM!"
    formula: "=TBILLYIELD(DATE(2008,3,31), DATE(2010,3,31), 98.45)"

  - id: tbillyield_zero_price_is_num
    description: "TBILLYIELD with pr <= 0 -> #NUM!"
    formula: "=TBILLYIELD(DATE(2008,3,31), DATE(2008,6,1), 0)"

  - id: tbillyield_settlement_after_maturity_is_num
    description: "TBILLYIELD with settlement >= maturity -> #NUM!"
    formula: "=TBILLYIELD(DATE(2008,6,1), DATE(2008,3,31), 98.45)"

  # -- PRICEDISC additional perspectives ----------------------------------
  - id: pricedisc_settlement_after_maturity_is_num
    description: "PRICEDISC with settlement >= maturity -> #NUM!"
