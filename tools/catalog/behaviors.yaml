        probe: '=ODDLYIELD(DATE(2008,4,20),DATE(2008,6,15),DATE(2007,12,24),0.0375,99.875,100,2,0)'
        expected: impl
      - name: "basis 1 (actual/actual)"
        probe: '=ODDLYIELD(DATE(2008,4,20),DATE(2008,6,15),DATE(2007,12,24),0.0375,99.875,100,2,1)'
        expected: impl
      - name: "basis 2 (actual/360)"
        probe: '=ODDLYIELD(DATE(2008,4,20),DATE(2008,6,15),DATE(2007,12,24),0.0375,99.875,100,2,2)'
        expected: impl
      - name: "basis 3 (actual/365)"
        probe: '=ODDLYIELD(DATE(2008,4,20),DATE(2008,6,15),DATE(2007,12,24),0.0375,99.875,100,2,3)'
        expected: impl
      - name: "basis 4 (European 30/360)"
        probe: '=ODDLYIELD(DATE(2008,4,20),DATE(2008,6,15),DATE(2007,12,24),0.0375,99.875,100,2,4)'
        expected: impl
      - name: "settlement before last_interest -> #NUM!"
        probe: '=ODDLYIELD(DATE(2007,11,1),DATE(2008,6,15),DATE(2007,12,24),0.0375,99.875,100,2,0)'
        expected: impl
      - name: "invalid basis 5 -> #NUM!"
        probe: '=ODDLYIELD(DATE(2008,4,20),DATE(2008,6,15),DATE(2007,12,24),0.0375,99.875,100,2,5)'
        expected: impl

  # -------------------------------------------------------------------------
  # DURATION — Macaulay duration. Microsoft docs canonical: DURATION(
  # 2008-01-01, 2016-01-01, 8%, 9%, 2, 1) -> ~5.9938. Seven perspectives:
  # 5 DCC bases + maturity-boundary error + invalid-basis.
  # -------------------------------------------------------------------------

  - function: "DURATION"
    aspect: "Macaulay duration DCC"
    behaviors:
      - name: "docs canonical example basis 1 -> ~5.9938"
        probe: '=DURATION(DATE(2008,1,1),DATE(2016,1,1),0.08,0.09,2,1)'
        expected: impl
      - name: "basis 0 (US 30/360)"
        probe: '=DURATION(DATE(2008,1,1),DATE(2016,1,1),0.08,0.09,2,0)'
        expected: impl
      - name: "basis 2 (actual/360)"
        probe: '=DURATION(DATE(2008,1,1),DATE(2016,1,1),0.08,0.09,2,2)'
        expected: impl
      - name: "basis 3 (actual/365)"
        probe: '=DURATION(DATE(2008,1,1),DATE(2016,1,1),0.08,0.09,2,3)'
        expected: impl
      - name: "basis 4 (European 30/360)"
        probe: '=DURATION(DATE(2008,1,1),DATE(2016,1,1),0.08,0.09,2,4)'
        expected: impl
      - name: "settlement >= maturity -> #NUM!"
