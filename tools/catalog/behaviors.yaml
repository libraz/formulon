  # =========================================================================
  # shape family — reference-shape introspection (ROW / ROWS / COLUMN /
  # COLUMNS), local-binding (LET), and shape-aware aggregates (SUM /
  # SUMPRODUCT). All cases live under tests/oracle/cases/shape.yaml.
  # =========================================================================

  - function: "COLUMN"
    aspect: "column-index of a reference"
    behaviors:
      - name: "single-cell ref -> 1-based column"
        probe: "=COLUMN(C5)"
        expected: impl
      - name: "rectangle ref -> first column"
        probe: "=COLUMN(B2:D4)"
        expected: impl
      - name: "no argument -> formula cell column"
        probe: "=COLUMN()"
        expected: impl
      - name: "horizontal range consumed by SUMPRODUCT"
        probe: "COLUMN(A1:E1)"
        expected: impl
      - name: "ref resolved through INDIRECT"
        probe: "=COLUMN(INDIRECT(\"D7\"))"
        expected: impl

  - function: "ROW"
    aspect: "row-index of a reference"
    behaviors:
      - name: "single-cell ref -> 1-based row"
        probe: "=ROW(C5)"
        expected: impl
      - name: "rectangle ref -> first row"
        probe: "=ROW(B2:D4)"
        expected: impl
      - name: "no argument -> formula cell row"
        probe: "=ROW()"
        expected: impl
      - name: "vertical range consumed by SUM"
        probe: "ROW(A1:A5)"
        expected: impl
      - name: "ref resolved through INDIRECT"
        probe: "=ROW(INDIRECT(\"D7\"))"
        expected: impl

  - function: "COLUMNS"
    aspect: "column count of a reference or array"
    behaviors:
      - name: "rectangle ref -> column count"
        probe: "=COLUMNS(A1:B3)"
        expected: impl
      - name: "single-cell ref -> 1"
        probe: "=COLUMNS(A1)"
        expected: impl
      - name: "horizontal array literal"
        probe: "=COLUMNS({1,2,3})"
        expected: impl
      - name: "scalar number -> 1 (1x1)"
        probe: "=COLUMNS(42)"
        expected: impl
      - name: "INDIRECT-resolved rectangle"
        probe: "=COLUMNS(INDIRECT(\"A1:B3\"))"
        expected: impl

  - function: "ROWS"
    aspect: "row count of a reference or array"
    behaviors:
      - name: "rectangle ref -> row count"
        probe: "=ROWS(A1:B3)"
        expected: impl
      - name: "single-cell ref -> 1"
        probe: "=ROWS(A1)"
        expected: impl
      - name: "vertical array literal"
        probe: "=ROWS({1;2;3})"
        expected: impl
      - name: "scalar number -> 1 (1x1)"
        probe: "=ROWS(42)"
        expected: impl
      - name: "IF returning a rangeop preserves shape"
        probe: "=ROWS(IF(TRUE,A1:B3,A1:B3))"
        expected: impl

  - function: "LET"
    aspect: "local-binding scope and forwarding"
    behaviors:
      - name: "single binding"
        probe: "=LET(x, 2, x*3)"
        expected: impl
      - name: "multi binding"
        probe: "=LET(a, 2, b, 3, a + b)"
        expected: impl
      - name: "intermediate computation reuses earlier binding"
        probe: "=LET(x, 4, y, x*x, y + 1)"
        expected: impl
      - name: "binds a RangeOp; forwarded to ROWS"
        probe: "=LET(x, A1:C3, ROWS(x))"
        expected: impl
      - name: "error in binding propagates"
        probe: "=LET(x, NA(), x + 1)"
        expected: impl

  - function: "SUM"
    aspect: "scalar / range / shape-aware addition"
    behaviors:
      - name: "scalar arguments"
        probe: "=SUM(1, 2, 3)"
        expected: impl
      - name: "vertical range"
        probe: "=SUM(A1:A3)"
        expected: impl
      - name: "consumes ROW(range) shape"
        probe: "=SUM(ROW(A1:A5))"
        expected: impl
      - name: "text and blank cells ignored"
        probe: "=SUM(B1:B3)"
        expected: impl
      - name: "error in operand propagates"
        probe: "=SUM(C1:C3)"
        expected: impl

  - function: "SUMPRODUCT"
    aspect: "elementwise product then sum"
    behaviors:
      - name: "two equal-shape arrays"
        probe: "=SUMPRODUCT(A1:A3,B1:B3)"
        expected: impl
      - name: "single array reduces to SUM"
        probe: "=SUMPRODUCT(A1:A3)"
        expected: impl
      - name: "shape mismatch -> #VALUE!"
        probe: "=SUMPRODUCT(A1:A2,B1:B3)"
        expected: impl
      - name: "boolean array coercion via *1"
        probe: "=SUMPRODUCT((A1:A5>2)*1)"
        expected: impl
      - name: "error in array literal propagates"
        probe: "=SUMPRODUCT({1,2,#N/A})"
        expected: impl

  # -------------------------------------------------------------------------
  # Bivariate-regression family: CORREL / COVARIANCE.P / COVARIANCE.S /
  # FORECAST / FORECAST.LINEAR / INTERCEPT / RSQ / SLOPE. All members live
  # in tests/oracle/cases/regression.yaml and consume the same `(known_y,
  # known_x)` argument shape. Probes hit the YAML `formula:` field; case
  # `id`s carry per-fixture semantics.
  # -------------------------------------------------------------------------

  - function: "CORREL"
    aspect: "Pearson correlation coefficient"
    behaviors:
      - name: "general r over reference dataset"
        probe: "=CORREL(B1:B5, A1:A5)"
        expected: impl
      - name: "perfect positive correlation"
        probe: "=CORREL(A1:A3, B1:B3)"
        expected: impl
      - name: "shape mismatch -> #N/A"
        probe: "=CORREL(A1:A2, B1:B3)"
        expected: impl
      - name: "row-vector pair"
        probe: "=CORREL(A1:C1, A2:C2)"
        expected: impl
      - name: "row-vs-column with matching cell counts"
        probe: "=CORREL(A1:C1, A2:A4)"
        expected: impl

  - function: "COVARIANCE.P"
    aspect: "population covariance (divisor n)"
    behaviors:
      - name: "population covariance over reference dataset"
        probe: "=COVARIANCE.P(B1:B5, A1:A5)"
        expected: impl
      - name: "perfect linear y = 2x"
        probe: "=COVARIANCE.P(B1:B3, A1:A3)"
        expected: impl
      - name: "single-pair n=1 -> 0"
        probe: "=COVARIANCE.P(A1:A1, B1:B1)"
        expected: impl
      - name: "shape mismatch -> #N/A"
        probe: "=COVARIANCE.P(A1:A2, B1:B3)"
        expected: impl
      - name: "with negatives (anti-correlation)"
        probe: "=COVARIANCE.P(B1:B3, A1:A3)"
        expected: impl

  - function: "COVARIANCE.S"
    aspect: "sample covariance (divisor n-1)"
    behaviors:
      - name: "sample covariance over reference dataset"
        probe: "=COVARIANCE.S(B1:B5, A1:A5)"
        expected: impl
      - name: "n=2 sample"
        probe: "=COVARIANCE.S(B1:B2, A1:A2)"
        expected: impl
      - name: "n=1 -> #DIV/0!"
        probe: "=COVARIANCE.S(A1:A1, B1:B1)"
        expected: impl
      - name: "perfect linear y = 2x"
        probe: "=COVARIANCE.S(B1:B3, A1:A3)"
        expected: impl
      - name: "with negatives (anti-correlation)"
        probe: "=COVARIANCE.S(B1:B3, A1:A3)"
        expected: impl

  - function: "FORECAST"
    aspect: "legacy alias for FORECAST.LINEAR"
    # FORECAST cases share the (x, known_y, known_x) argument shape; per-fixture
    # semantics (interpolation vs extrapolation, negative slope, mismatch) are
    # documented in case `id`s.
    behaviors:
      - name: "interpolation at x=3 on reference dataset"
        probe: "=FORECAST(3, B1:B5, A1:A5)"
        expected: impl
      - name: "at x=0 equals intercept"
        probe: "=FORECAST(0, B1:B5, A1:A5)"
        expected: impl
      - name: "extrapolation beyond known x"
        probe: "=FORECAST(10, B1:B5, A1:A5)"
        expected: impl
      - name: "negative slope"
        probe: "=FORECAST(4, B1:B3, A1:A3)"
        expected: impl
      - name: "shape mismatch -> #N/A"
        probe: "=FORECAST(2, B1:B3, A1:A2)"
        expected: impl

  - function: "FORECAST.LINEAR"
    aspect: "linear-regression point forecast"
    behaviors:
      - name: "at x=0 equals intercept"
        probe: "=FORECAST.LINEAR(0, B1:B5, A1:A5)"
        expected: impl
      - name: "interpolation at x=3 on reference dataset"
        probe: "=FORECAST.LINEAR(3, B1:B5, A1:A5)"
        expected: impl
      - name: "extrapolation beyond known x"
        probe: "=FORECAST.LINEAR(10, B1:B5, A1:A5)"
        expected: impl
      - name: "constant known_x -> #DIV/0!"
        probe: "=FORECAST.LINEAR(2, B1:B3, A1:A3)"
        expected: impl
      - name: "negative slope"
        probe: "=FORECAST.LINEAR(4, B1:B3, A1:A3)"
        expected: impl

  - function: "INTERCEPT"
    aspect: "linear-regression y-intercept"
    behaviors:
      - name: "intercept on reference dataset"
        probe: "=INTERCEPT(B1:B5, A1:A5)"
        expected: impl
      - name: "horizontal line -> intercept = constant y"
        probe: "=INTERCEPT(B1:B3, A1:A3)"
        expected: impl
      - name: "perfect linear y = 2x -> intercept = 0"
        probe: "=INTERCEPT(B1:B4, A1:A4)"
        expected: impl
      - name: "shape mismatch -> #N/A"
        probe: "=INTERCEPT(B1:B3, A1:A2)"
        expected: impl
      - name: "intercept identity slope*3 + intercept"
        probe: "=SLOPE(B1:B5,A1:A5)*3 + INTERCEPT(B1:B5,A1:A5)"
        expected: impl

  - function: "RSQ"
    aspect: "coefficient of determination (r-squared)"
    behaviors:
      - name: "RSQ on reference dataset"
        probe: "=RSQ(B1:B5, A1:A5)"
        expected: impl
      - name: "perfect linear y = 2x -> 1"
        probe: "=RSQ(B1:B4, A1:A4)"
        expected: impl
      - name: "constant y -> #DIV/0!"
        probe: "=RSQ(B1:B3, A1:A3)"
        expected: impl
      - name: "RSQ identity = CORREL^2"
        probe: "=RSQ(B1:B5,A1:A5) - CORREL(B1:B5,A1:A5)^2"
        expected: impl
      - name: "shape mismatch -> #N/A"
        probe: "=RSQ(B1:B3, A1:A2)"
        expected: impl

  - function: "SLOPE"
    aspect: "linear-regression slope"
    behaviors:
      - name: "slope on reference dataset"
        probe: "=SLOPE(B1:B5, A1:A5)"
        expected: impl
      - name: "vertical line (var_x = 0) -> #DIV/0!"
        probe: "=SLOPE(B1:B3, A1:A3)"
        expected: impl
      - name: "negative slope"
        probe: "=SLOPE(B1:B3, A1:A3)"
        expected: impl
      - name: "shape mismatch -> #N/A"
        probe: "=SLOPE(B1:B3, A1:A2)"
        expected: impl
      - name: "inline array literal arguments"
        probe: "=SLOPE({2,4,6}, {1,2,3})"
        expected: impl

  # -------------------------------------------------------------------------
  # Bessel and error-function family: BESSELI / BESSELJ / BESSELK / BESSELY
  # / ERF / ERF.PRECISE / ERFC / ERFC.PRECISE. All members live in
  # tests/oracle/cases/engineering_special.yaml; per-case tolerance is
  # widened where Excel's A&S polynomial approximations diverge from
  # Formulon's series / POSIX-delegated values (see tests/divergence.yaml).
  # -------------------------------------------------------------------------

  - function: "BESSELI"
    aspect: "modified Bessel function of the first kind I_n(x)"
    behaviors:
      - name: "I_0(1)"
        probe: "=BESSELI(1,0)"
        expected: impl
      - name: "I_0(0) = 1"
        probe: "=BESSELI(0,0)"
        expected: impl
      - name: "I_n(0) = 0 for n >= 1"
        probe: "=BESSELI(0,1)"
        expected: impl
      - name: "I_1(2)"
        probe: "=BESSELI(2,1)"
        expected: impl
      - name: "large-x growth I_0(20)"
        probe: "=BESSELI(20,0)"
        expected: impl

  - function: "BESSELJ"
    aspect: "Bessel function of the first kind J_n(x)"
    behaviors:
      - name: "J_0(0) = 1"
        probe: "=BESSELJ(0,0)"
        expected: impl
      - name: "J_n(0) = 0 for n >= 1"
        probe: "=BESSELJ(0,1)"
        expected: impl
      - name: "J_0(1)"
        probe: "=BESSELJ(1,0)"
        expected: impl
      - name: "negative order rejected -> #NUM!"
        probe: "=BESSELJ(1,-1)"
        expected: impl
      - name: "large-x oscillatory regime J_0(10)"
        probe: "=BESSELJ(10,0)"
        expected: impl

  - function: "BESSELK"
    aspect: "modified Bessel function of the second kind K_n(x)"
    behaviors:
      - name: "K_0(1)"
        probe: "=BESSELK(1,0)"
        expected: impl
      - name: "K_1(2)"
        probe: "=BESSELK(2,1)"
        expected: impl
      - name: "K_n(0) singular -> #NUM!"
        probe: "=BESSELK(0,0)"
        expected: impl
      - name: "negative x rejected -> #NUM!"
        probe: "=BESSELK(-1,0)"
        expected: impl
      - name: "large-x decay K_0(20)"
        probe: "=BESSELK(20,0)"
        expected: impl

  - function: "BESSELY"
    aspect: "Bessel function of the second kind Y_n(x)"
    behaviors:
      - name: "Y_0(1)"
        probe: "=BESSELY(1,0)"
        expected: impl
      - name: "Y_1(1)"
        probe: "=BESSELY(1,1)"
        expected: impl
      - name: "Y_n(0) singular -> #NUM!"
        probe: "=BESSELY(0,0)"
        expected: impl
      - name: "negative x rejected -> #NUM!"
        probe: "=BESSELY(-1,0)"
        expected: impl
      - name: "Y_5 at moderate x -> heavy magnitude"
        probe: "=BESSELY(2,5)"
        expected: impl

  - function: "ERF"
    aspect: "error function (1- or 2-argument form)"
    behaviors:
      - name: "erf(0) = 0"
        probe: "=ERF(0)"
        expected: impl
      - name: "erf(-x) = -erf(x) (odd)"
        probe: "=ERF(-1)"
        expected: impl
      - name: "two-argument interval erf(b) - erf(a)"
        probe: "=ERF(1,2)"
        expected: impl
      - name: "large-x asymptote erf(6) ~ 1"
        probe: "=ERF(6)"
        expected: impl
      - name: "error in argument propagates"
        probe: "=ERF(#N/A)"
        expected: impl

  - function: "ERF.PRECISE"
    aspect: "strict 1-arg error function"
    behaviors:
      - name: "ERF.PRECISE(0) = 0"
        probe: "=ERF.PRECISE(0)"
        expected: impl
      - name: "ERF.PRECISE(1)"
        probe: "=ERF.PRECISE(1)"
        expected: impl
      - name: "odd function: ERF.PRECISE(-1) = -ERF.PRECISE(1)"
        probe: "=ERF.PRECISE(-1)"
        expected: impl
      - name: "large-x asymptote ~ 1"
        probe: "=ERF.PRECISE(6)"
        expected: impl
      - name: "two-argument form rejected (Excel returns blank, Formulon #VALUE!)"
        probe: "=ERF.PRECISE(1,2)"
        expected: diverged

  - function: "ERFC"
    aspect: "complementary error function 1 - erf(x)"
    behaviors:
      - name: "erfc(0) = 1"
        probe: "=ERFC(0)"
        expected: impl
      - name: "erfc(1) ~ 0.157299"
        probe: "=ERFC(1)"
        expected: impl
      - name: "large-x tail erfc(6) ~ 1e-17"
        probe: "=ERFC(6)"
        expected: impl
      - name: "negative arg erfc(-1) = 2 - erfc(1)"
        probe: "=ERFC(-1)"
        expected: impl
      - name: "negative arg erfc(-2) ~ 1.99532"
        probe: "=ERFC(-2)"
        expected: impl

  - function: "ERFC.PRECISE"
    aspect: "strict 1-arg complementary error function"
    behaviors:
      - name: "ERFC.PRECISE(1)"
        probe: "=ERFC.PRECISE(1)"
        expected: impl
      - name: "ERFC.PRECISE(0) = 1"
        probe: "=ERFC.PRECISE(0)"
        expected: impl
      - name: "negative arg ERFC.PRECISE(-1) = 2 - ERFC.PRECISE(1)"
        probe: "=ERFC.PRECISE(-1)"
        expected: impl
      - name: "large-x tail ~ 0"
        probe: "=ERFC.PRECISE(6)"
        expected: impl
      - name: "two-argument form rejected (Excel returns blank, Formulon #VALUE!)"
        probe: "=ERFC.PRECISE(1,2)"
        expected: diverged

  # -------------------------------------------------------------------------
  # Lookup family: CHOOSE / INDEX / MATCH / VLOOKUP / HLOOKUP / XLOOKUP /
  # XMATCH. Members live in tests/oracle/cases/lookup.yaml; probes hit the
  # YAML `formula:` field of cases that exercise the named perspective.
  # Perspectives parallel across the cluster: exact-match, approximate or
  # search-mode variant, not-found behavior, wildcard interpretation, and
  # error / out-of-bounds propagation.
  # -------------------------------------------------------------------------

  - function: "MATCH"
    aspect: "linear lookup with match_type {-1, 0, 1}"
    behaviors:
      - name: "exact match (match_type=0) hits a value"
        probe: "=MATCH(20,A1:A3,0)"
        expected: impl
      - name: "exact match miss returns #N/A"
        probe: "=MATCH(25,A1:A3,0)"
        expected: impl
      - name: "approximate match ascending (match_type=1)"
        probe: "=MATCH(25,A1:A3,1)"
        expected: impl
      - name: "approximate match descending (match_type=-1)"
        probe: "=MATCH(15,A1:A3,-1)"
        expected: impl
      - name: "wildcard ? in lookup_value"
        probe: "=MATCH(\"ca?\",A1:A3,0)"
        expected: impl

  - function: "INDEX"
    aspect: "row/column index extraction from a reference"
    behaviors:
      - name: "1D vector index"
        probe: "=INDEX(A1:A3,2)"
        expected: impl
      - name: "2D row, column index"
        probe: "=INDEX(A1:B2,2,1)"
        expected: impl
      - name: "row=0 returns the entire column"
        probe: "=INDEX(A1:A3,0)"
        expected: impl
      - name: "col=0 on 2D returns the entire row"
        probe: "=INDEX(A1:B2,1,0)"
        expected: impl
      - name: "row out of range -> #REF!"
        probe: "=INDEX(A1:A3,5)"
        expected: impl

  - function: "CHOOSE"
    aspect: "1-based selection from a value list"
    behaviors:
      - name: "selects the second value"
        probe: "=CHOOSE(2,\"a\",\"b\",\"c\")"
        expected: impl
      - name: "index out of range -> #VALUE!"
        probe: "=CHOOSE(5,\"a\",\"b\",\"c\")"
        expected: impl
      - name: "index zero -> #VALUE!"
        probe: "=CHOOSE(0,\"a\",\"b\",\"c\")"
        expected: impl
      - name: "negative index -> #VALUE!"
        probe: "=CHOOSE(-1,\"a\",\"b\",\"c\")"
        expected: impl
      - name: "error in index propagates"
        probe: "=CHOOSE(#REF!,\"a\",\"b\",\"c\")"
        expected: impl

  - function: "VLOOKUP"
    aspect: "vertical tabular lookup with range_lookup TRUE/FALSE"
    behaviors:
      - name: "exact match (range_lookup=FALSE) hits"
        probe: "=VLOOKUP(\"banana\",A1:B3,2,FALSE)"
        expected: impl
      - name: "exact match miss -> #N/A"
        probe: "=VLOOKUP(\"cherry\",A1:B2,2,FALSE)"
        expected: impl
      - name: "approximate match (range_lookup=TRUE) on sorted range"
        probe: "=VLOOKUP(25,A1:B3,2,TRUE)"
        expected: impl
      - name: "wildcard pattern with exact match"
        probe: "=VLOOKUP(\"b*\",A1:B3,2,FALSE)"
        expected: impl
      - name: "col_index_num out of range -> #REF!"
        probe: "=VLOOKUP(\"apple\",A1:B2,3,FALSE)"
        expected: impl

  - function: "HLOOKUP"
    aspect: "horizontal tabular lookup with range_lookup TRUE/FALSE"
    behaviors:
      - name: "exact match (range_lookup=FALSE) hits"
        probe: "=HLOOKUP(\"b\",A1:C2,2,FALSE)"
        expected: impl
      - name: "approximate match (range_lookup=TRUE) on sorted row"
        probe: "=HLOOKUP(25,A1:C2,2,TRUE)"
        expected: impl
      - name: "duplicate-key columns: first match wins"
        probe: "=HLOOKUP(\"y\",A1:C2,2,FALSE)"
        expected: impl
      - name: "exact match miss -> #N/A"
        probe: "=HLOOKUP(\"z\",A1:C2,2,FALSE)"
        expected: impl
      - name: "row_index_num out of range -> #REF!"
        probe: "=HLOOKUP(\"a\",A1:B2,5,FALSE)"
        expected: impl

  - function: "XLOOKUP"
    aspect: "dynamic-array lookup with match_mode and search_mode"
    behaviors:
      - name: "default exact match hits"
        probe: "=XLOOKUP(20,A1:A2,B1:B2)"
        expected: impl
      - name: "if_not_found default returned on miss"
        probe: "=XLOOKUP(30,A1:A2,B1:B2,\"missing\")"
        expected: impl
      - name: "match_mode=-1 next-smaller"
        probe: "=XLOOKUP(25,A1:A3,B1:B3,,-1)"
        expected: impl
      - name: "match_mode=2 wildcard"
        probe: "=XLOOKUP(\"b*\",A1:A3,B1:B3,,2)"
        expected: impl
      - name: "search_mode=-1 reverse search returns last match"
        probe: "=XLOOKUP(\"x\",A1:A3,B1:B3,,0,-1)"
        expected: impl

  - function: "XMATCH"
    aspect: "dynamic-array index lookup with match_mode and search_mode"
    behaviors:
      - name: "exact match (match_mode=0) hits"
        probe: "=XMATCH(20,A1:A3,0)"
        expected: impl
      - name: "wildcard match_mode=2"
        probe: "=XMATCH(\"ca?\",A1:A3,2)"
        expected: impl
      - name: "search_mode=-1 reverse returns last match"
        probe: "=XMATCH(\"x\",A1:A3,0,-1)"
        expected: impl
      - name: "search_mode=2 binary search ascending"
        probe: "=XMATCH(30,A1:A4,0,2)"
        expected: impl
      - name: "exact match miss -> #N/A"
        probe: "=XMATCH(99,A1:A3,0)"
        expected: impl

  # -------------------------------------------------------------------------
  # Coupon-bond schedule family: COUPPCD / COUPNCD / COUPNUM / COUPDAYBS /
