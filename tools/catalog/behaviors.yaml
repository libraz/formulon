      - name: "number is not text -> FALSE"
        probe: "=ISTEXT(42)"
        expected: impl
      - name: "blank cell is not text -> FALSE"
        probe: "=ISTEXT(A1)"
        expected: impl
      - name: "error is inspected, not propagated -> FALSE"
