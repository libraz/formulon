        probe: "=TINV(1.5, 5)"
        expected: impl
      - name: "small quantile p=0.5"
        probe: "=TINV(0.5, 5)"
        expected: impl

  - function: "COVAR"
    aspect: "pre-2010 alias for COVARIANCE.P (population)"
    # Five COVAR cases share three distinct formulas — A1:A5/B1:B5
    # (population sample), A1:A3/B1:B3 (perfect-linear / negatives /
    # constant-series, distinguished by setup), and A1:A3/B1:B2 (length
    # mismatch). Each behavior probe simply needs to match at least one
    # case formula; per-fixture semantics are documented in case `id`s.
    behaviors:
      - name: "population covariance over A1:A5,B1:B5"
        probe: "=COVAR(A1:A5, B1:B5)"
        expected: impl
      - name: "perfect linear (y = 2x)"
        probe: "=COVAR(A1:A3, B1:B3)"
        expected: impl
      - name: "with negatives (anti-correlation)"
        probe: "=COVAR(A1:A3, B1:B3)"
        expected: impl
      - name: "length mismatch -> #N/A"
        probe: "=COVAR(A1:A3, B1:B2)"
        expected: impl
      - name: "constant x series (zero covariance)"
        probe: "=COVAR(A1:A3, B1:B3)"
        expected: impl

  - function: "PEARSON"
    aspect: "pre-2010 alias for CORREL"
    # PEARSON cases share four distinct formulas: A1:A3/B1:B3 (perfect
    # positive, with-negatives, constant-y), B1:B5/A1:A5 (general r),
    # A1:A3/B1:B2 (length mismatch), distinguished by setup.
    behaviors:
      - name: "perfect positive correlation"
        probe: "=PEARSON(A1:A3, B1:B3)"
        expected: impl
      - name: "general r over A1:A5,B1:B5"
        probe: "=PEARSON(B1:B5, A1:A5)"
        expected: impl
      - name: "length mismatch -> #N/A"
        probe: "=PEARSON(A1:A3, B1:B2)"
        expected: impl
      - name: "with negatives (perfect anti-correlation)"
        probe: "=PEARSON(A1:A3, B1:B3)"
        expected: impl
      - name: "constant y series (zero variance)"
        probe: "=PEARSON(A1:A3, B1:B3)"
        expected: impl

  # -------------------------------------------------------------------------
  # Information / type-introspection / reference family. All members share
