  # -------------------------------------------------------------------------
  # Date / time core (non-volatile). Cases live in
  # tests/oracle/cases/datetime.yaml. Volatile family (NOW / TODAY / RAND*)
  # is declared earlier under its own groups; DATEVALUE / TIMEVALUE live in
  # tests/oracle/cases/datevalue_timevalue.yaml and have their own groups.
  # -------------------------------------------------------------------------

  - function: "YEAR"
    aspect: "year extraction from serial dates"
    behaviors:
      - name: "year of explicit DATE(2024,4,22) -> 2024"
        probe: "=YEAR(DATE(2024,4,22))"
        expected: impl
      - name: "leap-year Feb 29 -> 2024"
        probe: "=YEAR(DATE(2024,2,29))"
        expected: impl
      - name: "serial 0 -> 1900 (1900-01-00 origin)"
        probe: "=YEAR(0)"
        expected: impl
      - name: "text date string coerces through locale parser"
        probe: '=YEAR("2024-12-31")'
        expected: impl
      - name: "large serial 50000 -> 2036"
        probe: "=YEAR(50000)"
        expected: impl

  - function: "MONTH"
    aspect: "month extraction from serial dates"
    behaviors:
      - name: "month of mid-year date -> 4"
        probe: "=MONTH(DATE(2024,4,22))"
        expected: impl
      - name: "leap-day Feb -> 2"
        probe: "=MONTH(DATE(2024,2,29))"
        expected: impl
      - name: "serial 0 -> 1 (1900-01-00 quirk)"
        probe: "=MONTH(0)"
        expected: impl
      - name: "year-end Dec -> 12"
        probe: "=MONTH(DATE(2024,12,31))"
        expected: impl
      - name: "text date string coerces through locale parser"
        probe: '=MONTH("2024-07-04")'
        expected: impl

  - function: "DAY"
    aspect: "day-of-month extraction"
    behaviors:
      - name: "day of explicit DATE -> 22"
        probe: "=DAY(DATE(2024,4,22))"
        expected: impl
      - name: "leap-day Feb 29 -> 29"
        probe: "=DAY(DATE(2024,2,29))"
        expected: impl
      - name: "month-end day 31 -> 31"
        probe: "=DAY(DATE(2024,12,31))"
        expected: impl
      - name: "serial 0 -> 0 (1900-01-00 quirk)"
        probe: "=DAY(0)"
        expected: impl
      - name: "text date string coerces through locale parser"
        probe: '=DAY("2024-07-04")'
        expected: impl

  - function: "HOUR"
    aspect: "hour extraction from time fractions"
    behaviors:
      - name: "midnight serial 0 -> 0"
        probe: "=HOUR(0)"
        expected: impl
      - name: "noon serial 0.5 -> 12"
        probe: "=HOUR(0.5)"
        expected: impl
      - name: "near-midnight serial 0.99999 -> 23"
        probe: "=HOUR(0.99999)"
        expected: impl
      - name: "TIME-built fractional hour read"
        probe: "=HOUR(TIME(13,45,30))"
        expected: impl
      - name: "ignores integer date part"
        probe: "=HOUR(DATE(2024,4,22)+0.75)"
        expected: impl

  - function: "MINUTE"
    aspect: "minute extraction from time fractions"
    behaviors:
      - name: "midnight serial 0 -> 0"
        probe: "=MINUTE(0)"
        expected: impl
      - name: "noon serial 0.5 -> 0"
        probe: "=MINUTE(0.5)"
        expected: impl
      - name: "TIME-built minute read"
