  # -------------------------------------------------------------------------
  # ANCHORARRAY singleton (cases under tests/oracle/cases/dynamic_array.yaml).
  # OOXML internal encoding of the postfix `ref#` spill operator. Cases are
  # written with the `_xlfn.ANCHORARRAY(...)` form so the closure-check
  # function-name regex matches; the `_xlfn.` prefix is stripped before
  # dispatch, so callers see the bare ANCHORARRAY at evaluation time. Some
  # Setup-formula spill sources are materialized by the oracle harness before
  # the formula under test runs. Non-spill anchors remain diverged because Mac
  # Excel/xlwings reads the explicit `_xlfn.ANCHORARRAY(...)` probe as blank
  # while Formulon surfaces the documented #REF! for a non-spill anchor.
  # -------------------------------------------------------------------------
  - function: "ANCHORARRAY"
    aspect: "spill-anchor lookup (OOXML internal `ref#` encoding)"
    behaviors:
      - name: "SUM over spill from SEQUENCE source"
        probe: "=SUM(_xlfn.ANCHORARRAY(A1))"
        expected: impl
      - name: "ROWS over spill from SEQUENCE source"
        probe: "=ROWS(_xlfn.ANCHORARRAY(A1))"
        expected: impl
      - name: "OFFSET-resolved spill anchor"
        probe: "_xlfn.ANCHORARRAY(OFFSET("
        expected: impl
      - name: "non-anchor static-value cell"
        probe: "_xlfn.ANCHORARRAY(B1)"
        expected: diverged
      - name: "blank anchor cell"
        probe: "_xlfn.ANCHORARRAY(E1)"
        expected: diverged

