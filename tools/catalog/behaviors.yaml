        expected: impl
      - name: "negative inputs"
        probe: "=STDEV.P(-1,-2,-3,-4,-5)"
        expected: impl
      - name: "single value -> 0 (population sd of singleton)"
        probe: "=STDEV.P(5)"
        expected: impl
      - name: "literal-array population sd"
        probe: "=STDEV.P({2;4;4;4;5;5;7;9})"
        expected: impl

