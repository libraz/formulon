        expected: impl
      - name: "shape mismatch -> error"
        probe: '=TREND({1;2;3}, {1;2})'
        expected: impl
      - name: "singular system (collinear x) -> partial fit spill"
        probe: '=TREND({1;2;3;4}, {1,2;1,2;1,2;1,2})'
        expected: impl
      - name: "non-numeric cell in known_y -> #VALUE!"
        probe: '=TREND({1;"x";3}, {1;2;3})'
        expected: impl

  # -------------------------------------------------------------------------
  # LOGEST — exponential regression via LINEST on ln(y). Seven perspectives:
  # univariate stats=FALSE / stats=TRUE spills, multivariate spill,
  # const=FALSE intercept slot=1, plus three live error returns
  # (y<=0 -> #NUM!, shape mismatch, non-numeric cell).
  # -------------------------------------------------------------------------

  - function: "LOGEST"
    aspect: "exponential regression"
    behaviors:
      - name: "univariate stats=FALSE -> 1x(k+1) spill"
        probe: '=LOGEST({2;4;8;16}, {1;2;3;4})'
        expected: impl
      - name: "univariate stats=TRUE -> 5x(k+1) spill"
        probe: '=LOGEST({2;4;8;16}, {1;2;3;4}, TRUE, TRUE)'
        expected: diverged
      - name: "multivariate -> spill"
        probe: '=LOGEST({2;4;8;16}, {1,0;2,0;3,1;4,1})'
        expected: impl
      - name: "const=FALSE -> trailing slot is exp(0)=1 in spill"
        probe: '=LOGEST({2;4;8;16}, {1;2;3;4}, FALSE)'
        expected: impl
      - name: "y <= 0 -> #NUM! (ln undefined)"
        probe: '=LOGEST({1;-2;3}, {1;2;3})'
        expected: impl
      - name: "shape mismatch -> error"
        probe: '=LOGEST({1;2;3}, {1;2})'
        expected: impl
      - name: "non-numeric cell in known_y -> #VALUE!"
        probe: '=LOGEST({1;"x";3}, {1;2;3})'
        expected: impl

  # -------------------------------------------------------------------------
