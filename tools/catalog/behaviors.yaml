  - function: "FLOOR.PRECISE"
    aspect: "round toward -infinity to multiple"
    behaviors:
      - name: "positive value default sig"
        probe: "=FLOOR.PRECISE(4.7)"
        expected: impl
      - name: "negative value rounds toward -infinity"
        probe: "=FLOOR.PRECISE(-4.3)"
        expected: impl
      - name: "negative significance treated as |sig|"
        probe: "=FLOOR.PRECISE(4.7, -2)"
        expected: impl
      - name: "zero significance returns 0"
        probe: "=FLOOR.PRECISE(4.7, 0)"
        expected: impl
      - name: "positive value with sig=2 rounds down"
        probe: "=FLOOR.PRECISE(7.7, 2)"
        expected: impl

  - function: "ISO.CEILING"
    aspect: "ISO half-toward-+inf rounding (alias of CEILING.PRECISE)"
    behaviors:
      - name: "positive value with sig=2"
        probe: "=ISO.CEILING(4.3, 2)"
        expected: impl
      - name: "negative value rounds toward +infinity"
        probe: "=ISO.CEILING(-4.3)"
        expected: impl
      - name: "default significance = 1"
        probe: "=ISO.CEILING(4.3)"
        expected: impl
      - name: "zero significance returns 0"
        probe: "=ISO.CEILING(4.3, 0)"
        expected: impl
      - name: "negative significance treated as |sig|"
        probe: "=ISO.CEILING(7.3, -2)"
        expected: impl

  - function: "SQRTPI"
    aspect: "sqrt(x * pi)"
    behaviors:
      - name: "SQRTPI(1) = sqrt(pi)"
