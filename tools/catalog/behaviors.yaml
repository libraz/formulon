  - function: "CEILING.PRECISE"
    aspect: "round toward +infinity to multiple"
    behaviors:
      - name: "positive value default sig"
        probe: "=CEILING.PRECISE(4.3)"
        expected: impl
      - name: "negative value rounds toward +infinity"
        probe: "=CEILING.PRECISE(-4.3)"
        expected: impl
      - name: "negative significance treated as |sig|"
        probe: "=CEILING.PRECISE(-4.3, -2)"
        expected: impl
      - name: "zero significance returns 0"
        probe: "=CEILING.PRECISE(4.3, 0)"
        expected: impl
      - name: "positive value with sig=2 rounds to next multiple"
        probe: "=CEILING.PRECISE(7.3, 2)"
