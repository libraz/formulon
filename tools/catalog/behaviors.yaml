      - name: "wildcard pattern over mixed text/number range"
        probe: "=COUNTIF(A1:A8,\"12*\")"
        expected: impl
      - name: "<>TRUE not-equal-bool criterion"
        probe: "=COUNTIF(A1:A8,\"<>TRUE\")"
        expected: impl
      - name: "empty-criterion (=\"\") over blank/formula-empty range"
