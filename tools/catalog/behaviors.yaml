  - function: "TREND"
    aspect: "least-squares prediction"
    behaviors:
      - name: "univariate, new_x omitted (defaults to known_x) -> spill"
        probe: '=TREND({2;4;6}, {1;2;3})'
        expected: impl
      - name: "univariate with explicit new_x -> spill"
        probe: '=TREND({2;4;6}, {1;2;3}, {4;5})'
        expected: impl
      - name: "multivariate -> spill"
