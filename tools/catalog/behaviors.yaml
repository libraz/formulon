  # -------------------------------------------------------------------------
  # Snedecor's F distribution family (cases under tests/oracle/cases/f_dist.yaml).
  # -------------------------------------------------------------------------
  - function: "F.DIST"
    aspect: "F distribution PDF / CDF with cumulative flag"
    behaviors:
      - name: "CDF at typical x with valid (df1, df2)"
        probe: "=F.DIST(2, 5, 10, TRUE)"
        expected: impl
      - name: "PDF (cumulative=FALSE) at typical x"
        probe: "=F.DIST(2, 5, 10, FALSE)"
        expected: impl
      - name: "boundary x = 0"
        probe: "=F.DIST(0, 5, 10, TRUE)"
        expected: impl
      - name: "negative x -> #NUM!"
        probe: "=F.DIST(-1, 5, 10, TRUE)"
        expected: impl
      - name: "small (df1, df2) = (1, 1) Cauchy-like"
        probe: "=F.DIST(1, 1, 1, TRUE)"
        expected: impl

  - function: "F.DIST.RT"
    aspect: "F distribution right-tail probability"
    behaviors:
      - name: "right-tail CDF at typical x"
        probe: "=F.DIST.RT(2, 5, 10)"
        expected: impl
      - name: "boundary x = 0 -> 1.0"
        probe: "=F.DIST.RT(0, 5, 10)"
        expected: impl
      - name: "negative x -> #NUM!"
        probe: "=F.DIST.RT(-1, 5, 10)"
        expected: impl
      - name: "very large x — vanishing right tail"
        probe: "=F.DIST.RT(100, 5, 10)"
        expected: impl
      - name: "complement to F.DIST — sum equals 1"
        probe: "=F.DIST(2, 5, 10, TRUE) + F.DIST.RT(2, 5, 10)"
        expected: impl

  - function: "F.INV"
    aspect: "F distribution inverse CDF (left-tail quantile)"
    behaviors:
      - name: "95th percentile with valid (df1, df2)"
        probe: "=F.INV(0.95, 5, 10)"
        expected: impl
      - name: "median (p = 0.5)"
        probe: "=F.INV(0.5, 5, 10)"
        expected: impl
      - name: "boundary p = 0 -> 0"
        probe: "=F.INV(0, 5, 10)"
        expected: impl
      - name: "p < 0 -> #NUM!"
        probe: "=F.INV(-0.1, 5, 10)"
        expected: impl
      - name: "p = 1 -> #NUM! (no finite quantile)"
        probe: "=F.INV(1, 5, 10)"
        expected: impl

  - function: "F.INV.RT"
    aspect: "F distribution inverse right-tail quantile"
    behaviors:
      - name: "5%-right-tail quantile matches F.INV(0.95, ...)"
        probe: "=F.INV.RT(0.05, 5, 10)"
        expected: impl
      - name: "boundary p = 0 -> #NUM!"
        probe: "=F.INV.RT(0, 5, 10)"
        expected: impl
      - name: "boundary p = 1 -> 0"
        probe: "=F.INV.RT(1, 5, 10)"
        expected: impl
      - name: "round-trip with F.DIST.RT"
        probe: "=F.INV.RT(F.DIST.RT(2, 5, 10), 5, 10) - 2"
        expected: impl
      - name: "complement symmetry F.INV(0.95) = F.INV.RT(0.05)"
        probe: "=F.INV(0.95, 5, 10) - F.INV.RT(0.05, 5, 10)"
        expected: impl

