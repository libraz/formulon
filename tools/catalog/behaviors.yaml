  # =========================================================================
  # dynamic_array_reshape family — TAKE, DROP, EXPAND, TOCOL, TOROW,
  # WRAPCOLS, WRAPROWS, HSTACK, VSTACK, CHOOSECOLS, CHOOSEROWS, TRIMRANGE.
  # Spill outputs and scalar errors are live under the array-aware oracle.
  # =========================================================================

  - function: "TAKE"
    aspect: "array head/tail extraction"
    behaviors:
      - name: "head rows positive count -> spill"
        probe: '=TAKE({1,2,3;4,5,6;7,8,9}, 2)'
        expected: impl
      - name: "tail rows negative count -> spill"
        probe: '=TAKE({1,2,3;4,5,6;7,8,9}, -1)'
        expected: impl
      - name: "head cols positive cols arg -> spill"
        probe: '=TAKE({1,2,3;4,5,6}, 2, 2)'
        expected: impl
      - name: "tail cols negative cols arg -> spill"
        probe: '=TAKE({1,2,3;4,5,6}, 2, -2)'
        expected: impl
      - name: "count exceeds row dimension clips to full array -> spill"
        probe: '=TAKE({10;20;30}, 99)'
        expected: impl
      - name: "single-cell result count=1 single-row vector -> scalar"
        probe: '=TAKE({42}, 1)'
        expected: impl
      - name: "rows=0 with cols arg keeps columns full -> spill"
        probe: '=TAKE({1,2,3;4,5,6}, 0, 2)'
        expected: impl

  - function: "DROP"
    aspect: "array head/tail discard"
    behaviors:
      - name: "drop head rows positive count -> spill"
        probe: '=DROP({1,2;3,4;5,6}, 1)'
        expected: impl
      - name: "drop tail rows negative count -> spill"
        probe: '=DROP({1,2;3,4;5,6}, -1)'
        expected: impl
      - name: "drop head cols positive cols arg -> spill"
        probe: '=DROP({1,2,3;4,5,6}, 0, 1)'
        expected: impl
      - name: "drop count equal to row count -> #CALC!"
        probe: '=DROP({1;2;3}, 3)'
        expected: impl
      - name: "drop count exceeds row count -> #CALC!"
        probe: '=DROP({1;2}, 5)'
        expected: impl
      - name: "drop 0 rows identity pass-through -> spill"
        probe: '=DROP({1,2;3,4}, 0)'
        expected: impl
      - name: "drop negative cols removing all columns -> #CALC!"
        probe: '=DROP({1,2;3,4}, 0, -2)'
        expected: impl

  - function: "EXPAND"
    aspect: "array padding to target size"
    behaviors:
      - name: "expand rows and cols with explicit pad_with -> spill"
        probe: '=EXPAND({1,2;3,4}, 3, 3, 0)'
        expected: impl
      - name: "expand without pad_with uses #N/A fill -> spill"
        probe: '=EXPAND({1,2;3,4}, 3, 3)'
        expected: impl
      - name: "target rows smaller than source -> #VALUE!"
        probe: '=EXPAND({1,2;3,4;5,6}, 2, 4)'
        expected: impl
      - name: "target cols smaller than source -> #VALUE!"
        probe: '=EXPAND({1,2,3;4,5,6}, 3, 2)'
        expected: impl
      - name: "expand 1x1 scalar to 2x2 with pad -> spill"
        probe: '=EXPAND({7}, 2, 2, 0)'
        expected: impl
      - name: "expand col-vector to matrix with explicit pad -> spill"
        probe: '=EXPAND({1;2;3}, 3, 3, 99)'
        expected: impl
      - name: "target equals source dimensions identity -> pass-through spill"
        probe: '=EXPAND({1,2;3,4}, 2, 2, 0)'
        expected: impl

  - function: "TOCOL"
    aspect: "array flatten to column vector"
    behaviors:
      - name: "row-major flatten default -> spill column"
        probe: '=TOCOL({1,2;3,4})'
        expected: impl
      - name: "column-major flatten scan_by_column=TRUE -> spill column"
        probe: '=TOCOL({1,2;3,4}, 0, TRUE)'
        expected: impl
      - name: "ignore=1 skips blanks -> shorter spill column"
        probe: '=TOCOL({1,"",2;"",3,""}, 1)'
        expected: impl
      - name: "ignore=2 skips errors -> shorter spill column"
        probe: '=TOCOL({1,#N/A;2,3}, 2)'
        expected: impl
      - name: "ignore=3 skips blanks and errors -> shortest spill column"
        probe: '=TOCOL({1,#N/A;"",3}, 3)'
        expected: impl
      - name: "all cells blank with ignore=1 -> #CALC!"
        probe: '=TOCOL({"",""}, 1)'
        expected: impl
      - name: "single-row vector row-major -> identical column spill"
        probe: '=TOCOL({10,20,30})'
        expected: impl

  - function: "TOROW"
    aspect: "array flatten to row vector"
    behaviors:
      - name: "row-major flatten default -> spill row"
        probe: '=TOROW({1,2;3,4})'
        expected: impl
      - name: "column-major flatten scan_by_column=TRUE -> spill row"
        probe: '=TOROW({1,2;3,4}, 0, TRUE)'
        expected: impl
      - name: "ignore=1 skips blanks -> shorter spill row"
        probe: '=TOROW({"",1,"",2}, 1)'
        expected: impl
      - name: "ignore=2 skips errors -> shorter spill row"
        probe: '=TOROW({#VALUE!,1,#N/A,2}, 2)'
        expected: impl
      - name: "ignore=3 skips blanks and errors -> shortest spill row"
        probe: '=TOROW({"",#N/A,1,#VALUE!,2}, 3)'
        expected: impl
      - name: "all cells errors with ignore=2 -> #CALC!"
        probe: '=TOROW({#N/A,#VALUE!}, 2)'
        expected: impl
      - name: "single-column vector -> identical row spill"
        probe: '=TOROW({10;20;30})'
        expected: impl

  - function: "WRAPCOLS"
    aspect: "vector wrap into column-filled matrix"
    behaviors:
      - name: "even-length wrap no padding needed -> spill"
        probe: '=WRAPCOLS({1,2,3,4,5,6}, 3)'
        expected: impl
      - name: "odd-length wrap default pad #N/A -> spill with #N/A"
        probe: '=WRAPCOLS({1,2,3,4,5}, 2)'
        expected: impl
      - name: "explicit pad_with value fills remainder -> spill"
        probe: '=WRAPCOLS({1,2,3,4,5}, 2, 0)'
        expected: impl
      - name: "wrap_count=0 -> #VALUE!"
        probe: '=WRAPCOLS({1,2,3}, 0)'
        expected: impl
      - name: "wrap_count exceeds length produces single-column spill"
        probe: '=WRAPCOLS({1,2,3}, 10)'
        expected: impl
      - name: "column-vector input treated as flat sequence -> spill"
        probe: '=WRAPCOLS({1;2;3;4}, 2)'
        expected: impl
      - name: "wrap_count=1 each element in own column -> spill"
        probe: '=WRAPCOLS({10,20,30}, 1)'
        expected: impl

  - function: "WRAPROWS"
    aspect: "vector wrap into row-filled matrix"
    behaviors:
      - name: "even-length wrap no padding needed -> spill"
        probe: '=WRAPROWS({1,2,3,4,5,6}, 3)'
        expected: impl
      - name: "odd-length wrap default pad #N/A -> spill with #N/A"
        probe: '=WRAPROWS({1,2,3,4,5}, 3)'
        expected: impl
      - name: "explicit pad_with value fills remainder -> spill"
        probe: '=WRAPROWS({1,2,3,4,5}, 3, -1)'
        expected: impl
      - name: "wrap_count=0 -> #VALUE!"
        probe: '=WRAPROWS({1,2,3}, 0)'
        expected: impl
      - name: "wrap_count exceeds length produces single-row spill"
        probe: '=WRAPROWS({1,2,3}, 10)'
        expected: impl
      - name: "column-vector input treated as flat sequence -> spill"
        probe: '=WRAPROWS({1;2;3;4}, 2)'
        expected: impl
      - name: "wrap_count=1 each element in own row -> spill"
        probe: '=WRAPROWS({10,20,30}, 1)'
        expected: impl

  - function: "HSTACK"
    aspect: "horizontal array concatenation"
    behaviors:
      - name: "same-height arrays -> concatenated spill"
        probe: '=HSTACK({1;2;3}, {4;5;6})'
        expected: impl
      - name: "ragged-row inputs shorter array padded with #N/A -> spill"
        probe: '=HSTACK({1;2;3}, {4;5})'
        expected: impl
      - name: "three-argument horizontal concatenation -> spill"
        probe: '=HSTACK({1,2}, {3,4}, {5,6})'
        expected: impl
      - name: "single-row vectors concatenate to wider single-row spill"
        probe: '=HSTACK({1,2,3}, {4,5,6})'
        expected: impl
      - name: "error cell in one array propagates into result position -> spill"
        probe: '=HSTACK({1;#N/A;3}, {4;5;6})'
        expected: impl
      - name: "single-element scalars produce 1x2 spill"
        probe: '=HSTACK({1}, {2})'
        expected: impl
      - name: "2D ragged arrays row-count mismatch padded with #N/A -> spill"
        probe: '=HSTACK({1,2;3,4}, {5;6;7})'
        expected: impl

  - function: "VSTACK"
    aspect: "vertical array concatenation"
    behaviors:
      - name: "same-width arrays -> concatenated spill"
        probe: '=VSTACK({1,2,3}, {4,5,6})'
        expected: impl
      - name: "ragged-col inputs shorter array padded with #N/A -> spill"
        probe: '=VSTACK({1,2,3}, {4,5})'
        expected: impl
      - name: "three-argument vertical stacking -> spill"
        probe: '=VSTACK({1;2}, {3;4}, {5;6})'
        expected: impl
      - name: "single-col vectors concatenate to taller single-col spill"
        probe: '=VSTACK({1;2;3}, {4;5;6})'
        expected: impl
      - name: "error cell propagates into result position -> spill"
        probe: '=VSTACK({1,2,3}, {#VALUE!,5,6})'
        expected: impl
      - name: "single-element scalars produce 2x1 spill"
        probe: '=VSTACK({1}, {2})'
        expected: impl
      - name: "2D ragged arrays col-count mismatch padded with #N/A -> spill"
        probe: '=VSTACK({1,2;3,4}, {5,6,7})'
        expected: impl

  - function: "CHOOSECOLS"
    aspect: "column selection by 1-based index"
    behaviors:
      - name: "single positive index -> spill column"
        probe: '=CHOOSECOLS({1,2,3;4,5,6}, 2)'
        expected: impl
      - name: "multiple positive indices -> multi-column spill"
        probe: '=CHOOSECOLS({1,2,3;4,5,6}, 1, 3)'
        expected: impl
      - name: "negative index from-end -> spill column"
        probe: '=CHOOSECOLS({1,2,3;4,5,6}, -1)'
        expected: impl
      - name: "repeated index duplicates column -> spill"
        probe: '=CHOOSECOLS({1,2,3;4,5,6}, 2, 2)'
        expected: impl
      - name: "out-of-range positive index -> #VALUE!"
        probe: '=CHOOSECOLS({1,2,3}, 5)'
        expected: impl
      - name: "out-of-range negative index -> #VALUE!"
        probe: '=CHOOSECOLS({1,2,3}, -5)'
        expected: impl
      - name: "index=0 invalid 1-based -> #VALUE!"
        probe: '=CHOOSECOLS({1,2,3}, 0)'
        expected: impl

  - function: "CHOOSEROWS"
    aspect: "row selection by 1-based index"
    behaviors:
      - name: "single positive index -> spill row"
        probe: '=CHOOSEROWS({1,2,3;4,5,6;7,8,9}, 2)'
        expected: impl
      - name: "multiple positive indices -> multi-row spill"
        probe: '=CHOOSEROWS({1,2,3;4,5,6;7,8,9}, 1, 3)'
        expected: impl
      - name: "negative index from-end -> spill row"
        probe: '=CHOOSEROWS({1,2,3;4,5,6;7,8,9}, -1)'
        expected: impl
      - name: "repeated index duplicates row -> spill"
        probe: '=CHOOSEROWS({1,2,3;4,5,6}, 1, 1)'
        expected: impl
      - name: "out-of-range positive index -> #VALUE!"
        probe: '=CHOOSEROWS({1,2;3,4}, 5)'
        expected: impl
      - name: "out-of-range negative index -> #VALUE!"
        probe: '=CHOOSEROWS({1,2;3,4}, -5)'
        expected: impl
      - name: "index=0 invalid 1-based -> #VALUE!"
        probe: '=CHOOSEROWS({1,2;3,4}, 0)'
        expected: impl

  - function: "TRIMRANGE"
    aspect: "trim leading/trailing blank rows and columns"
    behaviors:
      - name: "default trims leading and trailing blank edges -> spill"
        probe: '=TRIMRANGE(A1:D5)'
        expected: impl
      - name: "trim_rows=0 keeps every blank row -> spill"
        probe: '=TRIMRANGE(A1:D5, 0)'
        expected: impl
      - name: "trim_rows=1 trims leading blank rows only -> spill"
        probe: '=TRIMRANGE(A1:D5, 1)'
        expected: impl
      - name: "trim_rows=2 trims trailing blank rows only -> spill"
        probe: '=TRIMRANGE(A1:D5, 2)'
        expected: impl
      - name: "trim mode outside {0,1,2,3} -> #VALUE!"
        probe: '=TRIMRANGE(A1:A3, 4)'
        expected: impl
      - name: "scalar error in range argument propagates verbatim"
        probe: '=TRIMRANGE(1/0)'
        expected: impl
      - name: "all-blank input -> #REF!"
        probe: '=TRIMRANGE(A1:A3)'
        expected: impl
  # -------------------------------------------------------------------------
  # Core arithmetic / numeric scalar functions covered by
  # `tests/oracle/cases/math.yaml`. All entries below pass oracle today
  # (`expected: impl`); they record the perspectives we exercise so that
  # `closure_check` can credit each function with at least 5 declared
  # behaviors. Probes are substrings of existing case formulas — adding or
  # renaming a case requires updating this block.
  # -------------------------------------------------------------------------

  - function: "ABS"
    aspect: "absolute value across signs and types"
    behaviors:
      - name: "positive integer passthrough -> 5"
        probe: '=ABS(5)'
        expected: impl
      - name: "negative integer flips sign -> 5"
        probe: '=ABS(-5)'
        expected: impl
      - name: "zero is its own absolute value -> 0"
        probe: '=ABS(0)'
        expected: impl
      - name: "negative fractional value -> 3.14"
        probe: '=ABS(-3.14)'
        expected: impl
      - name: "empty-string argument coerces to #VALUE!"
        probe: '=ABS("")'
        expected: impl

  - function: "SIGN"
    aspect: "sign extraction (-1 / 0 / +1)"
    behaviors:
      - name: "positive number -> 1"
        probe: '=SIGN(42)'
        expected: impl
      - name: "negative number -> -1"
        probe: '=SIGN(-42)'
        expected: impl
      - name: "zero -> 0"
        probe: '=SIGN(0)'
        expected: impl
      - name: "empty-string argument -> #VALUE!"
        probe: '=SIGN("")'
        expected: impl
      - name: "boolean TRUE coerces to 1 -> SIGN(TRUE) = 1"
        probe: '=SIGN(TRUE)'
        expected: impl

  - function: "INT"
    aspect: "floor toward -infinity"
    behaviors:
      - name: "positive fractional truncates downward -> 3"
        probe: '=INT(3.7)'
        expected: impl
      - name: "negative fractional rounds toward -inf -> -4"
        probe: '=INT(-3.7)'
        expected: impl
      - name: "already-integer passthrough -> 5"
        probe: '=INT(5)'
        expected: impl
      - name: "empty-string argument -> #VALUE!"
        probe: '=INT("")'
        expected: impl
      - name: "negative integer is its own INT (passthrough on negatives)"
        probe: '=INT(-5)'
        expected: impl

  - function: "TRUNC"
    aspect: "truncate toward zero"
    behaviors:
      - name: "positive fractional drops decimal part -> 3"
        probe: '=TRUNC(3.7)'
        expected: impl
      - name: "negative fractional truncates toward 0 -> -3"
        probe: '=TRUNC(-3.7)'
        expected: impl
      - name: "explicit digits argument keeps two decimals -> 3.14"
        probe: '=TRUNC(3.14159,2)'
        expected: impl
      - name: "negative digits truncates to tens place -> 1200"
        probe: '=TRUNC(1234,-2)'
        expected: impl
      - name: "single-arg TRUNC defaults to digits=0 -> 5"
        probe: '=TRUNC(5.99)'
        expected: impl

  - function: "MOD"
    aspect: "modulo with Excel sign-of-divisor convention"
    behaviors:
      - name: "positive dividend / positive divisor -> 1"
        probe: '=MOD(10,3)'
        expected: impl
      - name: "exact division yields zero remainder"
        probe: '=MOD(10,5)'
        expected: impl
      - name: "negative dividend follows divisor sign -> 2"
        probe: '=MOD(-10,3)'
        expected: impl
      - name: "zero divisor surfaces #DIV/0!"
        probe: '=MOD(5,0)'
        expected: impl
      - name: "negative divisor: MOD(10,-3) = -2 (sign matches divisor)"
        probe: '=MOD(10,-3)'
        expected: impl

  - function: "ROUND"
    aspect: "rounding modes and tie-breaking"
    behaviors:
      - name: "positive .5 rounds away from zero (no banker's rounding) -> 3"
        probe: '=ROUND(2.5,0)'
        expected: impl
      - name: "negative .5 rounds away from zero -> -3"
        probe: '=ROUND(-2.5,0)'
        expected: impl
      - name: "round to two decimals -> 3.14"
        probe: '=ROUND(3.14159,2)'
        expected: impl
      - name: "negative digits round to hundreds -> 1200"
        probe: '=ROUND(1234.5,-2)'
        expected: impl
      - name: "below-half digit rounds toward zero -> 2.49 -> 2"
        probe: '=ROUND(2.49,0)'
        expected: impl

  - function: "ROUNDUP"
    aspect: "round away from zero"
    behaviors:
      - name: "positive value rounds away from zero -> 3.2"
        probe: '=ROUNDUP(3.14,1)'
        expected: impl
      - name: "negative value rounds away from zero -> -3.2"
        probe: '=ROUNDUP(-3.14,1)'
        expected: impl
      - name: "zero digits rounds up to next integer -> ROUNDUP(2.1,0) = 3"
        probe: '=ROUNDUP(2.1,0)'
        expected: impl
      - name: "negative digits rounds up to next ten -> ROUNDUP(123,-1) = 130"
        probe: '=ROUNDUP(123,-1)'
        expected: impl
      - name: "zero input is its own ceiling regardless of digits"
        probe: '=ROUNDUP(0,2)'
        expected: impl

  - function: "ROUNDDOWN"
    aspect: "round toward zero (truncation toward zero)"
    behaviors:
      - name: "positive value rounds toward zero -> 3.1"
        probe: '=ROUNDDOWN(3.19,1)'
        expected: impl
      - name: "negative value rounds toward zero -> -3.1"
        probe: '=ROUNDDOWN(-3.19,1)'
        expected: impl
      - name: "zero digits truncates toward zero -> ROUNDDOWN(2.9,0) = 2"
        probe: '=ROUNDDOWN(2.9,0)'
        expected: impl
      - name: "negative digits truncates at the tens place -> ROUNDDOWN(178,-1) = 170"
        probe: '=ROUNDDOWN(178,-1)'
        expected: impl
      - name: "zero input rounds down to zero regardless of digits"
        probe: '=ROUNDDOWN(0,2)'
        expected: impl

  - function: "POWER"
    aspect: "exponentiation including edge cases"
    behaviors:
      - name: "integer square -> 25"
        probe: '=POWER(5,2)'
        expected: impl
      - name: "fractional exponent computes square root -> 1.4142..."
        probe: '=POWER(2,0.5)'
        expected: impl
      - name: "negative base with integer exponent -> -8"
        probe: '=POWER(-2,3)'
        expected: impl
      - name: "0^0 returns 1 (IEEE pow convention)"
        probe: '=POWER(0,0)'
        expected: impl
      - name: "negative base with fractional exponent surfaces #NUM!"
        probe: '=POWER(-4,0.5)'
        expected: impl

  - function: "SQRT"
    aspect: "principal square root domain"
    behaviors:
      - name: "perfect square -> 3"
        probe: '=SQRT(9)'
        expected: impl
      - name: "zero -> 0"
        probe: '=SQRT(0)'
        expected: impl
      - name: "negative argument surfaces #NUM!"
        probe: '=SQRT(-1)'
        expected: impl
      - name: "empty-string argument -> #VALUE!"
        probe: '=SQRT("")'
        expected: impl
      - name: "irrational result -> SQRT(2) ~= 1.4142135623730951"
        probe: '=SQRT(2)'
        expected: impl

  - function: "EXP"
    aspect: "natural exponential"
    behaviors:
      - name: "EXP(0) is identity -> 1"
        probe: '=EXP(0)'
        expected: impl
      - name: "EXP(1) is Euler's number"
        probe: '=EXP(1)'
        expected: impl
      - name: "empty-string argument -> #VALUE!"
        probe: '=EXP("")'
        expected: impl
      - name: "EXP(-1) = 1/e (negative exponent reciprocates)"
        probe: '=EXP(-1)'
        expected: impl
      - name: "EXP(2) = e^2 ~= 7.389056 (non-trivial exponent magnitude)"
        probe: '=EXP(2)'
        expected: impl

  - function: "LN"
    aspect: "natural logarithm domain"
    behaviors:
      - name: "LN(1) -> 0"
        probe: '=LN(1)'
        expected: impl
      - name: "LN(EXP(1)) round-trips to 1"
        probe: '=LN(EXP(1))'
        expected: impl
      - name: "LN(0) surfaces #NUM!"
        probe: '=LN(0)'
        expected: impl
      - name: "LN of a negative real is undefined -> #NUM!"
        probe: '=LN(-1)'
        expected: impl
      - name: "fractional input: LN(0.5) = -ln(2) ~= -0.6931"
        probe: '=LN(0.5)'
        expected: impl

  - function: "LOG"
    aspect: "logarithm with optional base"
    behaviors:
      - name: "single-argument call defaults to base 10 -> 3"
        probe: '=LOG(1000)'
        expected: impl
      - name: "explicit base 2 -> 3"
        probe: '=LOG(8,2)'
        expected: impl
      - name: "LOG(1) = 0 for any base"
        probe: '=LOG(1)'
        expected: impl
      - name: "LOG(0) is undefined -> #NUM!"
        probe: '=LOG(0)'
        expected: impl
      - name: "base=1 makes ln(base)=0 -> #DIV/0!"
        probe: '=LOG(10,1)'
        expected: impl

  - function: "LOG10"
    aspect: "common (base-10) logarithm"
    behaviors:
      - name: "LOG10(100) -> 2"
        probe: '=LOG10(100)'
        expected: impl
      - name: "LOG10(1) -> 0"
        probe: '=LOG10(1)'
        expected: impl
      - name: "LOG10(0) is undefined -> #NUM!"
        probe: '=LOG10(0)'
        expected: impl
      - name: "LOG10 of a negative real -> #NUM!"
        probe: '=LOG10(-1)'
        expected: impl
      - name: "fractional argument: LOG10(0.1) = -1"
        probe: '=LOG10(0.1)'
        expected: impl

  - function: "PI"
    aspect: "mathematical constant pi"
    behaviors:
      - name: "PI() returns mathematical constant"
        probe: '=PI()'
        expected: impl
      - name: "PI() participates in arithmetic expressions -> 2pi"
        probe: '=PI()*2'
        expected: impl
      - name: "PI()/2 ~= 1.5708 (quarter-turn radians)"
        probe: '=PI()/2'
        expected: impl
      - name: "PI()^2 ~= 9.8696 (squared constant)"
        probe: '=PI()^2'
        expected: impl
      - name: "PI() composes inside ROUND -> ROUND(PI(),5) = 3.14159"
        probe: '=ROUND(PI(),5)'
        expected: impl

  - function: "VALUE"
    aspect: "text-to-number coercion"
    behaviors:
      - name: "integer-shaped string -> 42"
        probe: '=VALUE("42")'
        expected: impl
      - name: "float-shaped string -> 3.14"
        probe: '=VALUE("3.14")'
        expected: impl
      - name: "non-numeric text surfaces #VALUE!"
        probe: '=VALUE("hello")'
        expected: impl
      - name: "percent suffix is recognised -> VALUE(\"50%\") = 0.5"
        probe: '=VALUE("50%")'
        expected: impl
      - name: "leading minus sign parsed -> VALUE(\"-3.14\") = -3.14"
        probe: '=VALUE("-3.14")'
        expected: impl

  - function: "CEILING"
    aspect: "legacy CEILING (round toward +infinity)"
    behaviors:
      - name: "positive value with positive significance -> 5"
        probe: '=CEILING(4.3,1)'
        expected: impl
      - name: "negative value with matching negative significance -> -5"
        probe: '=CEILING(-4.3,-1)'
        expected: impl
      - name: "sign mismatch rounds toward +inf in Excel 365 Mac"
        probe: '=CEILING(-4.3,1)'
        expected: impl
      - name: "significance=0 short-circuits to 0"
        probe: '=CEILING(4.3,0)'
        expected: impl
      - name: "significance > 1 rounds to next multiple of 2 -> CEILING(4.3,2) = 6"
        probe: '=CEILING(4.3,2)'
        expected: impl

  - function: "FLOOR"
    aspect: "legacy FLOOR (round toward -infinity)"
    behaviors:
      - name: "positive value with positive significance -> 4"
        probe: '=FLOOR(4.7,1)'
        expected: impl
      - name: "negative value with matching negative significance -> -4"
        probe: '=FLOOR(-4.3,-1)'
        expected: impl
      - name: "sign mismatch rounds toward -inf in Excel 365 Mac"
        probe: '=FLOOR(-4.3,1)'
        expected: impl
      - name: "significance=0 surfaces #DIV/0! (legacy quirk)"
        probe: '=FLOOR(4.3,0)'
        expected: impl
      - name: "significance > 1 rounds down to previous multiple of 2 -> FLOOR(4.7,2) = 4"
        probe: '=FLOOR(4.7,2)'
        expected: impl

  - function: "MROUND"
    aspect: "round to nearest multiple"
    behaviors:
      - name: "basic positive multiple -> 9"
        probe: '=MROUND(10,3)'
        expected: impl
      - name: "tie rounds away from zero -> 9"
        probe: '=MROUND(7.5,3)'
        expected: impl
      - name: "negative number with negative multiple -> -9"
        probe: '=MROUND(-10,-3)'
        expected: impl
      - name: "sign mismatch surfaces #NUM!"
        probe: '=MROUND(10,-3)'
        expected: impl
      - name: "multiple=0 returns 0 (no #DIV/0!)"
        probe: '=MROUND(5,0)'
        expected: impl

  - function: "CEILING.MATH"
    aspect: "modern ceiling with mode flag"
    behaviors:
      - name: "default significance=1 -> 5"
        probe: '=CEILING.MATH(4.3)'
        expected: impl
      - name: "default mode=0 rounds negative toward +inf -> -4"
        probe: '=CEILING.MATH(-4.3)'
        expected: impl
      - name: "mode!=0 rounds negatives away from zero -> -5"
        probe: '=CEILING.MATH(-4.3,1,1)'
        expected: impl
      - name: "negative significance uses absolute value"
        probe: '=CEILING.MATH(4.3,-2)'
        expected: impl
      - name: "explicit positive significance=2 -> CEILING.MATH(4.3,2) = 6"
        probe: '=CEILING.MATH(4.3,2)'
        expected: impl

  - function: "FLOOR.MATH"
    aspect: "modern floor with mode flag"
    behaviors:
      - name: "default significance=1 -> 4"
        probe: '=FLOOR.MATH(4.7)'
        expected: impl
      - name: "default mode=0 rounds negative toward -inf -> -5"
        probe: '=FLOOR.MATH(-4.3)'
        expected: impl
      - name: "mode!=0 rounds negatives toward zero -> -4"
        probe: '=FLOOR.MATH(-4.3,1,1)'
        expected: impl
      - name: "explicit positive significance=2 -> FLOOR.MATH(4.7,2) = 4"
        probe: '=FLOOR.MATH(4.7,2)'
        expected: impl
      - name: "negative significance uses |sig| (FLOOR.MATH(4.7,-2) = 4)"
        probe: '=FLOOR.MATH(4.7,-2)'
        expected: impl

  - function: "SUMSQ"
    aspect: "sum of squares with range / scalar coercion"
    behaviors:
      - name: "scalar arguments -> 3^2 + 4^2 = 25"
        probe: '=SUMSQ(3, 4)'
        expected: impl
      - name: "range argument iterates and squares each cell"
        probe: '=SUMSQ(A1:A3)'
        expected: impl
      - name: "text cells inside a range are silently skipped"
        probe: 'SUMSQ(A1:A3)'
        expected: impl
      - name: "direct text scalar argument surfaces #VALUE!"
        probe: '=SUMSQ(3, "abc")'
        expected: impl
      - name: "single zero argument yields 0 (degenerate scalar case)"
        probe: '=SUMSQ(0)'
        expected: impl

  - function: "SUMX2PY2"
    aspect: "sum of x^2 + y^2 across paired arrays"
    behaviors:
      - name: "matched 3-element arrays -> 91"
        probe: '=SUMX2PY2({1;2;3}, {4;5;6})'
        expected: impl
      - name: "shape mismatch returns #N/A"
        probe: '=SUMX2PY2({1;2;3}, {4;5})'
        expected: impl
      - name: "single-element arrays: 3^2 + 4^2 = 25"
        probe: '=SUMX2PY2({3}, {4})'
        expected: impl
      - name: "all-zero arrays yield 0"
        probe: '=SUMX2PY2({0;0;0}, {0;0;0})'
        expected: impl
      - name: "negative inputs squared: (-1)^2 + (-3)^2 + 2^2 + 4^2 = 30"
        probe: '=SUMX2PY2({-1;-3}, {2;4})'
        expected: impl

  - function: "SUMX2MY2"
    aspect: "sum of x^2 - y^2 across paired arrays"
    behaviors:
      - name: "matched 3-element arrays -> -63"
        probe: '=SUMX2MY2({1;2;3}, {4;5;6})'
        expected: impl
      - name: "single-element arrays compute 2^2 - 5^2 = -21"
        probe: '=SUMX2MY2({2}, {5})'
        expected: impl
      - name: "shape mismatch returns #N/A"
        probe: '=SUMX2MY2({1;2;3}, {4;5})'
        expected: impl
      - name: "identical arrays cancel termwise -> 0"
        probe: '=SUMX2MY2({1;2;3}, {1;2;3})'
        expected: impl
      - name: "swapping argument order negates result -> 63"
        probe: '=SUMX2MY2({4;5;6}, {1;2;3})'
        expected: impl

  - function: "SUMXMY2"
    aspect: "sum of (x - y)^2 across paired arrays"
    behaviors:
      - name: "matched 3-element arrays -> 27"
        probe: '=SUMXMY2({1;2;3}, {4;5;6})'
        expected: impl
      - name: "single-element arrays: (5-3)^2 = 4"
        probe: '=SUMXMY2({5}, {3})'
        expected: impl
      - name: "shape mismatch returns #N/A"
        probe: '=SUMXMY2({1;2}, {3})'
        expected: impl
      - name: "all-zero arrays yield 0"
        probe: '=SUMXMY2({0;0}, {0;0})'
        expected: impl
      - name: "negatives: ((-1)-1)^2 + ((-2)-2)^2 = 4 + 16 = 20"
        probe: '=SUMXMY2({-1;-2}, {1;2})'
        expected: impl

  - function: "SERIESSUM"
    aspect: "polynomial series evaluation"
    behaviors:
      - name: "binary polynomial sum_{i=0..3} x^i with x=2 -> 15"
        probe: '=SERIESSUM(2, 0, 1, {1;1;1;1})'
        expected: impl
      - name: "step argument >1 skips intermediate powers -> 20"
        probe: '=SERIESSUM(2, 2, 2, {1;1})'
        expected: impl
      - name: "x=1 reduces sum to coefficient sum"
        probe: '=SERIESSUM(1, 0, 1, {5;5;5})'
        expected: impl
      - name: "x=-1 with unit coefficients alternates sign -> 0"
        probe: '=SERIESSUM(-1, 0, 1, {1;1;1;1})'
        expected: impl
      - name: "initial power n>0: SERIESSUM(3,2,1,{1;1}) = 9 + 27 = 36"
        probe: '=SERIESSUM(3, 2, 1, {1;1})'
        expected: impl

  # -------------------------------------------------------------------------
  # Logical / control-flow family. Cases live in
  # `tests/oracle/cases/logical.yaml`; semantics are realised by
  # `src/eval/special_forms_lazy.cpp`, `src/eval/builtins/logical.cpp`,
  # and the operator evaluator in `src/eval/tree_walker.cpp`.
  # -------------------------------------------------------------------------
  - function: "TRUE"
    aspect: "boolean literal callable and coercion contexts"
    behaviors:
      - name: "standalone literal call evaluates to bool TRUE"
        probe: '=TRUE()'
        expected: impl
      - name: "arithmetic coercion: TRUE() + 0 -> 1"
        probe: '=TRUE()+0'
        expected: impl
      - name: "drives IF condition to true-branch"
        probe: '=IF(TRUE(),1,0)'
        expected: impl
      - name: "equality vs. number 1: bool != number even when coerced"
        probe: '=TRUE()=1'
        expected: impl
      - name: "multiplicative coercion: TRUE() * 5 -> 5"
        probe: '=TRUE()*5'
        expected: impl

  - function: "FALSE"
    aspect: "boolean literal callable and coercion contexts"
    behaviors:
      - name: "standalone literal call evaluates to bool FALSE"
        probe: '=FALSE()'
        expected: impl
      - name: "arithmetic coercion: FALSE() + 1 -> 1"
        probe: '=FALSE()+1'
        expected: impl
      - name: "drives IF condition to false-branch"
        probe: '=IF(FALSE(),1,0)'
        expected: impl
      - name: "equality vs. number 0: bool != number even when coerced"
        probe: '=FALSE()=0'
        expected: impl
      - name: "multiplicative coercion: FALSE() * 5 -> 0"
        probe: '=FALSE()*5'
        expected: impl

  - function: "NOT"
    aspect: "logical negation with numeric coercion and error propagation"
    behaviors:
      - name: "negates bool TRUE -> FALSE"
        probe: '=NOT(TRUE)'
        expected: impl
      - name: "negates bool FALSE -> TRUE"
        probe: '=NOT(FALSE)'
        expected: impl
      - name: "non-zero number coerces to TRUE: NOT(1) -> FALSE"
        probe: '=NOT(1)'
        expected: impl
      - name: "zero coerces to FALSE: NOT(0) -> TRUE"
        probe: '=NOT(0)'
        expected: impl
      - name: "error in argument propagates through NOT"
        probe: '=NOT(1/0)'
        expected: impl

  - function: "AND"
    aspect: "logical conjunction over scalars and ranges"
    behaviors:
      - name: "all-true scalar args -> TRUE"
        probe: '=AND(TRUE,TRUE,TRUE)'
        expected: impl
      - name: "any FALSE arg -> FALSE"
        probe: '=AND(TRUE,FALSE,TRUE)'
        expected: impl
      - name: "non-zero numbers coerce to TRUE: AND(1,2,3) -> TRUE"
        probe: '=AND(1,2,3)'
        expected: impl
      - name: "zero number coerces to FALSE inside AND"
        probe: '=AND(1,0,1)'
        expected: impl
      - name: "range source: AND skips text cells without #VALUE!"
        probe: '=AND(A1:A3)'
        expected: impl

  - function: "OR"
    aspect: "logical disjunction over scalars and ranges"
    behaviors:
      - name: "all-false scalar args -> FALSE"
        probe: '=OR(FALSE,FALSE,FALSE)'
        expected: impl
      - name: "any TRUE arg -> TRUE"
        probe: '=OR(FALSE,TRUE,FALSE)'
        expected: impl
      - name: "any non-zero number coerces to TRUE"
        probe: '=OR(0,0,1)'
        expected: impl
      - name: "all-zero numbers -> FALSE"
        probe: '=OR(0,0,0)'
        expected: impl
      - name: "range source delivers element-wise OR"
        probe: '=OR(A1:A3)'
        expected: impl

  - function: "XOR"
    aspect: "parity (odd-count-of-TRUE) over bool / number args"
    behaviors:
      - name: "two TRUEs (even count) -> FALSE"
        probe: '=XOR(TRUE,TRUE)'
        expected: impl
      - name: "two FALSEs -> FALSE"
        probe: '=XOR(FALSE,FALSE)'
        expected: impl
      - name: "three TRUEs (odd count) -> TRUE"
        probe: '=XOR(TRUE,TRUE,TRUE)'
        expected: impl
      - name: "numeric coercion: XOR(1,0) -> TRUE"
        probe: '=XOR(1,0)'
        expected: impl
      - name: "single TRUE argument -> TRUE"
        probe: '=XOR(TRUE)'
        expected: impl

  - function: "IF"
    aspect: "conditional with lazy branch evaluation"
    behaviors:
      - name: "scalar TRUE selects value_if_true"
        probe: '=IF(TRUE,"yes","no")'
        expected: impl
      - name: "non-zero number coerces condition to TRUE"
        probe: '=IF(5,"yes","no")'
        expected: impl
      - name: "nested IF as value_if_false branch"
        probe: '=IF(A1>10,"big",IF(A1>5,"mid","small"))'
        expected: impl
      - name: "lazy: untaken false-branch error is suppressed"
        probe: '=IF(TRUE,1,1/0)'
        expected: impl
      - name: "omitted value_if_false defaults to bool FALSE"
        probe: '=IF(FALSE,"yes")'
        expected: impl

  - function: "IFERROR"
    aspect: "catch-any-error wrapper with passthrough on success"
    behaviors:
      - name: "non-error value passes through unchanged"
        probe: '=IFERROR(10,"fallback")'
        expected: impl
      - name: "catches #DIV/0! and returns fallback"
        probe: '=IFERROR(1/0,"fallback")'
        expected: impl
      - name: "catches #N/A and returns fallback"
        probe: '=IFERROR(NA(),"fallback")'
        expected: impl
      - name: "catches #VALUE! from text+number coercion"
        probe: '=IFERROR("x"+1,"fallback")'
        expected: impl
      - name: "plain text value passes through unchanged"
        probe: '=IFERROR("plain","fallback")'
        expected: impl

  - function: "IFNA"
    aspect: "selective #N/A catcher; other errors propagate"
    behaviors:
      - name: "non-error value passes through unchanged"
        probe: '=IFNA(10,"fallback")'
        expected: impl
      - name: "catches #N/A and returns fallback"
        probe: '=IFNA(NA(),"fallback")'
        expected: impl
      - name: "does NOT catch #DIV/0!: error propagates"
        probe: '=IFNA(1/0,"fallback")'
        expected: impl
      - name: "plain text value passes through unchanged"
        probe: '=IFNA("plain","fallback")'
        expected: impl
      - name: "catches the #N/A produced by a missing VLOOKUP key"
        probe: '=IFNA(VLOOKUP("z",A1:B2,2,FALSE),"missing")'
        expected: impl

  - function: "IFS"
    aspect: "first-true-wins multi-branch with no default"
    behaviors:
      - name: "first TRUE condition wins"
        probe: '=IFS(TRUE,1,TRUE,2)'
        expected: impl
      - name: "skips earlier FALSE conditions"
        probe: '=IFS(FALSE,1,TRUE,2)'
        expected: impl
      - name: "no TRUE condition -> #N/A"
        probe: '=IFS(FALSE,1,FALSE,2)'
        expected: impl
      - name: "error in evaluated condition short-circuits to error"
        probe: '=IFS(1/0,"div",TRUE,"ok")'
        expected: impl
      - name: "untaken value subtree is not evaluated (lazy)"
        probe: '=IFS(TRUE,"ok",FALSE,1/0)'
        expected: impl

  - function: "SWITCH"
    aspect: "expression-vs-cases dispatch with optional default"
    behaviors:
      - name: "first matching case wins"
        probe: '=SWITCH(1,1,"one",2,"two")'
        expected: impl
      - name: "second case match returns its result"
        probe: '=SWITCH(2,1,"one",2,"two")'
        expected: impl
      - name: "no match without default returns #N/A"
        probe: '=SWITCH(3,1,"one",2,"two")'
        expected: impl
      - name: "trailing unpaired argument acts as default"
        probe: '=SWITCH(3,1,"one",2,"two","other")'
        expected: impl
      - name: "text expression with case-insensitive comparison"
        probe: '=SWITCH("A","a","hit","miss")'
        expected: impl

  # -------------------------------------------------------------------------
  # Text family. Cases live in `tests/oracle/cases/text.yaml`; semantics are
  # realised by `src/eval/builtins/text.cpp`, `src/eval/text_ops.cpp`, and
  # the byte-mode helpers in `src/eval/utf8_length.cpp` (LENB / MIDB / etc.).
  # -------------------------------------------------------------------------
  - function: "CONCATENATE"
    aspect: "string concatenation with type coercion"
    behaviors:
      - name: "two literal text args"
        probe: '=CONCATENATE("x","y")'
        expected: impl
      - name: "single-arg passthrough"
        probe: '=CONCATENATE("hello")'
        expected: impl
      - name: "numeric arg coerces via shortest-text default"
        probe: '=CONCATENATE("x",1,"y")'
        expected: impl
      - name: "boolean arg coerces to TRUE/FALSE text"
        probe: '=CONCATENATE("x",TRUE)'
        expected: impl
      - name: "all-empty-string args"
        probe: '=CONCATENATE("","","")'
        expected: impl

  - function: "CONCAT"
    aspect: "modern concatenation accepting ranges and arrays"
    behaviors:
      - name: "two scalar text args"
        probe: '=CONCAT("a","b")'
        expected: impl
      - name: "mixed scalar text + number + bool"
        probe: '=CONCAT("a",1,TRUE)'
        expected: impl
      - name: "joins all cells in a single range"
        probe: '=CONCAT(A1:A3)'
        expected: impl
      - name: "empty-string args contribute nothing"
        probe: '=CONCAT("","x","")'
        expected: impl
      - name: "error in any arg propagates"
        probe: '=CONCAT("a",1/0,"c")'
        expected: impl

  - function: "UPPER"
    aspect: "ASCII uppercase conversion"
    behaviors:
      - name: "lowercase ASCII -> uppercase"
        probe: '=UPPER("hello")'
        expected: impl
      - name: "empty string passthrough"
        probe: '=UPPER("")'
        expected: impl
      - name: "already-uppercase identity"
        probe: '=UPPER("HELLO")'
        expected: impl
      - name: "digits unchanged within string"
        probe: '=UPPER("abc123")'
        expected: impl
      - name: "hiragana characters pass through unchanged"
        probe: '=UPPER("あいう")'
        expected: impl

  - function: "LOWER"
    aspect: "ASCII lowercase conversion"
    behaviors:
      - name: "uppercase ASCII -> lowercase"
        probe: '=LOWER("HELLO")'
        expected: impl
      - name: "empty string passthrough"
        probe: '=LOWER("")'
        expected: impl
      - name: "already-lowercase identity"
        probe: '=LOWER("hello")'
        expected: impl
      - name: "digits unchanged within string"
        probe: '=LOWER("ABC123")'
        expected: impl
      - name: "mixed-case ASCII fully lowered"
        probe: '=LOWER("HeLLo WoRLd")'
        expected: impl

  - function: "PROPER"
    aspect: "title-case capitalisation at word boundaries"
    behaviors:
      - name: "two-word title-case"
        probe: '=PROPER("hello world")'
        expected: impl
      - name: "empty string passthrough"
        probe: '=PROPER("")'
        expected: impl
      - name: "single-word capitalisation"
        probe: '=PROPER("hello")'
        expected: impl
      - name: "letter after digit is capitalised"
        probe: '=PROPER("abc123def")'
        expected: impl
      - name: "letter after apostrophe is capitalised"
        probe: "=PROPER(\"o'brien\")"
        expected: impl

  - function: "TRIM"
    aspect: "whitespace stripping with internal-collapse and Excel-ja edges"
    behaviors:
      - name: "leading/trailing spaces stripped"
        probe: '=TRIM("  hello   world  ")'
        expected: impl
      - name: "repeated internal spaces collapsed to single"
        probe: '=TRIM("a    b    c")'
        expected: impl
      - name: "no-op on already-clean string"
        probe: '=TRIM("hello world")'
        expected: impl
      - name: "only-spaces input returns empty"
        probe: '=TRIM("     ")'
        expected: impl
      - name: "ideographic full-width space U+3000 stripped (ja-JP)"
        probe: '=TRIM("　a　")'
        expected: impl

  - function: "CLEAN"
    aspect: "non-printable control-char removal (chars < 32)"
    behaviors:
      - name: "tab and other ctrl chars stripped from inline string"
        probe: '=CLEAN("ab	cd")'
        expected: impl
      - name: "CHAR(7) bell stripped"
        probe: '=CLEAN("a" & CHAR(7) & "b")'
        expected: impl
