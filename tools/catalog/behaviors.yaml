  # -- Pre-2010 statistical-distribution legacy aliases ---------------------
  # The functions below are backward-compat spellings of the post-2010
  # BETA.DIST / BINOM.DIST / etc. family. Their closure perspectives parallel
  # the post-2010 family: standard call, boundary value, invalid arg -> #NUM!,
  # cumulative TRUE vs FALSE, and a tail / extreme quantile.

  - function: "NORMDIST"
    aspect: "pre-2010 alias for NORM.DIST"
    behaviors:
      - name: "standard-normal CDF at 1.5"
        probe: "=NORMDIST(1.5, 0, 1, TRUE)"
        expected: impl
      - name: "standard-normal PDF at 1.5"
        probe: "=NORMDIST(1.5, 0, 1, FALSE)"
        expected: impl
      - name: "non-standard CDF (mu=100, sd=15)"
        probe: "=NORMDIST(110, 100, 15, TRUE)"
        expected: impl
      - name: "sd <= 0 -> #NUM!"
        probe: "=NORMDIST(1, 0, 0, TRUE)"
        expected: impl
      - name: "negative x CDF (symmetric tail)"
        probe: "=NORMDIST(-1.5, 0, 1, TRUE)"
        expected: impl

  - function: "NORMINV"
    aspect: "pre-2010 alias for NORM.INV"
    behaviors:
      - name: "median (p=0.5)"
        probe: "=NORMINV(0.5, 10, 2)"
        expected: impl
      - name: "upper-tail quantile p=0.975"
        probe: "=NORMINV(0.975, 0, 1)"
        expected: impl
      - name: "lower-tail quantile p=0.025"
        probe: "=NORMINV(0.025, 0, 1)"
        expected: impl
      - name: "p=0 -> #NUM!"
        probe: "=NORMINV(0, 0, 1)"
        expected: impl
      - name: "p out of [0,1] -> #NUM!"
        probe: "=NORMINV(1.5, 0, 1)"
        expected: impl

  - function: "NORMSDIST"
    aspect: "pre-2010 alias for NORM.S.DIST cumulative"
