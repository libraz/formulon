  # `JIS` has no behaviors group below: it is a UI-only ja-JP formula-bar
  # spelling that Excel rewrites to `DBCS` before storing or evaluating
  # (see tests/oracle/cases/width.yaml:32-33), and both names resolve to
  # the same Jis() backend in src/eval/builtins/text_width.cpp. The
  # oracle case suite that used to probe `JIS(...)` directly was retired
  # (Mac Excel ja-JP returns #NAME? for it), so the four behaviors that
  # duplicated a `DBCS`-spelled equivalent below were removed rather than
  # left pointing at cases that no longer exist, and the one behavior
  # without a `DBCS` equivalent ("ASC(JIS(...)) round-trip") was moved
  # into the `DBCS` group below as "ASC(DBCS(...)) round-trip", which has
  # live oracle coverage (`dbcs_round_trip`). `JIS` is declared an alias of
  # `DBCS` in tools/catalog/families.yaml, so the closure harness reads its
  # closure off the group below rather than expecting one here.
  - function: "DBCS"
    aspect: "halfwidth -> fullwidth conversion (alias of JIS)"
    behaviors:
      - name: "halfwidth ASCII space -> ideographic space"
        probe: "=DBCS(\"ABC 123\")"
        expected: impl
      - name: "voiced halfwidth katakana recomposes"
        probe: "=DBCS(\"ｶﾞ\")"
        expected: impl
      - name: "fullwidth passthrough (idempotent)"
        probe: "=DBCS(\"ＡＢＣ\")"
        expected: impl
      - name: "halfwidth katakana row -> fullwidth katakana"
        probe: "=DBCS(\"ｱｲｳｴｵ\")"
        expected: impl
      - name: "kanji passthrough (unchanged)"
        probe: "=DBCS(\"漢字\")"
        expected: impl
      - name: "ASC(DBCS(...)) round-trip"
        probe: "=ASC(DBCS(\"ABC123\"))"
        expected: impl

