        expected: impl
      - name: "three-argument GCD(24, 36, 60) = 12"
        probe: "=GCD(24, 36, 60)"
        expected: impl
      - name: "GCD(0, 0) == 0 boundary"
        probe: "=GCD(0, 0)"
        expected: impl
      - name: "negative argument -> #NUM!"
        probe: "=GCD(12, -18)"
        expected: impl
      - name: "GCD(0, n) == n identity"
        probe: "=GCD(0, 18)"
        expected: impl

  - function: "LCM"
    aspect: "least common multiple"
