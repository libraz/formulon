  # -------------------------------------------------------------------------
  # Modern statistics family. Cases live in `tests/oracle/cases/stats.yaml`.
  # Sample-vs-population pairs (STDEV.S/STDEV.P, VAR.S/VAR.P, *A variants,
  # legacy STDEVP/VARP), rank/percentile/quartile (.INC / .EXC / legacy),
  # order statistics (LARGE/SMALL), mode (MODE / MODE.SNGL), descriptive
  # tendency (GEOMEAN/HARMEAN/AVEDEV/DEVSQ/MEDIAN/TRIMMEAN), shape
  # (SKEW/SKEW.P/KURT), standardisation (STANDARDIZE) and regression
  # (STEYX). The `*A` variants (AVERAGEA / MAXA / MINA / VARA / VARPA /
  # STDEVA / STDEVPA) coerce text->0 and Bool->{0,1} at range scope; the
  # non-A variants ignore them.
  # -------------------------------------------------------------------------

  - function: "STDEV.S"
    aspect: "sample standard deviation (n-1 divisor)"
    behaviors:
      - name: "scalar args sample sd"
        probe: "=STDEV.S(1,2,3,4,5)"
        expected: impl
      - name: "two-value sample sd"
        probe: "=STDEV.S(1,3)"
        expected: impl
      - name: "negative inputs"
        probe: "=STDEV.S(-1,-2,-3,-4,-5)"
        expected: impl
      - name: "single value -> #DIV/0! (n-1=0 divisor)"
        probe: "=STDEV.S(5)"
        expected: impl
      - name: "literal-array sample sd"
        probe: "=STDEV.S({2;4;4;4;5;5;7;9})"
        expected: impl

