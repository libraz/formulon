        probe: "=QUOTIENT(10, -3)"
        expected: impl
      - name: "fractional numerator truncated"
        probe: "=QUOTIENT(5.9, 2)"
        expected: impl
      - name: "zero denominator -> #DIV/0!"
        probe: "=QUOTIENT(5, 0)"
        expected: impl

  # -------------------------------------------------------------------------
  # Combinatorial / number-base / precise-rounding family. Cases live in
  # tests/oracle/cases/math_combinatorics.yaml; the family clusters share
  # integer-overflow edges and locale-stable numeral conversions.
  # -------------------------------------------------------------------------
  - function: "FACT"
    aspect: "factorial"
    behaviors:
      - name: "FACT(0) == 1 boundary"
        probe: "=FACT(0)"
        expected: impl
      - name: "FACT(5) == 120 typical"
        probe: "=FACT(5)"
        expected: impl
      - name: "fractional input truncates toward zero"
        probe: "=FACT(5.9)"
        expected: impl
      - name: "negative input -> #NUM!"
        probe: "=FACT(-1)"
        expected: impl
      - name: "overflow above 170 -> #NUM!"
        probe: "=FACT(171)"
        expected: impl

  - function: "FACTDOUBLE"
    aspect: "double factorial"
    behaviors:
      - name: "FACTDOUBLE(0) == 1 boundary"
        probe: "=FACTDOUBLE(0)"
        expected: impl
      - name: "FACTDOUBLE(-1) == 1 Excel quirk"
        probe: "=FACTDOUBLE(-1)"
        expected: impl
      - name: "odd input 7!! = 105"
        probe: "=FACTDOUBLE(7)"
        expected: impl
      - name: "even input 8!! = 384"
        probe: "=FACTDOUBLE(8)"
        expected: impl
      - name: "fractional input truncates toward zero"
        probe: "=FACTDOUBLE(7.9)"
        expected: impl

  - function: "COMBIN"
    aspect: "binomial coefficient (no repetition)"
    behaviors:
      - name: "typical C(5,2) = 10"
        probe: "=COMBIN(5, 2)"
        expected: impl
      - name: "C(n,n) = 1 boundary"
        probe: "=COMBIN(7, 7)"
        expected: impl
      - name: "k > n -> #NUM!"
        probe: "=COMBIN(3, 5)"
        expected: impl
      - name: "fractional inputs truncate"
        probe: "=COMBIN(5.9, 2.5)"
        expected: impl
      - name: "C(n,0) = 1 boundary"
        probe: "=COMBIN(7, 0)"
        expected: impl

  - function: "COMBINA"
    aspect: "binomial coefficient with repetition"
    behaviors:
      - name: "typical multichoose(4, 3) = 20"
        probe: "=COMBINA(4, 3)"
        expected: impl
      - name: "k > n is allowed (repetition)"
        probe: "=COMBINA(3, 5)"
        expected: impl
      - name: "COMBINA(0, 0) = 1 boundary"
        probe: "=COMBINA(0, 0)"
        expected: impl
      - name: "negative input -> #NUM!"
        probe: "=COMBINA(-1, 2)"
        expected: impl
      - name: "k = 0 returns 1"
        probe: "=COMBINA(5, 0)"
        expected: impl

  - function: "MULTINOMIAL"
    aspect: "multinomial coefficient"
    behaviors:
      - name: "single argument returns 1"
        probe: "=MULTINOMIAL(5)"
        expected: impl
      - name: "two args matches binomial"
        probe: "=MULTINOMIAL(2, 3)"
        expected: impl
      - name: "three args 6!/(1!2!3!) = 60"
        probe: "=MULTINOMIAL(1, 2, 3)"
        expected: impl
      - name: "negative argument -> #NUM!"
        probe: "=MULTINOMIAL(2, -1, 3)"
        expected: impl
      - name: "with zero argument acts as identity"
        probe: "=MULTINOMIAL(0, 3, 2)"
        expected: impl

  - function: "GCD"
    aspect: "greatest common divisor"
    behaviors:
      - name: "typical two-argument GCD(12, 18) = 6"
