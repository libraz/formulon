        expected: impl
      - name: "pure imaginary magnitude"
        probe: "=IMABS(\"5i\")"
        expected: impl
      - name: "negative components"
        probe: "=IMABS(\"-3-4i\")"
        expected: impl
      - name: "pure real magnitude"
        probe: "=IMABS(\"3\")"
        expected: impl

