        expected: impl
      - name: "color"
        probe_regex: 'CELL\("color",'
        expected: impl
      - name: "parentheses"
        probe_regex: 'CELL\("parentheses",'
        expected: impl
      - name: "prefix"
        probe_regex: 'CELL\("prefix",'
        expected: diverged
      - name: "protect"
        probe_regex: 'CELL\("protect",'
        expected: impl
      - name: "filename"
        probe_regex: 'CELL\("filename"'
        expected: diverged
      - name: "unknown info_type -> #VALUE!"
