        expected: impl
      - name: "negative input -> #NUM!"
        probe: "=SQRTPI(-1)"
        expected: impl
      - name: "SQRTPI(2) = sqrt(2 * pi)"
        probe: "=SQRTPI(2)"
        expected: impl

  - function: "PERMUT"
