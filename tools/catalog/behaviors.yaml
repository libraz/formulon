      - name: "PERMUT(n, 0) = 1 boundary"
        probe: "=PERMUT(5, 0)"
        expected: impl
      - name: "k > n -> #NUM!"
        probe: "=PERMUT(3, 5)"
        expected: impl
      - name: "PERMUT(n, n) = n!"
        probe: "=PERMUT(5, 5)"
        expected: impl
