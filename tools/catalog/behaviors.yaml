      - name: "settlement >= maturity -> #NUM!"
        probe: "=COUPPCD(DATE(2011,11,15), DATE(2011,1,25), 2, 1)"
        expected: impl
      - name: "bad basis (5) -> #NUM!"
        probe: "=COUPPCD(DATE(2011,1,25), DATE(2011,11,15), 2, 5)"
