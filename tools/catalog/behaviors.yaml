        expected: impl
      - name: "median: NORMSDIST(0) = 0.5"
        probe: "=NORMSDIST(0)"
        expected: impl
      - name: "saturation at large positive x"
        probe: "=NORMSDIST(5)"
        expected: impl
      - name: "negative x (symmetry)"
        probe: "=NORMSDIST(-1)"
        expected: impl
      - name: "lower tail at -1.96"
        probe: "=NORMSDIST(-1.96)"
        expected: impl

