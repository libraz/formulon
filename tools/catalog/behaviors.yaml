    behaviors:
      - name: "equal-text criterion with sum_range"
        probe: "=SUMIF(A1:A3,\"x\",B1:B3)"
        expected: impl
      - name: "> numeric criterion (no sum_range)"
        probe: "=SUMIF(A1:A3,\">10\")"
        expected: impl
      - name: "no-match returns 0"
        probe: "=SUMIF(A1:A3,\">100\")"
        expected: impl
      - name: "wildcard text criterion with sum_range"
        probe: "=SUMIF(A1:A3,\"ap*\",B1:B3)"
