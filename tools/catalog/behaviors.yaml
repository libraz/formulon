        expected: impl
      - name: "negative input -> #VALUE!"
        probe: "=ROMAN(-1)"
        expected: impl
      - name: "above 3999 -> #VALUE!"
        probe: "=ROMAN(4000)"
        expected: impl
      - name: "simplified form selector form 4 (most concise)"
        probe: "=ROMAN(499, 4)"
        expected: impl

  - function: "BASE"
    aspect: "integer -> base-N string"
    behaviors:
      - name: "binary conversion BASE(7, 2) = 111"
        probe: "=BASE(7, 2)"
        expected: impl
      - name: "hexadecimal conversion BASE(15, 16) = F"
        probe: "=BASE(15, 16)"
