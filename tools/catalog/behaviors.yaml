        expected: impl

  # -------------------------------------------------------------------------
  # Pre-2010 stat aliases (PERCENTILE / QUARTILE / STDEV / VAR) — backward-
  # compat spellings of PERCENTILE.INC / QUARTILE.INC / STDEV.S / VAR.S. The
  # `.INC` / `.S` variants are already covered by stats.yaml; closure here
  # exercises the legacy spellings on a parallel set of perspectives so the
  # alias dispatch is locked in (basic / boundary / interpolation /
  # singleton-error / out-of-range).
  # -------------------------------------------------------------------------
  - function: "PERCENTILE"
    aspect: "pre-2010 alias for PERCENTILE.INC"
    behaviors:
      - name: "median (k=0.5)"
        probe_regex: 'PERCENTILE\(\{1;2;3;4;5\},\s*0\.5\)'
        expected: impl
      - name: "lower-boundary k=0"
        probe_regex: 'PERCENTILE\(\{[^}]+\},\s*0\)'
        expected: impl
      - name: "upper-boundary k=1"
        probe_regex: 'PERCENTILE\(\{[^}]+\},\s*1\)'
        expected: impl
      - name: "linear interpolation between ranks"
        probe_regex: 'PERCENTILE\(\{1;2;3;4\},\s*0\.25\)'
        expected: impl
      - name: "k out of [0,1] -> #NUM!"
        probe_regex: 'PERCENTILE\(\{[^}]+\},\s*1\.5\)'
        expected: impl

  - function: "QUARTILE"
    aspect: "pre-2010 alias for QUARTILE.INC"
    behaviors:
      - name: "Q0 = min"
        probe_regex: 'QUARTILE\(\{[^}]+\},\s*0\)'
        expected: impl
      - name: "Q2 = median"
        probe_regex: 'QUARTILE\(\{1;2;3;4;5\},\s*2\)'
        expected: impl
      - name: "Q3 with 9-element sample"
        probe_regex: 'QUARTILE\(\{1;2;3;4;5;6;7;8;9\},\s*3\)'
        expected: impl
      - name: "Q4 = max"
        probe_regex: 'QUARTILE\(\{[^}]+\},\s*4\)'
        expected: impl
      - name: "quart out of [0,4] -> #NUM!"
        probe_regex: 'QUARTILE\(\{[^}]+\},\s*5\)'
        expected: impl

  - function: "STDEV"
    aspect: "pre-2010 alias for STDEV.S"
    behaviors:
      - name: "scalar args sample sd"
        probe_regex: 'STDEV\(1,2,3,4,5\)'
        expected: impl
      - name: "literal-array sample sd"
        probe_regex: 'STDEV\(\{2;4;4;4;5;5;7;9\}\)'
        expected: impl
      - name: "two-value sample sd"
        probe_regex: 'STDEV\(1,\s*3\)'
        expected: impl
      - name: "negative values"
        probe_regex: 'STDEV\(-1,-2,-3\)'
        expected: impl
      - name: "single value -> #DIV/0!"
        probe: '=STDEV(5)'
        expected: impl

  - function: "VAR"
    aspect: "pre-2010 alias for VAR.S"
    behaviors:
      - name: "scalar args sample variance"
        probe_regex: 'VAR\(1,2,3,4,5\)'
        expected: impl
      - name: "literal-array sample variance"
        probe_regex: 'VAR\(\{2;4;4;4;5;5;7;9\}\)'
        expected: impl
      - name: "two-value sample variance"
        probe_regex: 'VAR\(1,\s*3\)'
        expected: impl
      - name: "negative values"
        probe_regex: 'VAR\(-1,-2,-3\)'
        expected: impl
      - name: "single value -> #DIV/0!"
        probe: '=VAR(5)'
        expected: impl

  # -------------------------------------------------------------------------
  # Volatile / non-deterministic functions. Closure is a divergence-only
  # declaration: each member's result is intrinsically non-reproducible
  # (NOW/TODAY drift over wall-clock time, RAND/RANDBETWEEN/RANDARRAY draw
  # from a non-seedable PRNG), so oracle comparison is meaningless. The
  # cases yaml carries one probe per function purely to satisfy the
  # closure-source check; divergence.yaml marks each as skip-oracle.
  # -------------------------------------------------------------------------
  - function: "NOW"
    aspect: "non-deterministic clock probe"
    behaviors:
      - name: "current date-time serial"
        probe: '=NOW()'
        expected: diverged

  - function: "TODAY"
    aspect: "non-deterministic clock probe"
    behaviors:
      - name: "current date serial"
        probe: '=TODAY()'
        expected: diverged

  - function: "RAND"
    aspect: "non-deterministic PRNG probe"
    behaviors:
      - name: "uniform [0,1) draw"
        probe: '=RAND()'
        expected: diverged

  - function: "RANDBETWEEN"
    aspect: "non-deterministic PRNG probe"
    behaviors:
      - name: "integer in [low,high]"
        probe: '=RANDBETWEEN(1, 10)'
        expected: diverged

  - function: "RANDARRAY"
    aspect: "non-deterministic PRNG probe"
    behaviors:
      - name: "rows x cols uniform draw"
        probe_regex: 'RANDARRAY\(2,\s*2\)'
        expected: diverged

