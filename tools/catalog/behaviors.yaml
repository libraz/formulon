      - name: "non-blank number -> FALSE"
        probe: "=ISBLANK(A1)"
        expected: impl
      - name: "empty string is not blank -> FALSE"
        probe: "=ISBLANK(A1)"
        expected: impl
      - name: "numeric zero is not blank -> FALSE"
        probe: "=ISBLANK(A1)"
        expected: impl
      - name: "error-valued cell is not blank -> FALSE"
        probe: "=ISBLANK(A1)"
        expected: impl

  - function: "ISNUMBER"
    aspect: "number-kind predicate"
    behaviors:
      - name: "integer literal -> TRUE"
