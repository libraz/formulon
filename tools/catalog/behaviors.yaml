  # serialises `@range` as `_xlfn.SINGLE(range)`; cases here use the
  # explicit `_xlfn.SINGLE(...)` text so the closure-check regex matches
  # the function name. Mac Excel evaluates both forms identically.
  # -------------------------------------------------------------------------
  - function: "SINGLE"
    aspect: "explicit form of `@` implicit-intersection projection"
    behaviors:
      - name: "single-column range, formula row aligned"
        probe: "_xlfn.SINGLE(A1:A5)"
        expected: impl
      - name: "single-column range, formula row excluded -> #VALUE!"
        probe: "_xlfn.SINGLE(A2:A6)"
        expected: impl
      - name: "single-row range, formula column excluded -> #VALUE!"
        probe: "_xlfn.SINGLE(A1:E1)"
        expected: impl
      - name: "2-D range, neither axis aligned -> #VALUE!"
        probe: "_xlfn.SINGLE(A1:B2)"
        expected: impl
      - name: "scalar passthrough -> identity"
        probe: "_xlfn.SINGLE(42)"
        expected: impl

