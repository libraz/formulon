  - function: "COMPLEX"
    aspect: "real / imag / suffix construction"
    behaviors:
      - name: "default i suffix"
        probe: "=COMPLEX(3,4)"
        expected: impl
      - name: "explicit j suffix"
        probe: "=COMPLEX(3,4,\"j\")"
        expected: impl
      - name: "pure imag +1 collapses to 'i'"
        probe: "=COMPLEX(0,1)"
        expected: impl
      - name: "pure real (imag=0)"
        probe: "=COMPLEX(3,0)"
        expected: impl
      - name: "invalid suffix -> #VALUE!"
        probe: "=COMPLEX(3,4,\"x\")"
        expected: impl

