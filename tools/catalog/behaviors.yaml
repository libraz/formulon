        expected: impl
      - name: "ignores integer date part"
        probe: "=MINUTE(DATE(2024,4,22)+TIME(0,45,0))"
        expected: impl

  - function: "SECOND"
    aspect: "second extraction from time fractions"
    behaviors:
      - name: "midnight serial 0 -> 0"
        probe: "=SECOND(0)"
        expected: impl
      - name: "TIME-built seconds read -> 30"
