# Oracle closure families.
#
# Sparse declaration: only functions that must be closed together as a
# cluster appear here. Functions not listed are treated as a singleton
# family by `tools/oracle/closure_check.py` (1 function = 1 closure unit).
#
# Used by:
#   - tools/oracle/closure_check.py            (closure-unit resolution)
#   - .claude/commands/oracle-close.md          (`/oracle-close family=NAME`)
#
# Schema:
#
#   families:
#     - name: <lowercase identifier, used as family= argument>
#       members: [FN1, FN2, ...]                 # function names (uppercase)
#       category_file: tests/oracle/cases/<file>.yaml
#       min_perspectives_per_member: <int>       # behaviors.yaml threshold
#       cluster_reason: "<why these must close together>"
#
# `min_perspectives_per_member` is the minimum number of behaviors.yaml
# entries each member function must accumulate before closure_check
# considers the function "perspective-complete". Defaults to 5 when
# omitted. Higher for functions with rich edge-case surface (regression,
# format codes); lower for trivial wrappers.
#
# A function may belong to at most one family. Functions not in any
# family are singletons (members=[FN], file derived from function name,
# threshold=5).

families:
  # -- Lambda family ---------------------------------------------------------
  # All lambda-helper functions take a LAMBDA as their callback argument,
  # so observable test cases require LAMBDA infrastructure to exist. They
  # share a closure unit: ISOMITTED in particular cannot be exercised
  # without a LAMBDA call site.
  - name: lambda
    members: [LAMBDA, ISOMITTED, BYROW, BYCOL, MAP, REDUCE, SCAN, MAKEARRAY]
    category_file: tests/oracle/cases/lambda.yaml
    min_perspectives_per_member: 6
    cluster_reason: "Helpers cannot be tested without LAMBDA; ISOMITTED requires LAMBDA argument-omission as trigger."

  # -- Dynamic-array reshape -------------------------------------------------
  - name: dynamic_array_reshape
    members: [TAKE, DROP, EXPAND, TOCOL, TOROW, WRAPCOLS, WRAPROWS, HSTACK, VSTACK, CHOOSECOLS, CHOOSEROWS, TRIMRANGE]
    category_file: tests/oracle/cases/dynamic_array_reshape.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Shared input-array fixtures and reshape-edge perspectives (orientation, padding, error propagation)."

  # -- Sort / Filter / Unique ------------------------------------------------
  - name: sort_filter
    members: [SORT, SORTBY, UNIQUE, FILTER]
    category_file: tests/oracle/cases/sort_filter.yaml
    min_perspectives_per_member: 6
    cluster_reason: "Shared input fixtures; cross-function ordering / stability semantics."

  # -- Logical control flow --------------------------------------------------
  # All eleven members live in tests/oracle/cases/logical.yaml; the explicit
  # family entry routes IFS through logical.yaml instead of the unrelated
  # ifs.yaml suite (which holds COUNTIFS / SUMIFS probes).
  - name: logical
    members: [TRUE, FALSE, AND, OR, NOT, XOR, IF, IFS, IFERROR, IFNA, SWITCH]
    category_file: tests/oracle/cases/logical.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Boolean primitives plus conditional dispatchers; share the same logical.yaml fixtures and bool-coercion edges."

  # -- Date / time core ------------------------------------------------------
  # Non-volatile date/time functions share serial-date arithmetic (1900
  # leap-year quirk, EOMONTH boundaries, weekend-mask interpretation) and
  # ja-JP locale fixtures. They co-evolve on calendar-edge perspectives, so
  # the closure threshold is anchored against the same datetime.yaml suite.
  #
  # DATEVALUE / TIMEVALUE / N are intentionally NOT family members: they
  # live in their own dedicated cases file (datevalue_timevalue.yaml or
  # info.yaml) and must remain singletons so closure_check uses the
  # all-files fallback to find their cases. NOW / TODAY / RAND* are
  # covered by the `volatile` family.
  - name: datetime
    members: [YEAR, MONTH, DAY, HOUR, MINUTE, SECOND, DATE, TIME, WEEKDAY, WEEKNUM, ISOWEEKNUM, EOMONTH, EDATE, DAYS, DAYS360, NETWORKDAYS, "NETWORKDAYS.INTL", WORKDAY, "WORKDAY.INTL", DATEDIF, YEARFRAC]
    category_file: tests/oracle/cases/datetime.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Date/time functions share serial-date arithmetic (1900-leap quirk, EOMONTH boundaries) and locale-bound parsing fixtures."

  # -- Matrix ----------------------------------------------------------------
  - name: matrix
    members: [MMULT, MDETERM, MINVERSE]
    category_file: tests/oracle/cases/matrix.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Shared matrix fixtures; numerical-stability perspectives (ill-conditioned, singular, near-singular)."

  # -- Regression / Frequency ------------------------------------------------
  - name: regression
    members: [LINEST, LOGEST, TREND, GROWTH, FREQUENCY]
    category_file: tests/oracle/cases/regression_advanced.yaml
    min_perspectives_per_member: 7
    cluster_reason: "Shared regression-statistics; covariant on intercept/slope/R^2 reporting."

  # -- Financial DCC ---------------------------------------------------------
  - name: financial_dcc
    members: [PRICE, YIELD, ODDFPRICE, ODDFYIELD, ODDLPRICE, ODDLYIELD, DURATION, MDURATION]
    category_file: tests/oracle/cases/financial_dcc.yaml
    min_perspectives_per_member: 7
    cluster_reason: "Shared DCC basis matrix (0..4); 1-ULP tolerance perspectives co-evolve."

  # -- FORECAST.ETS -----------------------------------------------------------
  # All four functions share the Holt-Winters additive triple-exponential
  # smoothing core (preprocessing, Nelder-Mead fit, ACF seasonality
  # detection). They co-evolve on optimizer-drift tolerance and timeline
  # / values shape rejection (#N/A), so closure perspectives are best
  # exercised against the same input fixtures.
  - name: forecast_ets
    members: [FORECAST.ETS, FORECAST.ETS.CONFINT, FORECAST.ETS.SEASONALITY, FORECAST.ETS.STAT]
    category_file: tests/oracle/cases/forecast_ets.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Shared Holt-Winters core; Nelder-Mead drift tolerance and timeline-shape errors co-evolve."

  # -- Regex (PCRE2-backed) -------------------------------------------------
  # Three Excel 365 regex functions share the same PCRE2 8-bit backend
  # (compile / match kernel, option set, resource limits). They co-evolve
  # on Excel-flavored regex dialect quirks and #CALC! exhaustion paths.
  - name: text_regex
    members: [REGEXTEST, REGEXEXTRACT, REGEXREPLACE]
    category_file: tests/oracle/cases/text_regex.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Shared PCRE2 backend; case-sensitivity / pattern-syntax / resource-limit perspectives co-evolve."

  # -- Sample-vs-population statistics --------------------------------------
  # Modern stats functions (post-2010 spellings + descriptive / shape /
  # rank / percentile / order-statistic builtins). They share dataset
  # fixtures, divisor-edge perspectives (n vs n-1) and rank-tie
  # semantics, so the closure threshold is anchored against the same
  # stats.yaml suite. Pre-2010 aliases (PERCENTILE / QUARTILE / STDEV /
  # VAR) are intentionally NOT included; they are covered by the
  # `stat_legacy` family below.
  - name: stats
    members: [AVEDEV, AVERAGEA, DEVSQ, GEOMEAN, HARMEAN, KURT, LARGE, MAXA, MEDIAN, MINA, MODE, "MODE.SNGL", "PERCENTILE.EXC", "PERCENTILE.INC", PERCENTRANK, "PERCENTRANK.EXC", "PERCENTRANK.INC", "QUARTILE.EXC", "QUARTILE.INC", RANK, "RANK.AVG", "RANK.EQ", SKEW, "SKEW.P", SMALL, STANDARDIZE, "STDEV.P", "STDEV.S", STDEVA, STDEVP, STDEVPA, STEYX, TRIMMEAN, "VAR.P", "VAR.S", VARA, VARP, VARPA]
    category_file: tests/oracle/cases/stats.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Sample-vs-population statistics share dataset fixtures, divisor-edge perspectives (n vs n-1), and rank-tie semantics."

  # -- Pre-2010 stat aliases ------------------------------------------------
  # Backward-compat spellings that delegate to PERCENTILE.INC / QUARTILE.INC /
  # STDEV.S / VAR.S (already covered by stats.yaml). They share the legacy-
  # alias closure perspective: same sample data, same expected values, only
  # the function name differs. Closing them as a family keeps the perspectives
  # parallel (basic / boundary / interpolation / singleton-error / out-of-
  # range) and the case fixture compact.
  - name: stat_legacy
    members: [PERCENTILE, QUARTILE, STDEV, VAR]
    category_file: tests/oracle/cases/stat_legacy.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Pre-2010 aliases of PERCENTILE.INC / QUARTILE.INC / STDEV.S / VAR.S; closure perspectives parallel across the cluster."

  # -- Pre-2010 distribution aliases ----------------------------------------
  # Backward-compat distribution / inverse / bivariate spellings that
  # delegate to BETA.DIST / BINOM.DIST / CHISQ.DIST.RT / EXPON.DIST /
  # F.DIST.RT / GAMMA.DIST / HYPGEOM.DIST / LOGNORM.DIST / NORM.DIST /
  # NORM.S.DIST / POISSON.DIST / T.DIST / WEIBULL.DIST and the inverses
  # BETA.INV / CHISQ.INV.RT / F.INV.RT / GAMMA.INV / LOGNORM.INV / NORM.INV
  # / NORM.S.INV / T.INV.2T plus the bivariate aliases COVARIANCE.P /
  # CORREL. Closure perspectives parallel the post-2010 family: standard
  # call, boundary value, invalid arg -> #NUM!, cumulative TRUE vs FALSE,
  # and a tail / extreme quantile.
  - name: stats_compat
    members: [BETADIST, BETAINV, BINOMDIST, CHIDIST, CHIINV, COVAR, EXPONDIST, FDIST, FINV, GAMMADIST, GAMMAINV, HYPGEOMDIST, LOGINV, LOGNORMDIST, NORMDIST, NORMINV, NORMSDIST, NORMSINV, PEARSON, POISSON, TDIST, TINV, WEIBULL]
    category_file: tests/oracle/cases/stats_compat.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Pre-2010 distribution aliases of BETA.DIST/CHISQ.DIST/etc.; closure perspectives parallel the post-2010 family."

  # -- Volatile / non-deterministic -----------------------------------------
  - name: volatile
    members: [NOW, TODAY, RAND, RANDBETWEEN, RANDARRAY]
    category_file: tests/oracle/cases/volatile.yaml
    min_perspectives_per_member: 1
    cluster_reason: "Non-deterministic; closure is a divergence-only declaration."

  # -- External / stub-only --------------------------------------------------
  - name: external_stubs
    members: [IMAGE, PY, RTD, STOCKHISTORY, WEBSERVICE, COPILOT, DETECTLANGUAGE, TRANSLATE, ARRAYTOTEXT, FILTERXML, INFO, CUBEKPIMEMBER, CUBEMEMBER, CUBEMEMBERPROPERTY, CUBERANKEDMEMBER, CUBESET, CUBESETCOUNT, CUBEVALUE, GETPIVOTDATA, PHONETIC]
    category_file: tests/oracle/cases/external_stubs.yaml
    min_perspectives_per_member: 1
    cluster_reason: "Stubs by design; closure is a divergence-only declaration."

  # -- Information / type-introspection / reference family ----------------
  # IS* predicates, T / NA / TYPE / ERROR.TYPE coercion + introspection,
  # and the reference-introspection trio (INDIRECT / OFFSET / SHEET /
  # SHEETS). They share the blank-vs-empty-text fixture, the seven-error
  # ERROR.TYPE map, and the formula-cell setup pattern (`{ A1: "=1+2" }`).
  # N is intentionally NOT a member: it lives in the datetime closure unit
  # because its primary semantic perspective is date-serial coercion.
  - name: info
    members: [ERROR.TYPE, INDIRECT, ISBLANK, ISERR, ISERROR, ISEVEN, ISFORMULA, ISLOGICAL, ISNA, ISNONTEXT, ISNUMBER, ISODD, ISREF, ISTEXT, NA, OFFSET, SHEET, SHEETS, T, TYPE]
    category_file: tests/oracle/cases/info.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Information / type-predicate / reference-introspection family; share blank-vs-empty-text and error-type fixtures."

  # -- Complex-number engineering family -----------------------------------
  # COMPLEX plus the IM* arithmetic / trig / log / root / inspector
  # functions share the COMPLEX( real, imag, suffix ) input fixtures and
  # the 'i'/'j' suffix dispatch. They co-evolve on suffix-mismatch error
  # propagation, branch-cut placement (IMLN, IMSQRT), and 1-ULP drift on
  # transcendentals (IMSIN/IMCOS/IMEXP) so closure perspectives are best
  # exercised against the same complex.yaml suite.
  - name: complex
    members: [COMPLEX, IMABS, IMAGINARY, IMARGUMENT, IMCONJUGATE, IMCOS, IMCOSH, IMCSC, IMDIV, IMEXP, IMLN, IMLOG10, IMLOG2, IMPOWER, IMPRODUCT, IMREAL, IMSEC, IMSIN, IMSINH, IMSQRT, IMSUB, IMSUM, IMTAN]
    category_file: tests/oracle/cases/complex.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Complex-number engineering family shares COMPLEX( real, imag, suffix ) input fixtures and 'i'/'j' suffix dispatch."

  # -- Post-2010 distribution functions ------------------------------------
  # Modern distribution / inverse / confidence-interval / special-function
  # spellings that share PDF/CDF dichotomy via the cumulative flag,
  # parameter-validity edges (negative variance, p-out-of-[0,1], n_s > n),
  # and standard-normal helpers (GAUSS, PHI). Closure perspectives parallel
  # the pre-2010 stats_compat family: standard call, boundary value,
  # invalid arg -> #NUM!, cumulative TRUE vs FALSE, and a tail / extreme
  # quantile.
  - name: distributions
    members: ["BINOM.DIST", "BINOM.DIST.RANGE", "BINOM.INV", CONFIDENCE, "CONFIDENCE.NORM", "CONFIDENCE.T", CRITBINOM, "EXPON.DIST", FISHER, FISHERINV, GAUSS, "NEGBINOM.DIST", NEGBINOMDIST, "NORM.DIST", "NORM.INV", "NORM.S.DIST", "NORM.S.INV", PHI, "POISSON.DIST"]
    category_file: tests/oracle/cases/distributions.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Post-2010 distribution functions; share PDF/CDF dichotomy, parameter-validity edges (negative variance, p-out-of-range)."

  # -- Primary trigonometry family -----------------------------------------
  # SIN / COS / TAN, their inverses (ASIN / ACOS / ATAN / ATAN2), and the
  # angle-conversion pair DEGREES / RADIANS. They share radian-vs-degree
  # conversion edges, identity perspectives (zero, +/- pi/2, pi, 2 pi), and
  # the COS/SIN/TAN <-> arc-* round-trip relations. PI is intentionally NOT
  # a family member: it is closed as a singleton because it takes no
  # arguments (only one perspective: PI() == 3.14159...) and merely appears
  # nested inside the trig case formulas here.
  - name: math_trig
    members: [ACOS, ASIN, ATAN, ATAN2, COS, DEGREES, RADIANS, SIN, TAN]
    category_file: tests/oracle/cases/math_trig.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Primary trig family; share radian/degree conversion edges and identity perspectives (zero, +/- pi, pi/2)."

  # -- Hyperbolic / reciprocal-trig / parity helpers ------------------------
  # Co-located in tests/oracle/cases/math_trig2.yaml. They share identity-
  # edge perspectives (zero, +/- infinity, pi/2) and the reciprocal pairs
  # (SINH<->CSCH, COSH<->SECH, TANH<->COTH, SIN<->CSC, COS<->SEC, TAN<->COT)
  # co-evolve on tail-bit drift across libm transcendentals. EVEN / ODD /
  # QUOTIENT ride along because they sit in the same suite file and share
  # the rounding-toward-away semantics that several reciprocal-trig
  # boundary cases also exercise.
  - name: math_trig2
    members: [ACOSH, ACOT, ACOTH, ASINH, ATANH, COSH, COT, COTH, CSC, CSCH, EVEN, ODD, QUOTIENT, SEC, SECH, SINH, TANH]
    category_file: tests/oracle/cases/math_trig2.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Hyperbolic / reciprocal trig identities and rounding-parity helpers; share identity-edge perspectives (zero, +/- infinity, pi/2)."

  # -- Combinatorial / number-base / precise-rounding family --------------
  # Combinatorial counters (COMBIN/COMBINA/PERMUT/PERMUTATIONA/FACT/FACTDOUBLE/
  # MULTINOMIAL), number-theory helpers (GCD/LCM/SQRTPI), Roman / Arabic
  # numeral conversions (ROMAN/ARABIC), arbitrary-radix string conversions
  # (BASE/DECIMAL), and the half-even / toward-+inf precise rounders
  # (CEILING.PRECISE/FLOOR.PRECISE/ISO.CEILING). They share integer-overflow
  # edges, locale-stable numeral conversions, and zero-significance / negative-
  # input quirks.
  - name: math_combinatorics
    members: [ARABIC, BASE, "CEILING.PRECISE", COMBIN, COMBINA, DECIMAL, FACT, FACTDOUBLE, "FLOOR.PRECISE", GCD, "ISO.CEILING", LCM, MULTINOMIAL, PERMUT, PERMUTATIONA, ROMAN, SQRTPI]
    category_file: tests/oracle/cases/math_combinatorics.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Combinatorial / base-conversion / precise-rounding family; share integer-overflow edges and locale-stable numeral conversions."

  # -- Post-2010 beta / gamma / lognormal / Weibull distribution family ----
  # These post-2010 spellings share special-function backends (regularized
  # incomplete beta and gamma, log-gamma) and the same tail-bit edges
  # (support boundaries, parameter validity, cumulative TRUE vs FALSE,
  # inverse round-trip). The pre-2010 aliases (BETADIST / HYPGEOMDIST /
  # LOGINV / LOGNORMDIST / WEIBULL) are intentionally NOT included here
  # because they live in the `stats_compat` family.
  - name: distributions_ext
    members: ["BETA.DIST", "BETA.INV", GAMMA, "GAMMA.DIST", "GAMMA.INV", GAMMALN, "GAMMALN.PRECISE", "HYPGEOM.DIST", "LOGNORM.DIST", "LOGNORM.INV", "WEIBULL.DIST"]
    category_file: tests/oracle/cases/distributions_ext.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Post-2010 beta/gamma/lognormal/Weibull family; share special-function backends and tail-bit edges."

  # -- Engineering bit / base-conversion / step family ----------------------
  # Base-conversion (BIN/OCT/HEX <-> DEC), bit operations (BITAND / BITOR /
  # BITXOR / BITLSHIFT / BITRSHIFT), and the two comparators (DELTA /
  # GESTEP). They share the integer-only engineering surface in
  # `src/eval/builtins/engineering.cpp`: ten-digit two's-complement decoding
  # for the source-base side, padded-output formatting via `places` for the
  # DEC2*/?2? side, and the 48-bit non-negative integer ceiling for bit
  # ops. Closure perspectives co-evolve on these shared edges.
  - name: engineering
    members: [BIN2DEC, BIN2OCT, BITAND, BITLSHIFT, BITOR, BITRSHIFT, BITXOR, DEC2BIN, DEC2HEX, DEC2OCT, DELTA, GESTEP, HEX2BIN, HEX2DEC, OCT2DEC]
    category_file: tests/oracle/cases/engineering.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Base-conversion and bit-manipulation family; share two's-complement edge cases (10-bit signed range), padded-output formatting, and 48-bit integer ceiling for bit ops."

  # -- Database aggregates (D-functions) -----------------------------------
  # The dozen D-functions all take the same `(database, field, criteria)`
  # argument shape and read records out of a tabular range with a header
  # row, projecting through `field` and filtering through a criteria
  # range. They share criterion-parsing, field-selector resolution
  # (text/index/cell), and the no-match aggregation quirks (DSUM=0,
  # DAVERAGE=#DIV/0!, DGET=#VALUE!, DPRODUCT=0, etc.). Closure
  # perspectives parallel across the cluster.
  - name: database
    members: [DAVERAGE, DCOUNT, DCOUNTA, DGET, DMAX, DMIN, DPRODUCT, DSTDEV, DSTDEVP, DSUM, DVAR, DVARP]
    category_file: tests/oracle/cases/database.yaml
    min_perspectives_per_member: 5
    cluster_reason: "D-functions share database/criteria/field-selector argument shape; closure perspectives parallel across the cluster (criterion match, blank, multi-row, no-match #VALUE!)."

  # -- Financial TVM and depreciation family -------------------------------
  # Time-value-of-money primitives (PV/FV/PMT/RATE/NPER/NPV/IRR), loan
  # amortization split (CUMIPMT/CUMPRINC/IPMT/PPMT) and book-depreciation
  # methods (DB/DDB/SLN/SYD). They share rate/period sign-convention edges
  # (loan vs. annuity, type=0 vs type=1) and Newton-Raphson tail-bit drift
  # on the iterative solvers (RATE/IRR/NPER), so closure perspectives are
  # best exercised against the same financial.yaml suite.
  - name: financial
    members: [CUMIPMT, CUMPRINC, DB, DDB, FV, IPMT, IRR, NPER, NPV, PMT, PPMT, PV, RATE, SLN, SYD]
    category_file: tests/oracle/cases/financial.yaml
    min_perspectives_per_member: 5
    cluster_reason: "TVM and depreciation family; share rate/period sign-convention edges (loan vs. annuity, type=0 vs type=1) and Newton-Raphson tail-bit drift."

  # -- Hypothesis-test / probability family ---------------------------------
  # Chi-square / F / T / Z hypothesis tests plus PROB. Pre-2010 *TEST aliases
  # (CHITEST / FTEST / TTEST / ZTEST) share fixtures with their post-2010
  # *.TEST forms; PROB rides along because it lives in the same suite file
  # and shares the discrete-distribution / range-shape perspective set.
  - name: hypothesis
    members: ["CHISQ.TEST", CHITEST, "F.TEST", FTEST, PROB, "T.TEST", TTEST, "Z.TEST", ZTEST]
    category_file: tests/oracle/cases/hypothesis.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Hypothesis-test family (chi-square / F / T / Z); pre-2010 *TEST aliases share fixtures with post-2010 *.TEST forms."

  # -- Student's-t distribution family --------------------------------------
  # T.DIST / T.DIST.2T / T.DIST.RT and the inverses T.INV / T.INV.2T share
  # the df-parameter validity edges and the one-tail/two-tail dichotomy.
  - name: t_dist
    members: ["T.DIST", "T.DIST.2T", "T.DIST.RT", "T.INV", "T.INV.2T"]
    category_file: tests/oracle/cases/t_dist.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Student's-t distribution family; share df-parameter validity edges and one-tail/two-tail dichotomy."

  # -- Financial discount-rate / Treasury-bill / matured-yield family ------
  # Discount-rate (DISC / INTRATE / RECEIVED), price/yield-from-discount
  # (PRICEDISC / YIELDDISC), at-maturity price/yield (PRICEMAT / YIELDMAT)
  # and Treasury-bill primitives (TBILLEQ / TBILLPRICE / TBILLYIELD). They
  # share the DCC basis matrix (0..4) parameter, the settlement-vs-maturity
  # ordering edges (and issue-vs-settlement for the *MAT pair), and the
  # ACT/360 convention used by every T-bill function. Closure perspectives
  # parallel across the cluster.
  - name: financial_rates
    members: [DISC, INTRATE, PRICEDISC, PRICEMAT, RECEIVED, TBILLEQ, TBILLPRICE, TBILLYIELD, YIELDDISC, YIELDMAT]
    category_file: tests/oracle/cases/financial_rates.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Discount-rate / Treasury-bill / matured-yield family; share DCC basis (0..4) parameter and settlement-vs-maturity ordering edges."
