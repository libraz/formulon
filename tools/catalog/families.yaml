# Oracle closure families.
#
# Sparse declaration: only functions that must be closed together as a
# cluster appear here. Functions not listed are treated as a singleton
# family by `tools/oracle/closure_check.py` (1 function = 1 closure unit).
#
# Used by:
#   - tools/oracle/closure_check.py            (closure-unit resolution)
#   - .claude/commands/oracle-close.md          (`/oracle-close family=NAME`)
#
# Schema:
#
#   families:
#     - name: <lowercase identifier, used as family= argument>
#       members: [FN1, FN2, ...]                 # function names (uppercase)
#       category_file: tests/oracle/cases/<file>.yaml
#       min_perspectives_per_member: <int>       # behaviors.yaml threshold
#       cluster_reason: "<why these must close together>"
#
# `min_perspectives_per_member` is the minimum number of behaviors.yaml
# entries each member function must accumulate before closure_check
# considers the function "perspective-complete". Defaults to 5 when
# omitted. Higher for functions with rich edge-case surface (regression,
# format codes); lower for trivial wrappers.
#
# A function may belong to at most one family. Functions not in any
# family are singletons (members=[FN], file derived from function name,
# threshold=5).

families:
  # -- Lambda family ---------------------------------------------------------
  # All lambda-helper functions take a LAMBDA as their callback argument,
  # so observable test cases require LAMBDA infrastructure to exist. They
  # share a closure unit: ISOMITTED in particular cannot be exercised
  # without a LAMBDA call site.
  - name: lambda
    members: [LAMBDA, ISOMITTED, BYROW, BYCOL, MAP, REDUCE, SCAN, MAKEARRAY]
    category_file: tests/oracle/cases/lambda.yaml
    min_perspectives_per_member: 6
    cluster_reason: "Helpers cannot be tested without LAMBDA; ISOMITTED requires LAMBDA argument-omission as trigger."

  # -- Dynamic-array reshape -------------------------------------------------
  - name: dynamic_array_reshape
    members: [TAKE, DROP, EXPAND, TOCOL, TOROW, WRAPCOLS, WRAPROWS, HSTACK, VSTACK, CHOOSECOLS, CHOOSEROWS, TRIMRANGE]
    category_file: tests/oracle/cases/dynamic_array_reshape.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Shared input-array fixtures and reshape-edge perspectives (orientation, padding, error propagation)."

  # -- Sort / Filter / Unique ------------------------------------------------
  - name: sort_filter
    members: [SORT, SORTBY, UNIQUE, FILTER]
    category_file: tests/oracle/cases/sort_filter.yaml
    min_perspectives_per_member: 6
    cluster_reason: "Shared input fixtures; cross-function ordering / stability semantics."

  # -- Logical control flow --------------------------------------------------
  # All eleven members live in tests/oracle/cases/logical.yaml; the explicit
  # family entry routes IFS through logical.yaml instead of the unrelated
  # ifs.yaml suite (which holds COUNTIFS / SUMIFS probes).
  - name: logical
    members: [TRUE, FALSE, AND, OR, NOT, XOR, IF, IFS, IFERROR, IFNA, SWITCH]
    category_file: tests/oracle/cases/logical.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Boolean primitives plus conditional dispatchers; share the same logical.yaml fixtures and bool-coercion edges."

  # -- Date / time core ------------------------------------------------------
  # Non-volatile date/time functions share serial-date arithmetic (1900
  # leap-year quirk, EOMONTH boundaries, weekend-mask interpretation) and
  # ja-JP locale fixtures. They co-evolve on calendar-edge perspectives, so
  # the closure threshold is anchored against the same datetime.yaml suite.
  #
  # DATEVALUE / TIMEVALUE / N are intentionally NOT family members: they
  # live in their own dedicated cases file (datevalue_timevalue.yaml or
  # info.yaml) and must remain singletons so closure_check uses the
  # all-files fallback to find their cases. NOW / TODAY / RAND* are
  # covered by the `volatile` family.
  - name: datetime
    members: [YEAR, MONTH, DAY, HOUR, MINUTE, SECOND, DATE, TIME, WEEKDAY, WEEKNUM, ISOWEEKNUM, EOMONTH, EDATE, DAYS, DAYS360, NETWORKDAYS, "NETWORKDAYS.INTL", WORKDAY, "WORKDAY.INTL", DATEDIF, YEARFRAC]
    category_file: tests/oracle/cases/datetime.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Date/time functions share serial-date arithmetic (1900-leap quirk, EOMONTH boundaries) and locale-bound parsing fixtures."

  # -- Matrix ----------------------------------------------------------------
  - name: matrix
    members: [MMULT, MDETERM, MINVERSE]
    category_file: tests/oracle/cases/matrix.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Shared matrix fixtures; numerical-stability perspectives (ill-conditioned, singular, near-singular)."

  # -- Regression / Frequency ------------------------------------------------
  - name: regression
    members: [LINEST, LOGEST, TREND, GROWTH, FREQUENCY]
    category_file: tests/oracle/cases/regression_advanced.yaml
    min_perspectives_per_member: 7
    cluster_reason: "Shared regression-statistics; covariant on intercept/slope/R^2 reporting."

  # -- Financial DCC ---------------------------------------------------------
  - name: financial_dcc
    members: [PRICE, YIELD, ODDFPRICE, ODDFYIELD, ODDLPRICE, ODDLYIELD, DURATION, MDURATION]
    category_file: tests/oracle/cases/financial_dcc.yaml
    min_perspectives_per_member: 7
    cluster_reason: "Shared DCC basis matrix (0..4); 1-ULP tolerance perspectives co-evolve."

  # -- FORECAST.ETS -----------------------------------------------------------
  # All four functions share the Holt-Winters additive triple-exponential
  # smoothing core (preprocessing, Nelder-Mead fit, ACF seasonality
  # detection). They co-evolve on optimizer-drift tolerance and timeline
  # / values shape rejection (#N/A), so closure perspectives are best
  # exercised against the same input fixtures.
  - name: forecast_ets
    members: [FORECAST.ETS, FORECAST.ETS.CONFINT, FORECAST.ETS.SEASONALITY, FORECAST.ETS.STAT]
    category_file: tests/oracle/cases/forecast_ets.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Shared Holt-Winters core; Nelder-Mead drift tolerance and timeline-shape errors co-evolve."

  # -- Regex (PCRE2-backed) -------------------------------------------------
  # Three Excel 365 regex functions share the same PCRE2 8-bit backend
  # (compile / match kernel, option set, resource limits). They co-evolve
  # on Excel-flavored regex dialect quirks and #CALC! exhaustion paths.
  - name: text_regex
    members: [REGEXTEST, REGEXEXTRACT, REGEXREPLACE]
    category_file: tests/oracle/cases/text_regex.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Shared PCRE2 backend; case-sensitivity / pattern-syntax / resource-limit perspectives co-evolve."

  # -- Sample-vs-population statistics --------------------------------------
  # Modern stats functions (post-2010 spellings + descriptive / shape /
  # rank / percentile / order-statistic builtins). They share dataset
  # fixtures, divisor-edge perspectives (n vs n-1) and rank-tie
  # semantics, so the closure threshold is anchored against the same
  # stats.yaml suite. Pre-2010 aliases (PERCENTILE / QUARTILE / STDEV /
  # VAR) are intentionally NOT included; they are covered by the
  # `stat_legacy` family below.
  - name: stats
    members: [AVEDEV, AVERAGEA, DEVSQ, GEOMEAN, HARMEAN, KURT, LARGE, MAXA, MEDIAN, MINA, MODE, "MODE.SNGL", "PERCENTILE.EXC", "PERCENTILE.INC", PERCENTRANK, "PERCENTRANK.EXC", "PERCENTRANK.INC", "QUARTILE.EXC", "QUARTILE.INC", RANK, "RANK.AVG", "RANK.EQ", SKEW, "SKEW.P", SMALL, STANDARDIZE, "STDEV.P", "STDEV.S", STDEVA, STDEVP, STDEVPA, STEYX, TRIMMEAN, "VAR.P", "VAR.S", VARA, VARP, VARPA]
    category_file: tests/oracle/cases/stats.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Sample-vs-population statistics share dataset fixtures, divisor-edge perspectives (n vs n-1), and rank-tie semantics."

  # -- Pre-2010 stat aliases ------------------------------------------------
  # Backward-compat spellings that delegate to PERCENTILE.INC / QUARTILE.INC /
  # STDEV.S / VAR.S (already covered by stats.yaml). They share the legacy-
  # alias closure perspective: same sample data, same expected values, only
  # the function name differs. Closing them as a family keeps the perspectives
  # parallel (basic / boundary / interpolation / singleton-error / out-of-
  # range) and the case fixture compact.
  - name: stat_legacy
    members: [PERCENTILE, QUARTILE, STDEV, VAR]
    category_file: tests/oracle/cases/stat_legacy.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Pre-2010 aliases of PERCENTILE.INC / QUARTILE.INC / STDEV.S / VAR.S; closure perspectives parallel across the cluster."

  # -- Volatile / non-deterministic -----------------------------------------
  - name: volatile
    members: [NOW, TODAY, RAND, RANDBETWEEN, RANDARRAY]
    category_file: tests/oracle/cases/volatile.yaml
    min_perspectives_per_member: 1
    cluster_reason: "Non-deterministic; closure is a divergence-only declaration."

  # -- External / stub-only --------------------------------------------------
  - name: external_stubs
    members: [IMAGE, PY, RTD, STOCKHISTORY, WEBSERVICE, COPILOT, DETECTLANGUAGE, TRANSLATE, ARRAYTOTEXT, FILTERXML, INFO, CUBEKPIMEMBER, CUBEMEMBER, CUBEMEMBERPROPERTY, CUBERANKEDMEMBER, CUBESET, CUBESETCOUNT, CUBEVALUE, GETPIVOTDATA, PHONETIC]
    category_file: tests/oracle/cases/external_stubs.yaml
    min_perspectives_per_member: 1
    cluster_reason: "Stubs by design; closure is a divergence-only declaration."

  # -- Complex-number engineering family -----------------------------------
  # COMPLEX plus the IM* arithmetic / trig / log / root / inspector
  # functions share the COMPLEX( real, imag, suffix ) input fixtures and
  # the 'i'/'j' suffix dispatch. They co-evolve on suffix-mismatch error
  # propagation, branch-cut placement (IMLN, IMSQRT), and 1-ULP drift on
  # transcendentals (IMSIN/IMCOS/IMEXP) so closure perspectives are best
  # exercised against the same complex.yaml suite.
  - name: complex
    members: [COMPLEX, IMABS, IMAGINARY, IMARGUMENT, IMCONJUGATE, IMCOS, IMCOSH, IMCSC, IMDIV, IMEXP, IMLN, IMLOG10, IMLOG2, IMPOWER, IMPRODUCT, IMREAL, IMSEC, IMSIN, IMSINH, IMSQRT, IMSUB, IMSUM, IMTAN]
    category_file: tests/oracle/cases/complex.yaml
    min_perspectives_per_member: 5
    cluster_reason: "Complex-number engineering family shares COMPLEX( real, imag, suffix ) input fixtures and 'i'/'j' suffix dispatch."
