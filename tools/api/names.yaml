enum_families:
  anchor: [enum.anchor_kind, enum.anchor_edit_as]
  # reading direction: Context 0, LeftToRight 1, RightToLeft 2 (`readingOrder` / `<x14:dataBar direction>`)
  reading_direction: [enum.reading_order, enum.cf_data_bar_direction]
enum_distinct:
  - { enums: [enum.cell_shift, enum.chart_axis_position], reason: "share Left / Right: the direction cells shift vs where a chart axis sits" }
  - { enums: [enum.cell_shift, enum.chart_label_position], reason: "share Left / Right: the direction cells shift vs where a data label sits" }
  - { enums: [enum.cell_shift, enum.chart_legend_position], reason: "share Left / Right: the direction cells shift vs where the legend sits" }
  - { enums: [enum.cell_shift, enum.horizontal_align], reason: "share Left / Right: the direction cells shift vs horizontal text alignment" }
  - { enums: [enum.chart_bar_direction, enum.pivot_axis], reason: "share Absent / Column: bar orientation vs pivot field axis" }
  - { enums: [enum.effective_style_source, enum.pivot_axis], reason: "share Column / Row: where a cell's style came from vs pivot field axis" }
  - { enums: [enum.chart_axis_crosses, enum.pivot_aggregation], reason: "share Min / Max only: axis crossing point vs aggregation function" }
  - { enums: [enum.chart_axis_position, enum.chart_label_position], reason: "share Left / Right: axis side vs data-label placement" }
  - { enums: [enum.chart_label_position, enum.chart_legend_position], reason: "share Left / Right: data-label placement vs legend placement" }
  - { enums: [enum.chart_line_dash, enum.chart_marker_symbol], reason: "share Dash / Dot: line dash vs marker shape" }
  - { enums: [enum.chart_line_dash, enum.shape_paint], reason: "share Solid / Other: line dash vs fill paint" }
  - { enums: [enum.chart_marker_symbol, enum.chart_title_kind], reason: "share Auto / None: marker shape vs title source" }
  - { enums: [enum.chart_marker_symbol, enum.color_kind], reason: "share Auto / None: marker shape vs colour source" }
  - { enums: [enum.chart_title_kind, enum.color_kind], reason: "share Auto / None: title source vs colour source" }
  - { enums: [enum.chart_source_kind, enum.chart_title_kind], reason: "share None / Ref: series source vs title source" }
  - { enums: [enum.chart_title_kind, enum.pivot_filter_value_kind], reason: "share None / Text: title source vs filter operand kind" }
  - { enums: [enum.chart_title_kind, enum.value_kind], reason: "share Ref / Text: title source vs cell value kind" }
  - { enums: [enum.chart_axis_position, enum.horizontal_align], reason: "share Left / Right: axis side vs cell horizontal alignment; values follow the OOXML vocabulary order" }
  - { enums: [enum.chart_axis_position, enum.vertical_align], reason: "share Top / Bottom: axis side vs cell vertical alignment; values follow the OOXML vocabulary order" }
  - { enums: [enum.chart_label_position, enum.horizontal_align], reason: "share Left / Right / Center: data-label placement vs cell horizontal alignment; values follow the OOXML vocabulary order" }
  - { enums: [enum.chart_legend_position, enum.horizontal_align], reason: "share Left / Right: legend placement vs cell horizontal alignment; values follow the OOXML vocabulary order" }
  - { enums: [enum.chart_legend_position, enum.vertical_align], reason: "share Top / Bottom: legend placement vs cell vertical alignment; values follow the OOXML vocabulary order" }
  - { enums: [enum.horizontal_align, enum.vertical_align], reason: "share Center / Justify / Distributed: horizontal vs vertical cell alignment; values follow the OOXML vocabulary order" }
  - { enums: [enum.border_style, enum.pivot_filter_value_kind], reason: "share None / Double: border line style vs filter operand kind; values follow the OOXML vocabulary order" }
  - { enums: [enum.border_style, enum.underline_style], reason: "share None / Double: border line style vs font underline; values follow the OOXML vocabulary order" }
  - { enums: [enum.pivot_filter_value_kind, enum.underline_style], reason: "share None / Double: filter operand kind vs font underline; values follow the OOXML vocabulary order" }
  - { enums: [enum.chart_tick_label_position, enum.shape_paint], reason: "share Absent / None: tick-label placement vs shape fill paint; Absent is the not-set value both carry" }
  - { enums: [enum.fill_pattern, enum.shape_paint], reason: "share None / Solid: cell fill pattern vs shape fill paint; values follow the OOXML vocabulary order" }
  - { enums: [enum.cf_match_kind, enum.cf_rule_type], reason: "share ColorScale / DataBar / IconSet: kind of a matched rule's result vs kind of the rule" }
  - { enums: [enum.chart_label_position, enum.phonetic_alignment], reason: "share Left / Center: data-label placement vs furigana alignment; values follow the OOXML vocabulary order" }
  - { enums: [enum.horizontal_align, enum.phonetic_alignment], reason: "share Left / Center / Distributed: cell horizontal alignment vs furigana alignment; values follow the OOXML vocabulary order" }
  - { enums: [enum.phonetic_alignment, enum.vertical_align], reason: "share Center / Distributed: furigana alignment vs cell vertical alignment; values follow the OOXML vocabulary order" }
  - { enums: [enum.cf_time_period, enum.pivot_filter_type], reason: "the pivot filter kinds are a larger set mixing label, value and date kinds; the shared date periods are spelled alike" }
  - { enums: [enum.dynamic_filter_type, enum.pivot_filter_type], reason: "AutoFilter dynamic kinds vs pivot filter kinds: different sets over different schema types; the shared periods are spelled alike" }
  - { enums: [enum.cf_value_object_type, enum.table_totals_row_function], reason: "share Min / Max: threshold source vs totals-row function" }
  - { enums: [enum.chart_axis_crosses, enum.table_totals_row_function], reason: "share Min / Max: axis crossing point vs totals-row function" }
  - { enums: [enum.filter_kind, enum.table_totals_row_function], reason: "share None / Custom: filter criterion kind vs totals-row function" }
  - { enums: [enum.pivot_aggregation, enum.table_totals_row_function], reason: "totals-row functions follow ST_TotalsRowFunction (with None and Custom) and pivot aggregations ST_DataConsolidateFunction; the order differs by schema" }
  - { enums: [enum.table_totals_row_function, enum.validation_type], reason: "share None / Custom: totals-row function vs validation type" }
  - { enums: [enum.cf_value_object_type, enum.chart_axis_crosses], reason: "share Min / Max: threshold kind vs axis crossing point" }
  - { enums: [enum.cf_time_period, enum.dynamic_filter_type], reason: "share Today / Yesterday / week and month periods: conditional-format time period vs AutoFilter dynamic filter" }
  - { enums: [enum.cf_value_object_type, enum.pivot_aggregation], reason: "share Min / Max: threshold kind vs aggregation function" }
  - { enums: [enum.filter_kind, enum.validation_type], reason: "share None / Custom: AutoFilter column kind vs data-validation type" }
  - { enums: [enum.pivot_sort_order, enum.slicer_sort], reason: "share Ascending / Descending: each zero is its OOXML default, Manual for a pivot field and Ascending for a slicer" }
  - { enums: [enum.chart_axis_position, enum.chart_legend_position], reason: "share Bottom / Top / Left / Right: axis side vs legend placement; the legend's zero is its OOXML default Right" }
