# Public API name ledger: one entry per exported symbol, keyed by a stable op id.
# `was` holds the current names, the top-level names the target ones. `scope: process`
# marks a process-wide function (JS named export, Python module function). `drop` names
# leave a surface when the `closes` rule closes; `replaced_by` folds a type into another.
# `kind: typedef` names a type that is neither a record nor an enum: a handle, an alias,
# a callback, an error class, or a module or options object.
# `cell_args` / `rect_args` list the argument positions (receiver excluded) of each one-cell
# `(row, col)` pair and each `CellRect`; `ref_args` is `[position, kind]` of an op's or list's
# `TableRef` / `PivotRef` / `CfRuleRef` / `ProtectedRangeRef` argument. `patch: true` marks a
# partial update whose keys are fields of `patch_record`, or `patch_record: none` with a
# `patch_reason` when no getter returns a record.
# `reads_values: true` marks a C function that computes pending cells before it reads (Auto
# calculation); `resolved: true` a read whose XF-family indices are resolved output, and
# `color: resolved` a record, field or op whose colours are rendered results. `namespace: ooxml`
# publishes a `Workbook` / `Sheet` op under `.ooxml` instead of on the class. A `params` slot may be
# `{ type, default }`: the binding may omit that trailing argument (`today`: the pinned clock, else
# the current date). `a1_exempt` lists the JS `*Row` / `*Col` fields of an input record that stay
# numbers instead of taking an A1 address.
# Engine error messages: one a call reports reads `<c_field> <constraint>` (or is a capitalised
# sentence when no argument is at fault) and the bindings print it as `<Class.method> <public path>
# <constraint>`; one that describes file content (kIo*, kSecurity*, out of memory) reads
# `<part or record>: <problem>` (check: binding_drift engine-messages).
# `was_semantics: inverted` marks a renamed field whose `true` means the opposite of the former one's.
# Text positions: C and JS index strings in UTF-16 code units; Python in code points, which the
# C ABI takes and returns through `fm_text_offset_unit_t` and the `*_cp` fields. Length limits are
# UTF-16 code units on every surface.
# Cleared cell-font attributes: one with no absent state (`size_pt`, `name`) takes the Normal
# font's value (C: `has_size_pt == 0`, `name == NULL`); one with an absent state (`color`, toggles)
# goes absent.
schema: 1
