# Oracle generation targets. The "primary" target is the canonical 1-bit
# compatibility reference; variants are opt-in additional environments
# whose goldens land under tests/oracle/targets/<name>/. The target root
# contains the formula, CF, and workbook tracks captured for that target.
# The mac-365-en_US target is the dedicated English oracle gate and remains
# required CTest coverage; other non-primary targets are opt-in.
#
# Target name shape: <host>-<excel-major>-<locale>
#
# `status:` is informational metadata used by the contributor CLI:
#   primary    -- the 1-bit reference; maintained by the core team
#   scaffolded -- target wired up; goldens may be partial / stale
#   wanted     -- entry reserved; goldens not yet contributed.
#                 Pick one of these via `make oracle-contribute TARGET=...`
#                 if you have Excel running in that locale.
primary: mac-365-ja_JP

# Per-track primary / variant overrides. The global `primary:` above is
# the formula oracle's reference (Mac Excel 365, ja-JP). Other oracle
# tracks may legitimately need a different reference host.
tracks:
  workbook:
    # The workbook track (pivot tables + print areas) uses win-365-ja_JP
    # as its primary: reliable PivotTable COM automation is only
    # available through Windows Excel, whereas the formula track stays on
    # the Mac primary. Variants surface cross-environment divergences.
    primary: win-365-ja_JP
    variants: [mac-365-ja_JP]
  cf:
    # Conditional-formatting capture uses the same product-verified Mac
    # Excel 365 ja-JP install as the formula track.  Keep this explicit per
    # track so the CF generator cannot silently fall back to an unrelated
    # target or to a historical Office 2019 directory.
    primary: mac-365-ja_JP
    variants: []

targets:
  mac-365-ja_JP:
    status: primary
    driver: macos_excel
    runs_on: [Darwin]
    locale: ja-JP
    output_dir: tests/oracle/targets/mac-365-ja_JP/golden
    environment_md: tests/oracle/targets/mac-365-ja_JP/ENVIRONMENT.md
    # divergence: tests/divergence.yaml   # primary uses the global file
                                          # via --divergence; non-primary targets set
                                          # this to a per-target path
                                          # (e.g. tests/oracle/targets/<name>/divergence.yaml).

  win-365-ja_JP:
    # Microsoft 365 (Windows, ja-JP) goldens.
    # Goldens previously committed under this target turned out to be
    # generated on a host whose Click-to-Run package was actually
    # `ProPlus2019Retail` (Office 2019 Pro Plus perpetual) -- the M365
    # subscription license was attached but the installed binary set was
    # never replaced. ARRAYTOTEXT / VALUETOTEXT / XLOOKUP / LET / LAMBDA
    # and the rest of the post-2019 function set therefore returned
    # `#NAME?` rather than real values. That data is retained unchanged
    # under `tests/oracle/reference/win-2019-ja_JP/` (see below).
    #
    # Re-captured 2026-08-16 on a genuine Microsoft 365 ja-JP install,
    # EXCEL.EXE file version 16.0.20228.20190, through the WSL2 -> Windows
    # COM bridge: the workbook track (tests/oracle/targets/win-365-ja_JP/golden_wb, promoted via
    # `make oracle-promote`) and the formula track (`output_dir` below).
    # Both generators gate on the ARRAYTOTEXT(1) M365 sentinel.
    status: scaffolded
    # Only the workbook track is active CTest coverage; its marker lives in
    # tests/oracle/targets/win-365-ja_JP/golden_wb/PROVENANCE.json. The formula-track directory
    # record below stays `active_ctest: false` because provenance.py's
    # variant inventory check needs a per-golden `capture_id` that
    # oracle_gen.py does not stamp yet.
    provenance:
      classification: verified
      verified: true
      product: Microsoft 365 Apps, Excel 16.0.20228.20190 (ja-JP)
      source: tests/oracle/targets/win-365-ja_JP/golden/PROVENANCE.json
    driver: windows_excel
    runs_on: [Windows, Linux]
    locale: ja-JP
    output_dir: tests/oracle/targets/win-365-ja_JP/golden
    environment_md: tests/oracle/targets/win-365-ja_JP/ENVIRONMENT.md
    divergence: tests/oracle/targets/win-365-ja_JP/divergence.yaml
    # win_python: not set by default to keep author-specific paths out
    # of the committed manifest. Two ways to point the bridge at a
    # Windows-side python.exe:
    #   (a) preferred for OSS contributors -- export FORMULON_WIN_PYTHON,
    #       e.g.:
    #         export FORMULON_WIN_PYTHON="/mnt/c/Users/<you>/AppData/\
    #           Local/Programs/Python/Python312/python.exe"
    #   (b) for a private fork -- add a `win_python:` line here.
    # The driver detects the Excel locale via Application.International,
    # so this same target also fits any other locale you happen to run;
    # see the win-365-<other> entries below for canonical names.

  # NOTE: there is intentionally no `win-2019-ja_JP` target. The goldens
  # once committed under that name were captured by mistake on an Office
  # Professional Plus 2019 host (the M365 / perpetual distinction was
  # missed). They are no longer a maintained oracle target and will not be
  # regenerated. The captured data is retained purely as historical
  # reference under `tests/oracle/reference/win-2019-ja_JP/` and is NOT
  # scanned by the variant test harness (only `tests/oracle/targets/*`
  # is). See that directory's ENVIRONMENT.md for context.

  # ----------------------------------------------------------------------
  # Wanted targets. These slots are reserved so contributors and the core
  # team agree on naming before any goldens land. To donate one, see
  # CONTRIBUTING.md (`make oracle-contribute TARGET=<name>`).
  # ----------------------------------------------------------------------

  mac-365-en_US:
    # Mac Excel takes its calculation locale from two per-app defaults:
    # AppleLanguages (code page, DBCS, era/day names) and AppleLocale
    # (currency, date order, format keywords). Set both, then relaunch.
    status: scaffolded
    driver: macos_excel
    runs_on: [Darwin]
    locale: en-US
    output_dir: tests/oracle/targets/mac-365-en_US/golden
    environment_md: tests/oracle/targets/mac-365-en_US/ENVIRONMENT.md
    divergence: tests/oracle/targets/mac-365-en_US/divergence.yaml

  mac-365-de_DE:
    status: scaffolded
    driver: macos_excel
    runs_on: [Darwin]
    locale: de-DE
    output_dir: tests/oracle/targets/mac-365-de_DE/golden
    environment_md: tests/oracle/targets/mac-365-de_DE/ENVIRONMENT.md
    divergence: tests/oracle/targets/mac-365-de_DE/divergence.yaml

  mac-365-fr_FR:
    status: scaffolded
    driver: macos_excel
    runs_on: [Darwin]
    locale: fr-FR
    output_dir: tests/oracle/targets/mac-365-fr_FR/golden
    environment_md: tests/oracle/targets/mac-365-fr_FR/ENVIRONMENT.md
    divergence: tests/oracle/targets/mac-365-fr_FR/divergence.yaml

  mac-365-zh_CN:
    status: scaffolded
    driver: macos_excel
    runs_on: [Darwin]
    locale: zh-CN
    output_dir: tests/oracle/targets/mac-365-zh_CN/golden
    environment_md: tests/oracle/targets/mac-365-zh_CN/ENVIRONMENT.md
    divergence: tests/oracle/targets/mac-365-zh_CN/divergence.yaml

  mac-365-ko_KR:
    status: scaffolded
    driver: macos_excel
    runs_on: [Darwin]
    locale: ko-KR
    output_dir: tests/oracle/targets/mac-365-ko_KR/golden
    environment_md: tests/oracle/targets/mac-365-ko_KR/ENVIRONMENT.md
    divergence: tests/oracle/targets/mac-365-ko_KR/divergence.yaml

  mac-365-th_TH:
    status: wanted
    driver: macos_excel
    runs_on: [Darwin]
    locale: th-TH
    output_dir: tests/oracle/targets/mac-365-th_TH/golden
    environment_md: tests/oracle/targets/mac-365-th_TH/ENVIRONMENT.md
    divergence: tests/oracle/targets/mac-365-th_TH/divergence.yaml

  win-365-en_US:
    status: wanted
    driver: windows_excel
    runs_on: [Windows, Linux]
    locale: en-US
    output_dir: tests/oracle/targets/win-365-en_US/golden
    environment_md: tests/oracle/targets/win-365-en_US/ENVIRONMENT.md
    divergence: tests/oracle/targets/win-365-en_US/divergence.yaml

  win-365-de_DE:
    # Decimal-comma locale; exercises TEXT formatting and DATEVALUE parsing
    # paths that ja-JP / en-US never reach.
    status: wanted
    driver: windows_excel
    runs_on: [Windows, Linux]
    locale: de-DE
    output_dir: tests/oracle/targets/win-365-de_DE/golden
    environment_md: tests/oracle/targets/win-365-de_DE/ENVIRONMENT.md
    divergence: tests/oracle/targets/win-365-de_DE/divergence.yaml

  win-365-fr_FR:
    status: wanted
    driver: windows_excel
    runs_on: [Windows, Linux]
    locale: fr-FR
    output_dir: tests/oracle/targets/win-365-fr_FR/golden
    environment_md: tests/oracle/targets/win-365-fr_FR/ENVIRONMENT.md
    divergence: tests/oracle/targets/win-365-fr_FR/divergence.yaml

  win-365-zh_CN:
    # Anchors NUMBERSTRING and Chinese-locale TEXT format codes.
    status: wanted
    driver: windows_excel
    runs_on: [Windows, Linux]
    locale: zh-CN
    output_dir: tests/oracle/targets/win-365-zh_CN/golden
    environment_md: tests/oracle/targets/win-365-zh_CN/ENVIRONMENT.md
    divergence: tests/oracle/targets/win-365-zh_CN/divergence.yaml

  win-365-ko_KR:
    status: wanted
    driver: windows_excel
    runs_on: [Windows, Linux]
    locale: ko-KR
    output_dir: tests/oracle/targets/win-365-ko_KR/golden
    environment_md: tests/oracle/targets/win-365-ko_KR/ENVIRONMENT.md
    divergence: tests/oracle/targets/win-365-ko_KR/divergence.yaml

  win-365-th_TH:
    # Anchors BAHTTEXT against authentic Thai-locale Excel.
    status: wanted
    driver: windows_excel
    runs_on: [Windows, Linux]
    locale: th-TH
    output_dir: tests/oracle/targets/win-365-th_TH/golden
