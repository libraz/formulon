# Formulon develop-branch CI workflow.
#
# Develop-branch checks layered on top of ci.yml so a red `develop` is
# caught before it is fast-forwarded onto `main`:
#
#   - format : `make format-check` (clang-format, ruff format --check,
#     biome) followed by `make lint` (ruff check; clang-tidy self-skips
#     without a build directory), then the source-only drift checks
#     (`tools/dev/check_binding_drift.py` and its unit tests). Hard gate
#     (binary check).
#   - native-fast : Debug build + the fast ctest suite, gated by the
#     allowlist in tools/ci/expected_flakes.txt. This is the C++ test
#     gate for the whole promotion path: `main` is fast-forwarded from a
#     green `develop` and ci.yml does not repeat the suite on that push.
#     Debug (-O0) is the build where `assert`s run; a Release build
#     OOM-kills the 2-core runner when compiling the heavy TUs in
#     parallel. Object files come from ccache, so a push recompiles only
#     the TUs it changed.
#
# Pattern mirrored from ../mygram-db's develop-ci.yml: develop-only
# checks live here, main keeps the minimal build+test signal in ci.yml.
#
# clang-tidy is intentionally NOT a CI gate, following the mygram-db
# policy. It carries a large pre-existing warnings backlog that would
# never realistically pass `-Werror`, and per CLAUDE.md "CI vs. local
# development" tunable-threshold signals belong as `tools/dev/` scripts,
# not as CI pass/fail gates. `make lint` reports it as advisory and never
# fails on it, so running that target here gates on ruff alone; the C++
# half additionally self-skips because this job has no build directory.
#
# Sanitizers (TSan, future ASan/UBSan) live in their own workflow
# (.github/workflows/sanitizers.yml) and are triggered manually from
# the Actions UI when investigating a specific commit.
name: develop-ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `make format-check` fans out to ruff (Python) via `uvx` and biome
      # (.mjs / .d.ts) via `npx`, so uv and Node must be on PATH alongside
      # clang-format.
      - name: Set up uv (ruff)
        uses: astral-sh/setup-uv@v10.2.0

      # Pinned to the local clang-format major: releases rewrap code
      # differently, so the runner image's apt package drifts the gate.
      - name: Install clang-format
        run: |
          uv tool install clang-format==18.1.8
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Show clang-format version
        run: clang-format --version

      - name: Set up Node.js (biome)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: format check
        run: make format-check

      # Static-analysis half. clang-tidy is advisory inside `make lint` and
      # additionally self-skips here because this job never builds, so this
      # step gates on ruff alone. clang-tidy therefore needs no install.
      - name: lint
        run: make lint

      # Source-only checks of the READMEs and the binding surface, plus the
      # unit tests of those checks. They need no build, so a documentation
      # or binding drift fails here in seconds instead of in the test job.
      - name: Drift checks
        run: |
          uv run --no-project --with pyyaml python tools/dev/check_binding_drift.py
          uv run --no-project --with pyyaml python -m tools.dev.binding_drift_test

  native-fast:
    name: Build and fast test (native, Linux)
    runs-on: ubuntu-latest
    # A cold compiler cache costs a full Debug build (about half an hour
    # on the 2-core runner) on top of the fast tier (about half an hour),
    # and a slow runner adds a fifth to that, so the limit leaves room
    # above it.
    timeout-minutes: 90
    env:
      CCACHE_MAXSIZE: 2G
      # Hash the compiler binary rather than its mtime, which differs
      # between runner images that carry the same compiler.
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libbrotli-dev brotli python3-yaml ccache

      # The compiler cache, not the build directory: a checkout rewrites
      # every source mtime, so a restored build directory recompiles all
      # of it anyway. The key is per commit so each run saves its cache;
      # the prefix restores the most recent one.
      - name: Cache compiler output (ccache)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-debug-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-debug-${{ runner.os }}-

      - name: Configure (debug preset)
        run: >
          cmake --preset debug
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        # Cap parallelism at 2 (the runner's physical core count).
        # Bare `--parallel` fans out to all logical CPUs and links the
        # heavy Debug test/bench binaries concurrently, which exhausts the
        # 7 GB runner and gets the compilers OOM-killed (SIGTERM / 143).
        run: |
          ccache --zero-stats
          cmake --build build --parallel 2
          ccache --show-stats

      - name: Run fast tests
        id: ctest
        continue-on-error: true
        working-directory: build
        # Same label exclusion as ci.yml's native job: SLOW is the
        # minutes-to-tens-of-minutes tier; BENCH and TSAN run out of band.
        run: ctest -LE "SLOW|BENCH|TSAN" --output-on-failure --timeout 60 -j 4

      - name: Check failures against allowlist
        run: |
          ctest --test-dir build --show-only=json-v1 > build/ctest-tests.json
          if [ -f build/Testing/Temporary/LastTestsFailed.log ]; then
            failed=build/Testing/Temporary/LastTestsFailed.log
          else
            failed=build/no-failures.log
            : > "$failed"
          fi
          python3 tools/ci/check_test_failures.py \
            --failed "$failed" \
            --allowlist tools/ci/expected_flakes.txt \
            --ctest-json build/ctest-tests.json
