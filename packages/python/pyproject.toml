# PEP 621 metadata for the Formulon Python wheel.
#
# The wheel ships a per-platform shared library (libformulon.{dylib,so,dll})
# that is built out-of-band by `make python-package`. We deliberately do NOT
# build C++ from inside `pip wheel`, because that would require CMake +
# clang/gcc on every host that pip-installs from sdist.
#
# Build flow:
#   1. `make python-package` -> builds libformulon and stages it into
#                               packages/python/formulon/_lib/.
#   2. `make python-wheel`   -> runs `setup.py bdist_wheel` against this
#                               directory with a platform tag.
#
# Stdlib-only at runtime. ctypes is the only binding mechanism.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formulon"
version = "0.9.0"
description = "Excel 365 calculation engine -- Python binding"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "libraz" }]
requires-python = ">=3.9"
keywords = ["excel", "spreadsheet", "formula", "xlsx", "calculation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/libraz/formulon"
Source = "https://github.com/libraz/formulon"
Issues = "https://github.com/libraz/formulon/issues"

[tool.setuptools]
packages = ["formulon", "formulon._lib"]
include-package-data = true

[tool.setuptools.package-data]
# Be explicit so the platform-specific shared library, the PEP 561 marker,
# and any sibling stub files all land in the wheel. setuptools' default
# package-data discovery will not pick up files in _lib/ otherwise.
formulon = [
  "py.typed",
  "*.pyi",
]
"formulon._lib" = [
  "*.so",
  "*.dylib",
  "*.dll",
  "*.lib",
]

# Wheel tagging lives in setup.py: the binding itself is ctypes-only, but the
# wheel is deliberately marked non-pure so it is py3-none-<platform>, never
# py3-none-any. It bundles libformulon.{dylib,so,dll}.
