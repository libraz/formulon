# PEP 621 metadata for the Formulon Python wheel.
#
# The wheel ships `formulon_capi.wasm` -- a standalone reactor-style
# WebAssembly module exporting the C ABI from `src/c_api/formulon_c.h`
# -- plus a pure-Python wrapper that drives it through `wasmtime`. One
# `py3-none-any` wheel works on every interpreter and OS that has a
# wasmtime build (which is every platform wasmtime itself supports:
# Linux x86_64 / aarch64, macOS x86_64 / arm64, Windows x86_64).
#
# Build flow:
#   1. `make wasm-capi`      -> emits build-wasm-capi/formulon_capi.wasm.
#   2. `make python-package` -> stages the wasm into
#                               packages/python/formulon/_wasm/.
#   3. `make python-wheel`   -> runs `setup.py bdist_wheel` against this
#                               directory; the result is py3-none-any.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formulon"
version = "0.9.5"
description = "Excel 365 calculation engine -- Python binding"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "libraz" }]
requires-python = ">=3.9"
dependencies = [
  # wasmtime is itself a per-platform binary wheel; pip resolves the
  # right build at install time. Pin the major to keep the runtime
  # API stable across formulon point releases.
  "wasmtime>=20,<45",
]
keywords = ["excel", "spreadsheet", "formula", "xlsx", "calculation", "wasm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://formulon.libraz.net"
Source = "https://github.com/libraz/formulon"
Issues = "https://github.com/libraz/formulon/issues"

# -- Formatter / linter (ruff) ---------------------------------------------
# Invoked from the repo root by `make format` / `make format-check`
# (uvx ruff format / check over packages/python). The target Python
# version is inferred from requires-python above (>=3.9); do not set
# target-version here or the two can drift.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Conservative, auto-fix-friendly set: pycodestyle errors/warnings,
# pyflakes, and import sorting. Broader opinionated rule families
# (pyupgrade, bugbear, ...) are deliberately not enabled -- they demand
# hand edits rather than mechanical fixes.
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.setuptools]
packages = ["formulon", "formulon._wasm"]
include-package-data = true

[tool.setuptools.package-data]
formulon = [
  "py.typed",
  "*.pyi",
]
"formulon._wasm" = [
  "formulon_capi.wasm",
]
